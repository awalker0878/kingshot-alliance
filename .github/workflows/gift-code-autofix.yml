name: Gift Code Autofix

on:
  push:
    branches:
      - gift-code-research-backed-acquisition

permissions:
  contents: write

concurrency:
  group: gift-code-autofix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    name: Apply repository formatters
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gift-code-research-backed-acquisition
          fetch-depth: 0

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: dom, gd, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --no-audit --no-fund

      - name: Apply repository formatters
        run: |
          vendor/bin/pint
          npx prettier --write resources/js/pages/Platform/GiftCodes/Sources.vue

      - name: Remove one-shot workflow and commit formatter output
        shell: bash
        run: |
          git rm .github/workflows/gift-code-autofix.yml
          if git diff --cached --quiet && git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply repository formatters"
          git push origin HEAD:gift-code-research-backed-acquisition
