name: Assistant Format Apply

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/ReadModels/AllianceAssistant/**'
      - 'app/Contexts/Intelligence/Observations/Queries/AssistantObservationQuery.php'
      - 'resources/js/pages/Assistant/**'
      - 'resources/js/localization/messages/assistant/**'
      - '.github/workflows/assistant-format-preview.yml'

permissions:
  contents: write

jobs:
  format-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          tools: composer:v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --no-audit --no-fund
      - name: Apply repository formatters and remove helper
        run: |
          vendor/bin/pint app/ReadModels/AllianceAssistant app/Contexts/Intelligence/Observations/Queries/AssistantObservationQuery.php
          npx prettier --write resources/js/pages/Assistant/Index.vue resources/js/localization/messages/assistant/*.ts
          rm .github/workflows/assistant-format-preview.yml
      - name: Commit exact formatter output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/ReadModels/AllianceAssistant app/Contexts/Intelligence/Observations/Queries/AssistantObservationQuery.php resources/js/pages/Assistant/Index.vue resources/js/localization/messages/assistant .github/workflows/assistant-format-preview.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(assistant): apply repository formatters'
          git push origin HEAD:${{ github.head_ref }}
