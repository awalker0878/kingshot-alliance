name: Territory Closeout Prep

on:
  push:
    branches:
      - territory-closeout-prep
    paths:
      - .github/workflows/territory-closeout-prep.yml

permissions:
  contents: write

jobs:
  reconcile-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: territory-closeout-prep
      - name: Reconcile Territory product documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def required_replace(path, old, new, count=None):
              text = read(path)
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f"missing expected text in {path}: {old[:120]!r}")
              if count is not None and found != count:
                  raise SystemExit(f"expected {count} matches in {path}, found {found}: {old[:120]!r}")
              write(path, text.replace(old, new, count if count is not None else -1))

          catalogue = 'docs/product/capability-catalogue.md'
          required_replace(
              catalogue,
              '| Territory plan vs observed state | Selected extension |',
              '| Territory plan vs observed state | Current complete capability |',
              1,
          )
          required_replace(
              catalogue,
              'The selected observed-state reconciliation extension does not alter this ownership.',
              'The current plan-versus-observed capability does not alter this ownership.',
              1,
          )

          gap = 'docs/product/capability-gap-analysis.md'
          text = read(gap)
          text = text.replace(
              'selected observed-state reconciliation extension',
              'current plan-versus-observed capability',
          )
          text, removed = re.subn(
              r'^\| Territory Planner: Plan vs Observed Reality \| .*\n',
              '',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if removed != 1:
              raise SystemExit('missing Territory selected-extension row in capability-gap-analysis.md')
          lines = text.splitlines()
          phase10 = 0
          for i, line in enumerate(lines):
              if line.startswith('| Phase 10 — Territory Plan vs Observed Reality |'):
                  parts = line.split('|')
                  if len(parts) < 5:
                      raise SystemExit('unexpected Phase 10 ledger shape in capability-gap-analysis.md')
                  parts[2] = ' Current complete capability '
                  parts[3] = ' Complete '
                  lines[i] = '|'.join(parts).replace('TR-01 – TR-08', 'TR-01 – TR-34')
                  phase10 += 1
          if phase10 != 1:
              raise SystemExit(f'expected one Phase 10 gap ledger row, found {phase10}')
          write(gap, '\n'.join(lines) + ('\n' if text.endswith('\n') else ''))

          extension = 'docs/product/capability-extension-program.md'
          required_replace(
              extension,
              '## Selected extension 8 — Territory Plan versus observed state',
              '## Current complete capability — Territory Plan versus observed state',
              1,
          )
          text = read(extension)
          lines = text.splitlines()
          phase10 = 0
          for i, line in enumerate(lines):
              if line.startswith('| Phase 10 — Territory Plan vs Observed Reality |'):
                  parts = line.split('|')
                  if len(parts) < 5:
                      raise SystemExit('unexpected Phase 10 ledger shape in capability-extension-program.md')
                  parts[2] = ' Current complete capability '
                  parts[3] = ' Complete '
                  lines[i] = '|'.join(parts).replace('TR-01 – TR-08', 'TR-01 – TR-34')
                  phase10 += 1
          if phase10 != 1:
              raise SystemExit(f'expected one Phase 10 extension ledger row, found {phase10}')
          text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          text = text.replace(
              'Alliance Assistant and Event Readiness & Closeout are current complete capabilities;',
              'Alliance Assistant, Event Readiness & Closeout and Territory Plan vs Observed Reality are current complete capabilities;',
              1,
          )
          write(extension, text)

          ledger = 'docs/product/capability-delivery-ledger.md'
          text = read(ledger)
          if '| Territory Planner — Plan vs Observed Reality | Complete |' not in text:
              territory_rows = [i for i, line in enumerate(text.splitlines()) if line.startswith('| Territory') and '| Complete |' in line]
              if not territory_rows:
                  raise SystemExit('could not locate current Territory complete row in capability-delivery-ledger.md')
              lines = text.splitlines()
              insert_at = territory_rows[-1] + 1
              lines.insert(
                  insert_at,
                  '| Territory Planner — Plan vs Observed Reality | Complete | [Territory plan versus observed reality](territory-plan-observed-reality.md) | Published Territory revisions remain immutable desired state; Evidence owns reviewed source provenance; Observations owns append-only accepted spatial facts; KingdomMaps owns geometry; ReadModels composes authorized comparison without plan mutation. |',
              )
              text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          lines = text.splitlines()
          phase10 = 0
          for i, line in enumerate(lines):
              if line.startswith('| Phase 10 — Territory Plan vs Observed Reality |'):
                  parts = line.split('|')
                  if len(parts) < 5:
                      raise SystemExit('unexpected Phase 10 ledger shape in capability-delivery-ledger.md')
                  parts[2] = ' Current complete capability '
                  parts[3] = ' Complete '
                  lines[i] = '|'.join(parts).replace('TR-01 – TR-08', 'TR-01 – TR-34')
                  phase10 += 1
          if phase10 != 1:
              raise SystemExit(f'expected one Phase 10 delivery ledger row, found {phase10}')
          write(ledger, '\n'.join(lines) + ('\n' if text.endswith('\n') else ''))

          journeys = 'docs/product/experience/user-journeys.md'
          text = read(journeys)
          match = re.search(
              r'(## Compare Territory plan with observed state\n.*?)(?=\n## |\Z)',
              text,
              flags=re.DOTALL,
          )
          if not match:
              raise SystemExit('missing Territory observed journey section')
          section = match.group(1)
          old_state = 'Program state: **Selected extension**.'
          if old_state not in section:
              raise SystemExit('Territory journey is not in selected state as expected')
          section = section.replace(old_state, 'Program state: **Current complete capability**.', 1)
          text = text[:match.start(1)] + section + text[match.end(1):]
          write(journeys, text)

          canonical = 'docs/product/territory-plan-observed-reality.md'
          text = read(canonical)
          text = text.replace(
              'Status: Implementation contract — 2026-08-27',
              'Status: Current complete capability — 2026-08-28',
              1,
          )
          lines = text.splitlines()
          changed = 0
          for i, line in enumerate(lines):
              if re.match(r'^\| Phase (?:[0-9]|1[0-4]) —', line):
                  parts = line.split('|')
                  if len(parts) < 5:
                      raise SystemExit(f'unexpected Territory canonical ledger shape: {line}')
                  parts[2] = ' Complete '
                  lines[i] = '|'.join(parts)
                  changed += 1
          if changed != 15:
              raise SystemExit(f'expected 15 canonical Territory phases, found {changed}')
          text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          write(canonical, text)

          # Closeout invariants: Territory must no longer be described as a selected extension
          # in the canonical/global surfaces being promoted. Unrelated selected extensions stay untouched.
          checks = {
              catalogue: ['| Territory plan vs observed state | Selected extension |'],
              gap: ['| Territory Planner: Plan vs Observed Reality |'],
              extension: ['## Selected extension 8 — Territory Plan versus observed state'],
              journeys: [],
          }
          for path, stale in checks.items():
              data = read(path)
              for needle in stale:
                  if needle in data:
                      raise SystemExit(f'stale Territory state remains in {path}: {needle}')

          canonical_text = read(canonical)
          if 'Status: Current complete capability — 2026-08-28' not in canonical_text:
              raise SystemExit('canonical Territory status was not promoted')
          for n in range(15):
              row = next((line for line in canonical_text.splitlines() if line.startswith(f'| Phase {n} —')), None)
              if row is None or '| Complete |' not in row:
                  raise SystemExit(f'canonical Territory phase {n} is not complete')
          PY
      - name: Show closeout diff
        run: git diff --check && git diff -- docs/product
      - name: Commit closeout documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/territory-closeout-prep.yml
          git add docs/product .github/workflows/territory-closeout-prep.yml
          git commit -m "Close Territory plan-observed delivery ledger"
          git push origin HEAD:territory-closeout-prep
