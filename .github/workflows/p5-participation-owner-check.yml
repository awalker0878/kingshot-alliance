name: P5 Participation Owner Check

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/p5-participation-owner-check.yml'

permissions:
  contents: write
  actions: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: >-
          vendor/bin/pint
          app/Contexts/Operations/Participation/Models/EventPlayerContext.php
          app/Contexts/Operations/Participation/Models/EventAttendance.php
          app/Contexts/Operations/Participation/Http/Controllers/EventParticipationController.php
      - run: >-
          vendor/bin/phpstan analyse --memory-limit=1024M
          app/Contexts/Operations/Participation/Models/EventPlayerContext.php
          app/Contexts/Operations/Participation/Models/EventAttendance.php
          app/Contexts/Operations/Participation/Http/Controllers/EventParticipationController.php
      - name: Commit and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p5-participation-owner-check.yml
          git add app/Contexts/Operations/Participation
          git commit -m 'ARCH-V2: complete Participation ownership cut'
          git push origin HEAD:architecture-v2
      - name: Dispatch verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run architecture-v2-verification.yml --ref architecture-v2
