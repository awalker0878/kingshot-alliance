name: Domain Structure Refactor V2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: domain-structure-refactor-v2
  cancel-in-progress: true

jobs:
  refactor:
    if: github.head_ref == 'agent/app-architecture-alignment' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/app-architecture-alignment
          fetch-depth: 0

      - name: Apply canonical domain structure
        run: python3 .github/scripts/domain_refactor.py

      - name: Commit domain-first refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Align app runtime with domain-first implementation plan"
          git push origin HEAD:agent/app-architecture-alignment
