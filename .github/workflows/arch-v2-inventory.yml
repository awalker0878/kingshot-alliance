name: ARCH V2 Semantic Inventory

on:
  push:
    branches:
      - arch-v2-remediation-20260816

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transactional authorization callsites
        shell: bash
        run: |
          echo '=== SERVICE IMPORTS / CONSTRUCTORS ==='
          grep -R -n -E 'AllianceAuthorization|KingdomAuthorization|AllianceOperationsAuthorization|KingdomOperationsAuthorization|AllianceIntelligenceAuthorization|TransferAuthorization|EventAuthorization|PlatformAuthorization|PlayerWriteState' app tests routes bootstrap || true
          echo '=== REQUIRE / ACQUIRE METHODS ==='
          grep -R -n -E -- '->(require|requireExclusive|requireManager|requireManagerExclusive|requireSelf|requireCreate|requireManage|acquireActiveScope|acquireExclusiveScope)\(' app tests || true
          echo '=== AUTHORIZATION CLASSES WITH LOCKING ==='
          grep -R -n -E 'lockForUpdate|sharedLock|transactionLevel' app/Contexts/*/*/Services/*Authorization.php app/Contexts/*/Access/Services/*Authorization.php 2>/dev/null || true
