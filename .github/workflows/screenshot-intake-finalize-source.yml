name: Screenshot Intake Finalize Source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/screenshot-intake-complete'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/screenshot-intake-complete
          fetch-depth: 0

      - name: Apply deterministic integration edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          evidence = Path('resources/js/pages/Operations/Events/Evidence.vue')
          text = evidence.read_text()
          text = text.replace("import { computed, reactive } from 'vue';", "import { reactive } from 'vue';")
          text = text.replace("const activeEvidence = computed(() => props.workspace.evidence[0] ?? null);\n", "")
          evidence.write_text(text)

          show = Path('resources/js/pages/Operations/Events/Show.vue')
          text = show.read_text()
          needle = """        <Link\n          v-if=\"event.canManage\"\n          :href=\"`/events/${event.eventId}/manage`\"\n          class=\"ks-command-link\"\n          data-variant=\"secondary\"\n        >\n          {{ t('events.show.manage') }}\n        </Link>\n"""
          addition = needle + """        <Link\n          v-if=\"event.canManage && event.eventTypeSlug === 'bear-hunt' && event.capabilities.includes('results')\"\n          :href=\"`/events/${event.id}/screenshot-intake`\"\n          class=\"ks-command-link\"\n          data-variant=\"secondary\"\n        >\n          {{ t('evidence.openIntake') }}\n        </Link>\n"""
          if "t('evidence.openIntake')" not in text:
              if needle not in text:
                  raise SystemExit('Unable to locate Event Show action insertion point')
              text = text.replace(needle, addition, 1)
          show.write_text(text)

          visual = Path('.github/workflows/visual-regression.yml')
          text = visual.read_text()
          fixture = "          php artisan tinker --execute='\\\\Tests\\\\v3\\\\Fixtures\\\\ScreenshotIntakeVisualFixture::seed();'\n"
          if 'ScreenshotIntakeVisualFixture::seed' not in text:
              marker = '\n      - name: Build production frontend\n'
              if marker not in text:
                  raise SystemExit('Unable to locate visual fixture insertion point')
              text = text.replace(marker, fixture + marker, 1)
          visual.write_text(text)
          PY

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: dom, gd, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply pinned formatters
        run: |
          vendor/bin/pint --parallel
          npx prettier --write resources/ tests/v3/Visual/

      - name: Commit integration edits
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources tests .github/workflows/visual-regression.yml app bootstrap config database routes docs Dockerfile
          git commit -m 'Finalize Screenshot Intake source integration'
          git push origin HEAD:feat/screenshot-intake-complete
