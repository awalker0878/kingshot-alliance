name: PR 163 checkout evidence

on:
  pull_request:
    paths:
      - '.github/workflows/pr163-checkout-evidence.yml'

permissions:
  contents: read

jobs:
  checkout-evidence:
    if: github.event.pull_request.number == 163 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'astra/codebase-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, gd, intl, mbstring, pdo_pgsql, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Install exact verification dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --no-audit --no-fund
      - name: Archive tracked source, dependencies, and portable runtimes
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/pr163-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/pr163-source.sha"
          git ls-tree -r HEAD > "$RUNNER_TEMP/pr163-source-tree.txt"
          tar -czf "$RUNNER_TEMP/pr163-dependencies.tar.gz" vendor node_modules
          mkdir -p "$RUNNER_TEMP/portable/php/bin" "$RUNNER_TEMP/portable/php/lib" "$RUNNER_TEMP/portable/node/bin"
          cp "$(command -v php)" "$RUNNER_TEMP/portable/php/bin/php"
          cp "$(command -v node)" "$RUNNER_TEMP/portable/node/bin/node"
          cp -a "$(php -r 'echo ini_get("extension_dir");')" "$RUNNER_TEMP/portable/php/extensions"
          cp -a /etc/php/8.5/cli "$RUNNER_TEMP/portable/php/config"
          { ldd "$(command -v php)"; find "$RUNNER_TEMP/portable/php/extensions" -name '*.so' -exec ldd {} \;; } | awk '/=> \// {print $3}' | sort -u | xargs -r -I{} cp -L {} "$RUNNER_TEMP/portable/php/lib/"
          docker run --rm -v "$RUNNER_TEMP/portable:/out" --entrypoint bash postgres:18-bookworm -c '
            set -euo pipefail
            mkdir -p /out/pg/lib /out/pg/share
            cp -a /usr/lib/postgresql/18/bin /out/pg/
            cp -a /usr/lib/postgresql/18/lib /out/pg/postgres-lib
            cp -a /usr/share/postgresql/18/* /out/pg/share/
            { find /usr/lib/postgresql/18/bin -type f -exec ldd {} \;; find /usr/lib/postgresql/18/lib -name "*.so" -exec ldd {} \;; } 2>/dev/null | awk '\''/=> \// {print $3}'\'' | sort -u | xargs -r -I{} cp -L {} /out/pg/lib/
          '
          sudo chmod -R a+rX "$RUNNER_TEMP/portable"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/pr163-runtime.tar.gz" portable
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr163-checkout-evidence
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/pr163-source.tar.gz
            ${{ runner.temp }}/pr163-source.sha
            ${{ runner.temp }}/pr163-source-tree.txt
            ${{ runner.temp }}/pr163-dependencies.tar.gz
            ${{ runner.temp }}/pr163-runtime.tar.gz
