name: Phase 4 PHPStan fix

on:
  push:
    branches:
      - agent/phase-4-recruitment
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase4-fix-phpstan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/phase-4-recruitment
          fetch-depth: 0
      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_sqlite, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Apply typed enum helpers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidate = Path('app/Http/Controllers/Alliance/RecruitmentCandidateController.php')
          text = candidate.read_text()
          replacements = {
              '$record->stage->value': '$record->recruitmentStage()->value',
              '$answer->question_type_snapshot->value': '$answer->questionType()->value',
              '$history->from_stage?->value': '$history->fromStage()?->value',
              '$history->to_stage->value': '$history->toStage()->value',
              '$communication->status->value': '$communication->communicationStatus()->value',
              '$onboarding->status->value': '$onboarding->onboardingStatus()->value',
              '$duplicate->stage->value': '$duplicate->recruitmentStage()->value',
              '$template->decision_stage->value': '$template->decisionStage()->value',
              '$this->manualStageOptions($record->stage)': '$this->manualStageOptions($record->recruitmentStage())',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Candidate controller missing expected marker: {old}')
              text = text.replace(old, new)

          old = """        $change->handle(
            $this->user($request),
            $alliance,
            $record,
            RecruitmentStage::from($validated['stage']),
            $validated['reason'] ?? null,
            isset($validated['next_action_at']) ? CarbonImmutable::parse($validated['next_action_at']) : null,
        );
"""
          new = """        $nextActionAt = isset($validated['next_action_at']) && is_string($validated['next_action_at'])
            ? CarbonImmutable::parse($validated['next_action_at'], (string) $alliance->timezone)
            : null;

        $change->handle(
            $this->user($request),
            $alliance,
            $record,
            RecruitmentStage::from($validated['stage']),
            $validated['reason'] ?? null,
            $nextActionAt,
        );
"""
          if text.count(old) != 1:
              raise SystemExit(f'Candidate controller next-action block mismatch: {text.count(old)}')
          candidate.write_text(text.replace(old, new))

          management = Path('app/Http/Controllers/Alliance/RecruitmentManagementController.php')
          text = management.read_text()
          old = '$template->decision_stage->value'
          if text.count(old) != 1:
              raise SystemExit(f'Management controller decision stage marker mismatch: {text.count(old)}')
          management.write_text(text.replace(old, '$template->decisionStage()->value'))

          public = Path('app/Http/Controllers/PublicRecruitmentController.php')
          text = public.read_text()
          old = """                'mode' => $settings?->application_mode->value ?? RecruitmentApplicationMode::Closed->value,
                'title' => $settings?->title ?? 'Recruitment applications are closed',
                'introduction' => $settings?->introduction,
"""
          new = """                'mode' => $settings instanceof RecruitmentSetting
                    ? $settings->application_mode->value
                    : RecruitmentApplicationMode::Closed->value,
                'title' => $settings instanceof RecruitmentSetting
                    ? (string) $settings->title
                    : 'Recruitment applications are closed',
                'introduction' => $settings instanceof RecruitmentSetting ? $settings->introduction : null,
"""
          if text.count(old) != 1:
              raise SystemExit(f'Public recruitment application props marker mismatch: {text.count(old)}')
          public.write_text(text.replace(old, new))
          PY
      - name: Format patched controllers
        run: vendor/bin/pint app/Http/Controllers/Alliance/RecruitmentCandidateController.php app/Http/Controllers/Alliance/RecruitmentManagementController.php app/Http/Controllers/PublicRecruitmentController.php
      - name: Commit patched controllers
        shell: bash
        run: |
          set -euo pipefail
          git add app/Http/Controllers/Alliance/RecruitmentCandidateController.php app/Http/Controllers/Alliance/RecruitmentManagementController.php app/Http/Controllers/PublicRecruitmentController.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use typed recruitment enum contracts'
          git push origin HEAD:agent/phase-4-recruitment
