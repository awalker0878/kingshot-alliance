name: PR 163 isolated fixture reconciliation
on:
  pull_request_review:
    types: [submitted]
permissions:
  contents: write
jobs:
  prepare:
    if: >-
      github.repository == 'awalker0878/kingshot-alliance' &&
      github.event.pull_request.number == 163 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'astra/codebase-hardening' &&
      github.event.review.user.login == 'awalker0878' &&
      github.event.review.state == 'commented' &&
      github.event.review.body == 'Prepare isolated fixture fix without changing refs.' &&
      github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.review.commit_id }}
          persist-credentials: false
      - name: Prepare three reviewed objects without touching the concurrent manifest
        env:
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import hashlib,json,pathlib,os,urllib.request
          changes=[{'path': 'docs/product/codebase-hardening-delivery-ledger.md', 'before': 'a9d0238b7df155dc381d67a593f8de1d8f1df9ab', 'after': '27b8e8fe0ef66e8eb5ae83b6dd921958d1285fdb', 'hunks': [[6, 7, "- Latest remote checkpoint before the choice implementation: `2cc10b5c103be649e5fd28b568c3721babef0a72`. All 3,052 tracked source blobs were recovered and matched exactly. This implementation's Git parent/history records its durable SHA; the next checkpoint records it without circular self-reference.\n- Latest pushed coherent choice implementation: `48fe6820461a8912abddbf1e5571b961411656f5`.\n"], [13, 14, '- Known failures/limits: normal Visual run `34662408427` at48fe6820 stopped before browser execution because a new fixture reused ScenarioFactory process-local player and Alliance identifiers across separate seeder processes. The fixture now uses explicit project-scoped stable Player IDs and Alliance slugs; production membership/Kingdom protection is unchanged. The corrected focused fixture test passes one case/23 assertions, and the entire normal seeder command sequence executes successfully in a separately created durable PostgreSQL database. Browser execution remains pending. No failure in the completed selection behavior scope. One synchronous containing command exceeded the tool window and was stopped; an independently completed rerun produced the191-case evidence. Direct GitHub networking and local browser navigation are restricted; use connector artifacts and hosted browser execution. The first combined frontend command was interrupted during Vite, then the same standalone build/budget phases passed. No test or production timeout was increased.\n']]}, {'path': 'tests/ReadModels/TransferManagement/Feature/TransferManagementChoiceTest.php', 'before': '190d751bb8f8ce3b776d196323ab5f513424a34e', 'after': '4b0c1a321868f728103fb2488aebf76dc9b3dc3b', 'hunks': [[248, 248, "            self::assertSame('transfer-choices-'.$project, $actor->game_player_id);\n            self::assertSame('transfer-choices-'.$project, DB::table('alliances')->where('id', $allianceId)->value('slug'));\n"]]}, {'path': 'tests/ReadModels/TransferManagement/Fixtures/TransferChoiceVisualFixture.php', 'before': '7c0adce0222dcbe05c751c7b5e6497346ee2c5e8', 'after': 'e6601ef5fc66e7878d8e02237ce9d42f31096e6d', 'hunks': [[7, 7, 'use App\\Contexts\\Alliance\\Lifecycle\\Actions\\CreateAlliance;\nuse App\\Contexts\\Alliance\\Lifecycle\\Queries\\AllianceReferenceQuery;\n'], [26, 28, "            $actor = $factory->player((int) $user->id, 59541 + $offset, 'transfer-choices-'.$project);\n            $allianceId = app(CreateAlliance::class)->handle((int) $user->id, $actor->playerId, 'Transfer Choices '.$project, 'transfer-choices-'.$project);\n            $alliance = app(AllianceReferenceQuery::class)->require($allianceId);\n"]]}]
          def blob(d): return hashlib.sha1(b'blob '+str(len(d)).encode()+b'\0'+d).hexdigest()
          ready=[]
          for c in changes:
              data=pathlib.Path(c['path']).read_bytes()
              assert blob(data)==c['before'],c['path']
              lines=data.decode().splitlines(keepends=True)
              for start,end,text in reversed(c['hunks']): lines[start:end]=text.splitlines(keepends=True)
              data=''.join(lines).encode()
              assert blob(data)==c['after'],c['path']
              ready.append((c,data))
          for c,data in ready:
              r=urllib.request.Request('https://api.github.com/repos/awalker0878/kingshot-alliance/git/blobs',data=json.dumps({'encoding':'utf-8','content':data.decode()}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['SOURCE_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(r,timeout=30) as response: result=json.load(response)
              assert result['sha']==c['after']
              print(c['path'],result['sha'])
          PYCODE
