name: P5 Reminder Owner Normalize

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/p5-reminder-owner-normalize.yml'

permissions:
  contents: write
  actions: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Cut reminders to Polls owner and format contract batch
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            app/Contexts/Operations/Reminders/Actions/SyncEventPollDeadlineReminder.php \
            app/Contexts/Operations/Reminders/Actions/CreateEventReminderRule.php \
            app/Contexts/Operations/Reminders/Models/EventReminderRule.php
          do
            sed -i 's#App\\Contexts\\Operations\\EventCore\\Models\\EventPoll#App\\Contexts\\Operations\\Polls\\Models\\EventPoll#g' "$file"
          done

          vendor/bin/pint \
            app/Contexts/Operations/EventCore/Models/Event.php \
            app/Contexts/Operations/EventCore/Queries/EventTemplateQuery.php \
            app/Contexts/Operations/EventCore/Queries/EventAttentionQuery.php \
            app/Contexts/Operations/Reminders/Actions/SyncEventPollDeadlineReminder.php \
            app/Contexts/Operations/Reminders/Actions/CreateEventReminderRule.php \
            app/Contexts/Operations/Reminders/Models/EventReminderRule.php

      - name: Commit normalization and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p5-reminder-owner-normalize.yml
          git add app/Contexts/Operations
          git commit -m 'ARCH-V2: complete Poll reminder ownership cut'
          git push origin HEAD:architecture-v2

      - name: Dispatch verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run architecture-v2-verification.yml --ref architecture-v2
