name: Architecture V2 P5 Management Boundary

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/architecture-v2-p5-management-boundary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct command/read ownership
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/Contexts/Operations/EventCore/Http/Controllers
          git mv \
            app/Contexts/Platform/EventOperations/Http/Controllers/EventManagementController.php \
            app/Contexts/Operations/EventCore/Http/Controllers/EventManagementController.php

          python3 - <<'PY'
          from pathlib import Path

          controller = Path('app/Contexts/Operations/EventCore/Http/Controllers/EventManagementController.php')
          source = controller.read_text()
          source = source.replace(
              'namespace App\\Contexts\\Platform\\EventOperations\\Http\\Controllers;',
              'namespace App\\Contexts\\Operations\\EventCore\\Http\\Controllers;',
              1,
          )
          source = source.replace(
              'use App\\Contexts\\Intelligence\\EventAnalysis\\Queries\\EventPlayerIntelligenceQuery;\n',
              '',
          )

          manage_start = source.index('    public function manage(\n')
          update_start = source.index('    public function update(\n', manage_start)
          source = source[:manage_start] + source[update_start:]

          payload_start = source.index(
              '    /** @return array<string, mixed> */\n'
              '    private function managementPayload('
          )
          identity_start = source.index(
              '    /** @return array{name:string,email:string} */\n'
              '    private function identity(',
              payload_start,
          )
          source = source[:payload_start] + source[identity_start:]
          controller.write_text(source)

          routes = Path('routes/web.php')
          source = routes.read_text()
          source = source.replace(
              'use App\\Contexts\\Platform\\EventOperations\\Http\\Controllers\\EventManagementController;',
              'use App\\Contexts\\Operations\\EventCore\\Http\\Controllers\\EventManagementController;',
          )
          read_import = 'use App\\ReadModels\\EventManagement\\Http\\Controllers\\EventManagementPageController;\n'
          anchor = 'use App\\ReadModels\\EventCalendar\\Http\\Controllers\\EventCalendarController;\n'
          if read_import not in source:
              if anchor not in source:
                  raise SystemExit('EventCalendarController route import anchor missing')
              source = source.replace(anchor, anchor + read_import, 1)
          source = source.replace(
              "Route::get('/events/{event}/manage', [EventManagementController::class, 'manage'])",
              "Route::get('/events/{event}/manage', EventManagementPageController::class)",
          )
          routes.write_text(source)
          PY

          test ! -d app/Contexts/Platform/EventOperations
          if grep -RIn --include='*.php' 'App\\Contexts\\Intelligence\\' app/Contexts/Operations; then
            echo 'Operations still imports Intelligence.' >&2
            exit 1
          fi
          if grep -RIn --include='*.php' 'App\\Contexts\\Platform\\EventOperations\\' app routes tests bootstrap config database; then
            echo 'Stale Platform EventOperations reference remains.' >&2
            exit 1
          fi
          grep -q 'EventManagementPageController::class' routes/web.php
          php -l app/Contexts/Operations/EventCore/Http/Controllers/EventManagementController.php
          php -l app/ReadModels/EventManagement/Http/Controllers/EventManagementPageController.php
          php -l routes/web.php

      - name: Commit ownership correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'architecture-v2-bot'
          git config user.email 'architecture-v2-bot@users.noreply.github.com'
          git add app routes
          git commit -m 'refactor(arch-v2): separate Event commands from management projection'
          git push origin HEAD:architecture-v2
