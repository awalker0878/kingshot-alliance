name: Architecture V2 P8 inventory

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/architecture-v2-p8-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out architecture-v2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - name: Inventory remaining V1 and cross-context write candidates
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Remaining app/Domain runtime ==='
          find app/Domain -type f -print 2>/dev/null | sort || true

          echo '=== Existing Workflows ==='
          find app/Workflows -type f -print | sort

          echo '=== Existing ReadModels ==='
          find app/ReadModels -type f -print | sort

          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('app/Contexts'), Path('app/Workflows'), Path('app/Domain/Kingdoms')]
          import_re = re.compile(r'^use App\\Contexts\\([^\\]+)\\.*?\\Models\\([^;]+);', re.M)
          namespace_re = re.compile(r'^namespace App\\(?:Contexts\\([^\\]+)|Workflows\\([^\\]+)|Domain\\Kingdoms)\\', re.M)
          mutation_markers = (
              '->save(', '->delete(', '->update(', '->forceDelete(', '->restore(',
              '::create(', '::query()->create(', 'updateOrCreate(', 'firstOrCreate(',
              '->increment(', '->decrement(',
          )

          print('=== Files importing another context model and containing mutation syntax ===')
          candidates = []
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob('*.php')):
                  text = path.read_text(encoding='utf-8')
                  imports = import_re.findall(text)
                  if not imports or not any(marker in text for marker in mutation_markers):
                      continue
                  owner = None
                  match = namespace_re.search(text)
                  if match:
                      owner = match.group(1) or ('Workflow:' + match.group(2) if match.group(2) else 'LegacyKingdoms')
                  external = sorted({ctx for ctx, _ in imports if owner is None or ctx != owner})
                  if external:
                      candidates.append((str(path), owner, external, sorted({m for m in mutation_markers if m in text})))

          for path, owner, external, markers in candidates:
              print(f'{path} | owner={owner} | external={",".join(external)} | markers={",".join(markers)}')
          print(f'TOTAL_CANDIDATES={len(candidates)}')

          print('=== Explicit GameWorld Player mutation references outside GameWorld ===')
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob('*.php')):
                  text = path.read_text(encoding='utf-8')
                  if 'App\\Contexts\\GameWorld\\Models\\Player' not in text:
                      continue
                  hits = [line.strip() for line in text.splitlines() if ('forceFill' in line or 'Player::query()->create' in line or 'Player::query()->update' in line)]
                  if hits and not str(path).startswith('app/Contexts/GameWorld/'):
                      print(path)
                      for hit in hits:
                          print('  ' + hit)
          PY
