name: ARCH V2 P6 Intelligence Format

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/arch-v2-p6-intelligence-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out architecture-v2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pdo_pgsql, xml, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format new Intelligence owners and tests
        run: >-
          vendor/bin/pint
          app/Contexts/Intelligence/Observations
          app/Contexts/Intelligence/Diplomacy
          tests/Architecture/ArchitectureV2IntelligenceTest.php
          tests/Feature/Intelligence

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'awalker0878'
          git config user.email '52688461+awalker0878@users.noreply.github.com'
          git add app/Contexts/Intelligence tests/Architecture/ArchitectureV2IntelligenceTest.php tests/Feature/Intelligence
          if git diff --cached --quiet; then
            echo 'No Pint changes required.'
            exit 0
          fi
          git commit -m 'ARCH-V2-P6: format Intelligence owners'
          git push origin HEAD:architecture-v2
