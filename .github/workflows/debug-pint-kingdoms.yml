name: Debug Pint Kingdoms

on:
  pull_request:

permissions:
  contents: read

jobs:
  pint-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Apply Pint to reconciliation action
        run: vendor/bin/pint app/Contexts/GameWorld/Kingdoms/Actions/ReconcileKingdomAlliances.php

      - name: Print exact formatter diff
        if: always()
        run: git --no-pager diff -- app/Contexts/GameWorld/Kingdoms/Actions/ReconcileKingdomAlliances.php
