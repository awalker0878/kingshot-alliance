name: Phase 4 wire UI

on:
  push:
    branches:
      - agent/phase-4-recruitment
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase4-wire-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/phase-4-recruitment
          fetch-depth: 0
      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_sqlite, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --no-audit --no-fund
      - name: Wire routes and public apply link
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          routes = Path('routes/web.php')
          text = routes.read_text()
          replacements = [
              (
                  'use App\\Http\\Controllers\\Alliance\\MembershipController;\n',
                  'use App\\Http\\Controllers\\Alliance\\MembershipController;\nuse App\\Http\\Controllers\\Alliance\\RecruitmentCandidateController;\nuse App\\Http\\Controllers\\Alliance\\RecruitmentManagementController;\n',
                  'alliance recruitment imports',
              ),
              (
                  'use App\\Http\\Controllers\\PublicContentController;\n',
                  'use App\\Http\\Controllers\\PublicContentController;\nuse App\\Http\\Controllers\\PublicRecruitmentController;\n',
                  'public recruitment import',
              ),
              (
                  "Route::get('/invitations/{token}', [InvitationAcceptanceController::class, 'show'])",
                  "Route::get('/alliances/{slug}/apply', [PublicRecruitmentController::class, 'show'])\n    ->where('slug', '[a-z0-9]+(?:-[a-z0-9]+)*')\n    ->name('public.alliances.recruitment.show');\nRoute::post('/alliances/{slug}/apply', [PublicRecruitmentController::class, 'store'])\n    ->where('slug', '[a-z0-9]+(?:-[a-z0-9]+)*')\n    ->middleware('throttle:recruitment-application')\n    ->name('public.alliances.recruitment.store');\n\nRoute::get('/invitations/{token}', [InvitationAcceptanceController::class, 'show'])",
                  'public recruitment routes',
              ),
              (
                  "            Route::get('/alliance/content', [MemberContentController::class, 'index'])",
                  "            Route::get('/alliance/recruitment', [RecruitmentManagementController::class, 'index'])\n                ->name('alliance.recruitment.index');\n            Route::patch('/alliance/recruitment/settings', [RecruitmentManagementController::class, 'updateSettings'])\n                ->name('alliance.recruitment.settings.update');\n            Route::post('/alliance/recruitment/questions', [RecruitmentManagementController::class, 'storeQuestion'])\n                ->name('alliance.recruitment.questions.store');\n            Route::post('/alliance/recruitment/application-invites', [RecruitmentManagementController::class, 'issueApplicationInvite'])\n                ->name('alliance.recruitment.application-invites.store');\n            Route::post('/alliance/recruitment/decision-templates', [RecruitmentManagementController::class, 'storeDecisionTemplate'])\n                ->name('alliance.recruitment.decision-templates.store');\n            Route::post('/alliance/recruitment/onboarding-items', [RecruitmentManagementController::class, 'storeOnboardingItem'])\n                ->name('alliance.recruitment.onboarding-items.store');\n            Route::patch('/alliance/recruitment/{candidate}/stage', [RecruitmentCandidateController::class, 'updateStage'])\n                ->whereUlid('candidate')\n                ->name('alliance.recruitment.candidates.stage.update');\n            Route::put('/alliance/recruitment/{candidate}/reviewers/{membership}', [RecruitmentCandidateController::class, 'assignReviewer'])\n                ->whereUlid('candidate')\n                ->whereUlid('membership')\n                ->name('alliance.recruitment.candidates.reviewers.store');\n            Route::post('/alliance/recruitment/{candidate}/notes', [RecruitmentCandidateController::class, 'addNote'])\n                ->whereUlid('candidate')\n                ->name('alliance.recruitment.candidates.notes.store');\n            Route::put('/alliance/recruitment/{candidate}/tags', [RecruitmentCandidateController::class, 'tag'])\n                ->whereUlid('candidate')\n                ->name('alliance.recruitment.candidates.tags.store');\n            Route::post('/alliance/recruitment/{candidate}/merge/{target}', [RecruitmentCandidateController::class, 'merge'])\n                ->whereUlid('candidate')\n                ->whereUlid('target')\n                ->name('alliance.recruitment.candidates.merge');\n            Route::post('/alliance/recruitment/{candidate}/communications/{template}', [RecruitmentCandidateController::class, 'prepareCommunication'])\n                ->whereUlid('candidate')\n                ->whereUlid('template')\n                ->name('alliance.recruitment.candidates.communications.store');\n            Route::patch('/alliance/recruitment/communications/{communication}/sent', [RecruitmentCandidateController::class, 'markCommunicationSent'])\n                ->whereUlid('communication')\n                ->name('alliance.recruitment.communications.sent');\n            Route::post('/alliance/recruitment/{candidate}/convert', [RecruitmentCandidateController::class, 'convert'])\n                ->whereUlid('candidate')\n                ->name('alliance.recruitment.candidates.convert');\n            Route::patch('/alliance/recruitment/onboarding/{onboarding}', [RecruitmentCandidateController::class, 'updateOnboarding'])\n                ->whereUlid('onboarding')\n                ->name('alliance.recruitment.onboarding.update');\n            Route::get('/alliance/recruitment/{candidate}', [RecruitmentCandidateController::class, 'show'])\n                ->whereUlid('candidate')\n                ->name('alliance.recruitment.candidates.show');\n\n            Route::get('/alliance/content', [MemberContentController::class, 'index'])",
                  'private recruitment routes',
              ),
          ]
          for old, new, label in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one {label} marker; found {text.count(old)}')
              text = text.replace(old, new)
          routes.write_text(text)

          controller = Path('app/Http/Controllers/PublicAllianceController.php')
          text = controller.read_text()
          old = 'use App\\Models\\ContentItem;\n'
          new = 'use App\\Models\\ContentItem;\nuse App\\Models\\RecruitmentSetting;\n'
          if text.count(old) != 1:
              raise SystemExit('PublicAllianceController import marker mismatch')
          text = text.replace(old, new)
          marker = "        $profile = AllianceProfile::query()->where('alliance_id', $alliance->id)->first();\n"
          addition = marker + "        $recruitment = RecruitmentSetting::query()->where('alliance_id', $alliance->id)->first();\n"
          if text.count(marker) != 1:
              raise SystemExit('PublicAllianceController recruitment query marker mismatch')
          text = text.replace(marker, addition)
          marker = "                'bannerUrl' => $brandingSlots->has('banner') ? route('public.alliances.branding', [$alliance->slug, 'banner']) : null,\n"
          addition = marker + "                'recruitmentApplicationUrl' => $recruitment?->is_open && $recruitment->application_mode->value === 'public'\n                    ? route('public.alliances.recruitment.show', $alliance->slug)\n                    : null,\n"
          if text.count(marker) != 1:
              raise SystemExit('PublicAllianceController public prop marker mismatch')
          text = text.replace(marker, addition)
          controller.write_text(text)

          page = Path('resources/js/pages/Public/Alliance.vue')
          text = page.read_text()
          marker = '    bannerUrl: string | null;\n'
          if text.count(marker) != 1:
              raise SystemExit('Public Alliance type marker mismatch')
          text = text.replace(marker, marker + '    recruitmentApplicationUrl: string | null;\n')
          marker = '''          <Link
            class="rounded-full border border-cyan-800 px-3 py-1.5 font-semibold text-cyan-300 hover:border-cyan-600 hover:text-cyan-200"
            href="/login"
          >
            Member sign in
          </Link>'''
          replacement = '''          <Link
            v-if="alliance.recruitmentApplicationUrl"
            class="rounded-full bg-cyan-300 px-3 py-1.5 font-semibold text-slate-950"
            :href="alliance.recruitmentApplicationUrl"
          >
            Apply to join
          </Link>
          <Link
            class="rounded-full border border-cyan-800 px-3 py-1.5 font-semibold text-cyan-300 hover:border-cyan-600 hover:text-cyan-200"
            href="/login"
          >
            Member sign in
          </Link>'''
          if text.count(marker) != 1:
              raise SystemExit('Public Alliance login marker mismatch')
          page.write_text(text.replace(marker, replacement))

          manage = Path('resources/js/pages/Alliance/Recruitment/Manage.vue')
          text = manage.read_text()
          text = text.replace("import { Head, Link, useForm } from '@inertiajs/vue3';\n", "import { Head, Link, useForm } from '@inertiajs/vue3';\nimport { ref } from 'vue';\n")
          text = text.replace("const questionOptions = defineModel<string>('questionOptions', { default: '' });", "const questionOptions = ref('');")
          manage.write_text(text)

          apply = Path('resources/js/pages/Public/RecruitmentApply.vue')
          text = apply.read_text()
          text = text.replace('v-model="form.answers[question.id] as string[]"', 'v-model="form.answers[question.id]"')
          text = text.replace('v-model="form.answers[question.id] as boolean"', 'v-model="form.answers[question.id]"')
          text = text.replace('v-model="form.answers[question.id] as string"', 'v-model="form.answers[question.id]"')
          apply.write_text(text)
          PY
      - name: Format PHP and Vue sources
        run: |
          vendor/bin/pint routes/web.php app/Http/Controllers/PublicAllianceController.php app/Http/Controllers/PublicRecruitmentController.php app/Http/Controllers/Alliance/RecruitmentManagementController.php app/Http/Controllers/Alliance/RecruitmentCandidateController.php
          npx prettier --write resources/js/pages/Public/Alliance.vue resources/js/pages/Public/RecruitmentApply.vue resources/js/pages/Alliance/Recruitment/Manage.vue resources/js/pages/Alliance/Recruitment/Candidate.vue
      - name: Commit wiring output
        shell: bash
        run: |
          set -euo pipefail
          git add routes/web.php app/Http/Controllers/PublicAllianceController.php app/Http/Controllers/PublicRecruitmentController.php app/Http/Controllers/Alliance/RecruitmentManagementController.php app/Http/Controllers/Alliance/RecruitmentCandidateController.php resources/js/pages/Public/Alliance.vue resources/js/pages/Public/RecruitmentApply.vue resources/js/pages/Alliance/Recruitment/Manage.vue resources/js/pages/Alliance/Recruitment/Candidate.vue
          if git diff --cached --quiet; then
            echo 'No wiring changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire Phase 4 recruitment product surface'
          git push origin HEAD:agent/phase-4-recruitment
