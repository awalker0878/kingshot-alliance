name: PR 163 HARD-106 candidate recovery
on:
  pull_request_review:
    types: [submitted]
permissions:
  contents: read
jobs:
  recover:
    if: >-
      github.repository == 'awalker0878/kingshot-alliance' &&
      github.event.pull_request.number == 163 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'astra/codebase-hardening' &&
      github.event.review.user.login == 'awalker0878' &&
      github.event.review.state == 'commented' &&
      github.event.review.body == 'Recover prior HARD-106 candidate objects read-only.' &&
      github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.review.commit_id }}
          persist-credentials: false
      - name: Export checked original and proposed objects without applying them
        env:
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import ast,base64,hashlib,json,os,pathlib,re,subprocess,textwrap,urllib.request
          source=pathlib.Path('.github/workflows/pr163-hard106-publication.yml').read_text()
          script=source.split("          python - <<'PY'\n",1)[1].split('\n          PY',1)[0]
          nodes=ast.parse(textwrap.dedent(script))
          values={}
          for node in ast.walk(nodes):
              if isinstance(node,ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0],ast.Name) and node.targets[0].id in ['manifests','additions']:
                  values[node.targets[0].id]=ast.literal_eval(node.value)
          assert len(values['manifests'])==6 and len(values['additions'])==18
          base='https://api.github.com/repos/awalker0878/kingshot-alliance/git/blobs/'
          headers={'Authorization':'Bearer '+os.environ['SOURCE_TOKEN'],'Accept':'application/vnd.github+json'}
          def digest(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def get(sha):
              assert re.fullmatch('[0-9a-f]{40}',sha)
              with urllib.request.urlopen(urllib.request.Request(base+sha,headers=headers),timeout=30) as response:
                  data=base64.b64decode(json.load(response)['content'])
              assert digest(data)==sha
              return data
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'hard106-candidate'
          seen=set(); rows=[]
          def write(path,old,new,expected):
              p=pathlib.PurePosixPath(path)
              assert not p.is_absolute() and '..' not in p.parts and str(p) not in seen
              assert p.parts[0] in ['app','docs','resources','routes','tests','database'] or str(p)=='phpunit.xml'
              seen.add(str(p)); assert digest(new)==expected
              for directory,data in [('original',old),('proposed',new)]:
                  if data is not None:
                      target=output/directory/path; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
              current=pathlib.Path(path)
              rows.append({'path':path,'before':digest(old) if old is not None else None,'after':expected,'current':digest(current.read_bytes()) if current.exists() else None})
          for sha in values['manifests']:
              manifest=json.loads(get(sha))
              for c in manifest['changes']:
                  old=get(c['before']);lines=old.decode().splitlines(keepends=True);prior=0
                  for start,end,text in c['hunks']:
                      assert isinstance(start,int) and isinstance(end,int) and isinstance(text,str) and prior<=start<=end<=len(lines)
                      prior=end
                  for start,end,text in reversed(c['hunks']):
                      lines[start:end]=text.splitlines(keepends=True)
                  write(c['path'],old,''.join(lines).encode(),c['after'])
          for path,sha in values['additions'].items():
              write(path,None,get(sha),sha)
          assert len(rows)==55
          (output/'receipt.json').write_text(json.dumps({'source_revision':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':rows,'repository_or_refs_changed':False},indent=2)+'\n')
          print('Recovered55 checked candidate paths without modifying repository source.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hard106-recovered-candidate
          path: ${{ runner.temp }}/hard106-candidate
          retention-days: 3
          if-no-files-found: error
