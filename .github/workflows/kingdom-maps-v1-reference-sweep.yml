name: KingdomMaps V1 Reference Sweep

on:
  push:
    branches:
      - kingdommaps-research-evidence-expansion

permissions:
  contents: write

concurrency:
  group: kingdom-maps-v1-reference-sweep
  cancel-in-progress: true

jobs:
  sweep:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: kingdommaps-research-evidence-expansion

      - name: Replace deleted V1 release references in fixtures
        shell: bash
        run: |
          old='kingshot-community-observed-2026-08-21-v1'
          new='kingshot-evidence-backed-2026-09-06-v2'
          mapfile -t files < <(git grep -Il "$old" -- tests scripts | grep -v '^\.github/workflows/' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No stale V1 test/fixture references found.'
            exit 0
          fi
          printf 'Updating stale V1 references in:\n'
          printf ' - %s\n' "${files[@]}"
          for file in "${files[@]}"; do
            OLD="$old" NEW="$new" perl -0pi -e 's/\Q$ENV{OLD}\E/$ENV{NEW}/g' "$file"
          done
          remaining="$(git grep -n "$old" -- tests scripts || true)"
          if [ -n "$remaining" ]; then
            printf '%s\n' "$remaining" >&2
            echo 'Stale V1 test/fixture references remain after sweep.' >&2
            exit 1
          fi

      - name: Commit updated fixtures and references
        shell: bash
        run: |
          if git diff --quiet -- tests scripts; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests scripts
          git commit -m 'Move KingdomMaps fixtures to V2 release'
          git push origin HEAD:kingdommaps-research-evidence-expansion
