name: Architecture V2 Debug

on:
  push:
    branches: [architecture-v2]

permissions:
  contents: read

jobs:
  architecture-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Capture architecture test output
        shell: bash
        run: |
          set +e
          php artisan test tests/Architecture/ArchitectureV2DependencyTest.php --testdox --colors=never > architecture-test-output.txt 2>&1
          status=$?
          cat architecture-test-output.txt
          echo "exit_code=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-v2-debug-output
          path: architecture-test-output.txt
          if-no-files-found: error
