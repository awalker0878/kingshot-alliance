name: Architecture V2 P3 Cutover

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/architecture-v2-p3-cutover.yml'

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out architecture-v2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Apply P3 Alliance hard cut
        shell: bash
        run: |
          python - <<'PY'
          import base64, zlib
          payload = ''
          script = zlib.decompress(base64.b64decode(payload))
          exec(compile(script, 'p3_transform.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Format changed PHP only
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACM -- '*.php')
          if (( ${#files[@]} > 0 )); then
            vendor/bin/pint "${files[@]}"
          fi

      - name: Syntax-check transformed PHP
        shell: bash
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Remove one-off migration tooling
        shell: bash
        run: |
          rm -f .github/workflows/architecture-v2-p3-cutover.yml
          rm -f .github/workflows/architecture-v2-source-snapshot.yml

      - name: Commit P3 hard cut
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'refactor(arch-v2): consolidate Alliance bounded context'
          git push origin HEAD:architecture-v2
