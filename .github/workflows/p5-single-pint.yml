name: P5 Single Pint

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/p5-single-pint.yml'

permissions:
  contents: write
  actions: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: vendor/bin/pint app/Contexts/Operations/EventCore/Queries/EventAttentionQuery.php

      - name: Commit format and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p5-single-pint.yml
          git add app/Contexts/Operations/EventCore/Queries/EventAttentionQuery.php
          git commit -m 'style(arch-v2): normalize Event attention query'
          git push origin HEAD:architecture-v2

      - name: Dispatch verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run architecture-v2-verification.yml --ref architecture-v2
