name: Architecture V2 P4 Inventory

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-v2-p4-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Inventory access symbols
        shell: bash
        run: |
          warn_matches() {
            local title="$1"
            local pattern="$2"
            local matches
            matches=$(grep -R -n -F --include='*.php' "$pattern" app routes tests bootstrap config database 2>/dev/null || true)
            if [ -n "$matches" ]; then
              matches=${matches//'%'/'%25'}
              matches=${matches//$'\r'/'%0D'}
              matches=${matches//$'\n'/'%0A'}
              echo "::warning title=$title::$matches"
            fi
          }

          warn_matches 'P4 PermissionKey consumers' 'PermissionKey'
          warn_matches 'P4 KingdomMutationAuthority consumers' 'KingdomMutationAuthority'
          warn_matches 'P4 PlayerMutationAuthority consumers' 'PlayerMutationAuthority'
          warn_matches 'P4 KingdomAuthorization consumers' 'KingdomAuthorization'
          warn_matches 'P4 Kingdom role type consumers' 'KingdomRole'
