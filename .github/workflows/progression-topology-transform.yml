name: Progression Topology Transform

on:
  push:
    branches:
      - progression-capability-completion
    paths:
      - scripts/progression/apply_completion_topology.py
      - .github/workflows/progression-topology-transform.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: progression-capability-completion
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python scripts/progression/apply_completion_topology.py
      - name: Commit transformed topology
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Contexts/GameWorld/Progression app/ReadModels/Progression
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: expand deterministic Progression planner topology'
          git push origin HEAD:progression-capability-completion
