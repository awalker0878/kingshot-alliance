se') }}</button><button v-else class="rounded border border-blue-400/25 px-3 py-1.5 text-xs font-semibold text-blue-200 disabled:opacity-50" :disabled="!subscription.contextCurrent" type="button" @click="transition(subscription, 'active')">{{ t('kingdomP7A.enable') }}</button><button v-if="subscription.state !== 'disabled'" class="rounded border border-red-400/25 px-3 py-1.5 text-xs font-semibold text-red-200" type="button" @click="transition(subscription, 'disabled')">{{ t('kingdomP7A.disable') }}</button></div></article></div>

