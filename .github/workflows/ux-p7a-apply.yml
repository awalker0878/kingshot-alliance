                <div v-if="candidates.length" class="mt-5 overflow-x-auto"><table class="min-w-full text-left text-sm"><caption class="sr-only">{{ t('kingdomP7A.recentCandidates') }}</caption><thead class="text-xs text-[var(--ks-text-muted)] uppercase"><tr><th class="px-3 py-3">{{ t('kingdomP7A.adapter') }}</th><th class="px-3 py-3">{{ t('kingdomP7A.target') }}</th><th class="px-3 py-3">{{ t('kingdomP7A.stableGameId') }}</th><th class="px-3 py-3">{{ t('kingdomP7A.captured') }}</th><th class="px-3 py-3">{{ t('kingdomP7A.state') }}</th><th class="px-3 py-3">{{ t('kingdomP7A.actions') }}</th></tr></thead><tbody class="divide-y divide-[var(--ks-border)]"><tr v-for="candidate in candidates" :key="candidate.id"><td class="px-3 py-4">{{ candidate.adapterKey }}</td><td class="px-3 py-4">{{ label(candidate.targetKind) }}</td><td class="px-3 py-4">{{ candidate.stableGameId ?? t('kingdomP7A.missing') }}</td><td class="px-3 py-4">{{ date(candidate.capturedAt) }}</td><td class="px-3 py-4"><span :class="tone(candidate.state)" class="rounded-full border px-2 py-1 text-xs font-semibold">{{ label(candidate.state) }}</span><span v-if="candidate.quarantineCode" class="mt-2 block text-xs text-amber-200">{{ label(candidate.quarantineCode) }}</span></td><td class="px-3 py-4"><div v-if="candidate.state === 'quarantined'" class="flex flex-wrap gap-2"><button class="rounded border border-blue-400/25 px-3 py-1.5 text-xs font-semibold text-blue-200" type="button" @click="replayCandidate(candidate)">{{ t('kingdomP7A.replay') }}</button><button class="rounded border border-red-400/25 px-3 py-1.5 text-xs font-semibold text-red-200" type="button" @click="rejectCandidate(candidate)">{{ t('kingdomP7A.reject') }}</button></div><span v-else class="text-xs text-[var(--ks-text-muted)]">{{ t('kingdomP7A.noManagerAction') }}</span></td></tr></tbody></table></div>
                <p v-else class="mt-5 text-sm text-[var(--ks-text-muted)]">{{ t('kingdomP7A.noCandidates') }}</p>
              </section>
            </AppLayout>
          </template>
          EOF

      - name: Add P7-A architecture guards
        run: |
          cat > tests/Architecture/KingdomP7AExperienceTest.php <<'EOF'
          <?php

          declare(strict_types=1);

          namespace Tests\Architecture;

          use PHPUnit\Framework\TestCase;

          final class KingdomP7AExperienceTest extends TestCase
          {
              public function test_p7a_surfaces_use_shared_shell_and_real_kingdom_contracts(): void
              {
                  $root = dirname(__DIR__, 2);
                  foreach (['KingdomAlliances.vue', 'KingdomSettings.vue', 'KingdomIngestionManage.vue'] as $page) {
                      $source = file_get_contents($root.'/resources/js/pages/Alliance/'.$page);
                      self::assertIsString($source);
                      self::assertStringContainsString('AppLayout', $source);
                      self::assertStringContainsString('kingdomP7A.', $source);
                      self::assertStringNotContainsString('<main', $source);
                  }

                  $overview = file_get_contents($root.'/resources/js/pages/Alliance/KingdomAlliances.vue');
                  self::assertIsString($overview);
                  self::assertStringContainsString('/alliance/kingdom-alliances/manage', $overview);
                  self::assertStringContainsString('/alliance/kingdom-alliances/intelligence', $overview);
                  self::assertStringContainsString('latestObservation', $overview);
                  self::assertStringContainsString('diplomacyNeedsReview', $overview);

                  $settings = file_get_contents($root.'/resources/js/pages/Alliance/KingdomSettings.vue');
                  self::assertIsString($settings);
                  self::assertStringContainsString("form.patch('/alliance/settings/kingdom'", $settings);

                  $ingestion = file_get_contents($root.'/resources/js/pages/Alliance/KingdomIngestionManage.vue');
                  self::assertIsString($ingestion);
                  foreach (['/alliance/kingdom-ingestion/subscriptions', '/state', '/replay', '/reject'] as $contract) {
                      self::assertStringContainsString($contract, $ingestion);
                  }
              }

              public function test_p7a_rejects_visual_target_only_analytics_and_controls(): void
              {
                  $root = dirname(__DIR__, 2).'/resources/js/pages/Alliance/';
                  $source = file_get_contents($root.'KingdomAlliances.vue').file_get_contents($root.'KingdomSettings.vue').file_get_contents($root.'KingdomIngestionManage.vue');
                  self::assertIsString($source);
                  foreach (['Kingdom Power Trend', 'Recent Kingdom Activity', 'Export Kingdom Data', 'AI-powered', 'Predicted power', 'Cross-kingdom ranking', 'Auto-snapshot'] as $unsupported) {
                      self::assertStringNotContainsString($unsupported, $source);
                  }
              }

              public function test_p7a_catalogue_covers_all_supported_locales_and_controllers_supply_shell_identity(): void
              {
                  $root = dirname(__DIR__, 2);
                  $catalogue = file_get_contents($root.'/resources/js/localization/messages/kingdom-p7a.ts');
                  self::assertIsString($catalogue);
                  foreach (['en', 'ar', 'de', 'es', 'fr', 'id', 'it', 'ja', 'ko', 'pl', 'pt-BR', 'ru', 'th', 'tr', 'vi', 'zh-CN', 'zh-TW'] as $locale) {
                      self::assertStringContainsString("'{$locale}'", $catalogue);
                  }

                  foreach (['KingdomAllianceController.php', 'KingdomSettingsController.php', 'KingdomIngestionController.php'] as $controller) {
                      $source = file_get_contents($root.'/app/Domain/Kingdoms/Http/Controllers/'.$controller);
                      self::assertIsString($source);
                      self::assertStringContainsString("'name' => (string) \$user->name", $source);
                      self::assertStringContainsString("'email' => (string) \$user->email", $source);
                  }
              }
          }
          EOF

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Format frontend
        run: |
          npm ci --no-audit --no-fund
          npx prettier --write resources/js/pages/Alliance/KingdomAlliances.vue resources/js/pages/Alliance/KingdomSettings.vue resources/js/pages/Alliance/KingdomIngestionManage.vue resources/js/localization/messages/kingdom-p7a.ts resources/js/localization/messages/index.ts

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Format PHP
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          vendor/bin/pint app/Domain/Kingdoms/Http/Controllers/KingdomAllianceController.php app/Domain/Kingdoms/Http/Controllers/KingdomSettingsController.php app/Domain/Kingdoms/Http/Controllers/KingdomIngestionController.php tests/Architecture/KingdomAccessibilityTest.php tests/Architecture/KingdomP7AExperienceTest.php

      - name: Commit P7-A implementation
        run: |
          git config user.name "awalker0878"
          git config user.email "52688461+awalker0878@users.noreply.github.com"
          git add app/Domain/Kingdoms/Http/Controllers/KingdomAllianceController.php app/Domain/Kingdoms/Http/Controllers/KingdomSettingsController.php app/Domain/Kingdoms/Http/Controllers/KingdomIngestionController.php resources/js/pages/Alliance/KingdomAlliances.vue resources/js/pages/Alliance/KingdomSettings.vue resources/js/pages/Alliance/KingdomIngestionManage.vue resources/js/localization/messages/kingdom-p7a.ts resources/js/localization/messages/index.ts tests/Architecture/KingdomAccessibilityTest.php tests/Architecture/KingdomP7AExperienceTest.php
