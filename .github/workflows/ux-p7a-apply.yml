{{ t('kingdomP7A.lastClaimed', { date: date(subscription.lastClaimedAt) }) }}</p></td><td class="px-3 py-4 align-top text-[var(--ks-text-secondary)]">{{ t('kingdomP7A.candidateSummary', { pending: formatNumber(subscription.pendingCandidates), quarantined: formatNumber(subscription.quarantinedCandidates), rejected: formatNumber(subscription.rejectedCandidates) }) }}</td><td class="px-3 py-4 align-top text-[var(--ks-text-secondary)]"><template v-if="subscription.latestBatch"><p>{{ label(subscription.latestBatch.state) }}</p><p class="mt-1 text-xs text-[var(--ks-text-muted)]">{{ t('kingdomP7A.latestBatchSummary', { staged: formatNumber(subscription.latestBatch.recordsStaged), quarantined: formatNumber(subscription.latestBatch.recordsQuarantined) }) }}</p><p v-if="subscription.latestBatch.failureCode" class="mt-1 text-xs text-red-200">{{ label(subscription.latestBatch.failureCode) }}</p></template><span v-else>{{ t('kingdomP7A.noBatches') }}</span></td><td class="px-3 py-4 align-top"><div class="flex flex-wrap gap-2"><button v-if="subscription.state === 'active'" class="rounded border border-amber-400/25 px-3 py-1.5 text-xs font-semibold text-amber-200" type="button" @click="transition(subscription, 'paused')">{{ t('kingdomP7A.pause') }}</button><button v-else class="rounded border border-blue-400/25 px-3 py-1.5 text-xs font-semibold text-blue-200 disabled:opacity-50" :disabled="!subscription.contextCurrent" type="button" @click="transition(subscription, 'active')">{{ t('kingdomP7A.enable') }}</button><button v-if="subscription.state !== 'disabled'" class="rounded border border-red-400/25 px-3 py-1.5 text-xs font-semibold text-red-200" type="button" @click="transition(subscription, 'disabled')">{{ t('kingdomP7A.disable') }}</button></div></td></tr></tbody></table></div>
                <p v-else class="mt-5 text-sm text-[var(--ks-text-muted)]">{{ t('kingdomP7A.noBatches') }}</p>
