name: Localization PR4 baseline compatibility matrix

on:
  pull_request:
    branches:
      - codex/audit-stabilization
    paths:
      - 'resources/js/localization/locales.ts'
      - 'app/Shared/Infrastructure/Http/SupportedLocale.php'
      - 'resources/data/localization/locale-normalization-cases.json'
      - 'scripts/report-localization-pr4-compatibility.mjs'
      - 'scripts/report-localization-pr4-http-candidates.php'
      - '.github/workflows/localization-pr4-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full baseline and new normalizers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Compare exact PHP and client results to merged baseline
        run: node scripts/report-localization-pr4-compatibility.mjs
      - name: Install locked PHP dependencies for real Illuminate HTTP request parser
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Diagnose actual getLanguages and normalize inputs across all fixtures
        run: php scripts/report-localization-pr4-http-candidates.php
      - name: Retain per-input compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localization-pr4-compatibility
          path: |
            localization-pr4-compatibility-delta.json
            localization-pr4-http-candidate-diagnostics.json
          if-no-files-found: warn
          retention-days: 14
