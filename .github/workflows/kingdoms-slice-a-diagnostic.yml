name: Kingdoms Slice A Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostics:
    name: Exact Pint migration diff
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format migration with Pint
        run: vendor/bin/pint database/migrations/2026_08_08_140500_create_kingdoms_and_link_alliances.php

      - name: Capture formatted file
        run: cp database/migrations/2026_08_08_140500_create_kingdoms_and_link_alliances.php formatted-migration.php

      - name: Upload formatted migration
        uses: actions/upload-artifact@v4
        with:
          name: kingdoms-slice-a-pint-output
          path: formatted-migration.php
          if-no-files-found: error
