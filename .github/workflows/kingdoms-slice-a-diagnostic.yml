name: Kingdoms Slice A Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  php-diagnostic:
    name: Split PHP checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kingshot_test
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_test
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: array
      REDIS_HOST: 127.0.0.1
      PULSE_ENABLED: false

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run migrations
        run: php artisan migrate --force

      - name: Pint format check
        id: pint
        continue-on-error: true
        run: composer format

      - name: Blade format check
        id: views
        if: always()
        continue-on-error: true
        run: composer views

      - name: PHPStan
        id: static
        if: always()
        continue-on-error: true
        run: composer static

      - name: PHPUnit
        id: tests
        if: always()
        continue-on-error: true
        run: composer test

      - name: Fail if any check failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.pint.outcome }}" = success
          test "${{ steps.views.outcome }}" = success
          test "${{ steps.static.outcome }}" = success
          test "${{ steps.tests.outcome }}" = success
