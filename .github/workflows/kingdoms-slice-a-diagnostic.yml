name: Kingdoms Slice A Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostics:
    name: Pint and PHPStan output
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Capture Pint output
        shell: bash
        run: |
          set +e
          composer lint:check > pint.txt 2>&1
          echo $? > pint.exit
          exit 0

      - name: Capture PHPStan output
        shell: bash
        run: |
          set +e
          composer types:check > phpstan.txt 2>&1
          echo $? > phpstan.exit
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: kingdoms-slice-a-php-diagnostics
          path: |
            pint.txt
            pint.exit
            phpstan.txt
            phpstan.exit
          if-no-files-found: error
