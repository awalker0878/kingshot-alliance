name: Phase 6 finish

on:
  push:
    branches:
      - agent/phase-6-platform-scale-administration

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/phase-6-platform-scale-administration
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: python .github/scripts/phase6_finish.py
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --no-audit --no-fund
      - run: vendor/bin/pint --parallel
      - run: npx prettier --write resources/js/pages/Platform/Administration/Index.vue resources/js/pages/Alliance/Integrations/Manage.vue resources/js/pages/AccountDeletion.vue resources/js/pages/Alliance/Overview.vue resources/js/pages/Profile.vue
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish and format Phase 6 implementation"
          git push origin HEAD:agent/phase-6-platform-scale-administration
