name: Factual Progression Localization Fix

on:
  push:
    branches:
      - feature/factual-governor-progression
    paths:
      - .github/workflows/progression-localization-fix.yml

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out feature head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/factual-governor-progression
          fetch-depth: 0

      - name: Replace visible progression abbreviations with locale messages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          en = Path('resources/js/localization/messages/progression/en.ts')
          text = en.read_text()
          text = text.replace(
              "    level: 'Level',\n",
              "    level: 'Level',\n    levelShort: 'Lv {value}',\n    townCenterLevel: 'TC {level}',\n    authorityTier: 'Tier {tier}',\n",
          )
          en.write_text(text)

          governor = Path('resources/js/pages/Kingdom/Progression/Governor.vue')
          text = governor.read_text()
          text = text.replace(
              '<template v-if="hero.level !== null"> · Lv {{ hero.level }}</template>',
              '<template v-if="hero.level !== null"> · {{ t(\'progression.levelShort\', { value: hero.level }) }}</template>',
          )
          governor.write_text(text)

          for name in ('Index.vue', 'Library.vue'):
              path = Path('resources/js/pages/Kingdom/Progression') / name
              text = path.read_text()
              text = text.replace(
                  '<dd>TC {{ systems.hero_gear.unlock_town_center }}</dd>',
                  "<dd>{{ t('progression.townCenterLevel', { level: systems.hero_gear.unlock_town_center }) }}</dd>",
              )
              text = text.replace(
                  '<dd>TC {{ systems.hero_gear.mastery_forging.unlock_town_center }}</dd>',
                  "<dd>{{ t('progression.townCenterLevel', { level: systems.hero_gear.mastery_forging.unlock_town_center }) }}</dd>",
              )
              text = text.replace(
                  '<dd>TC {{ systems.governor_gear.unlock_town_center }}</dd>',
                  "<dd>{{ t('progression.townCenterLevel', { level: systems.governor_gear.unlock_town_center }) }}</dd>",
              )
              text = text.replace(
                  'Tier {{ source.authority_tier }}',
                  "{{ t('progression.authorityTier', { tier: source.authority_tier }) }}",
              )
              path.write_text(text)
          PY

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Format and validate localization
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write resources/js/localization/messages/progression/en.ts resources/js/pages/Kingdom/Progression/Governor.vue resources/js/pages/Kingdom/Progression/Index.vue resources/js/pages/Kingdom/Progression/Library.vue
          npm run check:page-localization-coverage
          npm run types:check

      - name: Commit validated localization changes
        shell: bash
        run: |
          set -euo pipefail
          git add resources/js/localization/messages/progression/en.ts resources/js/pages/Kingdom/Progression/Governor.vue resources/js/pages/Kingdom/Progression/Index.vue resources/js/pages/Kingdom/Progression/Library.vue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: localize factual progression display labels'
          git push origin HEAD:feature/factual-governor-progression
