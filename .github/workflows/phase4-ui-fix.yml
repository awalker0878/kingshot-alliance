name: Phase 4 UI fix

on:
  push:
    branches:
      - agent/phase-4-recruitment
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase4-ui-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/phase-4-recruitment
          fetch-depth: 0
      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply guarded Vue fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manage = Path('resources/js/pages/Alliance/Recruitment/Manage.vue')
          text = manage.read_text()
          fixes = [
              ("import { Head, Link, useForm } from '@inertiajs/vue3';\n", "import { Head, Link, useForm } from '@inertiajs/vue3';\nimport { ref } from 'vue';\n"),
              ("const questionOptions = defineModel<string>('questionOptions', { default: '' });", "const questionOptions = ref('');\nconst candidatePlaceholder = '{{candidate_name}}';\nconst alliancePlaceholder = '{{alliance_name}}';"),
              ("<p class=\"text-xs text-slate-500\">Supported placeholders: <code>{{ '{{candidate_name}}' }}</code> and <code>{{ '{{alliance_name}}' }}</code>.</p>", "<p class=\"text-xs text-slate-500\">Supported placeholders: <code>{{ candidatePlaceholder }}</code> and <code>{{ alliancePlaceholder }}</code>.</p>"),
          ]
          for old, new in fixes:
              if text.count(old) != 1:
                  raise SystemExit(f'Manage.vue expected one match for: {old[:80]}')
              text = text.replace(old, new)
          manage.write_text(text)

          apply = Path('resources/js/pages/Public/RecruitmentApply.vue')
          text = apply.read_text()
          replacements = {
              'v-model="form.answers[question.id] as string[]"': 'v-model="form.answers[question.id]"',
              'v-model="form.answers[question.id] as boolean"': 'v-model="form.answers[question.id]"',
              'v-model="form.answers[question.id] as string"': 'v-model="form.answers[question.id]"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'RecruitmentApply.vue missing expected expression: {old}')
              text = text.replace(old, new)
          apply.write_text(text)

          candidate = Path('resources/js/pages/Alliance/Recruitment/Candidate.vue')
          text = candidate.read_text()
          marker = "function updateOnboarding(id: string, status: string): void {\n  router.patch(`/alliance/recruitment/onboarding/${id}`, { status }, { preserveScroll: true });\n}\n"
          addition = marker + "\nfunction updateOnboardingFromEvent(id: string, event: Event): void {\n  const target = event.target;\n  if (target instanceof HTMLSelectElement) {\n    updateOnboarding(id, target.value);\n  }\n}\n"
          if text.count(marker) != 1:
              raise SystemExit('Candidate.vue onboarding function marker mismatch')
          text = text.replace(marker, addition)
          old = '@change="updateOnboarding(item.id, ($event.target as HTMLSelectElement).value)"'
          new = '@change="updateOnboardingFromEvent(item.id, $event)"'
          if text.count(old) != 1:
              raise SystemExit('Candidate.vue inline event marker mismatch')
          candidate.write_text(text.replace(old, new))
          PY
      - name: Format recruitment pages
        run: npx prettier --write resources/js/pages/Public/RecruitmentApply.vue resources/js/pages/Alliance/Recruitment/Manage.vue resources/js/pages/Alliance/Recruitment/Candidate.vue resources/js/pages/Public/Alliance.vue
      - name: Commit normalized pages
        shell: bash
        run: |
          set -euo pipefail
          git add resources/js/pages/Public/RecruitmentApply.vue resources/js/pages/Alliance/Recruitment/Manage.vue resources/js/pages/Alliance/Recruitment/Candidate.vue resources/js/pages/Public/Alliance.vue
          if git diff --cached --quiet; then
            echo 'No recruitment UI fixes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Normalize Phase 4 recruitment UI'
          git push origin HEAD:agent/phase-4-recruitment
