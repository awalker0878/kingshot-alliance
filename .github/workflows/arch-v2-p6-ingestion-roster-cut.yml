name: ARCH V2 P6 Ingestion Roster Cut

on:
  push:
    branches:
      - architecture-v2
    paths:
      - '.github/workflows/arch-v2-p6-ingestion-roster-cut.yml'
      - '.github/scripts/arch_v2_p6_ingestion_roster_cut.py'

permissions:
  contents: write

jobs:
  hard-cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kingshot_test
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_test
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PULSE_ENABLED: false

    steps:
      - name: Check out architecture-v2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - name: Hard cut Intelligence ingestion and roster ownership
        run: python3 .github/scripts/arch_v2_p6_ingestion_roster_cut.py

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format P6 cut
        run: >-
          vendor/bin/pint
          app/Contexts/Intelligence/Ingestion
          app/Contexts/Intelligence/Roster
          app/Contexts/GameWorld/Actions/ResolveKingdom.php
          tests/Feature/Intelligence/Ingestion
          tests/Feature/Intelligence/Roster
          tests/Unit/Intelligence

      - name: Fresh PostgreSQL schema
        run: php artisan migrate:fresh --force

      - name: Verify V1 ingestion and roster runtime is gone
        shell: bash
        run: |
          set -euo pipefail
          matches=$(find app/Domain/Kingdoms -type f -name '*.php' \( -name '*KingdomIngestion*' -o -name '*Roster*' -o -name '*PlayerSnapshot*' -o -name 'PowerMath.php' -o -name 'ResolvePlayer.php' -o -name 'ResolveKingdom.php' \) -print 2>/dev/null || true)
          if [ -n "$matches" ]; then echo "$matches"; exit 1; fi
          refs=$(grep -R -n --include='*.php' -E 'App\\Domain\\Kingdoms\\(Actions|Contracts|Data|Enums|Http|Jobs|Models|Queries|Services|ValueObjects)\\(.*KingdomIngestion|.*Roster|.*PlayerSnapshot|PowerMath|ResolvePlayer|ResolveKingdom)' app routes bootstrap config database tests 2>/dev/null || true)
          if [ -n "$refs" ]; then echo "$refs"; exit 1; fi
          stale=$(grep -R -n --include='*.php' -E 'App\\Contexts\\GameWorld\\Models\\(KingdomIngestion|PlayerSnapshot|RosterImport|KingdomAllianceObservation|TrackedKingdomAlliance)' app routes bootstrap config database tests 2>/dev/null || true)
          if [ -n "$stale" ]; then echo "$stale"; exit 1; fi
          test ! -e config/kingdoms.php
          test -e config/intelligence.php

      - name: Static-check P6 cut
        run: >-
          vendor/bin/phpstan analyse --memory-limit=1G
          app/Contexts/Intelligence/Ingestion
          app/Contexts/Intelligence/Roster
          app/Contexts/GameWorld/Actions/ResolveKingdom.php

      - name: Run recovered P6 behavior contracts
        run: >-
          php artisan test
          tests/Feature/Intelligence/Ingestion
          tests/Feature/Intelligence/Roster
          tests/Unit/Intelligence
          tests/Architecture/ArchitectureV2IntelligenceTest.php

      - name: Remove one-shot refactor machinery
        shell: bash
        run: |
          rm -f .github/workflows/arch-v2-p6-observation-source-fix.yml
          rm -f .github/workflows/arch-v2-p6-observations-cut-v2.yml
          rm -f .github/workflows/arch-v2-p6-ingestion-roster-cut.yml
          rm -f .github/scripts/arch_v2_p6_ingestion_roster_cut.py

      - name: Commit P6 ingestion and roster cut
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'awalker0878'
          git config user.email '52688461+awalker0878@users.noreply.github.com'
          git add -A
          git commit -m 'ARCH-V2-P6: hard cut ingestion and roster intelligence'
          git push origin HEAD:architecture-v2
