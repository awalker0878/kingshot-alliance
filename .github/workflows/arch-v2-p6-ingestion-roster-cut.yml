name: ARCH V2 P6 Ingestion Roster Cut

on:
  push:
    branches:
      - architecture-v2
    paths:
      - '.github/workflows/arch-v2-p6-ingestion-roster-cut.yml'

permissions:
  contents: write

jobs:
  hard-cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kingshot_test
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_test
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PULSE_ENABLED: false

    steps:
      - name: Check out architecture-v2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - name: Hard cut Intelligence ingestion and roster ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import shutil

          repo = Path('.')
          domain = repo / 'app/Domain/Kingdoms'
          replacements: dict[str, str] = {}

          def fqcn(path: Path, text: str) -> str:
              match = re.search(r'^namespace\s+([^;]+);', text, re.M)
              if not match:
                  raise RuntimeError(f'No namespace in {path}')
              return match.group(1) + '\\' + path.stem

          def move_php(src: Path, dst: Path) -> None:
              if not src.is_file():
                  raise RuntimeError(f'Missing source: {src}')
              if dst.exists():
                  raise RuntimeError(f'Destination already exists: {dst}')
              original = src.read_text(encoding='utf-8')
              old_fqcn = fqcn(src, original)
              old_ns = old_fqcn.rsplit('\\', 1)[0]
              rel_parent = dst.parent.relative_to(repo / 'app')
              new_ns = 'App\\' + str(rel_parent).replace('/', '\\')
              rewritten = original.replace(f'namespace {old_ns};', f'namespace {new_ns};', 1)
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_text(rewritten, encoding='utf-8')
              src.unlink()
              replacements[old_fqcn] = new_ns + '\\' + dst.stem

          # Correct one neutral foundation primitive that P6 exposed as still stranded in V1.
          move_php(
              domain / 'Actions/ResolveKingdom.php',
              repo / 'app/Contexts/GameWorld/Actions/ResolveKingdom.php',
          )

          # Roster-scoped Player resolution is deliberately NOT moved into GameWorld: it
          # reads Alliance membership/roster state and therefore belongs downstream.
          move_php(
              domain / 'Actions/ResolvePlayer.php',
              repo / 'app/Contexts/Intelligence/Roster/Actions/ResolvePlayer.php',
          )

          ingestion_files: list[Path] = []
          roster_files: list[Path] = []
          for src in sorted(domain.rglob('*.php')):
              name = src.stem
              if 'KingdomIngestion' in name:
                  ingestion_files.append(src)
                  continue
              if ('Roster' in name or 'PlayerSnapshot' in name or name == 'PowerMath') and 'Transfer' not in name:
                  roster_files.append(src)

          if not ingestion_files:
              raise RuntimeError('No V1 KingdomIngestion files found for P6 cut.')
          if not roster_files:
              raise RuntimeError('No V1 roster/player-snapshot files found for P6 cut.')

          for src in ingestion_files:
              rel = src.relative_to(domain)
              move_php(src, repo / 'app/Contexts/Intelligence/Ingestion' / rel)

          for src in roster_files:
              rel = src.relative_to(domain)
              move_php(src, repo / 'app/Contexts/Intelligence/Roster' / rel)

          # P2 already removed these feature aggregates from GameWorld. Dormant V1 tests
          # still used those stale namespaces; restate them against their P6 owners.
          model_owner: dict[str, str] = {}
          for path in (repo / 'app/Contexts/Intelligence/Ingestion/Models').glob('*.php'):
              model_owner[path.stem] = f'App\\Contexts\\Intelligence\\Ingestion\\Models\\{path.stem}'
          for path in (repo / 'app/Contexts/Intelligence/Roster/Models').glob('*.php'):
              model_owner[path.stem] = f'App\\Contexts\\Intelligence\\Roster\\Models\\{path.stem}'
          model_owner['KingdomAllianceObservation'] = 'App\\Contexts\\Intelligence\\Observations\\Models\\KingdomAllianceObservation'
          model_owner['TrackedKingdomAlliance'] = 'App\\Contexts\\Intelligence\\Observations\\Models\\TrackedKingdomAlliance'
          for name, new in model_owner.items():
              replacements[f'App\\Contexts\\GameWorld\\Models\\{name}'] = new

          roots = ['app', 'routes', 'bootstrap', 'config', 'database', 'tests']
          for root_name in roots:
              root = repo / root_name
              if not root.exists():
                  continue
              for path in root.rglob('*.php'):
                  text = path.read_text(encoding='utf-8')
                  rewritten = text
                  for old, new in replacements.items():
                      rewritten = rewritten.replace(old, new)
                  if rewritten != text:
                      path.write_text(rewritten, encoding='utf-8')

          # Add the lower-context Kingdom import to moved models that inherited the stale
          # V1 same-namespace assumption after the P2 hard cut.
          for capability in ('Ingestion', 'Roster'):
              models = repo / f'app/Contexts/Intelligence/{capability}/Models'
              if not models.exists():
                  continue
              for path in models.glob('*.php'):
                  text = path.read_text(encoding='utf-8')
                  if 'Kingdom::class' in text and 'use App\\Contexts\\GameWorld\\Models\\Kingdom;' not in text:
                      marker = re.search(r'^(namespace [^;]+;\n)', text, re.M)
                      if marker:
                          insert_at = marker.end()
                          text = text[:insert_at] + '\nuse App\\Contexts\\GameWorld\\Models\\Kingdom;\n' + text[insert_at:]
                          path.write_text(text, encoding='utf-8')

          # Configuration follows the owning context. This is a hard cut, not an alias.
          old_config = repo / 'config/kingdoms.php'
          new_config = repo / 'config/intelligence.php'
          if old_config.is_file():
              if new_config.exists():
                  raise RuntimeError('config/intelligence.php already exists unexpectedly')
              old_config.rename(new_config)
          for root_name in roots:
              root = repo / root_name
              if not root.exists():
                  continue
              for path in root.rglob('*.php'):
                  text = path.read_text(encoding='utf-8')
                  rewritten = text.replace("config('kingdoms.ingestion_", "config('intelligence.ingestion_")
                  rewritten = rewritten.replace("config('kingdoms.shared_intelligence", "config('intelligence.shared_intelligence")
                  rewritten = rewritten.replace("'kingdoms.ingestion_", "'intelligence.ingestion.")
                  rewritten = rewritten.replace('"kingdoms.ingestion_', '"intelligence.ingestion.')
                  rewritten = rewritten.replace("'kingdoms.roster_", "'intelligence.roster.")
                  rewritten = rewritten.replace('"kingdoms.roster_', '"intelligence.roster.')
                  if rewritten != text:
                      path.write_text(rewritten, encoding='utf-8')

          # Recover valid V1-named acceptance contracts under the owning V2 capabilities.
          feature_kingdoms = repo / 'tests/Feature/Kingdoms'
          for path in sorted(feature_kingdoms.glob('*.php')) if feature_kingdoms.exists() else []:
              name = path.stem
              capability = None
              if 'KingdomIngestion' in name:
                  capability = 'Ingestion'
              elif 'Roster' in name or 'PlayerSnapshot' in name:
                  capability = 'Roster'
              if capability is None:
                  continue
              dst = repo / f'tests/Feature/Intelligence/{capability}/{path.name}'
              dst.parent.mkdir(parents=True, exist_ok=True)
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  'namespace Tests\\Feature\\Kingdoms;',
                  f'namespace Tests\\Feature\\Intelligence\\{capability};',
                  1,
              )
              dst.write_text(text, encoding='utf-8')
              path.unlink()

          unit_kingdoms = repo / 'tests/Unit/Kingdoms'
          for path in sorted(unit_kingdoms.glob('*.php')) if unit_kingdoms.exists() else []:
              name = path.stem
              capability = None
              if 'KingdomIngestion' in name:
                  capability = 'Ingestion'
              elif 'Roster' in name or 'PlayerSnapshot' in name:
                  capability = 'Roster'
              if capability is None:
                  continue
              dst = repo / f'tests/Unit/Intelligence/{capability}/{path.name}'
              dst.parent.mkdir(parents=True, exist_ok=True)
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  'namespace Tests\\Unit\\Kingdoms;',
                  f'namespace Tests\\Unit\\Intelligence\\{capability};',
                  1,
              )
              dst.write_text(text, encoding='utf-8')
              path.unlink()

          # Update imports in moved tests after their relocation.
          for root_name in ('tests/Feature/Intelligence', 'tests/Unit/Intelligence'):
              root = repo / root_name
              if not root.exists():
                  continue
              for path in root.rglob('*.php'):
                  text = path.read_text(encoding='utf-8')
                  rewritten = text
                  for old, new in replacements.items():
                      rewritten = rewritten.replace(old, new)
                  if rewritten != text:
                      path.write_text(rewritten, encoding='utf-8')

          print(f'Moved {len(ingestion_files)} ingestion files and {len(roster_files)} roster files.')
          PY

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format P6 cut
        run: >-
          vendor/bin/pint
          app/Contexts/Intelligence/Ingestion
          app/Contexts/Intelligence/Roster
          app/Contexts/GameWorld/Actions/ResolveKingdom.php
          tests/Feature/Intelligence/Ingestion
          tests/Feature/Intelligence/Roster

      - name: Fresh PostgreSQL schema
        run: php artisan migrate:fresh --force

      - name: Verify V1 ingestion and roster runtime is gone
        shell: bash
        run: |
          set -euo pipefail
          matches=$(find app/Domain/Kingdoms -type f -name '*.php' \( -name '*KingdomIngestion*' -o -name '*Roster*' -o -name '*PlayerSnapshot*' -o -name 'PowerMath.php' -o -name 'ResolvePlayer.php' -o -name 'ResolveKingdom.php' \) -print 2>/dev/null || true)
          if [ -n "$matches" ]; then echo "$matches"; exit 1; fi
          refs=$(grep -R -n --include='*.php' -E 'App\\Domain\\Kingdoms\\(Actions|Contracts|Data|Enums|Http|Jobs|Models|Queries|Services|ValueObjects)\\(.*KingdomIngestion|.*Roster|.*PlayerSnapshot|PowerMath|ResolvePlayer|ResolveKingdom)' app routes bootstrap config database tests 2>/dev/null || true)
          if [ -n "$refs" ]; then echo "$refs"; exit 1; fi
          stale=$(grep -R -n --include='*.php' -E 'App\\Contexts\\GameWorld\\Models\\(KingdomIngestion|PlayerSnapshot|RosterImport|KingdomAllianceObservation|TrackedKingdomAlliance)' app routes bootstrap config database tests 2>/dev/null || true)
          if [ -n "$stale" ]; then echo "$stale"; exit 1; fi
          test ! -e config/kingdoms.php
          test -e config/intelligence.php

      - name: Static-check P6 cut
        run: >-
          vendor/bin/phpstan analyse --memory-limit=1G
          app/Contexts/Intelligence/Ingestion
          app/Contexts/Intelligence/Roster
          app/Contexts/GameWorld/Actions/ResolveKingdom.php

      - name: Run recovered P6 behavior contracts
        run: >-
          php artisan test
          tests/Feature/Intelligence/Ingestion
          tests/Feature/Intelligence/Roster
          tests/Architecture/ArchitectureV2IntelligenceTest.php

      - name: Remove one-shot refactor workflows
        shell: bash
        run: |
          rm -f .github/workflows/arch-v2-p6-observation-source-fix.yml
          rm -f .github/workflows/arch-v2-p6-observations-cut-v2.yml
          rm -f .github/workflows/arch-v2-p6-ingestion-roster-cut.yml

      - name: Commit P6 ingestion and roster cut
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'awalker0878'
          git config user.email '52688461+awalker0878@users.noreply.github.com'
          git add -A
          git commit -m 'ARCH-V2-P6: hard cut ingestion and roster intelligence'
          git push origin HEAD:architecture-v2
