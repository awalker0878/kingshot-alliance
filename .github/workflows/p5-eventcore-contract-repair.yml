name: P5 EventCore Contract Repair

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/p5-eventcore-contract-repair.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pdo_pgsql, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Tighten EventCore read contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          controller = Path('app/Contexts/Operations/EventCore/Http/Controllers/EventManagementController.php')
          text = controller.read_text()
          text = text.replace(
          """        foreach (EventScope::cases() as $scope) {
              $typesByScope[$scope->value] = $types->activeForScope($scope)
                  ->map(function (EventType $type) use ($scope, $types, $defaults): array {
                      $configuration = $types->scope($type, $scope);

                      return [
                          'id' => (string) $type->id,
                          'scopeConfigurationId' => (string) $configuration->id,
                          'slug' => (string) $type->slug,
                          'nameKey' => (string) $type->name_key,
                          'descriptionKey' => $type->description_key,
                          'category' => $type->category->value,
                          'iconKey' => $type->icon_key,
                          'defaults' => $defaults->resolve($configuration),
                      ];
                  })
                  ->all();
          }

          return Inertia::render('Events/Create', [
              'user' => $this->identity($user),
              'contexts' => $creationContexts,
              'typesByScope' => $typesByScope,
              'templates' => $templates->available($actor)->map(function (EventTemplate $template) use ($targets): array {
                  $target = $targets->forTemplate($template);

                  return [
                      'id' => (string) $template->id,
                      'name' => (string) $template->name,
                      'nameKey' => (string) $template->eventType->name_key,
                      'scope' => $template->scope->value,
                      'targetId' => (string) $target->id,
                      'targetLabel' => $targets->label($target),
                      'timezone' => (string) $template->timezone,
                      'recurrenceFrequency' => $template->recurrence_frequency->value,
                      'recurrenceInterval' => (int) $template->recurrence_interval,
                  ];
              })->values()->all(),
          ]);""",
          """        foreach (EventScope::cases() as $scope) {
              $scopeTypes = [];
              foreach ($types->activeForScope($scope) as $type) {
                  if (! $type instanceof EventType) {
                      continue;
                  }

                  $configuration = $types->scope($type, $scope);
                  $scopeTypes[] = [
                      'id' => (string) $type->id,
                      'scopeConfigurationId' => (string) $configuration->id,
                      'slug' => $type->slug,
                      'nameKey' => $type->name_key,
                      'descriptionKey' => $type->description_key,
                      'category' => $type->category->value,
                      'iconKey' => $type->icon_key,
                      'defaults' => $defaults->resolve($configuration),
                  ];
              }
              $typesByScope[$scope->value] = $scopeTypes;
          }

          $templateOptions = [];
          foreach ($templates->available($actor) as $template) {
              if (! $template instanceof EventTemplate) {
                  continue;
              }

              $eventType = $template->eventType;
              if (! $eventType instanceof EventType) {
                  continue;
              }

              $target = $targets->forTemplate($template);
              $templateOptions[] = [
                  'id' => (string) $template->id,
                  'name' => $template->name,
                  'nameKey' => $eventType->name_key,
                  'scope' => $template->scope->value,
                  'targetId' => (string) $target->id,
                  'targetLabel' => $targets->label($target),
                  'timezone' => $template->timezone,
                  'recurrenceFrequency' => $template->recurrence_frequency->value,
                  'recurrenceInterval' => $template->recurrence_interval,
              ];
          }

          return Inertia::render('Events/Create', [
              'user' => $this->identity($user),
              'contexts' => $creationContexts,
              'typesByScope' => $typesByScope,
              'templates' => $templateOptions,
          ]);"""
          )
          controller.write_text(text)

          catalog = Path('app/Contexts/Operations/EventCore/Catalog/KingShotEventTypeCatalog.php')
          text = catalog.read_text()
          text = text.replace(
              '/** @param list<array<string, mixed>> $scopes */\n    private static function type',
              '/**\n     * @param list<array<string, mixed>> $scopes\n     * @return array<string, mixed>\n     */\n    private static function type'
          )
          text = text.replace(
              '     * @param  array<string, array<string, int|string|bool|array<array-key, mixed>>>  $capabilityConfiguration\n     * @return array<string, mixed>',
              '     * @param  array<string, mixed>  $defaultSettings\n     * @param  array<string, array<string, int|string|bool|array<array-key, mixed>>>  $capabilityConfiguration\n     * @return array<string, mixed>'
          )
          catalog.write_text(text)
          PY

          vendor/bin/pint \
            app/Contexts/Operations/EventCore/Http/Controllers/EventManagementController.php \
            app/Contexts/Operations/EventCore/Catalog/KingShotEventTypeCatalog.php \
            app/Contexts/Operations/EventCore/Actions/CreateEventFromTemplate.php \
            app/Contexts/Operations/EventCore/Models/EventType.php \
            app/Contexts/Operations/EventCore/Models/EventTemplate.php

      - name: Commit repair and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p5-eventcore-contract-repair.yml
          git add app/Contexts/Operations/EventCore
          git commit -m 'ARCH-V2: tighten EventCore runtime contracts'
          git push origin HEAD:architecture-v2

      - name: Dispatch authoritative verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run architecture-v2-verification.yml --ref architecture-v2
