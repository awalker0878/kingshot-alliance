name: Domain Structure Refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: domain-structure-refactor-pr
  cancel-in-progress: true

jobs:
  refactor:
    if: github.head_ref == 'agent/app-architecture-alignment' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/app-architecture-alignment
          fetch-depth: 0

      - name: Extract refactor implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/domain-first-refactor.yml').read_text().splitlines()
          marker = '      - name: Move runtime code into canonical domains'
          start = lines.index(marker)
          run_index = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          body = []
          for line in lines[run_index + 1:]:
              if line == '      - name: Commit refactor':
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              elif line == '':
                  body.append('')
              else:
                  raise RuntimeError(f'Unexpected workflow line: {line!r}')
          Path('/tmp/domain-refactor.sh').write_text('\n'.join(body) + '\n')
          PY

      - name: Apply domain-first refactor
        shell: bash
        run: bash /tmp/domain-refactor.sh

      - name: Commit domain-first refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Align app runtime with domain-first implementation plan"
          git push origin HEAD:agent/app-architecture-alignment
