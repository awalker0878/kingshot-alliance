name: Factual Progression Format

on:
  push:
    branches:
      - feature/factual-governor-progression
    paths:
      - .github/workflows/progression-format.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: factual-progression-format
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out feature head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/factual-governor-progression
          fetch-depth: 0

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply repository formatters
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/pint \
            app/Contexts/GameWorld/Progression \
            app/Contexts/Intelligence/Roster/Actions/RecordPlayerSnapshot.php \
            app/Contexts/Intelligence/Roster/Http/Controllers/PlayerSnapshotController.php \
            app/Contexts/Operations/Rallies/Actions/SavePlayerFormation.php \
            app/Contexts/Operations/Rallies/Http/Controllers/PlayerFormationController.php \
            app/Contexts/Operations/Rallies/Models/PlayerFormation.php \
            app/ReadModels/Progression \
            routes/progression.php \
            database/migrations/2026_08_23_233500_pin_progression_datasets_to_observations_and_formations.php \
            tests/v3/Contexts/GameWorld/Progression
          npx prettier --write \
            resources/js/layouts/AppLayout.vue \
            'resources/js/localization/messages/progression/*.ts' \
            resources/js/localization/registry.ts \
            'resources/js/pages/Kingdom/Progression/*.vue'

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git add \
            app/Contexts/GameWorld/Progression \
            app/Contexts/Intelligence/Roster/Actions/RecordPlayerSnapshot.php \
            app/Contexts/Intelligence/Roster/Http/Controllers/PlayerSnapshotController.php \
            app/Contexts/Operations/Rallies \
            app/ReadModels/Progression \
            routes/progression.php \
            database/migrations/2026_08_23_233500_pin_progression_datasets_to_observations_and_formations.php \
            tests/v3/Contexts/GameWorld/Progression \
            resources/js/layouts/AppLayout.vue \
            resources/js/localization/messages/progression \
            resources/js/localization/registry.ts \
            resources/js/pages/Kingdom/Progression
          if git diff --cached --quiet; then
            echo 'Repository formatting is already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format factual progression implementation'
          git push origin HEAD:feature/factual-governor-progression
