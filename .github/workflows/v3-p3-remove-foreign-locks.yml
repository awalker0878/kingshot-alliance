name: V3 CA-P3 Remove Foreign Locks

on:
  push:
    branches:
      - architecture-v3-capability-alignment

permissions:
  contents: write

jobs:
  rewrite:
    if: ${{ !contains(github.event.head_commit.message, 'remove invalid foreign-context locks') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v3-capability-alignment
          fetch-depth: 0
      - name: Remove locks from foreign model reads
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          contexts = Path('app/Contexts')
          import_pattern = re.compile(
              r'^use App\\Contexts\\([A-Za-z0-9_]+)\\[^;]*\\Models\\([A-Za-z0-9_]+)(?:\s+as\s+([A-Za-z0-9_]+))?;',
              re.M,
          )
          changed = []
          for context_path in sorted(p for p in contexts.iterdir() if p.is_dir()):
              context = context_path.name
              for path in context_path.rglob('*.php'):
                  text = path.read_text()
                  foreign = []
                  for match in import_pattern.finditer(text):
                      if match.group(1) == context:
                          continue
                      foreign.append(match.group(3) or match.group(2))
                  updated = text
                  for alias in foreign:
                      q = re.escape(alias)
                      patterns = [
                          re.compile(r'(\b'+q+r'::query\(\)[\s\S]{0,800}?)->lockForUpdate\(\)'),
                          re.compile(r'(\b'+q+r'::query\(\)[\s\S]{0,800}?)->sharedLock\(\)'),
                          re.compile(r'(\b'+q+r'::where\([\s\S]{0,800}?)->lockForUpdate\(\)'),
                          re.compile(r'(\b'+q+r'::where\([\s\S]{0,800}?)->sharedLock\(\)'),
                      ]
                      for pattern in patterns:
                          updated = pattern.sub(r'\1', updated)
                  if updated != text:
                      path.write_text(updated)
                      changed.append(path.as_posix())
          print('\n'.join(changed))
          PY
      - name: Syntax check changed application
        shell: bash
        run: find app -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Remove one-use workflow
        run: rm -f .github/workflows/v3-p3-remove-foreign-locks.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor(v3): remove invalid foreign-context locks [skip ci]"
          git push origin HEAD:architecture-v3-capability-alignment
