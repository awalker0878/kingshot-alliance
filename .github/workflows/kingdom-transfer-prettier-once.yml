name: Kingdom Transfer Prettier Once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event.pull_request.head.ref == 'feature/kingdom-transfer-planning' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/kingdom-transfer-planning
      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply and verify Prettier
        run: |
          npx prettier --write resources/js/pages/Kingdom/Transfer/Manage.vue resources/js/pages/Kingdom/Transfer/Readiness.vue
          npx prettier --check resources/js/pages/Kingdom/Transfer/Manage.vue resources/js/pages/Kingdom/Transfer/Readiness.vue
      - name: Commit formatting and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/kingdom-transfer-prettier-once.yml
          git add resources/js/pages/Kingdom/Transfer/Manage.vue resources/js/pages/Kingdom/Transfer/Readiness.vue
          git commit -m "style: format transfer provenance UX"
          git push origin HEAD:feature/kingdom-transfer-planning
