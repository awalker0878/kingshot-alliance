name: ARCH V2 P6 Sharing Cut

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/arch-v2-p6-sharing-cut.yml'

permissions:
  contents: write

jobs:
  hard-cut:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out architecture-v2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - name: Move Sharing domain capability into Intelligence
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          groups = {
              'Models': ['KingdomIntelligenceShare', 'KingdomIntelligenceShareTarget'],
              'Enums': ['KingdomIntelligenceShareState', 'KingdomIntelligenceShareTargetState'],
              'Services': ['KingdomIntelligenceShareTokenService'],
              'ValueObjects': ['IssuedKingdomIntelligenceShareInvitation'],
              'Actions': [
                  'AcceptKingdomIntelligenceShareInvitation',
                  'AddKingdomIntelligenceShareTarget',
                  'CreateKingdomIntelligenceShareInvitation',
                  'DeclineKingdomIntelligenceShareInvitation',
                  'EnforceKingdomIntelligenceSharingRetention',
                  'LeaveKingdomIntelligenceShare',
                  'RemoveKingdomIntelligenceShareTarget',
                  'RevokeKingdomIntelligenceShare',
              ],
              'Queries': ['KingdomIntelligenceSharingManageQuery'],
          }

          replacements = {}
          for group, names in groups.items():
              for name in names:
                  old = f'App\\Domain\\Kingdoms\\{group}\\{name}'
                  new = f'App\\Contexts\\Intelligence\\Sharing\\{group}\\{name}'
                  replacements[old] = new

          # Several V1 files already referenced sharing models as if GameWorld owned them.
          replacements[r'App\Contexts\GameWorld\Models\KingdomIntelligenceShare'] = r'App\Contexts\Intelligence\Sharing\Models\KingdomIntelligenceShare'
          replacements[r'App\Contexts\GameWorld\Models\KingdomIntelligenceShareTarget'] = r'App\Contexts\Intelligence\Sharing\Models\KingdomIntelligenceShareTarget'

          for group, names in groups.items():
              for name in names:
                  src = Path(f'app/Domain/Kingdoms/{group}/{name}.php')
                  dst = Path(f'app/Contexts/Intelligence/Sharing/{group}/{name}.php')
                  if not src.is_file():
                      raise SystemExit(f'Missing source for P6 Sharing cut: {src}')
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  text = src.read_text(encoding='utf-8')
                  text = text.replace(
                      f'namespace App\\Domain\\Kingdoms\\{group};',
                      f'namespace App\\Contexts\\Intelligence\\Sharing\\{group};',
                  )
                  for old, new in replacements.items():
                      text = text.replace(old, new)
                  dst.write_text(text, encoding='utf-8')
                  src.unlink()

          share = Path('app/Contexts/Intelligence/Sharing/Models/KingdomIntelligenceShare.php')
          text = share.read_text(encoding='utf-8')
          anchor = 'use App\\Contexts\\GameWorld\\Models\\Player;\n'
          if anchor not in text:
              raise SystemExit('KingdomIntelligenceShare Player import anchor missing')
          text = text.replace(anchor, 'use App\\Contexts\\GameWorld\\Models\\Kingdom;\n'+anchor, 1)
          share.write_text(text, encoding='utf-8')

          target = Path('app/Contexts/Intelligence/Sharing/Models/KingdomIntelligenceShareTarget.php')
          text = target.read_text(encoding='utf-8')
          anchor = 'use App\\Contexts\\GameWorld\\Models\\Player;\n'
          if anchor not in text:
              raise SystemExit('KingdomIntelligenceShareTarget Player import anchor missing')
          text = text.replace(
              anchor,
              anchor+'use App\\Contexts\\Intelligence\\Observations\\Models\\TrackedKingdomAlliance;\n',
              1,
          )
          target.write_text(text, encoding='utf-8')

          # Rewrite all production consumers. The legacy UI controller remains in place until
          # its current/history read side is rebuilt under ReadModels, but it consumes these
          # new Sharing actions/query immediately.
          for root_name in ('app', 'routes', 'bootstrap', 'config', 'database'):
              root = Path(root_name)
              if not root.exists():
                  continue
              for path in root.rglob('*.php'):
                  text = path.read_text(encoding='utf-8')
                  rewritten = text
                  for old, new in replacements.items():
                      rewritten = rewritten.replace(old, new)
                  if rewritten != text:
                      path.write_text(rewritten, encoding='utf-8')
          PY

      - name: Verify Sharing owner is V2-only
        shell: bash
        run: |
          set -euo pipefail
          test -d app/Contexts/Intelligence/Sharing
          test ! -e app/Domain/Kingdoms/Models/KingdomIntelligenceShare.php
          test ! -e app/Domain/Kingdoms/Models/KingdomIntelligenceShareTarget.php
          test -e app/Domain/Kingdoms/Http/Controllers/KingdomIntelligenceSharingController.php
          matches=$(grep -R -n --include='*.php' 'App\\Domain\\' app/Contexts/Intelligence/Sharing 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            exit 1
          fi

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pdo_pgsql, xml, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format Sharing
        run: vendor/bin/pint app/Contexts/Intelligence/Sharing

      - name: Static-check Sharing
        run: vendor/bin/phpstan analyse --memory-limit=1G app/Contexts/Intelligence/Sharing

      - name: Commit P6 Sharing cut
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'awalker0878'
          git config user.email '52688461+awalker0878@users.noreply.github.com'
          git add app routes bootstrap config database
          if git diff --cached --quiet; then
            echo 'No Sharing migration changes found.'
            exit 0
          fi
          git commit -m 'ARCH-V2-P6: hard cut Intelligence Sharing'
          git push origin HEAD:architecture-v2
