name: ARCH V2 P6 Sharing Cut

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/arch-v2-p6-sharing-cut.yml'

permissions:
  contents: write

jobs:
  hard-cut:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out architecture-v2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - name: Move Sharing into Intelligence
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          moves = {
              'app/Domain/Kingdoms/Models/KingdomIntelligenceShare.php': 'app/Contexts/Intelligence/Sharing/Models/KingdomIntelligenceShare.php',
              'app/Domain/Kingdoms/Models/KingdomIntelligenceShareTarget.php': 'app/Contexts/Intelligence/Sharing/Models/KingdomIntelligenceShareTarget.php',
              'app/Domain/Kingdoms/Enums/KingdomIntelligenceShareState.php': 'app/Contexts/Intelligence/Sharing/Enums/KingdomIntelligenceShareState.php',
              'app/Domain/Kingdoms/Enums/KingdomIntelligenceShareTargetState.php': 'app/Contexts/Intelligence/Sharing/Enums/KingdomIntelligenceShareTargetState.php',
              'app/Domain/Kingdoms/Services/KingdomIntelligenceShareTokenService.php': 'app/Contexts/Intelligence/Sharing/Services/KingdomIntelligenceShareTokenService.php',
              'app/Domain/Kingdoms/ValueObjects/IssuedKingdomIntelligenceShareInvitation.php': 'app/Contexts/Intelligence/Sharing/ValueObjects/IssuedKingdomIntelligenceShareInvitation.php',
              'app/Domain/Kingdoms/Actions/AcceptKingdomIntelligenceShareInvitation.php': 'app/Contexts/Intelligence/Sharing/Actions/AcceptKingdomIntelligenceShareInvitation.php',
              'app/Domain/Kingdoms/Actions/AddKingdomIntelligenceShareTarget.php': 'app/Contexts/Intelligence/Sharing/Actions/AddKingdomIntelligenceShareTarget.php',
              'app/Domain/Kingdoms/Actions/CreateKingdomIntelligenceShareInvitation.php': 'app/Contexts/Intelligence/Sharing/Actions/CreateKingdomIntelligenceShareInvitation.php',
              'app/Domain/Kingdoms/Actions/DeclineKingdomIntelligenceShareInvitation.php': 'app/Contexts/Intelligence/Sharing/Actions/DeclineKingdomIntelligenceShareInvitation.php',
              'app/Domain/Kingdoms/Actions/EnforceKingdomIntelligenceSharingRetention.php': 'app/Contexts/Intelligence/Sharing/Actions/EnforceKingdomIntelligenceSharingRetention.php',
              'app/Domain/Kingdoms/Actions/LeaveKingdomIntelligenceShare.php': 'app/Contexts/Intelligence/Sharing/Actions/LeaveKingdomIntelligenceShare.php',
              'app/Domain/Kingdoms/Actions/RemoveKingdomIntelligenceShareTarget.php': 'app/Contexts/Intelligence/Sharing/Actions/RemoveKingdomIntelligenceShareTarget.php',
              'app/Domain/Kingdoms/Actions/RevokeKingdomIntelligenceShare.php': 'app/Contexts/Intelligence/Sharing/Actions/RevokeKingdomIntelligenceShare.php',
              'app/Domain/Kingdoms/Queries/KingdomIntelligenceSharingManageQuery.php': 'app/Contexts/Intelligence/Sharing/Queries/KingdomIntelligenceSharingManageQuery.php',
              'app/Domain/Kingdoms/Http/Controllers/KingdomIntelligenceSharingController.php': 'app/Contexts/Intelligence/Sharing/Http/Controllers/KingdomIntelligenceSharingController.php',
          }

          classes = {
              r'App\Domain\Kingdoms\Models\KingdomIntelligenceShare': r'App\Contexts\Intelligence\Sharing\Models\KingdomIntelligenceShare',
              r'App\Domain\Kingdoms\Models\KingdomIntelligenceShareTarget': r'App\Contexts\Intelligence\Sharing\Models\KingdomIntelligenceShareTarget',
              r'App\Contexts\GameWorld\Models\KingdomIntelligenceShare': r'App\Contexts\Intelligence\Sharing\Models\KingdomIntelligenceShare',
              r'App\Contexts\GameWorld\Models\KingdomIntelligenceShareTarget': r'App\Contexts\Intelligence\Sharing\Models\KingdomIntelligenceShareTarget',
              r'App\Domain\Kingdoms\Enums\KingdomIntelligenceShareState': r'App\Contexts\Intelligence\Sharing\Enums\KingdomIntelligenceShareState',
              r'App\Domain\Kingdoms\Enums\KingdomIntelligenceShareTargetState': r'App\Contexts\Intelligence\Sharing\Enums\KingdomIntelligenceShareTargetState',
              r'App\Domain\Kingdoms\Services\KingdomIntelligenceShareTokenService': r'App\Contexts\Intelligence\Sharing\Services\KingdomIntelligenceShareTokenService',
              r'App\Domain\Kingdoms\ValueObjects\IssuedKingdomIntelligenceShareInvitation': r'App\Contexts\Intelligence\Sharing\ValueObjects\IssuedKingdomIntelligenceShareInvitation',
              r'App\Domain\Kingdoms\Actions\AcceptKingdomIntelligenceShareInvitation': r'App\Contexts\Intelligence\Sharing\Actions\AcceptKingdomIntelligenceShareInvitation',
              r'App\Domain\Kingdoms\Actions\AddKingdomIntelligenceShareTarget': r'App\Contexts\Intelligence\Sharing\Actions\AddKingdomIntelligenceShareTarget',
              r'App\Domain\Kingdoms\Actions\CreateKingdomIntelligenceShareInvitation': r'App\Contexts\Intelligence\Sharing\Actions\CreateKingdomIntelligenceShareInvitation',
              r'App\Domain\Kingdoms\Actions\DeclineKingdomIntelligenceShareInvitation': r'App\Contexts\Intelligence\Sharing\Actions\DeclineKingdomIntelligenceShareInvitation',
              r'App\Domain\Kingdoms\Actions\EnforceKingdomIntelligenceSharingRetention': r'App\Contexts\Intelligence\Sharing\Actions\EnforceKingdomIntelligenceSharingRetention',
              r'App\Domain\Kingdoms\Actions\LeaveKingdomIntelligenceShare': r'App\Contexts\Intelligence\Sharing\Actions\LeaveKingdomIntelligenceShare',
              r'App\Domain\Kingdoms\Actions\RemoveKingdomIntelligenceShareTarget': r'App\Contexts\Intelligence\Sharing\Actions\RemoveKingdomIntelligenceShareTarget',
              r'App\Domain\Kingdoms\Actions\RevokeKingdomIntelligenceShare': r'App\Contexts\Intelligence\Sharing\Actions\RevokeKingdomIntelligenceShare',
              r'App\Domain\Kingdoms\Queries\KingdomIntelligenceSharingManageQuery': r'App\Contexts\Intelligence\Sharing\Queries\KingdomIntelligenceSharingManageQuery',
              r'App\Domain\Kingdoms\Http\Controllers\KingdomIntelligenceSharingController': r'App\Contexts\Intelligence\Sharing\Http\Controllers\KingdomIntelligenceSharingController',
          }

          ns = {
              '/Models/': r'App\Contexts\Intelligence\Sharing\Models',
              '/Enums/': r'App\Contexts\Intelligence\Sharing\Enums',
              '/Services/': r'App\Contexts\Intelligence\Sharing\Services',
              '/ValueObjects/': r'App\Contexts\Intelligence\Sharing\ValueObjects',
              '/Actions/': r'App\Contexts\Intelligence\Sharing\Actions',
              '/Queries/': r'App\Contexts\Intelligence\Sharing\Queries',
              '/Http/Controllers/': r'App\Contexts\Intelligence\Sharing\Http\Controllers',
          }
          old_ns = {
              '/Models/': r'App\Domain\Kingdoms\Models',
              '/Enums/': r'App\Domain\Kingdoms\Enums',
              '/Services/': r'App\Domain\Kingdoms\Services',
              '/ValueObjects/': r'App\Domain\Kingdoms\ValueObjects',
              '/Actions/': r'App\Domain\Kingdoms\Actions',
              '/Queries/': r'App\Domain\Kingdoms\Queries',
              '/Http/Controllers/': r'App\Domain\Kingdoms\Http\Controllers',
          }

          for src_name, dst_name in moves.items():
              src = Path(src_name)
              dst = Path(dst_name)
              if not src.is_file():
                  raise SystemExit(f'Missing source for P6 Sharing cut: {src}')
              dst.parent.mkdir(parents=True, exist_ok=True)
              text = src.read_text(encoding='utf-8')
              key = next(k for k in ns if k in src_name)
              text = text.replace(f'namespace {old_ns[key]};', f'namespace {ns[key]};')
              for old, new in classes.items():
                  text = text.replace(old, new)
              dst.write_text(text, encoding='utf-8')
              src.unlink()

          # Relations hidden by the old same-namespace layout become explicit V2 imports.
          share = Path('app/Contexts/Intelligence/Sharing/Models/KingdomIntelligenceShare.php')
          text = share.read_text(encoding='utf-8')
          anchor = 'use App\\Contexts\\GameWorld\\Models\\Player;\n'
          if anchor not in text:
              raise SystemExit('KingdomIntelligenceShare Player import anchor missing')
          text = text.replace(anchor, 'use App\\Contexts\\GameWorld\\Models\\Kingdom;\n'+anchor, 1)
          share.write_text(text, encoding='utf-8')

          target = Path('app/Contexts/Intelligence/Sharing/Models/KingdomIntelligenceShareTarget.php')
          text = target.read_text(encoding='utf-8')
          anchor = 'use App\\Contexts\\GameWorld\\Models\\Player;\n'
          if anchor not in text:
              raise SystemExit('KingdomIntelligenceShareTarget Player import anchor missing')
          text = text.replace(anchor, anchor+'use App\\Contexts\\Intelligence\\Observations\\Models\\TrackedKingdomAlliance;\n', 1)
          target.write_text(text, encoding='utf-8')

          # Rewrite production callers, including old Kingdom read-model code that still consumes Sharing.
          for root_name in ('app', 'routes', 'bootstrap', 'config', 'database'):
              root = Path(root_name)
              if not root.exists():
                  continue
              for path in root.rglob('*.php'):
                  text = path.read_text(encoding='utf-8')
                  rewritten = text
                  for old, new in classes.items():
                      rewritten = rewritten.replace(old, new)
                  if rewritten != text:
                      path.write_text(rewritten, encoding='utf-8')
          PY

      - name: Verify Sharing owner is V2-only
        shell: bash
        run: |
          set -euo pipefail
          test -d app/Contexts/Intelligence/Sharing
          test ! -e app/Domain/Kingdoms/Models/KingdomIntelligenceShare.php
          test ! -e app/Domain/Kingdoms/Models/KingdomIntelligenceShareTarget.php
          matches=$(grep -R -n --include='*.php' 'App\\Domain\\' app/Contexts/Intelligence/Sharing 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            exit 1
          fi

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pdo_pgsql, xml, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format Sharing
        run: vendor/bin/pint app/Contexts/Intelligence/Sharing

      - name: Static-check Sharing
        run: vendor/bin/phpstan analyse --memory-limit=1G app/Contexts/Intelligence/Sharing

      - name: Commit P6 Sharing cut
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'awalker0878'
          git config user.email '52688461+awalker0878@users.noreply.github.com'
          git add app routes bootstrap config database
          if git diff --cached --quiet; then
            echo 'No Sharing migration changes found.'
            exit 0
          fi
          git commit -m 'ARCH-V2-P6: hard cut Intelligence Sharing'
          git push origin HEAD:architecture-v2
