name: Temporary Gift Code Prettier cleanup

on:
  push:
    branches:
      - gift-code-research-backed-acquisition

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: gift-code-research-backed-acquisition
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format localization changes
        run: npx prettier --write resources/js/localization/messages/platform/en.ts resources/js/pages/Platform/GiftCodes/Sources.vue
      - name: Commit cleanup and remove helper
        shell: bash
        run: |
          rm .github/workflows/tmp-gift-code-prettier.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Format Gift Code source localization"
          git push origin HEAD:gift-code-research-backed-acquisition
