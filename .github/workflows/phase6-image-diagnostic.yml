name: Phase 6 image diagnostic

on:
  push:
    branches:
      - agent/phase-6-platform-scale-administration

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, 'Capture Phase 6 image diagnostic') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/phase-6-platform-scale-administration
      - name: Build production image and capture autoload/boot diagnostics
        shell: bash
        run: |
          set +e
          docker build --target runtime -t kingshot-phase6-diagnostic . > /tmp/build.log 2>&1
          build_status=$?
          {
            echo "=== build status: ${build_status} ==="
            tail -n 80 /tmp/build.log
            echo "=== source declarations ==="
            grep -RFn --include='*.php' 'class PlatformAdministrationController' app vendor 2>/dev/null || true
            echo "=== image classmap ==="
            docker run --rm --entrypoint php kingshot-phase6-diagnostic -r '$m=require "/var/www/html/vendor/composer/autoload_classmap.php"; var_dump($m["App\\Domain\\Platform\\Http\\Controllers\\PlatformAdministrationController"] ?? null);' 2>&1 || true
            echo "=== image files matching class ==="
            docker run --rm --entrypoint sh kingshot-phase6-diagnostic -lc 'grep -RFn --include="*.php" "class PlatformAdministrationController" /var/www/html 2>/dev/null || true' 2>&1 || true
            echo "=== raw class_exists ==="
            docker run --rm --entrypoint php kingshot-phase6-diagnostic -d display_errors=1 -r 'require "/var/www/html/vendor/autoload.php"; var_dump(class_exists("App\\Domain\\Platform\\Http\\Controllers\\PlatformAdministrationController"));' 2>&1 || true
            echo "=== artisan list ==="
            docker run --rm --entrypoint php -e APP_ENV=testing -e APP_KEY=base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0= kingshot-phase6-diagnostic artisan list --no-ansi 2>&1 || true
          } > .github/phase6-image-diagnostic.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/phase6-image-diagnostic.log
          git commit -m "Capture Phase 6 image diagnostic"
          git push origin HEAD:agent/phase-6-platform-scale-administration
