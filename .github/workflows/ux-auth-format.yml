name: UX Auth Format

on:
  push:
    branches:
      - ux/ux-001-experience-localization

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ux/ux-001-experience-localization
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format UX-P3 resources
        run: |
          npx prettier --write \
            resources/js/localization/messages/auth-extra.ts \
            resources/js/pages/Auth/ConfirmPassword.vue \
            resources/js/pages/Auth/ForgotPassword.vue \
            resources/js/pages/Auth/Login.vue \
            resources/js/pages/Auth/Register.vue \
            resources/js/pages/Auth/ResetPassword.vue \
            resources/js/pages/Auth/TwoFactorChallenge.vue
      - name: Commit formatted resources
        shell: bash
        run: |
          if git diff --quiet -- resources/js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/localization/messages/auth-extra.ts \
            resources/js/pages/Auth/ConfirmPassword.vue \
            resources/js/pages/Auth/ForgotPassword.vue \
            resources/js/pages/Auth/Login.vue \
            resources/js/pages/Auth/Register.vue \
            resources/js/pages/Auth/ResetPassword.vue \
            resources/js/pages/Auth/TwoFactorChallenge.vue
          git commit -m "Format UX-P3 auth experience"
          git push origin HEAD:ux/ux-001-experience-localization
