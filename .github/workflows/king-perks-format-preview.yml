name: King Perks Format Preview

on:
  pull_request:
    paths:
      - 'app/Domain/KingPerks/**'
      - 'app/Domain/Notifications/Actions/*KingPerk*'
      - 'app/Domain/Notifications/Models/KingPerkReminderDelivery.php'
      - 'app/Domain/Notifications/Queries/EventReminderInboxQuery.php'
      - 'app/Domain/Platform/Providers/AppServiceProvider.php'
      - 'bootstrap/app.php'
      - 'database/migrations/*king_perk*'
      - 'resources/js/pages/KingPerks/**'
      - 'routes/king-perks.php'
      - 'tests/Feature/KingPerks/**'
      - 'tests/Unit/KingPerks/**'
      - '.github/workflows/king-perks-format-preview.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --no-audit --no-fund
      - name: Preserve historical Player cooldown snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/Domain/KingPerks/Services/KingPerkScheduler.php')
          source = path.read_text()
          old = """            ->get(['id', 'appointment_type', 'starts_at', 'ends_at']);\n\n        $newBlockedUntil = $end->addMinutes($newType->playerCooldownMinutes());\n        foreach ($appointments as $existing) {\n            $existingType = $existing->appointment_type;\n            $existingEnd = CarbonImmutable::instance($existing->ends_at);\n            $existingBlockedUntil = $existingEnd->addMinutes($existingType->playerCooldownMinutes());\n            $existingStart = CarbonImmutable::instance($existing->starts_at);\n"""
          new = """            ->get(['id', 'appointment_type', 'starts_at', 'ends_at', 'player_cooldown_ends_at']);\n\n        $newBlockedUntil = $end->addMinutes($newType->playerCooldownMinutes());\n        foreach ($appointments as $existing) {\n            $existingBlockedUntil = CarbonImmutable::instance($existing->player_cooldown_ends_at);\n            $existingStart = CarbonImmutable::instance($existing->starts_at);\n"""
          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif 'player_cooldown_ends_at' not in source[source.index('private function assertPlayerAvailable'):]:
              raise SystemExit('Expected KingPerkScheduler cooldown block was not found')
          PY
      - name: Apply King Perks static analysis fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/Domain/KingPerks/Http/Controllers/KingPerkController.php')
          source = path.read_text()
          source = source.replace("CarbonImmutable::createFromFormat('Y-m-d\\\\TH:i', (string) $validated['starts_at'], 'UTC')", "CarbonImmutable::parse((string) $validated['starts_at'], 'UTC')")
          source = source.replace("CarbonImmutable::createFromFormat('Y-m-d\\\\TH:i', (string) $validated['cancelled_at'], 'UTC')", "CarbonImmutable::parse((string) $validated['cancelled_at'], 'UTC')")
          source = source.replace("CarbonImmutable::createFromFormat('Y-m-d\\\\TH:i', (string) $validated['availability_starts_at'], 'UTC')", "CarbonImmutable::parse((string) $validated['availability_starts_at'], 'UTC')")
          source = source.replace("CarbonImmutable::createFromFormat('Y-m-d\\\\TH:i', (string) $validated['availability_ends_at'], 'UTC')", "CarbonImmutable::parse((string) $validated['availability_ends_at'], 'UTC')")
          source = source.replace("CarbonImmutable::createFromFormat('Y-m-d\\\\TH:i', (string) $validated['from'], 'UTC')", "CarbonImmutable::parse((string) $validated['from'], 'UTC')")
          source = source.replace("CarbonImmutable::createFromFormat('Y-m-d\\\\TH:i', (string) $validated['until'], 'UTC')", "CarbonImmutable::parse((string) $validated['until'], 'UTC')")
          source = source.replace("CarbonImmutable::createFromFormat('Y-m-d\\\\TH:i', (string) $validated['planned_activation_at'], 'UTC')", "CarbonImmutable::parse((string) $validated['planned_activation_at'], 'UTC')")
          source = source.replace('type: $current->appointment_type,', 'type: $current->appointmentType(),')
          source = source.replace('startsAt: CarbonImmutable::instance($current->starts_at),', 'startsAt: $current->startsAt(),')
          source = source.replace('$now->lt($replacement->starts_at)', '$now->lt($replacement->startsAt())')
          source = source.replace('$now->lt($replacement->ends_at)', '$now->lt($replacement->endsAt())')
          path.write_text(source)
          PY
      - name: Apply canonical formatters
        run: |
          vendor/bin/pint \
            app/Domain/KingPerks \
            app/Domain/Notifications/Actions/MarkKingPerkReminderSent.php \
            app/Domain/Notifications/Actions/QueueDueKingPerkReminders.php \
            app/Domain/Notifications/Models/KingPerkReminderDelivery.php \
            app/Domain/Notifications/Queries/EventReminderInboxQuery.php \
            app/Domain/Platform/Providers/AppServiceProvider.php \
            bootstrap/app.php \
            database/migrations/2026_08_15_083000_create_king_perk_tables.php \
            routes/king-perks.php \
            tests/Feature/KingPerks \
            tests/Unit/KingPerks
          npx prettier --write resources/js/pages/KingPerks
      - name: Commit canonical formatting when needed
        run: |
          if git diff --quiet; then
            echo 'King Perks source is already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/Domain/KingPerks \
            app/Domain/Notifications/Actions/MarkKingPerkReminderSent.php \
            app/Domain/Notifications/Actions/QueueDueKingPerkReminders.php \
            app/Domain/Notifications/Models/KingPerkReminderDelivery.php \
            app/Domain/Notifications/Queries/EventReminderInboxQuery.php \
            app/Domain/Platform/Providers/AppServiceProvider.php \
            bootstrap/app.php \
            database/migrations/2026_08_15_083000_create_king_perk_tables.php \
            resources/js/pages/KingPerks \
            routes/king-perks.php \
            tests/Feature/KingPerks \
            tests/Unit/KingPerks
          git commit -m 'Apply canonical King Perks static analysis fixes'
          git push origin HEAD:${GITHUB_HEAD_REF}
