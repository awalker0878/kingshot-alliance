name: V3 Source Snapshot

on:
  push:
    branches:
      - architecture-v3-capability-alignment

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/upload-artifact@v4
        with:
          name: v3-source-snapshot
          path: |
            app
            bootstrap
            config
            database
            routes
            tests/v3
          if-no-files-found: error
          retention-days: 1
