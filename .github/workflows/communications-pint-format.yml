name: Communications Pint Format

on:
  push:
    branches:
      - communications-recipient-delivery-expansion

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format Communications delivery changes
        run: |
          vendor/bin/pint \
            app/Contexts/Communications/Delivery/Actions/ProcessNotificationDigests.php \
            app/Contexts/Communications/Delivery/Actions/SetNotificationRoutingPolicy.php \
            app/Contexts/Communications/Delivery/Channels/WebPushChannel.php \
            app/Contexts/Communications/Delivery/Services/EndpointConfigurationValidator.php \
            app/Contexts/Communications/Delivery/Services/NotificationRoutingPolicyWriteState.php \
            app/Contexts/Communications/Delivery/ValueObjects/NotificationIntent.php \
            app/Contexts/Communications/Delivery/ValueObjects/NotificationQueueReceipt.php \
            app/Contexts/GameWorld/GiftCodes/Actions/QueueGiftCodeExpiryNotifications.php \
            app/Contexts/GameWorld/GiftCodes/Actions/QueueGiftCodeTransitionNotifications.php

      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: communications-pint-formatted
          path: |
            app/Contexts/Communications/Delivery/Actions/ProcessNotificationDigests.php
            app/Contexts/Communications/Delivery/Actions/SetNotificationRoutingPolicy.php
            app/Contexts/Communications/Delivery/Channels/WebPushChannel.php
            app/Contexts/Communications/Delivery/Services/EndpointConfigurationValidator.php
            app/Contexts/Communications/Delivery/Services/NotificationRoutingPolicyWriteState.php
            app/Contexts/Communications/Delivery/ValueObjects/NotificationIntent.php
            app/Contexts/Communications/Delivery/ValueObjects/NotificationQueueReceipt.php
            app/Contexts/GameWorld/GiftCodes/Actions/QueueGiftCodeExpiryNotifications.php
            app/Contexts/GameWorld/GiftCodes/Actions/QueueGiftCodeTransitionNotifications.php
          if-no-files-found: error
          retention-days: 1
