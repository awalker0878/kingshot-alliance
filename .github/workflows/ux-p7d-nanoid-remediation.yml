name: UX P7-D Nanoid Remediation

on:
  push:
    branches:
      - ux/ux-001-experience-localization
    paths:
      - .ux-p7d-nanoid-remediation-run

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out UX branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ux/ux-001-experience-localization
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Remediate vulnerable transitive lock resolution
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/package.json.before
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          cmp -s package.json /tmp/package.json.before || { echo 'package.json changed unexpectedly'; exit 1; }
          node <<'NODE'
          const lock = require('./package-lock.json');
          const version = lock.packages?.['node_modules/nanoid']?.version;
          if (!version) throw new Error('nanoid is missing from package-lock.json');
          const parts = version.split('.').map(Number);
          const safe = parts[0] > 3 || (parts[0] === 3 && (parts[1] > 3 || (parts[1] === 3 && parts[2] >= 18)));
          if (!safe) throw new Error(`nanoid remains vulnerable at ${version}`);
          console.log(`nanoid lock resolution: ${version}`);
          NODE
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run check

      - name: Commit lockfile remediation and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/ux-p7d-nanoid-remediation.yml .ux-p7d-nanoid-remediation-run
          test -z "$(git diff --name-only -- package.json)" || { echo 'package.json changed unexpectedly'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && { echo 'No remediation changes to commit'; exit 1; }
          git commit -m 'Remediate nanoid lockfile advisory'
          git push origin HEAD:ux/ux-001-experience-localization
