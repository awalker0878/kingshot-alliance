name: Architecture V3 Verification

on:
  push:
    branches:
      - architecture-v3-capability-alignment
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: architecture-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-v3:
    runs-on: ubuntu-24.04
    # Full serial coverage includes transaction/lock contention cases.
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kingshot_test
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
          POSTGRES_INITDB_ARGS: --set=max_locks_per_transaction=256
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=4g
          --health-cmd "pg_isready -U kingshot -d kingshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_test
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PULSE_ENABLED: false

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, gd, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate optimized PSR-4 autoload
        run: composer dump-autoload --optimize --strict-psr

      - name: PHP syntax
        shell: bash
        run: find app bootstrap config database routes tests/v3 -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Boot routes
        run: php artisan route:list --no-ansi

      # Architecture tests are already part of the complete Architecture V3 suite below.
      # Running tests/v3/Architecture separately duplicated those cases and their setup.
      - name: Migrate V3 test schema
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for setting in fsync synchronous_commit full_page_writes; do
            test "$(docker exec "$POSTGRES_CONTAINER" psql -U kingshot -d kingshot_test -Atc "SHOW $setting")" = on
          done
          php artisan migrate --force

      - name: Static analysis
        shell: bash
        run: |
          set +e
          composer types:check 2>&1 | tee "${RUNNER_TEMP}/architecture-v3-phpstan.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload static-analysis diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-v3-static-analysis
          path: ${{ runner.temp }}/architecture-v3-phpstan.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Full V3 PHPUnit suite
        run: vendor/bin/phpunit --configuration phpunit.xml --testsuite "Architecture V3"
