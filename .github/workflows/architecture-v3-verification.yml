name: Architecture V3 Verification

on:
  push:
    branches:
      - architecture-v3-capability-alignment
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: architecture-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-v3:
    runs-on: ubuntu-24.04
    # Full PostgreSQL, static analysis and behavior coverage remain mandatory in CI.
    # This specialized gate owns only the lightweight architecture contracts.
    timeout-minutes: 10

    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      APP_DEBUG: false
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PULSE_ENABLED: false

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, gd, intl, mbstring, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate optimized PSR-4 autoload
        run: composer dump-autoload --optimize --strict-psr

      - name: Verify test layout
        run: php scripts/verify-test-layout.php

      - name: Architecture contracts
        run: composer test:architecture
