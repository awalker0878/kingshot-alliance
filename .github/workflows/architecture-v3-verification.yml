name: Architecture V3 Verification

on:
  push:
    branches:
      - architecture-v3-capability-alignment
  pull_request:

permissions:
  contents: read

jobs:
  architecture-v3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate optimized PSR-4 autoload
        run: composer dump-autoload --optimize --strict-psr

      - name: PHP syntax
        shell: bash
        run: find app bootstrap config database routes tests/v3 -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Boot routes
        run: php artisan route:list --no-ansi

      - name: Architecture V3 tests
        shell: bash
        run: |
          set +e
          vendor/bin/phpunit tests/v3/Architecture 2>&1 | tee /tmp/architecture-v3-tests.txt
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && printf '::error title=Architecture V3::%s\n' "$line"
            done < /tmp/architecture-v3-tests.txt
          fi

          exit "$status"
