name: Visual Regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Playwright visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kingshot_visual
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_visual"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      APP_DEBUG: false
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_visual
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      MAIL_MAILER: array
      PULSE_ENABLED: false
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
      PLAYWRIGHT_USE_SYSTEM_CHROME: true

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pdo_pgsql, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Finalize Territory UI and repository formatting
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/alliance-territory-hive-planner'
        shell: bash
        run: |
          python scripts/finalize-territory-ui.py
          vendor/bin/pint
          npm run lint
          npm run format

          if git diff --quiet; then
            echo "Territory UI and formatting are already canonical."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app resources tests scripts package.json
          git commit -m "Finalize Territory planner UI and formatting"
          git push origin HEAD:${{ github.head_ref }}

      - name: Prepare visual database
        shell: bash
        run: |
          php artisan migrate --force
          php artisan tinker --execute='$user = \App\Contexts\Accounts\Identity\Models\User::factory()->create(["name" => "UX P9 Visual", "email" => "ux-p9-visual@example.test", "timezone" => "UTC"]); $k1123 = \App\Contexts\GameWorld\Kingdoms\Models\Kingdom::query()->create(["number" => 1123, "status" => "active"]); $k1198 = \App\Contexts\GameWorld\Kingdoms\Models\Kingdom::query()->create(["number" => 1198, "status" => "active"]); \App\Contexts\GameWorld\Players\Models\Player::query()->create(["user_id" => $user->id, "current_kingdom_id" => $k1123->id, "game_player_id" => "GOV-1123-A", "current_name" => "Lady Seraphina"]); \App\Contexts\GameWorld\Players\Models\Player::query()->create(["user_id" => $user->id, "current_kingdom_id" => $k1198->id, "game_player_id" => "GOV-1198-B", "current_name" => "Lord Caspian"]);'
          php artisan tinker --execute='$user = \App\Contexts\Accounts\Identity\Models\User::factory()->create(["name" => "Territory Visual", "email" => "territory-visual@example.test", "timezone" => "UTC"]); $kingdom = \App\Contexts\GameWorld\Kingdoms\Models\Kingdom::query()->create(["number" => 1223, "status" => "active"]); $player = \App\Contexts\GameWorld\Players\Models\Player::query()->create(["user_id" => $user->id, "current_kingdom_id" => $kingdom->id, "game_player_id" => "GOV-TERRITORY-A", "current_name" => "Map Warden"]); $allianceId = app(\App\Contexts\Alliance\Lifecycle\Actions\CreateAlliance::class)->handle((string) $player->id, "Dawn Guard", "dawn-guard", "en", "UTC"); $plan = app(\App\Contexts\Operations\TerritoryPlanning\Actions\CreateTerritoryPlan::class)->handle((string) $player->id, \App\Contexts\Operations\TerritoryPlanning\Enums\TerritoryPlanScope::Alliance, (string) $kingdom->id, $allianceId, "Bear Hive Alpha", "kingshot-community-observed-2026-08-21-v1"); app(\App\Contexts\Operations\TerritoryPlanning\Actions\SaveTerritoryPlan::class)->handle((string) $player->id, $plan->planId, $plan->revision, [["key"=>"owner","alliance_id"=>$allianceId,"external_name"=>null,"external_tag"=>null,"display_name"=>"Dawn Guard","presentation_color"=>"#4da3ff","sort_order"=>0,"visible"=>true,"locked"=>false]], [["key"=>"hive","label"=>"Primary Hive"]], [["key"=>"hq","alliance_key"=>"owner","group_key"=>null,"type"=>"headquarters","player_id"=>null,"external_player_name"=>null,"label"=>"HQ","x"=>100,"y"=>100,"rotation"=>0,"sort_order"=>0,"metadata"=>[]],["key"=>"banner","alliance_key"=>"owner","group_key"=>null,"type"=>"banner","player_id"=>null,"external_player_name"=>null,"label"=>"Banner","x"=>110,"y"=>100,"rotation"=>0,"sort_order"=>1,"metadata"=>[]],["key"=>"city","alliance_key"=>"owner","group_key"=>"hive","type"=>"governor_city","player_id"=>null,"external_player_name"=>"North Star","label"=>"North Star","x"=>112,"y"=>112,"rotation"=>0,"sort_order"=>2,"metadata"=>[]],["key"=>"trap-one","alliance_key"=>"owner","group_key"=>"hive","type"=>"bear_trap","player_id"=>null,"external_player_name"=>null,"label"=>"Bear Trap 1","x"=>120,"y"=>120,"rotation"=>0,"sort_order"=>3,"metadata"=>[]]], ["preferred_bear_radius_tiles"=>40,"march_seconds_per_tile"=>2,"selected_bear_trap_by_alliance"=>["owner"=>"trap-one"]]);'

      - name: Build production frontend
        run: npm run build

      - name: Start application
        shell: bash
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > "${RUNNER_TEMP}/ux-p9-server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/ux-p9-server.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/ux-p9-server.log"
          exit 1

      - name: Run visual regression
        run: npm run test:visual

      - name: Upload visual failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ux-p9-visual-failure
          path: |
            test-results/visual
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f "${RUNNER_TEMP}/ux-p9-server.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/ux-p9-server.pid")" 2>/dev/null || true
          fi
