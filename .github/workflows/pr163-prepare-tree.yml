name: PR 163 prepare test layout without test execution

on:
  push:
    branches: [astra/codebase-hardening]
    paths: [.github/pr163-apply-test-layout.py, .github/workflows/pr163-prepare-tree.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'awalker0878/kingshot-alliance' && github.ref == 'refs/heads/astra/codebase-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Confirm deterministic source inventory
        shell: bash
        run: |
          set -euo pipefail
          test -d tests/v3
          test "$(find tests/v3 -type f -name '*Test.php' | wc -l)" -eq 283
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/pr163-apply-test-layout.py').read_text()
          compile(source, '.github/pr163-apply-test-layout.py', 'exec')
          PY

      - name: Apply reviewed deterministic migration
        run: python .github/pr163-apply-test-layout.py

      - name: Verify migration shape without executing tests
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tests/v3
          for path in tests/Unit tests/Feature tests/Integration tests/Architecture tests/Frontend tests/Browser tests/Fixtures tests/Support; do
            test -d "$path"
          done
          test -f tests/TestCase.php
          test -f docs/codebase/test-layout-migration.json
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('docs/codebase/test-layout-migration.json').read_text())
          rows = manifest['files']
          tests = [row for row in rows if row['old_path'].endswith('Test.php')]
          assert manifest['php_classes'] == 283
          assert len(tests) == 283
          assert len({row['old_path'] for row in rows}) == len(rows)
          assert len({row['new_path'] for row in rows}) == len(rows)
          assert all(not Path(row['old_path']).exists() for row in rows)
          assert all(Path(row['new_path']).exists() for row in rows)
          print('Migration manifest reconciles 283 PHP test classes; no tests executed.')
          PY
          git diff --check

      - name: Prepare exact unreferenced Git tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          def git(*args: str) -> str:
              return subprocess.check_output(['git', *args]).decode().strip()

          local_tree = git('write-tree')
          entries = []
          raw = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-status', '--no-renames', '-z']
          ).decode().split('\0')

          for index in range(0, len(raw) - 1, 2):
              status, path = raw[index:index + 2]
              allowed = (
                  path.startswith(('tests/', 'scripts/', 'docs/', '.github/'))
                  or path in {'composer.json', 'phpunit.xml', 'app/Contexts/README.md'}
              )
              assert allowed, path
              entry = {'path': path, 'mode': '100644', 'type': 'blob'}
              if status == 'D':
                  entry['sha'] = None
              else:
                  entry['content'] = Path(path).read_text()
              entries.append(entry)

          payload = json.dumps({'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': entries}).encode()
          request = urllib.request.Request(
              'https://api.github.com/repos/awalker0878/kingshot-alliance/git/trees',
              data=payload,
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              result = json.load(response)

          assert result['sha'] == local_tree, (result['sha'], local_tree)
          evidence = {
              'source_commit': git('rev-parse', 'HEAD'),
              'tree_sha': local_tree,
              'php_classes': 283,
              'tests_executed': False,
              'branch_updated': False,
          }
          out = Path(os.environ['RUNNER_TEMP'], 'prepared-tree.json')
          out.write_text(json.dumps(evidence, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'PREPARED_TREE_SHA={local_tree}\n')
          print(json.dumps(evidence))
          PY

      - name: Publish preparation status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"test-layout-preparation-no-tests\",\"description\":\"tree ${PREPARED_TREE_SHA}; no tests executed\"}"

      - name: Publish preparation failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"test-layout-preparation-no-tests","description":"layout preparation failed; no tests executed"}'

      - name: Retain preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr163-prepared-test-tree-no-tests
          path: ${{ runner.temp }}/prepared-tree.json
          if-no-files-found: warn
          retention-days: 7
