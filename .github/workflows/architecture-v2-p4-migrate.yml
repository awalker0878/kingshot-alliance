name: Architecture V2 P4 Mechanical Migration

on:
  push:
    branches: [architecture-v2]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - name: Rewrite V1 access references by owning context
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          roots = [Path('app'), Path('routes'), Path('tests'), Path('bootstrap'), Path('config'), Path('database')]
          files = []
          for root in roots:
              if root.exists():
                  files.extend(root.rglob('*.php'))

          namespace_replacements = {
              r'App\Domain\Authorization\Services\PlayerMutationAuthority': r'App\Contexts\GameWorld\Governance\Services\PlayerMutationAuthority',
              r'App\Domain\Authorization\Services\KingdomMutationAuthority': r'App\Contexts\GameWorld\Governance\Services\KingdomMutationAuthority',
              r'App\Domain\Authorization\Services\KingdomAuthorization': r'App\Contexts\GameWorld\Governance\Services\KingdomAuthorization',
              r'App\Domain\Authorization\Services\KingdomRoleProvisioner': r'App\Contexts\GameWorld\Governance\Services\KingdomRoleProvisioner',
              r'App\Domain\Authorization\Models\KingdomRoleAssignment': r'App\Contexts\GameWorld\Governance\Models\KingdomRoleAssignment',
              r'App\Domain\Authorization\Models\KingdomRole': r'App\Contexts\GameWorld\Governance\Models\KingdomRole',
              r'App\Domain\Authorization\Enums\DefaultKingdomRole': r'App\Contexts\GameWorld\Governance\Enums\DefaultKingdomRole',
              r'App\Domain\Authorization\Actions\AssignKingdomRole': r'App\Contexts\GameWorld\Governance\Actions\AssignKingdomRole',
              r'App\Domain\Authorization\Actions\RemoveKingdomRole': r'App\Contexts\GameWorld\Governance\Actions\RemoveKingdomRole',
              r'App\Domain\Authorization\Actions\BootstrapKingdomAdministrator': r'App\Workflows\KingdomGovernance\Actions\BootstrapKingdomAdministrator',
              r'App\Domain\Authorization\Http\Controllers\KingdomRoleController': r'App\Contexts\Alliance\Access\Http\Controllers\KingdomRoleController',
              'app/Domain/Authorization/Services/PlayerMutationAuthority.php': 'app/Contexts/GameWorld/Governance/Services/PlayerMutationAuthority.php',
              'app/Domain/Authorization/Services/KingdomMutationAuthority.php': 'app/Contexts/GameWorld/Governance/Services/KingdomMutationAuthority.php',
              'app/Domain/Authorization/Services/KingdomAuthorization.php': 'app/Contexts/GameWorld/Governance/Services/KingdomAuthorization.php',
          }

          permission_replacements = {
              'PermissionKey::AllianceView': 'AlliancePermission::View',
              'PermissionKey::AllianceManage': 'AlliancePermission::Manage',
              'PermissionKey::MembershipManage': 'AlliancePermission::MembershipManage',
              'PermissionKey::RoleManage': 'AlliancePermission::RoleManage',
              'PermissionKey::InvitationManage': 'AlliancePermission::InvitationManage',
              'PermissionKey::ContentManage': 'AlliancePermission::ContentManage',
              'PermissionKey::RecruitmentManage': 'AlliancePermission::RecruitmentManage',
              'PermissionKey::EventPlayerView': 'OperationsPermission::EventPlayerView',
              'PermissionKey::EventPlayerCreate': 'OperationsPermission::EventPlayerCreate',
              'PermissionKey::EventPlayerManage': 'OperationsPermission::EventPlayerManage',
              'PermissionKey::EventAllianceView': 'OperationsPermission::EventAllianceView',
              'PermissionKey::EventAllianceCreate': 'OperationsPermission::EventAllianceCreate',
              'PermissionKey::EventAllianceManage': 'OperationsPermission::EventAllianceManage',
              'PermissionKey::EventKingdomView': 'OperationsPermission::EventKingdomView',
              'PermissionKey::EventKingdomCreate': 'OperationsPermission::EventKingdomCreate',
              'PermissionKey::EventKingdomManage': 'OperationsPermission::EventKingdomManage',
              'PermissionKey::EventTypeManage': 'OperationsPermission::EventTypeManage',
              'PermissionKey::KingdomRoleManage': 'KingdomPermission::RoleManage',
              'PermissionKey::ContributionManage': 'IntelligencePermission::ContributionManage',
              'PermissionKey::KingdomManage': 'IntelligencePermission::KingdomManage',
              'PermissionKey::from(': 'OperationsPermission::from(',
          }

          owner_imports = {
              'AlliancePermission::': r'use App\Contexts\Alliance\Access\Enums\AlliancePermission;',
              'OperationsPermission::': r'use App\Contexts\Operations\Access\Enums\OperationsPermission;',
              'KingdomPermission::': r'use App\Contexts\GameWorld\Governance\Enums\KingdomPermission;',
              'IntelligencePermission::': r'use App\Contexts\Intelligence\Access\Enums\IntelligencePermission;',
          }

          changed = []
          unresolved = []

          for path in files:
              if str(path).startswith('app/Domain/Authorization/'):
                  continue

              text = path.read_text()
              original = text

              for old, new in namespace_replacements.items():
                  text = text.replace(old, new)

              for old, new in permission_replacements.items():
                  text = text.replace(old, new)

              text = text.replace(r'use App\Domain\Authorization\Enums\PermissionKey;' + '\n', '')
              text = text.replace(r'\App\Domain\Authorization\Enums\PermissionKey', r'\App\Contexts\Operations\Access\Enums\OperationsPermission')

              needed = [import_line for token, import_line in owner_imports.items() if token in text and import_line not in text]
              if needed:
                  lines = text.splitlines()
                  namespace_index = next((i for i, line in enumerate(lines) if line.startswith('namespace ')), None)
                  if namespace_index is None:
                      unresolved.append(f'{path}: owner permission token without namespace')
                  else:
                      first_use = next((i for i in range(namespace_index + 1, len(lines)) if lines[i].startswith('use ')), None)
                      insert_at = first_use if first_use is not None else namespace_index + 1
                      for import_line in sorted(needed, reverse=True):
                          lines.insert(insert_at, import_line)
                      text = '\n'.join(lines) + ('\n' if original.endswith('\n') else '')

              if 'PermissionKey' in text:
                  unresolved.append(f'{path}: unresolved PermissionKey')

              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          external_v1 = []
          for path in files:
              if str(path).startswith('app/Domain/Authorization/'):
                  continue
              text = path.read_text()
              if r'App\Domain\Authorization' in text:
                  external_v1.append(str(path))

          if unresolved or external_v1:
              print('Unresolved migration items:')
              for item in sorted(set(unresolved + external_v1)):
                  print(item)
              raise SystemExit(1)

          print(f'Mechanically migrated {len(changed)} PHP files.')
          for path in changed:
              print(path)
          PY

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format mechanically changed PHP
        run: vendor/bin/pint app routes tests bootstrap config database/factories/UserFactory.php

      - name: Commit mechanical migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No mechanical P4 changes remain.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app routes tests bootstrap config database
          git commit -m 'refactor: migrate access references to V2 owners'
          git push origin HEAD:architecture-v2
