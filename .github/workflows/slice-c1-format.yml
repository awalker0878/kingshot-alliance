name: Slice C1 formatter

on:
  push:
    branches:
      - agent/kingdoms-001-slice-c1

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write resources/js/pages/Alliance/Roster.vue resources/js/pages/Alliance/RosterHistory.vue
      - run: git diff -- resources/js/pages/Alliance/Roster.vue resources/js/pages/Alliance/RosterHistory.vue
