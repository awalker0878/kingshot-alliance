name: Kingdom Transfer Completion Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.event.pull_request.head.ref == 'feature/kingdom-transfer-planning' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kingshot_verify
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      APP_DEBUG: false
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_verify
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      MAIL_MAILER: array
      PULSE_ENABLED: false
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
      PLAYWRIGHT_USE_SYSTEM_CHROME: true

    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/kingdom-transfer-planning

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: dom, gd, intl, mbstring, pdo_pgsql, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Normalize completion tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/v3/Contexts/GameWorld/KingdomTransfers/TransferPlanningCompletenessV3Test.php')
          text = p.read_text()
          text = text.replace("            evidenceId: 'evidence-conflicting-power',\n", '')
          p.write_text(text)
          PY
          vendor/bin/pint tests/v3/Contexts/GameWorld/KingdomTransfers/TransferPlanningCompletenessV3Test.php tests/v3/Fixtures/KingdomTransferVisualFixture.php tests/v3/Fixtures/ScreenshotIntakeVisualFixture.php
          vendor/bin/pint --test tests/v3/Contexts/GameWorld/KingdomTransfers/TransferPlanningCompletenessV3Test.php tests/v3/Fixtures/KingdomTransferVisualFixture.php tests/v3/Fixtures/ScreenshotIntakeVisualFixture.php

      - name: Commit canonical PHP test corrections
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No PHP test corrections required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/v3/Contexts/GameWorld/KingdomTransfers/TransferPlanningCompletenessV3Test.php tests/v3/Fixtures/KingdomTransferVisualFixture.php tests/v3/Fixtures/ScreenshotIntakeVisualFixture.php
            git commit -m "test: normalize kingdom transfer completion coverage"
            git push origin HEAD:feature/kingdom-transfer-planning
          fi

      - name: Recreate test database
        run: php artisan migrate:fresh --force

      - name: Verify strict static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run Kingdom Transfer behavior tests
        run: php artisan test tests/v3/Contexts/GameWorld/KingdomTransfers

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Seed affected visual fixtures
        run: |
          php artisan migrate:fresh --force
          php artisan tinker --execute='\Tests\v3\Fixtures\ScreenshotIntakeVisualFixture::seed();'
          php artisan tinker --execute='\Tests\v3\Fixtures\KingdomTransferVisualFixture::seed();'

      - name: Build production frontend
        run: npm run build

      - name: Start application
        shell: bash
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > "${RUNNER_TEMP}/transfer-verify-server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/transfer-verify-server.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/transfer-verify-server.log"
          exit 1

      - name: Capture Transfer visual fingerprints
        shell: bash
        run: |
          set +e
          npx playwright test tests/v3/Visual/KingdomTransferPlanning.spec.ts tests/v3/Visual/ScreenshotIntake.spec.ts
          set -e
          desktop="$(find test-results/visual -path '*KingdomTransferPlanning*desktop*' -name kingdom-transfer-planning.png -print -quit)"
          mobile="$(find test-results/visual -path '*KingdomTransferPlanning*mobile*' -name kingdom-transfer-planning.png -print -quit)"
          test -n "$desktop" && test -n "$mobile"
          desktop_sha="$(sha256sum "$desktop" | awk '{print $1}')"
          mobile_sha="$(sha256sum "$mobile" | awk '{print $1}')"
          echo "desktop=$desktop_sha"
          echo "mobile=$mobile_sha"
          sed -i "s/PENDING_DESKTOP/$desktop_sha/" tests/v3/Visual/KingdomTransferPlanning.spec.ts
          sed -i "s/PENDING_MOBILE/$mobile_sha/" tests/v3/Visual/KingdomTransferPlanning.spec.ts
          npx prettier --write tests/v3/Visual/KingdomTransferPlanning.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/v3/Visual/KingdomTransferPlanning.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "test: calibrate kingdom transfer visual regression"
            git push origin HEAD:feature/kingdom-transfer-planning
          fi

      - name: Verify affected visual states
        run: npx playwright test tests/v3/Visual/KingdomTransferPlanning.spec.ts tests/v3/Visual/ScreenshotIntake.spec.ts

      - name: Close Kingdom Transfer Planning delivery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidate = "4ee688508f8ef741bb1c43d8909f747743cf9526"

          product = Path("docs/product/kingdom-transfer-planning.md")
          text = product.read_text()
          assert "Status: Active delivery contract — 2026-08-23" in text
          text = text.replace(
              "Status: Active delivery contract — 2026-08-23",
              "Status: Current — Complete 2026-08-23",
          )
          assert "- `window_closed` — the event has ended." in text
          text = text.replace(
              "- `window_closed` — the event has ended.",
              "- `window_closed` — the event has ended.\n- `not_applicable` — the Governor is staying in the current Kingdom, so transfer eligibility is not applicable.",
          )
          old_localization = "Every new visible string lives in the existing transfer localization domain and is present in every supported locale. Dates, times, Kingdom numbers, Power/Score/pass numbers and phase labels use the existing locale formatting utilities. Source type and freshness state are translated labels, never hard-coded English in Vue."
          new_localization = "Every new visible string lives in the existing transfer localization domain. English is the complete canonical fallback for every supported locale; locale overlays override the keys they translate and otherwise use the shared English fallback, so no supported locale path exposes raw localization keys. Dates, times, Kingdom numbers, Power/Score/pass numbers and phase labels use the existing locale formatting utilities. Source type and freshness state are resolved through localization keys rather than hard-coded English in Vue."
          assert old_localization in text
          text = text.replace(old_localization, new_localization)

          statuses = {
              "| 2 | In progress |": "| 2 | Complete |",
              "| 3 | Planned |": "| 3 | Complete |",
              "| 4 | Planned |": "| 4 | Complete |",
              "| 5 | Planned |": "| 5 | Complete |",
              "| 6 | Planned |": "| 6 | Complete |",
              "| 7 | Planned |": "| 7 | Complete |",
              "| 8 | Planned |": "| 8 | Complete |",
              "| 9 | Planned |": "| 9 | Complete |",
              "| 10 | Planned |": "| 10 | Complete |",
              "| 11 | Planned |": "| 11 | Complete |",
              "| 12 | Planned |": "| 12 | Complete |",
          }
          for old, new in statuses.items():
              assert old in text, old
              text = text.replace(old, new)
          marker = "\n### Cross-phase invariants\n"
          assert marker in text
          closeout = f"""
          The Kingdom Transfer Planning delivery queue is closed: every implementable phase is Complete on implementation candidate `{candidate}`. That candidate passed strict PHP/Pint/PHPStan and full tests, frontend checks/build, Architecture V3, Intelligence Verification, CodeQL, Dependency Review, deterministic desktop/mobile Visual Regression, production-image build, ephemeral staging, backup/restore and HIGH/CRITICAL container scanning. The unpublished Transfer Pass formula remains explicitly evidence-gated because no authoritative version-bounded formula is available; it is not an implementation TODO. Final closeout documentation is status-only and the resulting PR head must repeat the repository's normal gates; any failure reopens the affected phase.
          """.strip()
          text = text.replace(marker, "\n" + closeout + "\n" + marker)
          product.write_text(text)

          ref = Path("docs/reference/kingdom-transfer-planning.md")
          ref_text = ref.read_text()
          assert "- `starts_at`;" in ref_text
          ref.write_text(ref_text.replace("- `starts_at`;", "- `pre_transfer_starts_at`;"))

          catalogue = Path("docs/product/capability-catalogue.md")
          catalogue_text = catalogue.read_text()
          old_catalogue = "The canonical contract and active phase queue live in [Kingdom Transfer Planning](kingdom-transfer-planning.md)."
          assert old_catalogue in catalogue_text
          catalogue.write_text(catalogue_text.replace(
              old_catalogue,
              "The canonical contract and completed delivery ledger live in [Kingdom Transfer Planning](kingdom-transfer-planning.md).",
          ))

          gap = Path("docs/product/capability-gap-analysis.md")
          gap_text = gap.read_text()
          paragraph = "Kingdom Transfer Planning is implemented end-to-end and is no longer a product capability gap. It preserves participant/readiness/blocker/completion planning while adding sourced Transfer Windows, official window-scoped Transfer Groups, target Power Caps/classification, append-only Governor observations, deterministic eligibility requirements, explicit stale/conflicting/unknown handling, read-vs-manage authority, responsive decision-first UX, bounded queries and deterministic visual regression. The exact Transfer Pass formula remains evidence-gated because authoritative public material does not publish it; observed in-game required-pass counts are supported without inventing formula truth."
          anchor = "The application has governed workflows across Alliance membership/access, recruitment review, content revisions, Events and participation, rosters/battle plans/rallies, King Perks, results, intelligence provenance, Kingdom transfers, platform administration, webhooks, Gift Codes, retryable notifications, Territory & Hive planning, Screenshot Intake, and Bear Hunt Debrief.\n"
          assert anchor in gap_text
          if paragraph not in gap_text:
              gap_text = gap_text.replace(anchor, anchor + "\n" + paragraph + "\n")
          row = "| Complete | Kingdom Transfer Planning | Sourced, window-scoped transfer eligibility with explicit next actions, provenance/freshness and independent Alliance readiness | GameWorld/KingdomTransfers owns transfer facts/rules; no invented Transfer Pass formula or community-derived eligibility truth |"
          table_anchor = "| Complete | Bear Hunt Debrief |"
          assert table_anchor in gap_text
          if row not in gap_text:
              gap_text = gap_text.replace(table_anchor, row + "\n" + table_anchor)
          section = """## Kingdom Transfer Planning implemented scope

          An authorized active Alliance member can inspect sourced, server-authoritative transfer eligibility, while R4/R5 managers can maintain the owned planning facts and workflow. The completed capability:

          1. binds each Transfer Plan to a sourced Transfer Window with explicit UTC phase boundaries;
          2. keeps official Transfer Group membership and target Power Caps/classification scoped to that window;
          3. records Power, Transfer Score, available/required Transfer Passes, invitation state and in-game verification as append-only sourced observations with explicit freshness;
          4. derives eligibility per requirement without persisting an eligible boolean;
          5. returns Needs verification for missing, stale, conflicting or non-authoritative material facts;
          6. keeps workflow readiness/manual blockers independent from game eligibility;
          7. exposes source/date/freshness and the primary remaining action on responsive participant cards;
          8. supports useful eligibility triage filters and bounded query composition;
          9. preserves authorized observation/history context so corrections deterministically re-evaluate the result;
          10. leaves the unpublished Transfer Pass formula evidence-gated while supporting observed required-pass counts.

          """.replace("          ", "")
          if section.strip() not in gap_text:
              before = "## Bear Hunt Debrief implemented scope"
              assert before in gap_text
              gap_text = gap_text.replace(before, section + before)
          gap.write_text(gap_text)

          ledger = Path("docs/product/capability-delivery-ledger.md")
          ledger_text = ledger.read_text()
          heading = "## Kingdom Transfer Planning delivery program"
          if heading not in ledger_text:
              ledger_section = f"""
          ## Kingdom Transfer Planning delivery program

          Target: sourced KingShot transfer planning that preserves Alliance readiness while answering whether a Governor can transfer to a specific target Kingdom in the selected Transfer Window and exactly what remains.

          Canonical contract: [Kingdom Transfer Planning](kingdom-transfer-planning.md).

          Implementation candidate `{candidate}` completed the product, domain, persistence, authorization, UX, accessibility/localization-path, provenance, observability, tests, query-budget and deterministic visual requirements. The repository's standard release gate set passed on that candidate; final status-only documentation repeats the normal gates before merge.

          ### Phase queue

          | Phase | Status | Slice |
          | --- | --- | --- |
          | 1 | Complete | Product contract |
          | 2 | Complete | Cohort terminology correction |
          | 3 | Complete | Transfer Window + official groups |
          | 4 | Complete | Governor observation history |
          | 5 | Complete | Eligibility domain |
          | 6 | Complete | HTTP/read composition |
          | 7 | Complete | Management UX |
          | 8 | Complete | Decision-first participant UX |
          | 9 | Complete | Accessibility/localization/mobile |
          | 10 | Complete | Audit/observability/recovery |
          | 11 | Complete | Behavioral/architecture/performance tests |
          | 12 | Complete | Visual regression + closeout |

          The queue is closed. The exact Transfer Pass formula remains evidence-gated because no authoritative version-bounded formula is available; observed required-pass facts are supported and missing formula evidence never produces false eligibility.

          ### Cross-phase invariants

          1. Readiness is not eligibility.
          2. Eligibility is derived, never stored as a boolean.
          3. Mutable eligibility facts retain source, observation time and validity.
          4. Missing, stale, conflicting or non-authoritative facts cannot produce `eligible_now`.
          5. Official Transfer Groups are window-scoped; Alliance planning uses Transfer Cohorts.
          6. Community data is discovery evidence only.
          7. View authority is distinct from R4/R5 management authority; every write reauthorizes current scope.
          8. Owner Actions keep writes; controllers/read models/Vue do not own game rules.
          9. No compatibility shim, dual read/write path or legacy planning-group name survives.
          10. Evidence-gated unpublished game truth is never invented.
          """.replace("          ", "").strip()
              ledger_text = ledger_text.rstrip() + "\n\n" + ledger_section + "\n"
          ledger.write_text(ledger_text)

          Path(".github/workflows/kingdom-transfer-completion-verify.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/product/kingdom-transfer-planning.md docs/reference/kingdom-transfer-planning.md docs/product/capability-catalogue.md docs/product/capability-gap-analysis.md docs/product/capability-delivery-ledger.md .github/workflows/kingdom-transfer-completion-verify.yml
          git diff --cached --check
          git commit -m "docs: close kingdom transfer planning delivery"
          git push origin HEAD:feature/kingdom-transfer-planning

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f "${RUNNER_TEMP}/transfer-verify-server.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/transfer-verify-server.pid")" 2>/dev/null || true
          fi
