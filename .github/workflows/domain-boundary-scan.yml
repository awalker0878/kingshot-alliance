name: Scan Domain Boundaries

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  scan:
    if: github.head_ref == 'agent/app-architecture-alignment' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/app-architecture-alignment
          fetch-depth: 0
      - name: Build domain dependency audit
        run: |
          python3 - <<'PY'
          from collections import Counter, defaultdict
          from pathlib import Path
          import re

          root = Path('.')
          canonical = [
              'Alliances','Audit','Authorization','Content','Contributions','Events','Identity',
              'Integrations','Kingdoms','Memberships','Notifications','Platform','Rallies','Recruitment',
          ]
          rows = []
          direct_model = []
          by_pair = Counter()
          by_kind = Counter()
          runtime_counts = Counter()

          for path in sorted(Path('app/Domain').rglob('*.php')):
              rel = path.as_posix()
              m_owner = re.match(r'app/Domain/([^/]+)/', rel)
              if not m_owner:
                  continue
              owner = m_owner.group(1)
              runtime_counts[owner] += 1
              text = path.read_text(errors='replace')
              for imported in re.findall(r'^use\s+(App\\Domain\\([^\\]+)\\([^;]+));', text, re.M):
                  fqcn, target, remainder = imported
                  if target == owner:
                      continue
                  kind = remainder.split('\\', 1)[0]
                  rows.append((owner, target, kind, rel, fqcn))
                  by_pair[(owner, target)] += 1
                  by_kind[kind] += 1
                  if kind == 'Models':
                      direct_model.append((owner, target, rel, fqcn))

          out = ['# Domain Boundary Audit', '',
                 'Generated from the current Phase 0–4 domain-first runtime after the implementation-plan structure refactor.', '',
                 '## Runtime ownership', '']
          for domain in canonical:
              out.append(f'- **{domain}:** {runtime_counts[domain]} PHP runtime files')
          out += ['', 'Domains with zero PHP files are intentional only when their implementation phase has not started.', '']

          out += ['## Cross-domain dependency summary', '']
          if by_pair:
              for (source, target), count in sorted(by_pair.items()):
                  out.append(f'- `{source}` → `{target}`: {count} imports')
          else:
              out.append('- none')

          out += ['', '## Dependency type summary', '']
          if by_kind:
              for kind, count in sorted(by_kind.items()):
                  out.append(f'- `{kind}`: {count}')
          else:
              out.append('- none')

          out += ['', '## Direct cross-domain model dependencies', '',
                  'These are the highest-risk dependencies because they couple one domain to another domain’s persistence internals.', '']
          if direct_model:
              for owner, target, path, fqcn in sorted(direct_model):
                  out.append(f'- `{owner}` → `{target}`: `{path}` imports `{fqcn}`')
          else:
              out.append('- none')

          out += ['', '## All cross-domain imports', '']
          if rows:
              for owner, target, kind, path, fqcn in sorted(rows):
                  out.append(f'- `{owner}` → `{target}` ({kind}): `{path}` imports `{fqcn}`')
          else:
              out.append('- none')

          app_dirs = sorted(p.name for p in Path('app').iterdir() if p.is_dir())
          test_dirs = sorted(p.name for p in Path('tests').iterdir() if p.is_dir())
          doc_dirs = sorted(p.name for p in Path('docs').iterdir() if p.is_dir())
          out += ['', '## Repository structure status', '',
                  f'- `app/` directories: {", ".join(app_dirs)}',
                  f'- `tests/` directories: {", ".join(test_dirs)}',
                  f'- `docs/` directories: {", ".join(doc_dirs)}', '']

          target = Path('docs/domains/DOMAIN_BOUNDARY_AUDIT.md')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text('\n'.join(out) + '\n')
          PY
      - name: Commit audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/domains/DOMAIN_BOUNDARY_AUDIT.md
          git commit -m "Audit domain dependency boundaries"
          git push origin HEAD:agent/app-architecture-alignment
