name: Gift Code Format Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply formatters
        run: |
          vendor/bin/pint app/Contexts/GameWorld/GiftCodes/Adapters/DiscordChannelGiftCodeSourceAdapter.php
          npx prettier --write resources/js/pages/Platform/GiftCodes/Sources.vue
      - name: Print formatter patch
        run: git diff --no-color -- app/Contexts/GameWorld/GiftCodes/Adapters/DiscordChannelGiftCodeSourceAdapter.php resources/js/pages/Platform/GiftCodes/Sources.vue
