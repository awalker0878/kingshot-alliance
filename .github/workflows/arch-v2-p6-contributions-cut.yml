name: ARCH V2 P6 Contributions Cut

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/arch-v2-p6-contributions-cut.yml'

permissions:
  contents: write

jobs:
  hard-cut:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out architecture-v2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - name: Move Contributions into Intelligence and rewrite production namespaces
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import shutil

          source = Path('app/Domain/Contributions')
          target = Path('app/Contexts/Intelligence/Contributions')
          old = r'App\Domain\Contributions'
          new = r'App\Contexts\Intelligence\Contributions'

          if not source.is_dir():
              raise SystemExit('Expected app/Domain/Contributions to exist before the P6 hard cut.')
          if target.exists():
              raise SystemExit('Refusing to merge over an existing Intelligence/Contributions capability.')

          for path in source.rglob('*'):
              if not path.is_file():
                  continue
              relative = path.relative_to(source)
              destination = target / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              text = path.read_text(encoding='utf-8')
              destination.write_text(text.replace(old, new), encoding='utf-8')

          shutil.rmtree(source)

          for root_name in ('app', 'routes', 'bootstrap', 'config', 'database'):
              root = Path(root_name)
              if not root.exists():
                  continue
              for path in root.rglob('*.php'):
                  text = path.read_text(encoding='utf-8')
                  rewritten = text.replace(old, new)
                  if rewritten != text:
                      path.write_text(rewritten, encoding='utf-8')
          PY

      - name: Verify Contributions hard cut
        shell: bash
        run: |
          set -euo pipefail
          test ! -d app/Domain/Contributions
          test -d app/Contexts/Intelligence/Contributions
          matches=$(grep -R -n --include='*.php' 'App\\Domain\\Contributions' app routes bootstrap config database 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            exit 1
          fi

      - name: Commit P6 Contributions cut
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'awalker0878'
          git config user.email '52688461+awalker0878@users.noreply.github.com'
          git add app routes bootstrap config database
          if git diff --cached --quiet; then
            echo 'No Contributions migration changes found.'
            exit 0
          fi
          git commit -m 'ARCH-V2-P6: hard cut Contributions into Intelligence'
          git push origin HEAD:architecture-v2
