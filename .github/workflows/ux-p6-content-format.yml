name: UX P6 Content formatter

on:
  push:
    branches:
      - ux/ux-001-experience-localization
    paths:
      - .ux-p6-content-format-trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out UX branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ux/ux-001-experience-localization

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply pinned Prettier
        run: npx prettier --write resources/js/pages/Alliance/ContentIndex.vue resources/js/pages/Alliance/ContentDetail.vue resources/js/pages/Alliance/ContentManage.vue resources/js/localization/messages/content-experience.ts resources/js/localization/messages/index.ts

      - name: Restore package check
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.scripts['format:check']='prettier --check resources/';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Apply Pint
        run: vendor/bin/pint app/Domain/Content/Http/Controllers/MemberContentController.php app/Domain/Content/Http/Controllers/ContentManagementController.php tests/Architecture/ContentExperienceTest.php

      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json resources/js/pages/Alliance/ContentIndex.vue resources/js/pages/Alliance/ContentDetail.vue resources/js/pages/Alliance/ContentManage.vue resources/js/localization/messages/content-experience.ts resources/js/localization/messages/index.ts app/Domain/Content/Http/Controllers/MemberContentController.php app/Domain/Content/Http/Controllers/ContentManagementController.php tests/Architecture/ContentExperienceTest.php
          if ! git diff --cached --quiet; then
            git commit -m "Format UX-P6 content experience"
            git push origin HEAD:ux/ux-001-experience-localization
          fi
