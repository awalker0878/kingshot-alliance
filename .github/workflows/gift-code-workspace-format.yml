name: Gift Code Workspace Format

on:
  push:
    branches:
      - gift-code-redemption-workspace

permissions:
  contents: write

concurrency:
  group: gift-code-workspace-format
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gift-code-redemption-workspace

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Format Gift Code workspace files
        run: >-
          npx prettier --write
          resources/js/localization/gift-code-workspace-labels.ts
          resources/js/pages/Kingdom/GiftCodes/AllianceCoverage.vue
          resources/js/pages/Kingdom/GiftCodes/Workspace.vue

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add resources/js/localization/gift-code-workspace-labels.ts resources/js/pages/Kingdom/GiftCodes/AllianceCoverage.vue resources/js/pages/Kingdom/GiftCodes/Workspace.vue
          git commit -m "style: format Gift Code workspace frontend"
          git push origin HEAD:gift-code-redemption-workspace
