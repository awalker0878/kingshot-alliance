name: V3 CA-P6 Authorization Lock Cleanup

on:
  push:
    branches:
      - architecture-v3-capability-alignment

permissions:
  contents: write

jobs:
  rewrite:
    if: ${{ !contains(github.event.head_commit.message, 'remove authorization-service locks') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v3-capability-alignment
          fetch-depth: 0
      - name: Remove locks from authorization/read services
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          changed=[]
          for path in Path('app/Contexts').rglob('*.php'):
              normalized=path.as_posix()
              if '/Access/' not in normalized and 'Authorization' not in path.name:
                  continue
              text=path.read_text()
              updated=text.replace('->lockForUpdate()', '').replace('->sharedLock()', '')
              if updated != text:
                  path.write_text(updated)
                  changed.append(normalized)
          print('\n'.join(changed))
          PY
      - name: Syntax check
        run: find app/Contexts -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Remove one-use workflow
        run: rm -f .github/workflows/v3-p6-auth-lock-cleanup.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor(v3): remove authorization-service locks [skip ci]"
          git push origin HEAD:architecture-v3-capability-alignment
