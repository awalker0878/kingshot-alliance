name: UX P5A3 Finalize

on:
  push:
    branches:
      - ux/ux-001-experience-localization
    paths:
      - .github/workflows/ux-p5a3-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ux/ux-001-experience-localization
          fetch-depth: 0
      - name: Add presentation identity to coordinator payload
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/Domain/Events/Http/Controllers/EventManagementController.php')
          text = path.read_text()
          needle = "        return Inertia::render('Alliance/Events/Manage', [\n            'alliance' => ["
          replacement = "        return Inertia::render('Alliance/Events/Manage', [\n            'user' => [\n                'name' => (string) $user->name,\n                'email' => (string) $user->email,\n            ],\n            'alliance' => ["
          if replacement not in text:
              if text.count(needle) != 1:
                  raise SystemExit(f'Expected one coordinator payload insertion point, found {text.count(needle)}')
              path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Format coordinator frontend
        run: npx prettier --write resources/js/pages/Alliance/Events/Manage.vue resources/js/localization/messages/event-coordinator.ts resources/js/localization/messages/index.ts
      - name: Commit mechanical coordinator changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/Domain/Events/Http/Controllers/EventManagementController.php resources/js/pages/Alliance/Events/Manage.vue resources/js/localization/messages/event-coordinator.ts resources/js/localization/messages/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "Finalize UX-P5 event coordinator presentation"
          git push origin HEAD:ux/ux-001-experience-localization
