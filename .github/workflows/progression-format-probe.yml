name: Progression Format Probe

on:
  push:
    branches:
      - feature/progression-goal-planner-calculators-main

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Pint formatter
        run: vendor/bin/pint app/Contexts/GameWorld/Progression/Queries/ProgressionTopologyQuery.php app/Contexts/GameWorld/Progression/Services/ProgressionCalculator.php app/ReadModels/Progression/Queries/ProgressionPlannerQuery.php

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Prettier formatter
        run: npx prettier --write resources/js/pages/Kingdom/Progression/Planner.vue

      - name: Print formatter diff
        run: git --no-pager diff -- app/Contexts/GameWorld/Progression/Queries/ProgressionTopologyQuery.php app/Contexts/GameWorld/Progression/Services/ProgressionCalculator.php app/ReadModels/Progression/Queries/ProgressionPlannerQuery.php resources/js/pages/Kingdom/Progression/Planner.vue
