name: Kingdoms Slice B Format Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Canonical Slice B formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --no-audit --no-fund

      - name: Format Slice B files
        run: |
          vendor/bin/pint app/Domain/Kingdoms/Http/Controllers/RosterController.php
          npx prettier --write resources/js/pages/Alliance/Roster.vue resources/js/pages/Alliance/RosterManage.vue

      - name: Stage formatted files
        run: |
          mkdir -p formatted/app/Domain/Kingdoms/Http/Controllers
          mkdir -p formatted/resources/js/pages/Alliance
          cp app/Domain/Kingdoms/Http/Controllers/RosterController.php formatted/app/Domain/Kingdoms/Http/Controllers/RosterController.php
          cp resources/js/pages/Alliance/Roster.vue formatted/resources/js/pages/Alliance/Roster.vue
          cp resources/js/pages/Alliance/RosterManage.vue formatted/resources/js/pages/Alliance/RosterManage.vue

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: kingdoms-slice-b-formatted-files
          path: formatted/
          if-no-files-found: error
