name: Territory Closeout Type Fix

on:
  pull_request:
    paths:
      - 'resources/js/pages/Kingdom/Territory/Tools.vue'
      - '.github/workflows/territory-closeout-type-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply exact type fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('resources/js/pages/Kingdom/Territory/Tools.vue')
          text = path.read_text()
          old_options = "const options: { image?: Parameters<typeof exportModule.buildSvg>[4]['image'] } = {};"
          new_options = "const options: { image?: NonNullable<Parameters<typeof exportModule.buildSvg>[4]>['image'] } = {};"
          if old_options not in text:
              raise SystemExit('export options type target not found')
          text = text.replace(old_options, new_options, 1)
          old_bytes = """function bytesFromBase64(value: string): Uint8Array {\n  const binary = atob(value);\n  return Uint8Array.from(binary, (character) => character.charCodeAt(0));\n}"""
          new_bytes = """function bytesFromBase64(value: string): Uint8Array<ArrayBuffer> {\n  const binary = atob(value);\n  const bytes = new Uint8Array(binary.length);\n  for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);\n  return bytes;\n}"""
          if old_bytes not in text:
              raise SystemExit('base64 byte conversion target not found')
          path.write_text(text.replace(old_bytes, new_bytes, 1))
          PY
          npx prettier resources/js/pages/Kingdom/Territory/Tools.vue --write
          npm run types:check
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet -- resources/js/pages/Kingdom/Territory/Tools.vue; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/js/pages/Kingdom/Territory/Tools.vue
          git commit -m 'fix(territory): satisfy rendition type boundaries'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
