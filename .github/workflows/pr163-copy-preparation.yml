name: PR 163 reviewed copy preparation
on:
  pull_request_review:
    types: [submitted]
permissions:
  contents: write
jobs:
  prepare:
    if: >-
      github.repository == 'awalker0878/kingshot-alliance' &&
      github.event.pull_request.number == 163 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'astra/codebase-hardening' &&
      github.event.review.user.login == 'awalker0878' &&
      github.event.review.state == 'commented' &&
      github.event.review.body == 'Prepare reviewed candidate label blob only.' &&
      github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.review.commit_id }}
          persist-credentials: false
      - name: Prepare the exact reviewed blob without changing refs
        env:
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          p=pathlib.Path('resources/js/pages/Alliance/Recruitment/Candidate.vue')
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          original=p.read_bytes()
          assert blob(original)=='cf75fecfb0e0295ecc741b6ecb9a4c9066fded2f'
          text=original.decode()
          pairs={'reason':'internalReason','reviewers':'reviewersTags','selectReviewer':'chooseReviewer','assignReviewer':'assign','convertCandidate':'createMembershipInvitation','selectPlayer':'choosePlayer','application':'answers','notes':'privateNotes','internalNotes':'newPrivateNote','tags':'tag','selectTemplate':'chooseTemplate'}
          for old,new in pairs.items():
              token="t('recruitment."+old+"')"
              assert text.count(token)==(2 if old in ['tags','convertCandidate'] else 1)
              text=text.replace(token,"t('recruitment."+new+"')")
          assert text.count("t('recruitment.noTags')")==1
          text=text.replace("t('recruitment.noTags')","t('common.none')")
          result=text.encode()
          assert blob(result)=='40532f636a46e844869bb5ef92b4f1e4e0febd57'
          request=urllib.request.Request('https://api.github.com/repos/awalker0878/kingshot-alliance/git/blobs',data=json.dumps({'content':text,'encoding':'utf-8'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['SOURCE_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response:
              receipt=json.load(response)
          assert receipt['sha']==blob(result)
          print(json.dumps({'path':str(p),'source_blob':blob(original),'result_blob':receipt['sha'],'substitutions':14,'commits_or_refs_changed':False}))
          PY
