name: Architecture V3 Diagnostics

on:
  push:
    branches:
      - gift-code-research-backed-acquisition

permissions:
  contents: read

jobs:
  architecture-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, gd, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Capture Architecture V3 output
        shell: bash
        run: |
          set +e
          vendor/bin/phpunit tests/v3/Architecture --colors=never > architecture-v3-output.txt 2>&1
          status=$?
          printf '\nEXIT_STATUS=%s\n' "$status" >> architecture-v3-output.txt
          exit 0

      - name: Upload Architecture V3 output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: architecture-v3-output
          path: architecture-v3-output.txt
          retention-days: 1
