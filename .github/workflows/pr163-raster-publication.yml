name: PR 163 exact raster preparation
on:
  pull_request_review:
    types: [submitted]
permissions:
  contents: write
jobs:
  prepare:
    if: >-
      github.repository == 'awalker0878/kingshot-alliance' &&
      github.event.pull_request.number == 163 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'astra/codebase-hardening' &&
      github.event.review.user.login == 'awalker0878' &&
      github.event.review.state == 'commented' &&
      github.event.review.body == 'Prepare exact raster review objects; no commits or refs.' &&
      github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.review.commit_id }}
          persist-credentials: false
      - name: Reconcile full input and validate all source objects
        env:
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,urllib.request
          raw=pathlib.Path('.github/pr163-reviewed-slice.json').read_bytes().rstrip(b'\n')
          wrong=b'iVBORw0KGgoAAAANSUhEUgAAAAMAAAACCAIAAAASFvFNAAAAFklEQVR4nGOSc87o3XT9j6Jb9oStTLxIAAB1IgaTWQrenQAAAABJRU5ErkJggg=='
          right=b'iVBORw0KGgoAAAANSUhEUgAAAAMAAAACCAIAAAASFvFNAAAAFklEQVR4nGOSc87o3XT9j6IbEy8MAABAywS87NBQVgAAAABJRU5ErkJggg=='
          assert raw.count(wrong)==1
          raw=raw.replace(wrong,right)
          assert hashlib.sha256(raw).hexdigest()=='12b83afa654ecd2db9d791555551a33538c19d7ba3538c97d7bfde714024fa4a'
          payload=json.loads(raw)
          assert payload['id']=='HARD-107-viewport-capture-review'
          changes=payload['changes']
          assert len(changes)==6 and len({c['path'] for c in changes})==6
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          prepared=[]
          for c in changes:
              p=pathlib.Path(c['path'])
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] in ['tests','docs']
              assert not any(q.is_symlink() for q in [p,*p.parents])
              data=p.read_bytes() if p.exists() else b''
              assert (blob(data) if p.exists() else None)==c['before'],c['path']
              lines=data.decode().splitlines(keepends=True)
              prior=0
              for start,end,text in c['hunks']:
                  assert isinstance(start,int) and isinstance(end,int) and isinstance(text,str) and prior<=start<=end<=len(lines)
                  prior=end
              for start,end,text in reversed(c['hunks']):
                  lines[start:end]=text.splitlines(keepends=True)
              data=''.join(lines).encode()
              assert blob(data)==c['after'],c['path']
              prepared.append((str(p),data,c['after']))
          result=[]
          for path,data,expected in prepared:
              request=urllib.request.Request('https://api.github.com/repos/awalker0878/kingshot-alliance/git/blobs',data=json.dumps({'content':data.decode(),'encoding':'utf-8'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['SOURCE_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  assert json.load(response)['sha']==expected
              result.append({'path':path,'sha':expected})
          receipt={'source_revision':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'objects':result,'commits_or_refs_written':False}
          pathlib.Path('raster-prepared.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: raster-exact-source
          path: raster-prepared.json
          retention-days: 3
          if-no-files-found: error
