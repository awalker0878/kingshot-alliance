name: Agent Polish Governor Selection Label

on:
  push:
    branches:
      - agent/full-ui-rewrite

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out rewrite branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/full-ui-rewrite
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Shorten localized Governor selection label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          translations = {
              'ar': 'اختر الحاكم',
              'de': 'Gouverneur auswählen',
              'en': 'Select Governor',
              'es': 'Seleccionar gobernador',
              'fr': 'Sélectionner le gouverneur',
              'id': 'Pilih Gubernur',
              'it': 'Seleziona governatore',
              'ja': '総督を選択',
              'ko': '총독 선택',
              'pl': 'Wybierz gubernatora',
              'pt-BR': 'Selecionar governador',
              'ru': 'Выбрать губернатора',
              'th': 'เลือกผู้ว่าการ',
              'tr': 'Vali seç',
              'vi': 'Chọn Thống đốc',
              'zh-CN': '选择总督',
              'zh-TW': '選擇總督',
          }

          root = Path('resources/js/localization/messages/core')
          for locale, value in translations.items():
              path = root / f'{locale}.ts'
              text = path.read_text()
              pattern = re.compile(r"(\s+selectPlayer:\s*)'[^']*',")
              updated, count = pattern.subn(lambda match: f"{match.group(1)}'{value}',", text, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one selectPlayer translation, found {count}.')
              path.write_text(updated)
          PY

      - name: Format localization files
        run: npx prettier --write resources/js/localization/messages/core/

      - name: Run full frontend checks
        run: npm run check

      - name: Commit localized label polish
        shell: bash
        run: |
          if git diff --quiet -- resources/js/localization/messages/core/; then
            echo "No localization change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/localization/messages/core/
          git commit -m "polish governor selection copy"
          git push origin HEAD:agent/full-ui-rewrite
