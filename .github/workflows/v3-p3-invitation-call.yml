name: V3 CA-P3 Invitation Call

on:
  push:
    branches:
      - architecture-v3-capability-alignment

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v3-capability-alignment
          fetch-depth: 0
      - shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/Contexts/Alliance/Membership/Actions/CreateInvitation.php')
          text = path.read_text()
          candidates = [
              ('$this->issuer->handle($context, $target,', '$this->issuer->handle($context, (string) $target->id,'),
              ('$this->issue->handle($context, $target,', '$this->issue->handle($context, (string) $target->id,'),
              ('$this->invitations->handle($context, $target,', '$this->invitations->handle($context, (string) $target->id,'),
          ]
          changed = False
          for old, new in candidates:
              if old in text:
                  text = text.replace(old, new)
                  changed = True
          if not changed:
              raise SystemExit('Invitation service call pattern not found')
          path.write_text(text)
          PY
      - run: php -l app/Contexts/Alliance/Membership/Actions/CreateInvitation.php
      - run: rm -f .github/workflows/v3-p3-invitation-call.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(v3): call invitation service by Player ID [skip ci]"
          git push origin HEAD:architecture-v3-capability-alignment
