name: Architecture V2 P5 Format Controller

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/architecture-v2-p5-format-controller.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Format command controller
        run: vendor/bin/pint app/Contexts/Operations/EventCore/Http/Controllers/EventManagementController.php
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Contexts/Operations/EventCore/Http/Controllers/EventManagementController.php
          git diff --cached --quiet && exit 0
          git commit -m 'style(arch-v2): normalize Event command controller'
          git push origin HEAD:architecture-v2
