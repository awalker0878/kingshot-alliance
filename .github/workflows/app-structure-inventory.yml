name: Inventory implementation-plan structure

on:
  push:
    branches:
      - agent/app-architecture-alignment

permissions:
  contents: write

concurrency:
  group: app-structure-inventory
  cancel-in-progress: true

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/app-architecture-alignment
          fetch-depth: 0

      - name: Build architecture inventory
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          from collections import Counter, defaultdict
          from pathlib import Path
          import re

          root = Path('.')
          php_files = [p for p in root.rglob('*.php') if '.git' not in p.parts and 'vendor' not in p.parts]

          def ns(text: str) -> str | None:
              m = re.search(r'^namespace\s+([^;]+);', text, re.M)
              return m.group(1) if m else None

          def uses(text: str) -> list[str]:
              return re.findall(r'^use\s+([^;]+);', text, re.M)

          app_php = [p for p in php_files if p.parts and p.parts[0] == 'app']
          namespaces = Counter()
          domain_files = defaultdict(list)
          application_files = defaultdict(list)
          model_files = []
          shared_files = []
          rally_in_events = []
          cross_domain = []

          for p in app_php:
              text = p.read_text(errors='replace')
              namespace = ns(text) or '(none)'
              namespaces[namespace] += 1
              if namespace.startswith('App\\Domain\\'):
                  parts = namespace.split('\\')
                  domain = parts[2] if len(parts) > 2 else '(root)'
                  domain_files[domain].append(str(p))
                  if domain == 'Shared':
                      shared_files.append(str(p))
              if namespace.startswith('App\\Application\\'):
                  parts = namespace.split('\\')
                  area = parts[2] if len(parts) > 2 else '(root)'
                  application_files[area].append(str(p))
              if namespace == 'App\\Models':
                  model_files.append(str(p))
              if 'Rally' in p.stem and ('/Events/' in str(p) or '\\Events' in namespace):
                  rally_in_events.append(str(p))

              owner = None
              if namespace.startswith('App\\Domain\\'):
                  parts = namespace.split('\\')
                  owner = parts[2] if len(parts) > 2 else None
              elif namespace.startswith('App\\Application\\'):
                  parts = namespace.split('\\')
                  owner = parts[2] if len(parts) > 2 else None

              if owner:
                  for imported in uses(text):
                      m = re.match(r'App\\(?:Domain|Application)\\([^\\]+)\\', imported)
                      if m and m.group(1) != owner and m.group(1) != 'Shared':
                          cross_domain.append((str(p), owner, imported))

          def top_dirs(base: str) -> list[str]:
              path = Path(base)
              if not path.exists():
                  return []
              return sorted(p.name for p in path.iterdir() if p.is_dir())

          def top_files(base: str) -> list[str]:
              path = Path(base)
              if not path.exists():
                  return []
              return sorted(p.name for p in path.iterdir() if p.is_file())

          target_domains = [
              'Alliances', 'Audit', 'Authorization', 'Content', 'Contributions', 'Events',
              'Identity', 'Integrations', 'Kingdoms', 'Memberships', 'Notifications',
              'Platform', 'Rallies', 'Recruitment',
          ]
          current_domains = top_dirs('app/Domain')
          missing_domains = [d for d in target_domains if d not in current_domains]
          extra_domains = [d for d in current_domains if d not in target_domains]

          target_test_dirs = ['Architecture', 'Feature', 'Integration', 'Performance', 'TenantIsolation', 'Unit']
          current_test_dirs = top_dirs('tests')
          missing_test_dirs = [d for d in target_test_dirs if d not in current_test_dirs]

          target_doc_dirs = ['adr', 'domains', 'operations', 'product', 'security']
          current_doc_dirs = top_dirs('docs')
          missing_doc_dirs = [d for d in target_doc_dirs if d not in current_doc_dirs]
          extra_doc_dirs = [d for d in current_doc_dirs if d not in target_doc_dirs]

          out = []
          out += ['# Implementation-plan structure audit', '']
          out += ['Generated from the repository filesystem on the architecture-alignment branch.', '']
          out += ['## Canonical target', '']
          out += ['The source of truth is `docs/IMPLEMENTATION_PLAN.md` section 11.', '']
          out += ['## Top-level structure', '']
          out += [f'- `app/`: {", ".join(top_dirs("app")) or "(none)"}']
          out += [f'- `docs/` directories: {", ".join(current_doc_dirs) or "(none)"}']
          out += [f'- `docs/` root files: {", ".join(top_files("docs")) or "(none)"}']
          out += [f'- `tests/`: {", ".join(current_test_dirs) or "(none)"}', '']
          out += ['## Domain directory drift', '']
          out += [f'- Current: {", ".join(current_domains) or "(none)"}']
          out += [f'- Missing canonical domains: {", ".join(missing_domains) or "none"}']
          out += [f'- Non-canonical domain directories: {", ".join(extra_domains) or "none"}', '']
          out += ['## Test directory drift', '']
          out += [f'- Missing canonical test groups: {", ".join(missing_test_dirs) or "none"}', '']
          out += ['## Documentation directory drift', '']
          out += [f'- Missing canonical documentation groups: {", ".join(missing_doc_dirs) or "none"}']
          out += [f'- Non-canonical documentation directories: {", ".join(extra_doc_dirs) or "none"}', '']

          out += ['## Application-layer inventory', '']
          for area in sorted(application_files):
              out += [f'### {area}', '']
              out += [f'- `{p}`' for p in sorted(application_files[area])]
              out += ['']

          out += ['## Domain-layer inventory', '']
          for area in sorted(domain_files):
              out += [f'### {area}', '']
              out += [f'- `{p}`' for p in sorted(domain_files[area])]
              out += ['']

          out += ['## Flat Eloquent model inventory', '']
          out += [f'- `{p}`' for p in sorted(model_files)] or ['- none']
          out += ['']

          out += ['## `Shared` inventory', '']
          out += [f'- `{p}`' for p in sorted(shared_files)] or ['- none']
          out += ['']

          out += ['## Rally-named code currently owned by Events', '']
          out += [f'- `{p}`' for p in sorted(rally_in_events)] or ['- none']
          out += ['']

          out += ['## Cross-domain application/domain imports', '']
          for path, owner, imported in sorted(cross_domain):
              out += [f'- `{path}` ({owner}) -> `{imported}`']
          if not cross_domain:
              out += ['- none']
          out += ['']

          out += ['## Namespace counts', '']
          for namespace, count in sorted(namespaces.items()):
              out += [f'- `{namespace}`: {count}']
          out += ['']

          target = Path('docs/domains/STRUCTURE_AUDIT.md')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text('\n'.join(out) + '\n')
          PY

      - name: Commit inventory
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/domains/STRUCTURE_AUDIT.md
          git commit -m "Audit repository structure against implementation plan"
          git push origin HEAD:agent/app-architecture-alignment
