name: Architecture V2 P5 Platform Access Cut

on:
  push:
    branches:
      - architecture-v2
    paths:
      - '.github/workflows/architecture-v2-p5-platform-access.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move Platform access primitives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/Contexts/Platform/Access/{Models,Services,ValueObjects}

          git mv app/Domain/Platform/Models/PlatformAdministrator.php app/Contexts/Platform/Access/Models/PlatformAdministrator.php
          git mv app/Domain/Platform/Services/PlatformMutationAuthority.php app/Contexts/Platform/Access/Services/PlatformMutationAuthority.php
          git mv app/Domain/Platform/ValueObjects/PlatformMutationContext.php app/Contexts/Platform/Access/ValueObjects/PlatformMutationContext.php

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              r'App\\Domain\\Platform\\Models\\PlatformAdministrator': r'App\\Contexts\\Platform\\Access\\Models\\PlatformAdministrator',
              r'App\\Domain\\Platform\\Services\\PlatformMutationAuthority': r'App\\Contexts\\Platform\\Access\\Services\\PlatformMutationAuthority',
              r'App\\Domain\\Platform\\ValueObjects\\PlatformMutationContext': r'App\\Contexts\\Platform\\Access\\ValueObjects\\PlatformMutationContext',
          }

          for root in ('app', 'routes', 'tests', 'bootstrap', 'config', 'database'):
              base = Path(root)
              if not base.exists():
                  continue
              for path in base.rglob('*.php'):
                  source = path.read_text()
                  updated = source
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != source:
                      path.write_text(updated)

          namespaces = {
              Path('app/Contexts/Platform/Access/Models/PlatformAdministrator.php'):
                  ('namespace App\\Domain\\Platform\\Models;', 'namespace App\\Contexts\\Platform\\Access\\Models;'),
              Path('app/Contexts/Platform/Access/Services/PlatformMutationAuthority.php'):
                  ('namespace App\\Domain\\Platform\\Services;', 'namespace App\\Contexts\\Platform\\Access\\Services;'),
              Path('app/Contexts/Platform/Access/ValueObjects/PlatformMutationContext.php'):
                  ('namespace App\\Domain\\Platform\\ValueObjects;', 'namespace App\\Contexts\\Platform\\Access\\ValueObjects;'),
          }
          for path, (old, new) in namespaces.items():
              source = path.read_text()
              if old not in source:
                  raise SystemExit(f'Expected namespace not found in {path}')
              path.write_text(source.replace(old, new, 1))
          PY

          if grep -RInE 'App\\Domain\\Platform\\(Models\\PlatformAdministrator|Services\\PlatformMutationAuthority|ValueObjects\\PlatformMutationContext)' app routes tests bootstrap config database --include='*.php'; then
            echo 'Old Platform access references remain.' >&2
            exit 1
          fi

          find app/Contexts/Platform/Access -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Commit Platform access cut
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'architecture-v2-bot'
          git config user.email 'architecture-v2-bot@users.noreply.github.com'
          git add app routes tests bootstrap config database
          if git diff --cached --quiet; then
            echo 'No Platform access changes to commit.'
            exit 0
          fi
          git commit -m 'refactor(arch-v2): move platform access to V2'
          git push origin HEAD:architecture-v2
