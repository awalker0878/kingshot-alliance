name: V3 CA-P7 Full Leakage Scan Fixed

on:
  push:
    branches:
      - architecture-v3-capability-alignment

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v3-capability-alignment
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Run validation probes
        shell: bash
        run: |
          set +e
          composer install --no-interaction --no-progress --prefer-dist >/tmp/composer.log 2>&1; echo $? >/tmp/composer.status
          composer dump-autoload --optimize --strict-psr >/tmp/autoload.log 2>&1; echo $? >/tmp/autoload.status
          find app bootstrap config database routes tests/v3 -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/syntax.log 2>&1; echo $? >/tmp/syntax.status
          php artisan route:list --no-ansi >/tmp/routes.log 2>&1; echo $? >/tmp/routes.status
          vendor/bin/phpunit tests/v3/Architecture >/tmp/architecture.log 2>&1; echo $? >/tmp/architecture.status
          exit 0
      - name: Build report
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import collections, re

          repo=Path('.')
          contexts=repo/'app/Contexts'
          findings=[]
          counts=collections.Counter()

          expected={
            'Accounts': {'Identity','Registration','Authentication','Credentials','EmailVerification','Profile','MultiFactorAuthentication'},
            'GameWorld': {'Players','Kingdoms','Governance','KingdomTransfers'},
            'Alliance': {'Lifecycle','Membership','Access','Recruitment','Content'},
            'Operations': {'Access','Events','Participation','Polls','Rosters','BattlePlans','Rallies','KingPerks','Results'},
            'Intelligence': {'Access','Observations','Ingestion','Roster','Contributions','EventAnalysis','Diplomacy','Sharing'},
            'Communications': {'Delivery'},
            'Platform': {'Administration','AllianceAdministration','DataGovernance','EventAdministration','Integrations'},
          }
          actual_contexts={p.name for p in contexts.iterdir() if p.is_dir()}
          if actual_contexts != set(expected):
              findings.append(f'CONTEXT_ROOTS expected={sorted(expected)} actual={sorted(actual_contexts)}'); counts['context_structure']+=1
          for context, capabilities in expected.items():
              root=contexts/context
              actual={p.name for p in root.iterdir() if p.is_dir()} if root.is_dir() else set()
              if actual != capabilities:
                  findings.append(f'CAPABILITY_ROOTS {context} expected={sorted(capabilities)} actual={sorted(actual)}'); counts['capability_structure']+=1

          technical={'Actions','Models','Queries','Services','Policies','Http','Providers','Enums','Jobs','Listeners','Contracts','ValueObjects'}
          for context in expected:
              for name in technical:
                  if (contexts/context/name).exists():
                      findings.append(f'ROOT_TECHNICAL_BUCKET app/Contexts/{context}/{name}'); counts['root_technical']+=1

          foreign_import=re.compile(r'^use App\\Contexts\\([A-Za-z0-9_]+)\\[^;]*\\Models\\[^;]+;', re.M)
          for context_path in sorted(p for p in contexts.iterdir() if p.is_dir()):
              source=context_path.name
              for path in sorted(context_path.rglob('*.php')):
                  text=path.read_text()
                  for match in foreign_import.finditer(text):
                      target=match.group(1)
                      if target != source:
                          findings.append(f'FOREIGN_MODEL_IMPORT {path.as_posix()} -> {target}: {match.group(0)}'); counts['foreign_model_import']+=1
                  if 'MutationAuthority' in text:
                      findings.append(f'MUTATION_AUTHORITY {path.as_posix()}'); counts['mutation_authority']+=1
                  if 'App\\Workflows\\' in text:
                      findings.append(f'CONTEXT_IMPORTS_WORKFLOW {path.as_posix()}'); counts['context_imports_workflow']+=1

          read_root=repo/'app/ReadModels'
          if read_root.exists():
              for path in read_root.rglob('*.php'):
                  text=path.read_text()
                  if re.search(r'\bDB::transaction\s*\(|->lockForUpdate\s*\(|->forceFill\s*\(|->save\s*\(\s*\)|->delete\s*\(\s*\)|::(?:query\(\)->)?create\s*\(', text):
                      findings.append(f'READMODEL_WRITE {path.as_posix()}'); counts['readmodel_write']+=1

          workflow_root=repo/'app/Workflows'
          workflow_names={p.name for p in workflow_root.iterdir() if p.is_dir()} if workflow_root.exists() else set()
          if workflow_names != {'AccountOnboarding','KingdomGovernance'}:
              findings.append(f'WORKFLOW_ROOTS actual={sorted(workflow_names)}'); counts['workflow_structure']+=1
          if workflow_root.exists():
              for path in workflow_root.rglob('*.php'):
                  text=path.read_text()
                  if re.search(r'\bDB::transaction\s*\(|->lockForUpdate\s*\(|->forceFill\s*\(|->save\s*\(\s*\)|::(?:query\(\)->)?create\s*\(', text):
                      findings.append(f'WORKFLOW_WRITE {path.as_posix()}'); counts['workflow_write']+=1

          comm=repo/'app/Contexts/Communications'
          for path in comm.rglob('*.php'):
              text=path.read_text()
              for term in ['EventReminder','KingPerkReminder','event.reminder.requested','king_perks.reminder.requested','App\\Contexts\\Operations\\']:
                  if term in text:
                      findings.append(f'COMMUNICATIONS_DOMAIN_LEAK {path.as_posix()} [{term}]'); counts['communications_domain_leak']+=1

          stale_terms=['App\\Contexts\\Alliance\\Core\\','App\\Contexts\\Operations\\EventCore\\','App\\Workflows\\PlayerContext\\','App\\Workflows\\Registration\\']
          for root_name in ['app','bootstrap','config','database','routes']:
              root=repo/root_name
              if not root.exists(): continue
              for path in root.rglob('*.php'):
                  text=path.read_text()
                  for term in stale_terms:
                      if term in text:
                          findings.append(f'STALE_NAMESPACE {path.as_posix()} [{term}]'); counts['stale_namespace']+=1

          docs=repo/'docs'
          if docs.exists():
              for path in docs.rglob('*.md'):
                  text=path.read_text()
                  for term in ['Architecture V2','EventCore','Workflows/PlayerContext','Workflows/Registration','Alliance/Core']:
                      if term in text:
                          findings.append(f'DOC_DRIFT {path.as_posix()} [{term}]'); counts['doc_drift']+=1

          for path in (repo/'.github/workflows').glob('v3-*.yml'):
              findings.append(f'TEMP_WORKFLOW {path.as_posix()}'); counts['temporary_workflow']+=1

          probes={
            'composer_install':'/tmp/composer.status',
            'strict_autoload':'/tmp/autoload.status',
            'php_syntax':'/tmp/syntax.status',
            'route_boot':'/tmp/routes.status',
            'v3_architecture_tests':'/tmp/architecture.status',
          }
          for name,status_path in probes.items():
              status=int(Path(status_path).read_text().strip())
              if status != 0:
                  findings.append(f'VALIDATION_FAILURE {name} exit={status}'); counts['validation_failure']+=1

          blocking=sum(counts.values())
          lines=['# Architecture V3 CA-P7 leakage scan','',f'RESULT={"PASS" if blocking == 0 else "FAIL"}',f'BLOCKING_FINDINGS={blocking}','','## Counts']
          if counts:
              lines.extend(f'- {key}: {value}' for key,value in sorted(counts.items()))
          else:
              lines.append('- none')
          lines.extend(['','## Findings'])
          lines.extend(f'- {finding}' for finding in findings)
          Path('ARCH_V3_P7_LEAKAGE_REPORT.md').write_text('\n'.join(lines)+'\n')
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARCH_V3_P7_LEAKAGE_REPORT.md
          git commit -m "chore(v3): record corrected CA-P7 leakage scan [skip ci]" || exit 0
          git push origin HEAD:architecture-v3-capability-alignment
