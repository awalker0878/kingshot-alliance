name: PR 163 HARD-106 exact source preparation

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write

jobs:
  prepare:
    if: >-
      github.repository == 'awalker0878/kingshot-alliance' &&
      github.event.pull_request.number == 163 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'astra/codebase-hardening' &&
      github.event.review.user.login == 'awalker0878' &&
      github.event.review.state == 'commented' &&
      github.event.review.body == 'Prepare verified HARD-106 objects only; do not commit or move refs.' &&
      github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.review.commit_id }}
          persist-credentials: false
      - name: Verify all source substitutions before creating objects
        env:
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,re,subprocess,urllib.request
          base='https://api.github.com/repos/awalker0878/kingshot-alliance/git/blobs'
          headers={'Authorization':'Bearer '+os.environ['SOURCE_TOKEN'],'Accept':'application/vnd.github+json'}
          def digest(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def get(sha):
              with urllib.request.urlopen(urllib.request.Request(base+'/'+sha,headers=headers),timeout=30) as response:
                  value=json.load(response)
              data=base64.b64decode(value['content'])
              assert digest(data)==sha
              return data
          manifests=[
              '59ebefa8cf0c8de425170b54fb88ebde9b16d1ab',
              '5199bcfa68377e89daf615cd779de03dd8ce78fd',
              '07d3659ccabd7cc9e257b1f8b9ba638d10eefdfa',
              '089a172efcdfa857d99f8ffaf9f096b63f3ed010',
              '802415459429bd587ec1516288bf17d823a2e0c4',
              'a398d73f449f0c2e48a2af4986754a461546c9ac',
          ]
          additions={
              'app/Contexts/Alliance/Content/Queries/ContentManagementQuery.php':'2adf3a258dcfc5138f18598cf5cb087294792bac',
              'app/Contexts/Communications/Delivery/Queries/AnnouncementDeliverySummaryQuery.php':'8f5a3dd0b62c0d2f5a2d5278e0063db1905bfb34',
              'app/Contexts/Communications/Delivery/ValueObjects/AnnouncementDeliverySummary.php':'3d6f9077a0147a9842797f1fad20a544bd91b26d',
              'docs/architecture/adr/0050-scoped-announcement-outcome-projections.md':'5b471702e999e7f0bc31557278e27b1d1098e350',
              'resources/js/components/content/AnnouncementRunHistory.vue':'c1a512160f03848eccbafd06346f670255208f4c',
              'resources/js/components/content/ContentChoicePicker.vue':'12d9ef506bd3854ff9f276f1c91d95734e9db1f7',
              'resources/js/components/content/ContentHistoryControls.vue':'d030eec7bbf21d35c51e7631d01110b80b8f2e44',
              'resources/js/components/content/ContentRevisionHistory.vue':'d64bdcc90a68d50e769ae7a708872e6f2cb0618b',
              'resources/js/features/alliance-content/reconcileDrafts.ts':'8d9f195af78b5e8caafa00be8787185aba53e170',
              'resources/js/features/alliance-content/types.ts':'cfefdf40d5bf50444e1e991a3842e2aeab0c0774',
              'resources/js/features/alliance-content/useContentHistory.ts':'00bb16e922021fd3993bc5720d9d814a13b12532',
              'tests/Contexts/Communications/Delivery/Feature/AnnouncementDeliverySummaryTest.php':'ea61befa17ed87539709667686e719a6bb1dc7ec',
              'tests/ReadModels/AnnouncementBroadcastManagement/Architecture/BroadcastOwnerBoundaryTest.php':'d1fb4470a9b6661911de783f5c6cdc72e3134982',
              'tests/ReadModels/AnnouncementBroadcastManagement/Browser/ContentManagementPagination.spec.ts':'2276f643c922406f5c2a1a3053c751d77de07eef',
              'tests/ReadModels/AnnouncementBroadcastManagement/Feature/ContentManagementPaginationTest.php':'8922558551201fb061c554a62b8ca1604dadac21',
              'tests/ReadModels/AnnouncementBroadcastManagement/Fixtures/ContentManagementPaginationFixture.php':'46566c1ac4e7487f41a1553e6126b79998be549e',
              'tests/ReadModels/AnnouncementBroadcastManagement/Frontend/ContentDrafts.test.ts':'7b7629cc88808786c5fec72e5821f8d9a05305e5',
              'tests/ReadModels/AnnouncementBroadcastManagement/README.md':'e9bffe5f4cf4288ab1008c84bcbd7afd2f9f5e10',
          }
          prepared={}
          for sha in manifests:
              manifest=json.loads(get(sha))
              for change in manifest['changes']:
                  path=pathlib.PurePosixPath(change['path'])
                  assert not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] in ['app','docs','resources','routes','tests','database'] or str(path)=='phpunit.xml'
                  assert str(path) not in prepared
                  original=pathlib.Path(path).read_bytes()
                  assert digest(original)==change['before'],str(path)+' source changed'
                  lines=original.decode().splitlines(keepends=True)
                  end=-1
                  for start,stop,text in change['hunks']:
                      assert 0<=start<=stop<=len(lines) and start>=end
                      end=stop
                  for start,stop,text in reversed(change['hunks']):
                      lines[start:stop]=text.splitlines(keepends=True)
                  data=''.join(lines).encode()
                  assert digest(data)==change['after'],str(path)+' result mismatch'
                  prepared[str(path)]=(data,change['after'])
          for path,sha in additions.items():
              assert path not in prepared and not pathlib.Path(path).exists(),path
              prepared[path]=(get(sha),sha)
          assert len(prepared)==55
          result=[]
          for path,(data,sha) in prepared.items():
              if path not in additions:
                  req=urllib.request.Request(base,data=json.dumps({'encoding':'utf-8','content':data.decode()}).encode(),headers=headers,method='POST')
                  with urllib.request.urlopen(req,timeout=30) as response:
                      assert json.load(response)['sha']==sha
              result.append({'path':path,'sha':sha})
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'hard106-prepared'
          output.mkdir()
          receipt={'source_revision':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'objects':result,'commits_or_refs_written':False}
          (output/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hard106-exact-source
          path: ${{ runner.temp }}/hard106-prepared
          retention-days: 3
          if-no-files-found: error
