name: PR 163 HARD-106 exact source preparation

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write

jobs:
  prepare:
    if: >-
      github.repository == 'awalker0878/kingshot-alliance' &&
      github.event.pull_request.number == 163 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'astra/codebase-hardening' &&
      github.event.review.user.login == 'awalker0878' &&
      github.event.review.state == 'commented' &&
      github.event.review.body == 'Prepare verified HARD-106 objects only; do not commit or move refs.' &&
      github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.review.commit_id }}
          persist-credentials: false
      - name: Reconcile the reviewed owner slice without committing or moving refs
        env:
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import base64,gzip,hashlib,json,os,pathlib,subprocess,urllib.request
          base='https://api.github.com/repos/awalker0878/kingshot-alliance/git/blobs'
          headers={'Authorization':'Bearer '+os.environ['SOURCE_TOKEN'],'Accept':'application/vnd.github+json'}
          def digest(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          cache={}
          def get(sha):
              if sha not in cache:
                  with urllib.request.urlopen(urllib.request.Request(base+'/'+sha,headers=headers),timeout=30) as response:
                      value=json.load(response)
                  data=base64.b64decode(value['content'])
                  assert digest(data)==sha
                  cache[sha]=data
              return cache[sha]
          def apply(original,hunks):
              lines=original.decode().splitlines(keepends=True)
              end=-1
              for start,stop,text in hunks:
                  assert 0<=start<=stop<=len(lines) and start>=end
                  end=stop
              for start,stop,text in reversed(hunks):
                  lines[start:stop]=text.splitlines(keepends=True)
              return ''.join(lines).encode()
          # Transport-only pieces of one reviewed manifest, not executable archives.
          parts=['4f9267ef916cd3c7efd3f87a6ac372fbbec20997',
                 '4eb604f3d03912ad7260fdfeb98b35df19a30703',
                 'a367a712d375dbd72b86f4df053522a505b795f4',
                 '0acb2108fdecc1f29bb93fb1a6117ef10fadd8f8',
                 'da81ac575f5809f562d53fddc8880027dc6d5db4',
                 '89b1333af429eef00de77e47c836620a65451ad7',
                 '3548640fb644b4222cdb2bac748ea0bc3029219f',
                 '5f0edc05826d875aa30ff84e32585d14b8c97d74',
                 'e42cbd80c02a68eeb9e85e8765fb9cb901aec734',
                 '06db09cbb13eccd4f73a19a8ce16c94253265a6f',
                 '78edfd6e3e72dd5a5063ebeded6485c28048fa4b',
                 'd6a2ed9c10a16a18c5e5a03c2529eb58e9b7c527']
          packed=b''.join(get(sha) for sha in parts)
          assert digest(packed)=='46d2a171e698f33bfd403cb917858d42eb841b94'
          raw=gzip.decompress(packed)
          assert hashlib.sha256(raw).hexdigest()=='98114803dbb1177a3a19c6f152de7f115879d7092e515982c2893f1a5a904ded'
          manifest=json.loads(raw)
          assert manifest['id']=='HARD-106-current-manager-pagination'
          assert len(manifest['changes'])==50
          needed={c['path'] for c in manifest['changes'] if c['source']=='candidate'}
          # Reconstruct the old candidate only as a diff base. Never overwrite current
          # Communications outcome authority, its tests, or its accepted ADR-0050.
          proposed={}
          for sha in ['59ebefa8cf0c8de425170b54fb88ebde9b16d1ab',
                      '5199bcfa68377e89daf615cd779de03dd8ce78fd',
                      '07d3659ccabd7cc9e257b1f8b9ba638d10eefdfa',
                      '089a172efcdfa857d99f8ffaf9f096b63f3ed010',
                      '802415459429bd587ec1516288bf17d823a2e0c4',
                      'a398d73f449f0c2e48a2af4986754a461546c9ac']:
              for c in json.loads(get(sha))['changes']:
                  if c['path'] not in needed:continue
                  original=get(c['before']) if c['before'] else b''
                  data=apply(original,c['hunks'])
                  assert digest(data)==c['after'],c['path']
                  assert c['path'] not in proposed
                  proposed[c['path']]=data
          prepared={};before={}
          for c in manifest['changes']:
              path=pathlib.PurePosixPath(c['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ['app','docs','resources','routes','tests','database']
              assert str(path) not in prepared
              original=pathlib.Path(path).read_bytes() if pathlib.Path(path).exists() else b''
              actual=digest(original) if pathlib.Path(path).exists() else None
              assert actual==c['before'],str(path)+' current source changed'
              if c['source']=='candidate':
                  starting=proposed[str(path)] if str(path) in proposed else get(c['source_blob'])
              else:
                  assert c['source']=='current'
                  starting=original
              assert digest(starting)==c['source_blob'],str(path)+' base mismatch'
              data=apply(starting,c['hunks'])
              assert digest(data)==c['after'],str(path)+' reviewed result mismatch'
              prepared[str(path)]=data;before[str(path)]=actual
          # Preserve concurrent ledger work outside our own section and additive
          # checkpoint notes. Exact old section match prevents competing HARD-106 edits.
          ledger=manifest['ledger']
          assert ledger['path']=='docs/product/codebase-hardening-delivery-ledger.md'
          original=pathlib.Path(ledger['path']).read_bytes();text=original.decode()
          assert text.count(ledger['section_before'])==1
          assert text.count(ledger['insert_before'])==1
          assert ledger['header_notes'] not in text
          assert ledger['section_before'].startswith('### HARD-106')
          assert ledger['section_after'].startswith('### HARD-106')
          text=text.replace(ledger['section_before'],ledger['section_after'],1)
          text=text.replace(ledger['insert_before'],'\n'+ledger['header_notes']+ledger['insert_before'],1)
          prepared[ledger['path']]=text.encode();before[ledger['path']]=digest(original)
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'hard106-prepared';output.mkdir()
          (output/'reviewed-manifest.json').write_bytes(raw)
          (output/'ledger-before.md').write_bytes(original)
          result=[]
          for path,data in prepared.items():
              sha=digest(data)
              req=urllib.request.Request(base,data=json.dumps({'encoding':'utf-8','content':data.decode()}).encode(),headers=headers,method='POST')
              with urllib.request.urlopen(req,timeout=30) as response:assert json.load(response)['sha']==sha
              dest=output/'source'/path;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
              result.append({'path':path,'before':before[path],'sha':sha})
          receipt={'source_revision':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                   'objects':result,'manifest_sha256':hashlib.sha256(raw).hexdigest(),
                   'tests_executed':False,'commits_or_refs_written':False}
          (output/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hard106-exact-source
          path: ${{ runner.temp }}/hard106-prepared
          retention-days: 3
          if-no-files-found: error
