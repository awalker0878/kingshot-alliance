name: Architecture V2 P5 Inventory

on:
  push:
    branches:
      - architecture-v2
    paths:
      - 'app/Domain/Events/**'
      - 'app/Domain/Rallies/**'
      - 'app/Domain/KingPerks/**'
      - '.github/workflows/architecture-v2-p5-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build P5 inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p5

          find app/Domain/Events app/Domain/Rallies app/Domain/KingPerks \
            -type f -name '*.php' -print | sort > /tmp/p5/files.txt

          {
            echo '# External App\\Domain imports from P5 roots'
            grep -RhoE '^use App\\Domain\\[^;]+;' \
              app/Domain/Events app/Domain/Rallies app/Domain/KingPerks \
              | sort -u || true
          } > /tmp/p5/imports.txt

          {
            echo '# Importing files by legacy domain'
            grep -RInE '^use App\\Domain\\' \
              app/Domain/Events app/Domain/Rallies app/Domain/KingPerks || true
          } > /tmp/p5/importing-files.txt

          {
            echo '# References to P5 namespaces outside P5 roots'
            grep -RInE 'App\\Domain\\(Events|Rallies|KingPerks)\\' \
              app routes tests bootstrap config database \
              --include='*.php' \
              --exclude-dir=Events --exclude-dir=Rallies --exclude-dir=KingPerks || true
          } > /tmp/p5/external-consumers.txt

          echo "P5 PHP files: $(wc -l < /tmp/p5/files.txt)"
          echo "Unique legacy-domain imports: $(grep -c '^use ' /tmp/p5/imports.txt || true)"
          echo "External consumer references: $(grep -c 'App\\Domain' /tmp/p5/external-consumers.txt || true)"

      - uses: actions/upload-artifact@v4
        with:
          name: architecture-v2-p5-inventory
          path: /tmp/p5
          retention-days: 2
