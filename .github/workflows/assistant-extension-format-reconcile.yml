name: Assistant Extension Format Reconcile

on:
  push:
    branches:
      - alliance-assistant-gameworld-extension

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[assistant-format-done]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: alliance-assistant-gameworld-extension
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - run: npm ci --no-audit --no-fund
      - name: Apply repository formatters
        shell: bash
        run: |
          ./vendor/bin/pint \
            app/Contexts/GameWorld/KingdomTransfers/Queries/TransferSelfEligibilityQuery.php \
            app/Contexts/GameWorld/Progression/ValueObjects/ProgressionFactResult.php
          npx prettier --write \
            resources/js/localization/assistant-gameworld-extension.ts \
            resources/js/localization/assistant-transfer-labels.ts \
            resources/js/pages/Assistant/Index.vue
          git diff --check
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/assistant-extension-format-reconcile.yml
          git add \
            app/Contexts/GameWorld/KingdomTransfers/Queries/TransferSelfEligibilityQuery.php \
            app/Contexts/GameWorld/Progression/ValueObjects/ProgressionFactResult.php \
            resources/js/localization/assistant-gameworld-extension.ts \
            resources/js/localization/assistant-transfer-labels.ts \
            resources/js/pages/Assistant/Index.vue
          git commit -m 'style: normalize Assistant extension [assistant-format-done]'
          git push origin HEAD:alliance-assistant-gameworld-extension
