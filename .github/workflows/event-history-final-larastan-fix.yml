name: Event History Final Larastan Fix

on:
  push:
    branches:
      - feature/event-contribution-history-p0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/event-contribution-history-p0
      - name: Remove unused helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/Domain/Events/Queries/EventPlayerOccurrenceEvidenceQuery.php')
          text = path.read_text()
          block = '''    private function orWhereAttendance(Builder $query, Player $player, string $occurrenceColumn, string $status): Builder
              {
                  return $query->orWhereExists(static function (Builder $subquery) use ($player, $occurrenceColumn, $status): void {
                      $subquery->selectRaw('1')
                          ->from('event_attendance as participation_attendance')
                          ->whereColumn('participation_attendance.occurrence_id', $occurrenceColumn)
                          ->where('participation_attendance.player_id', $player->id)
                          ->where('participation_attendance.status', $status);
                  });
              }

          '''
          fallback = '''    private function orWhereAttendance(Builder $query, Player $player, string $occurrenceColumn, string $status): Builder
          {
              return $query->orWhereExists(static function (Builder $subquery) use ($player, $occurrenceColumn, $status): void {
                  $subquery->selectRaw('1')
                      ->from('event_attendance as participation_attendance')
                      ->whereColumn('participation_attendance.occurrence_id', $occurrenceColumn)
                      ->where('participation_attendance.player_id', $player->id)
                      ->where('participation_attendance.status', $status);
              });
          }

          '''
          for candidate in (block, fallback):
              if candidate in text:
                  text = text.replace(candidate, '', 1)
                  break
          path.write_text(text)
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/Domain/Events/Queries/EventPlayerOccurrenceEvidenceQuery.php
          git commit -m "Remove unused Event participation query helper"
          git push origin HEAD:feature/event-contribution-history-p0
