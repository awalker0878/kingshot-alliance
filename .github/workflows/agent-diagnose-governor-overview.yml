name: Agent Diagnose Governor Overview Polish

on:
  push:
    branches:
      - agent/full-ui-rewrite

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out rewrite branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/full-ui-rewrite
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Diagnose Overview transformation
        shell: bash
        run: |
          set +e
          : > /tmp/governor-overview.log
          python3 - <<'PY' >> /tmp/governor-overview.log 2>&1
          from pathlib import Path

          overview = Path('resources/js/pages/Command/Overview.vue')
          text = overview.read_text()
          replacements = [
              ("import { Head, Link, useForm } from '@inertiajs/vue3';\n", "import { Head, Link, useForm, usePage } from '@inertiajs/vue3';\nimport { computed } from 'vue';\n"),
              ("type RoleSummary = { key: string; name: string };\n", "type PlayerIdentity = { id: string; name: string };\ntype SharedPlayerContext = { activePlayerId: string | null; players: PlayerIdentity[] };\ntype RoleSummary = { key: string; name: string };\n"),
              ("const { t } = useLocale();\nconst allianceForm = useForm({", "const { t } = useLocale();\nconst page = usePage();\nconst playerContext = computed<SharedPlayerContext>(\n  () =>\n    ((page.props as Record<string, unknown>).playerContext as SharedPlayerContext | undefined) ?? {\n      activePlayerId: null,\n      players: [],\n    },\n);\nconst hasAvailablePlayers = computed(() => playerContext.value.players.length > 0);\nconst allianceForm = useForm({"),
              (""":subtitle="
        membership
          ? t('application.dashboard.playerAllianceIntro')
          : t('application.dashboard.noPlayerAllianceIntro')
      """, """:subtitle="
        membership
          ? t('application.dashboard.playerAllianceIntro')
          : activePlayer
            ? t('application.dashboard.noPlayerAllianceIntro')
            : hasAvailablePlayers
              ? t('application.dashboard.playerContextIntro')
              : t('common.noPlayers')
      """),
              ("{{ t('application.dashboard.noPlayerAllianceTitle') }}", "{{ activePlayer ? t('application.dashboard.noPlayerAllianceTitle') : hasAvailablePlayers ? t('application.dashboard.selectPlayer') : t('common.noPlayers') }}"),
              ("{{ t('application.dashboard.noPlayerAllianceIntro') }}", "{{ activePlayer ? t('application.dashboard.noPlayerAllianceIntro') : hasAvailablePlayers ? t('application.dashboard.playerContextIntro') : t('common.noPlayers') }}"),
              ("{{ activePlayer?.name ?? t('common.noPlayers') }}", "{{ activePlayer?.name ?? (hasAvailablePlayers ? t('application.dashboard.selectPlayer') : t('common.noPlayers')) }}"),
          ]
          for index, (old, new) in enumerate(replacements, 1):
              count = text.count(old)
              print(f'replacement_{index}_matches={count}')
              if count != 1:
                  raise SystemExit(f'replacement {index} expected one match, found {count}')
              text = text.replace(old, new, 1)
          overview.write_text(text)
          print('transform_status=0')
          PY
          transform_status=$?
          echo "transform_exit=${transform_status}" >> /tmp/governor-overview.log

          if [ "$transform_status" -eq 0 ]; then
            echo '=== prettier ===' >> /tmp/governor-overview.log
            npx prettier --write resources/js/pages/Command/Overview.vue >> /tmp/governor-overview.log 2>&1
            echo "prettier_exit=$?" >> /tmp/governor-overview.log
            echo '=== npm check ===' >> /tmp/governor-overview.log
            npm run check >> /tmp/governor-overview.log 2>&1
            echo "check_exit=$?" >> /tmp/governor-overview.log
          fi

          cp /tmp/governor-overview.log agent-governor-overview.log
          git restore resources/js/pages/Command/Overview.vue || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-governor-overview.log
          git commit -m "diagnose governor overview polish"
          git push origin HEAD:agent/full-ui-rewrite
