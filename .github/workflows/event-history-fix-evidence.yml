name: Event History One-Shot Evidence Fix

on:
  push:
    branches:
      - feature/event-contribution-history-p0

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix unresolved Event result evidence chain') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: feature/event-contribution-history-p0
      - name: Apply exact chain correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/Domain/Events/Queries/EventPlayerOccurrenceEvidenceQuery.php')
          text = path.read_text()
          old = """            $this->orWhereRegistration($evidence, $player, $occurrenceColumn)\n                ->orWhereResultOutcome($player, $occurrenceColumn, 'unresolved')\n                ->orWhere(function (Builder $nested) use ($player, $occurrenceColumn): void {\n"""
          new = """            $this->orWhereRegistration($evidence, $player, $occurrenceColumn);\n            $this->orWhereResultOutcome($evidence, $player, $occurrenceColumn, 'unresolved');\n            $evidence->orWhere(function (Builder $nested) use ($player, $occurrenceColumn): void {\n"""
          if old not in text:
              raise SystemExit('Expected evidence chain not found; refusing broad edit.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit safely
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Domain/Events/Queries/EventPlayerOccurrenceEvidenceQuery.php
          git commit -m 'Fix unresolved Event result evidence chain'
          git pull --rebase origin feature/event-contribution-history-p0
          git push origin HEAD:feature/event-contribution-history-p0
