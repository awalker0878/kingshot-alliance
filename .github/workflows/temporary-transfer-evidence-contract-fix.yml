name: Temporary Transfer Evidence Contract Fix

on:
  push:
    branches:
      - kingdom-transfers-official-rules-capacity
    paths:
      - .github/workflows/temporary-transfer-evidence-contract-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: kingdom-transfers-official-rules-capacity
      - name: Apply Evidence contract fixes
        run: python3 scripts/temporary-transfer-evidence-contract-fix.py
      - name: Commit Evidence contract fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-transfer-evidence-contract-fix.yml scripts/temporary-transfer-evidence-contract-fix.py
          git add tests/Fixtures/Evidence/Transfer/transfer-target-kingdom-rules-v2.json tests/v3/Contexts/Intelligence/Evidence/TransferEvidenceSchemasV3Test.php
          git diff --cached --check
          git commit -m 'Reconcile Transfer Evidence v2 contract tests'
          git push origin HEAD:kingdom-transfers-official-rules-capacity
