name: Governor Progression Accessibility Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feature/screenshot-intake-governor-progression-main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Governor Progression branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/screenshot-intake-governor-progression-main
          fetch-depth: 0
      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Replace native confirmation with accessible dialog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('resources/js/components/progression/GovernorProgressionScreenshotIntake.vue')
          text = path.read_text()

          import_marker = "import { useLocale } from '@/localization';\n"
          imports = "import ConfirmActionDialog from '@/components/ui/ConfirmActionDialog.vue';\nimport { useConfirmAction } from '@/components/ui/useConfirmAction';\n"
          if "ConfirmActionDialog" not in text:
              if import_marker not in text:
                  raise SystemExit('Locale import marker not found')
              text = text.replace(import_marker, imports + import_marker, 1)

          locale_marker = "const { t, formatDate } = useLocale();\n"
          confirm_state = "const { dialog, requestConfirmation, cancelConfirmation, confirmAction } = useConfirmAction();\n"
          if confirm_state not in text:
              if locale_marker not in text:
                  raise SystemExit('Locale state marker not found')
              text = text.replace(locale_marker, locale_marker + confirm_state, 1)

          old = '''function removeEvidence(item: GovernorProgressionEvidenceSummary): void {\n  if (!props.canManage || !window.confirm(t('progression.deleteEvidenceConfirm'))) return;\n\n  router.delete(`/progression/governor/${props.rosterEntryId}/evidence/${item.id}`, {\n    preserveScroll: true,\n  });\n}\n'''
          new = '''function removeEvidence(item: GovernorProgressionEvidenceSummary): void {\n  if (!props.canManage) return;\n\n  requestConfirmation({\n    id: `governor-progression-evidence-delete-${item.id}`,\n    title: t('progression.deleteEvidence'),\n    description: t('progression.deleteEvidenceConfirm'),\n    confirmLabel: t('progression.deleteEvidence'),\n    cancelLabel: t('common.cancel'),\n    perform: (finish) =>\n      router.delete(`/progression/governor/${props.rosterEntryId}/evidence/${item.id}`, {\n        preserveScroll: true,\n        onFinish: finish,\n      }),\n  });\n}\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'window.confirm' in text:
              raise SystemExit('Native confirmation exists but expected function shape changed')

          dialog = '''\n    <ConfirmActionDialog v-bind="dialog" @confirm="confirmAction" @cancel="cancelConfirmation" />\n'''
          if '<ConfirmActionDialog' not in text:
              needle = '''    </section>\n  </div>\n</template>'''
              if needle not in text:
                  raise SystemExit('Template closing marker not found')
              text = text.replace(needle, '    </section>' + dialog + '  </div>\n</template>', 1)

          path.write_text(text)
          PY
          npx prettier --write resources/js/components/progression/GovernorProgressionScreenshotIntake.vue
          npm run types:check
          npm run check:accessibility
      - name: Commit accessibility repair
        shell: bash
        run: |
          if git diff --quiet -- resources/js/components/progression/GovernorProgressionScreenshotIntake.vue; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/js/components/progression/GovernorProgressionScreenshotIntake.vue
          git commit -m 'Use accessible Governor Progression evidence confirmation'
          git push origin HEAD:feature/screenshot-intake-governor-progression-main
