name: Architecture V2 P4 Finalize

on:
  push:
    branches: [architecture-v2]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - name: Verify no external V1 Authorization references remain
        shell: bash
        run: |
          matches=$(grep -R -n -F --include='*.php' 'App\Domain\Authorization' app routes bootstrap config database tests 2>/dev/null | grep -v '^app/Domain/Authorization/' | grep -v '^tests/Architecture/' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            exit 1
          fi

      - name: Apply P4 hard cut
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          console = Path('routes/console.php')
          console_text = console.read_text()
          old = r'use App\Contexts\GameWorld\Governance\Actions\BootstrapKingdomAdministrator;'
          new = r'use App\Workflows\KingdomGovernance\Actions\BootstrapKingdomAdministrator;'
          if old not in console_text:
              raise SystemExit('Expected GameWorld bootstrap import was not found.')
          console.write_text(console_text.replace(old, new, 1))

          test = Path('tests/Architecture/ArchitectureV2DependencyTest.php')
          test_text = test.read_text()
          marker = '    public function test_operations_does_not_depend_on_downstream_intelligence_or_delivery_contexts(): void\n'
          if marker not in test_text:
              raise SystemExit('P4 architecture insertion marker was not found.')
          if 'test_p4_legacy_authorization_domain_is_deleted' not in test_text:
              addition = "    public function test_p4_legacy_authorization_domain_is_deleted(): void\n    {\n        self::assertDirectoryDoesNotExist($this->root().'/app/Domain/Authorization');\n    }\n\n    public function test_p4_runtime_has_no_v1_authorization_references(): void\n    {\n        foreach (['app', 'routes', 'bootstrap', 'config', 'database'] as $root) {\n            foreach ($this->phpFiles($this->root().'/'.$root) as $file) {\n                self::assertStringNotContainsString('App\\\\Domain\\\\Authorization', $this->source($file));\n            }\n        }\n    }\n\n    public function test_p4_game_authority_is_player_scoped_not_user_scoped(): void\n    {\n        $membership = $this->source($this->root().'/app/Contexts/Alliance/Membership/Models/AllianceMembership.php');\n        $assignment = $this->source($this->root().'/app/Contexts/GameWorld/Governance/Models/KingdomRoleAssignment.php');\n        $authorization = $this->source($this->root().'/app/Contexts/GameWorld/Governance/Services/KingdomAuthorization.php');\n\n        self::assertStringContainsString(\"'player_id'\", $membership);\n        self::assertStringNotContainsString(\"'user_id'\", $membership);\n        self::assertStringContainsString(\"'player_id'\", $assignment);\n        self::assertStringNotContainsString(\"'user_id'\", $assignment);\n        self::assertStringContainsString('allows(Player $player, Kingdom $kingdom, Permission $permission)', $authorization);\n        self::assertStringContainsString(\"->where('player_id',\", $authorization);\n        self::assertStringContainsString('$player->id', $authorization);\n        self::assertStringNotContainsString('User $user', $authorization);\n    }\n\n"
              test_text = test_text.replace(marker, addition + marker, 1)
              test.write_text(test_text)

          verifier = Path('.github/workflows/architecture-v2-verification.yml')
          verifier_text = verifier.read_text()
          verifier_text = verifier_text.replace('            app/Domain/Authorization \\\n', '')
          verifier_text = verifier_text.replace('          app/Domain/Authorization\n', '')
          verifier.write_text(verifier_text)
          PY

          rm -rf app/Domain/Authorization
          rm -f .github/workflows/architecture-v2-p4-inventory.yml
          rm -f .github/workflows/architecture-v2-p4-migrate.yml
          rm -f .github/workflows/architecture-v2-p4-finalize.yml

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format and verify P4 final cut
        shell: bash
        run: |
          vendor/bin/pint routes/console.php tests/Architecture/ArchitectureV2DependencyTest.php
          php artisan test tests/Architecture/ArchitectureV2DependencyTest.php tests/Architecture/ArchitectureV2AllianceTest.php
          test ! -d app/Domain/Authorization

      - name: Commit P4 hard cut
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: delete V1 authorization domain'
          git push origin HEAD:architecture-v2
