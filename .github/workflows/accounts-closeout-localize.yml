name: Accounts Closeout Localization Fix

on:
  push:
    branches:
      - chatgpt/accounts-security-closeout

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Localize account section labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('resources/js/pages/Accounts/Governor/Profile.vue')
          text = path.read_text()
          text = text.replace('aria-label="Security"', ':aria-label="t(\'accountExperience.account.securityTitle\')"')
          text = text.replace('aria-label="Sessions"', ':aria-label="t(\'accountExperience.account.sessionsTitle\')"')
          path.write_text(text)
          PY
          git diff --check

      - name: Commit localization fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/Accounts/Governor/Profile.vue
          git commit -m "Localize account security section labels"
          git push origin HEAD:chatgpt/accounts-security-closeout
