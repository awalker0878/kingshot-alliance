name: PR 163 reviewed preparation

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write

jobs:
  prepare:
    if: >-
      github.repository == 'awalker0878/kingshot-alliance' &&
      github.event.pull_request.number == 163 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'astra/codebase-hardening' &&
      github.event.review.user.login == 'awalker0878' &&
      github.event.review.state == 'commented' &&
      github.event.review.body == 'Prepare exact reviewed hardening blobs; do not commit or move refs.' &&
      github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.review.commit_id }}
          persist-credentials: false
      - name: Validate and prepare reviewed objects
        env:
          SOURCE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request,zlib
          payload=json.loads(pathlib.Path('.github/pr163-reviewed-slice.json').read_text())
          changes=payload['changes']
          assert 0 < len(changes) <= 30
          paths=[c['path'] for c in changes]
          assert len(paths)==len(set(paths))
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for c in changes:
              p=pathlib.Path(c['path'])
              assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] in ['app','tests','docs','routes','resources','database','config','bootstrap']
              assert not p.is_symlink()
              assert (blob(p.read_bytes()) if p.exists() else None)==c['before'],c['path']
          compressed=base64.b64decode(payload['patch'],validate=True)
          assert len(compressed)<500000
          decoder=zlib.decompressobj()
          patch=decoder.decompress(compressed,2000000)
          assert decoder.eof and not decoder.unconsumed_tail
          subprocess.run(['git','apply','--check','--whitespace=error'],input=patch,check=True)
          subprocess.run(['git','apply','--index','--whitespace=error'],input=patch,check=True)
          actual=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert sorted(actual)==sorted(paths)
          results=[]
          for c in changes:
              p=pathlib.Path(c['path'])
              assert not p.is_symlink()
              data=p.read_bytes()
              assert blob(data)==c['after'],c['path']
              mode=subprocess.check_output(['git','ls-files','--stage','--',str(p)],text=True).split()[0]
              assert mode=='100644'
              request=urllib.request.Request('https://api.github.com/repos/awalker0878/kingshot-alliance/git/blobs',data=json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['SOURCE_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  remote=json.load(response)
              assert remote['sha']==c['after']
              results.append({'path':str(p),'sha':remote['sha']})
          receipt={'slice':payload['id'],'review_revision':os.environ['GITHUB_SHA'],'objects':results,'commits_or_refs_changed':False}
          pathlib.Path('hardening-preparation-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hardening-preparation-receipt
          path: hardening-preparation-receipt.json
          retention-days: 3
          if-no-files-found: error
