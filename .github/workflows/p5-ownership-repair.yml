name: P5 Ownership Repair

on:
  push:
    branches: [architecture-v2]
    paths: [.github/workflows/p5-ownership-repair.yml]

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture-v2
          fetch-depth: 0

      - name: Repair V2 Operations ownership references
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('app/Contexts')
          replacements = {
              r'App\Contexts\Operations\EventCore\Models\EventObjectiveAssignment': r'App\Contexts\Operations\BattlePlans\Models\EventObjectiveAssignment',
              r'App\Contexts\Operations\EventCore\Models\EventObjective': r'App\Contexts\Operations\BattlePlans\Models\EventObjective',
              r'App\Contexts\Operations\EventCore\Models\EventRosterMember': r'App\Contexts\Operations\Rosters\Models\EventRosterMember',
              r'App\Contexts\Operations\EventCore\Models\EventRoster': r'App\Contexts\Operations\Rosters\Models\EventRoster',
              r'App\Contexts\Operations\EventCore\Models\EventAttendance': r'App\Contexts\Operations\Participation\Models\EventAttendance',
              r'App\Contexts\Operations\EventCore\Models\EventRegistration': r'App\Contexts\Operations\Participation\Models\EventRegistration',
              r'App\Contexts\Operations\EventCore\Models\EventPlayerResult': r'App\Contexts\Operations\Results\Models\EventPlayerResult',
          }
          for path in root.rglob('*.php'):
              text = path.read_text()
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)

          injections = {
              Path('app/Contexts/Operations/BattlePlans/Models/EventObjective.php'):
                  ('use App\\Contexts\\Operations\\BattlePlans\\Enums\\EventObjectiveStatus;\n',
                   'use App\\Contexts\\Operations\\BattlePlans\\Enums\\EventObjectiveStatus;\nuse App\\Contexts\\Operations\\EventCore\\Models\\EventOccurrence;\n'),
              Path('app/Contexts/Operations/BattlePlans/Models/EventObjectiveAssignment.php'):
                  ('use App\\Contexts\\GameWorld\\Models\\Player;\n',
                   'use App\\Contexts\\GameWorld\\Models\\Player;\nuse App\\Contexts\\Operations\\EventCore\\Models\\EventOccurrence;\nuse App\\Contexts\\Operations\\Rosters\\Models\\EventRoster;\n'),
              Path('app/Contexts/Operations/BattlePlans/Queries/EventObjectiveQuery.php'):
                  ('use App\\Contexts\\Operations\\EventCore\\Models\\EventOccurrence;\n',
                   'use App\\Contexts\\Operations\\EventCore\\Models\\EventOccurrence;\nuse App\\Contexts\\Operations\\Participation\\Queries\\EventEligiblePlayerQuery;\n'),
              Path('app/Contexts/Intelligence/EventAnalysis/Queries/EventPlayerIntelligenceQuery.php'):
                  ('use App\\Contexts\\Operations\\Participation\\Enums\\EventRegistrationStatus;\n',
                   'use App\\Contexts\\Operations\\Participation\\Enums\\EventRegistrationStatus;\nuse App\\Contexts\\Operations\\Participation\\Queries\\EventEligiblePlayerQuery;\n'),
          }
          for path, (needle, replacement) in injections.items():
              text = path.read_text()
              if replacement not in text:
                  if needle not in text:
                      raise SystemExit(f'Expected import anchor not found in {path}')
                  path.write_text(text.replace(needle, replacement, 1))
          PY

          if grep -R -n -E 'App\\Contexts\\Operations\\EventCore\\Models\\(EventObjective|EventObjectiveAssignment|EventRoster|EventRosterMember|EventAttendance|EventRegistration|EventPlayerResult)' app/Contexts; then
            echo 'Stale EventCore ownership reference remains.' >&2
            exit 1
          fi

      - name: Commit hard-cut repair and remove maintenance workflow
        shell: bash
        run: |
          rm .github/workflows/p5-ownership-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ARCH-V2: repair P5 Operations ownership references'
          git push origin HEAD:architecture-v2

      - name: Dispatch authoritative verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run architecture-v2-verification.yml --ref architecture-v2
