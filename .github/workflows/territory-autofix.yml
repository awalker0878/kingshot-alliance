name: Territory Planner Autofix

on:
  push:
    branches:
      - feature/alliance-territory-hive-planner

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[territory-format]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/alliance-territory-hive-planner

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Repair non-auto-fixable Territory lint issue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('resources/js/pages/Kingdom/Territory/Editor.vue')
          source = path.read_text()
          old = "if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') { event.preventDefault(); event.shiftKey ? redo() : undo(); return; }"
          new = """if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') {
            event.preventDefault();
            if (event.shiftKey) {
              redo();
            } else {
              undo();
            }
            return;
          }"""
          if old in source:
              path.write_text(source.replace(old, new, 1))
          PY

      - name: Apply repository formatters
        run: |
          composer lint
          npm run lint
          npm run format

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app resources tests scripts package.json
          git commit -m "[territory-format] Apply repository formatters"
          git push origin HEAD:feature/alliance-territory-hive-planner
