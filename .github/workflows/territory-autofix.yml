name: Territory Planner Autofix

on:
  push:
    branches:
      - feature/alliance-territory-hive-planner

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[territory-format]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/alliance-territory-hive-planner

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Repair Territory editor source before formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('resources/js/pages/Kingdom/Territory/Editor.vue')
          source = path.read_text()

          source = source.replace(
              "const importPreview = ref<Record<string, unknown> | null>(null);",
              "const importPreview = ref<Record<string, unknown> | null>(null);\nconst importDocument = ref('');",
              1,
          ) if "const importDocument = ref('');" not in source else source

          source = re.sub(
              r"async function importFile\(event: Event\): Promise<void> \{.*?\n\}\nfunction applyImport\(\): void \{.*?\n\}",
              """async function importFile(event: Event): Promise<void> {
            const input = event.target as HTMLInputElement;
            const file = input.files?.[0];
            if (!file) return;
            busy.value = true;
            try {
              importDocument.value = await file.text();
              const payload = await jsonRequest('/territory/import-preview', 'POST', {
                document: importDocument.value,
              });
              importPreview.value = payload.preview as Record<string, unknown>;
              notice.value = { tone: 'info', message: t('territory.importReady') };
            } catch (error) {
              importDocument.value = '';
              importPreview.value = null;
              notice.value = {
                tone: 'danger',
                message: error instanceof Error ? error.message : t('territory.requestFailed'),
              };
            } finally {
              busy.value = false;
              input.value = '';
            }
          }
          async function applyImport(): Promise<void> {
            if (!importPreview.value || importPreview.value.can_commit !== true || !importDocument.value) return;
            busy.value = true;
            try {
              const payload = await jsonRequest(`/territory/${props.territory.plan.id}/import`, 'POST', {
                expected_revision: revision.value,
                document: importDocument.value,
              });
              const receipt = payload.receipt as { revision: number; status: string };
              revision.value = receipt.revision;
              status.value = receipt.status;
              importPreview.value = null;
              importDocument.value = '';
              history.value = [];
              future.value = [];
              localStorage.removeItem(draftStorageKey);
              notice.value = {
                tone: 'success',
                message: t('territory.imported', { revision: revision.value }),
              };
              router.reload({ only: ['territory'] });
            } catch (error) {
              notice.value = {
                tone: 'danger',
                message: error instanceof Error ? error.message : t('territory.requestFailed'),
              };
            } finally {
              busy.value = false;
            }
          }""",
              source,
              count=1,
              flags=re.S,
          )

          source = re.sub(
              r"if \(\(event\.ctrlKey \|\| event\.metaKey\) && event\.key\.toLowerCase\(\) === 'z'\) \{\s*event\.preventDefault\(\);\s*event\.shiftKey \? redo\(\) : undo\(\);\s*return;\s*\}",
              """if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') {
            event.preventDefault();
            if (event.shiftKey) {
              redo();
            } else {
              undo();
            }
            return;
          }""",
              source,
              count=1,
          )

          path.write_text(source)
          PY

      - name: Apply repository formatters
        run: |
          composer lint
          npm run lint
          npm run format

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app resources tests scripts package.json
          git commit -m "[territory-format] Apply repository formatters"
          git push origin HEAD:feature/alliance-territory-hive-planner
