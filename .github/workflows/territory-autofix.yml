name: Territory Planner Autofix

on:
  push:
    branches:
      - feature/alliance-territory-hive-planner
    paths:
      - .github/workflows/territory-autofix.yml

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[territory-format]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/alliance-territory-hive-planner

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Complete Territory frontend integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          editor = Path('resources/js/pages/Kingdom/Territory/Editor.vue')
          source = editor.read_text()
          if "MarchAnalysisPanel.vue" not in source:
              source = source.replace(
                  "import TerritoryCanvas from '@/features/territory-planner/components/TerritoryCanvas.vue';",
                  "import MarchAnalysisPanel from '@/features/territory-planner/components/MarchAnalysisPanel.vue';\nimport TerritoryCanvas from '@/features/territory-planner/components/TerritoryCanvas.vue';",
                  1,
              )
          if 'governor_options:' not in source:
              source = source.replace(
                  '  revisions: Revision[];\n};',
                  '  revisions: Revision[];\n  governor_options: Record<string, Array<{ id: string; name: string }>>;\n};',
                  1,
              )
          if 'function governorOptionsFor(' not in source:
              source = source.replace(
                  "function editable(object: PlanObject): boolean {\n  return canEdit.value && !allianceFor(object)?.locked;\n}",
                  """function editable(object: PlanObject): boolean {
            return canEdit.value && !allianceFor(object)?.locked;
          }
          function governorOptionsFor(object: PlanObject): Array<{ id: string; name: string }> {
            return props.territory.governor_options[object.alliance_key] ?? [];
          }
          function assignGovernor(object: PlanObject, playerId: string): void {
            if (!editable(object)) return;
            remember();
            object.player_id = playerId || null;
            if (playerId) object.external_player_name = null;
          }
          function assignExternalGovernor(object: PlanObject, name: string): void {
            if (!editable(object)) return;
            remember();
            object.player_id = null;
            object.external_player_name = name || null;
          }
          function selectBearTrap(payload: { allianceKey: string; trapKey: string }): void {
            if (!canEdit.value) return;
            remember();
            const selected = { ...(preferences.value.selected_bear_trap_by_alliance ?? {}) };
            if (payload.trapKey) selected[payload.allianceKey] = payload.trapKey;
            else delete selected[payload.allianceKey];
            preferences.value = {
              ...preferences.value,
              selected_bear_trap_by_alliance: Object.keys(selected).length ? selected : undefined,
            };
          }""",
                  1,
              )
          if "t('territory.governor')" not in source:
              source = source.replace(
                  '                  <th class="p-2 text-start">Y</th>\n                  <th class="p-2 text-start">{{ t(\'territory.state\') }}</th>',
                  '                  <th class="p-2 text-start">Y</th>\n                  <th class="p-2 text-start">{{ t(\'territory.governor\') }}</th>\n                  <th class="p-2 text-start">{{ t(\'territory.state\') }}</th>',
                  1,
              )
              state_cell = '                  <td class="p-2">\n                    <span v-if="objectIssues.get(object.key)?.length" class="text-amber-100">'
              governor_cell = """                  <td class="p-2">
                    <template v-if="object.type === 'governor_city'">
                      <select
                        v-if="governorOptionsFor(object).length"
                        :value="object.player_id ?? ''"
                        class="ks-input min-w-44 px-2 py-1"
                        :disabled="!editable(object)"
                        :aria-label="t('territory.governorAssignment')"
                        @change="assignGovernor(object, ($event.target as HTMLSelectElement).value)"
                      >
                        <option value="">{{ t('territory.unassignedGovernor') }}</option>
                        <option
                          v-for="governor in governorOptionsFor(object)"
                          :key="governor.id"
                          :value="governor.id"
                        >
                          {{ governor.name }}
                        </option>
                      </select>
                      <input
                        v-else
                        :value="object.external_player_name ?? ''"
                        type="text"
                        maxlength="160"
                        class="ks-input min-w-44 px-2 py-1"
                        :disabled="!editable(object)"
                        :placeholder="t('territory.externalGovernorName')"
                        :aria-label="t('territory.externalGovernorName')"
                        @input="assignExternalGovernor(object, ($event.target as HTMLInputElement).value)"
                      />
                    </template>
                    <span v-else aria-hidden="true">—</span>
                  </td>
"""
              source = source.replace(state_cell, governor_cell + state_cell, 1)
          if '<MarchAnalysisPanel' not in source:
              source = source.replace(
                  '        <section class="ks-surface p-4">\n          <p class="ks-kicker">{{ t(\'territory.preferences\') }}</p>',
                  """        <MarchAnalysisPanel
          :alliances="alliances"
          :objects="objects"
          :analysis="analysis"
          :preferences="preferences"
          :can-edit="canEdit"
          @select-trap="selectBearTrap"
        />
        <section class="ks-surface p-4">
          <p class="ks-kicker">{{ t('territory.preferences') }}</p>""",
                  1,
              )
          editor.write_text(source)

          manage = Path('resources/js/pages/Operations/Events/Manage.vue')
          source = manage.read_text()
          source = re.sub(
              r"\ntype TerritoryRevisionOption = \{.*?\n\};\ntype TerritoryAttachment = \{.*?\n\};\ntype TerritoryPlanningOperations = \{.*?\n\};\n",
              '\n', source, count=1, flags=re.S,
          )
          source = re.sub(
              r"\nconst territorySelections = ref<Record<string, string>>\(.*?\n\}\n(?=const editingPhaseId)",
              '\n', source, count=1, flags=re.S,
          )
          source = re.sub(
              r"\n      <section\n        v-if=\"territoryPlanning\.supported\"\n        id=\"territory-planning\".*?</section>\n",
              '\n', source, count=1, flags=re.S,
          )
          if "EventTerritoryPositioning.vue" not in source:
              source = source.replace(
                  "import ConfirmActionDialog from '@/components/ui/ConfirmActionDialog.vue';",
                  "import ConfirmActionDialog from '@/components/ui/ConfirmActionDialog.vue';\nimport EventTerritoryPositioning from '@/features/territory-planner/components/EventTerritoryPositioning.vue';",
                  1,
              )
          if 'type TerritoryPlanningOperations =' not in source:
              source = source.replace(
                  '\nconst props = defineProps<{',
                  """
type TerritoryPlanningOperations = {
  supported: boolean;
  availableRevisions: Array<{
    id: string;
    planId: string;
    planName: string;
    revisionNumber: number;
    mapDatasetId: string;
    mapDatasetChecksum: string;
    publishedAt: string | null;
  }>;
  attachments: Array<{
    id: string;
    occurrenceId: string;
    purpose: string;
    revisionId: string;
    planId: string;
    planName: string;
    revisionNumber: number;
    publishedAt: string | null;
  }>;
};

const props = defineProps<{""",
                  1,
              )
          if 'territoryPlanning: TerritoryPlanningOperations;' not in source:
              source = source.replace(
                  '  playerIntelligence: PlayerIntelligence[];\n  reminderAudiences: string[];',
                  '  playerIntelligence: PlayerIntelligence[];\n  territoryPlanning: TerritoryPlanningOperations;\n  reminderAudiences: string[];',
                  1,
              )
          if 'href="#territory-positioning"' not in source:
              source = source.replace(
                  '        <a href="#reminders" class="ks-tab">{{ t(\'events.manage.reminders\') }}</a>',
                  """        <a v-if="territoryPlanning.supported" href="#territory-positioning" class="ks-tab">{{
          t('territory.eventPlanningTitle')
        }}</a>
        <a href="#reminders" class="ks-tab">{{ t('events.manage.reminders') }}</a>""",
                  1,
              )
          if '<EventTerritoryPositioning' not in source:
              source = source.replace(
                  '      <div\n        id="schedule"',
                  """      <EventTerritoryPositioning
        v-if="territoryPlanning.supported"
        class="mt-5"
        :occurrences="event.occurrences"
        :planning="territoryPlanning"
      />

      <div
        id="schedule""",
                  1,
              )
          manage.write_text(source)
          PY

      - name: Apply repository formatters
        run: |
          composer lint
          npm run lint
          npm run format

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app resources tests scripts package.json
          git commit -m "[territory-format] Finalize Territory frontend integration"
          git push origin HEAD:feature/alliance-territory-hive-planner
