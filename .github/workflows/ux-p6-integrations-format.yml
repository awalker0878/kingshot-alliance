name: UX P6 Integrations formatter

on:
  push:
    branches:
      - ux/ux-001-experience-localization
    paths:
      - .ux-p6-integrations-format-trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out UX branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ux/ux-001-experience-localization

      - name: Register integrations catalogue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('resources/js/localization/messages/index.ts')
          text = p.read_text()
          text = text.replace("import { eventDetailMessages } from './event-detail';\n", "import { eventDetailMessages } from './event-detail';\nimport { integrationMessages } from './integration-experience';\n", 1)
          text = text.replace("type ContentMessageTree = (typeof contentMessages)['en'];\n", "type ContentMessageTree = (typeof contentMessages)['en'];\ntype IntegrationMessageTree = (typeof integrationMessages)['en'];\n", 1)
          text = text.replace("  ContentMessageTree &\n  AccountExperienceMessageTree &", "  ContentMessageTree &\n  IntegrationMessageTree &\n  AccountExperienceMessageTree &", 1)
          text = text.replace("    ...contentMessages[locale],\n    ...accountExperienceMessages[locale],", "    ...contentMessages[locale],\n    ...integrationMessages[locale],\n    ...accountExperienceMessages[locale],", 1)
          p.write_text(text)
          PY

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply pinned Prettier
        run: npx prettier --write resources/js/pages/Alliance/Integrations/Manage.vue resources/js/localization/messages/integration-experience.ts resources/js/localization/messages/index.ts

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Apply Pint
        run: vendor/bin/pint app/Domain/Integrations/Http/Controllers/IntegrationManagementController.php tests/Architecture/IntegrationExperienceTest.php

      - name: Commit canonical integration formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/Alliance/Integrations/Manage.vue resources/js/localization/messages/integration-experience.ts resources/js/localization/messages/index.ts app/Domain/Integrations/Http/Controllers/IntegrationManagementController.php tests/Architecture/IntegrationExperienceTest.php
          if ! git diff --cached --quiet; then
            git commit -m "Wire and format UX-P6 integrations experience"
            git push origin HEAD:ux/ux-001-experience-localization
          fi
