name: KingdomMaps Format Once

on:
  push:
    branches:
      - kingdommaps-research-evidence-expansion

permissions:
  contents: write

concurrency:
  group: kingdom-maps-format-once
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: kingdommaps-research-evidence-expansion

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply repository formatters
        run: |
          vendor/bin/pint \
            app/Contexts/GameWorld/KingdomMaps/Services/KingdomMapReleaseDiff.php \
            app/Contexts/GameWorld/KingdomMaps/Services/KingdomMapSourceVerifier.php \
            bootstrap/providers.php
          npx prettier --write \
            resources/data/kingdom-maps/artifacts/kingshot-facilities-2026-09-06.json \
            resources/data/kingdom-maps/kingshot-evidence-backed-2026-09-06-v2.json \
            resources/js/features/territory-planner/engine/geometry.ts

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/Contexts/GameWorld/KingdomMaps/Services/KingdomMapReleaseDiff.php \
            app/Contexts/GameWorld/KingdomMaps/Services/KingdomMapSourceVerifier.php \
            bootstrap/providers.php \
            resources/data/kingdom-maps/artifacts/kingshot-facilities-2026-09-06.json \
            resources/data/kingdom-maps/kingshot-evidence-backed-2026-09-06-v2.json \
            resources/js/features/territory-planner/engine/geometry.ts
          git commit -m 'Format KingdomMaps V2 implementation'
          git push origin HEAD:kingdommaps-research-evidence-expansion
