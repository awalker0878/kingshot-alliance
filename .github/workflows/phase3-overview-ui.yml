name: Phase 3 overview UI

on:
  push:
    branches:
      - agent/phase-3-events-and-rallies
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase3-overview-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/phase-3-events-and-rallies
          fetch-depth: 0
      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Replace Phase 2 event placeholder
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('resources/js/pages/Alliance/Overview.vue')
          lines = path.read_text().splitlines()

          if any('canManageEvents: boolean;' in line for line in lines):
              raise SystemExit('Overview already contains Phase 3 event props.')

          can_manage = [i for i, line in enumerate(lines) if line.strip() == 'canManage: boolean;']
          activities = [i for i, line in enumerate(lines) if line.strip() == 'upcomingActivities: unknown[];']
          phase = [i for i, line in enumerate(lines) if line.strip() == 'upcomingActivitiesPhase: number;']
          content_link = [i for i, line in enumerate(lines) if 'href="/alliance/content">Content hub</Link>' in line]
          public_href = [i for i, line in enumerate(lines) if ':href="alliance.publicUrl"' in line]
          activity_heading = [i for i, line in enumerate(lines) if '>Upcoming activities</h2>' in line]

          checks = {
              'contentHub canManage': can_manage,
              'upcoming activities type': activities,
              'Phase 2 marker': phase,
              'content navigation link': content_link,
              'public page link': public_href,
              'upcoming activities heading': activity_heading,
          }
          for label, matches in checks.items():
              if len(matches) != 1:
                  raise SystemExit(f'Expected one {label}; found {len(matches)}')

          lines.insert(can_manage[0] + 1, '    canManageEvents: boolean;')

          activity_index = next(i for i, line in enumerate(lines) if line.strip() == 'upcomingActivities: unknown[];')
          lines[activity_index:activity_index + 2] = [
              '    upcomingActivities: Array<{',
              '      id: string;',
              '      title: string;',
              '      startsAt: string;',
              '      allianceTimezone: string;',
              '    }>;',
          ]

          content_index = next(i for i, line in enumerate(lines) if 'href="/alliance/content">Content hub</Link>' in line)
          lines.insert(content_index + 1, '        <Link class="text-cyan-300 hover:text-cyan-200" href="/alliance/events">Events</Link>')

          public_href_index = next(i for i, line in enumerate(lines) if ':href="alliance.publicUrl"' in line)
          public_anchor_start = public_href_index
          while public_anchor_start >= 0 and lines[public_anchor_start].strip() != '<a':
              public_anchor_start -= 1
          if public_anchor_start < 0:
              raise SystemExit('Could not locate public page anchor start.')
          manage_event_lines = [
              '        <Link',
              '          v-if="contentHub.canManageEvents"',
              '          class="text-cyan-300 hover:text-cyan-200"',
              '          href="/alliance/events/manage"',
              '          >Coordinate events</Link',
              '        >',
          ]
          lines[public_anchor_start:public_anchor_start] = manage_event_lines

          heading_index = next(i for i, line in enumerate(lines) if '>Upcoming activities</h2>' in line)
          block_start = heading_index - 1
          if 'rounded-2xl border border-slate-800 bg-slate-900/70 p-6' not in lines[block_start]:
              raise SystemExit('Unexpected upcoming activities block start.')
          block_end = None
          for i in range(heading_index + 1, len(lines)):
              if lines[i] == '      </div>':
                  block_end = i
                  break
          if block_end is None:
              raise SystemExit('Could not locate upcoming activities block end.')

          new_block = '''      <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6">
        <div class="flex items-center justify-between gap-3">
          <h2 class="text-xl font-semibold">Upcoming activities</h2>
          <Link class="text-sm font-semibold text-cyan-300 hover:text-cyan-200" href="/alliance/events">
            View all
          </Link>
        </div>
        <div v-if="contentHub.upcomingActivities.length" class="mt-4 space-y-3">
          <article
            v-for="activity in contentHub.upcomingActivities"
            :key="activity.id"
            class="rounded-xl border border-slate-800 p-4"
          >
            <h3 class="font-semibold">
              <Link class="hover:text-cyan-200" :href="`/alliance/events/${activity.id}`">
                {{ activity.title }}
              </Link>
            </h3>
            <p class="mt-1 text-sm text-slate-400">
              {{
                new Intl.DateTimeFormat(undefined, {
                  year: 'numeric',
                  month: 'short',
                  day: 'numeric',
                  hour: 'numeric',
                  minute: '2-digit',
                  timeZone: activity.allianceTimezone,
                  timeZoneName: 'short',
                }).format(new Date(activity.startsAt))
              }}
            </p>
          </article>
        </div>
        <p v-else class="mt-4 text-sm text-slate-500">No scheduled events in the next 30 days.</p>
      </div>'''.splitlines()
          lines[block_start:block_end + 1] = new_block

          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Format overview page
        run: npx prettier --write resources/js/pages/Alliance/Overview.vue
      - name: Commit overview integration
        shell: bash
        run: |
          set -euo pipefail
          git add resources/js/pages/Alliance/Overview.vue
          if git diff --cached --quiet; then
            echo 'No overview changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Show upcoming events on alliance overview'
          git push origin HEAD:agent/phase-3-events-and-rallies
