name: Gift Code Prettier Probe

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: gift-code-researched-source-rollout-completion
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply Prettier
        run: npx prettier --write resources/js/pages/Platform/GiftCodes/Sources.vue resources/js/localization/messages/platform/en.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet -- resources/js/pages/Platform/GiftCodes/Sources.vue resources/js/localization/messages/platform/en.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add resources/js/pages/Platform/GiftCodes/Sources.vue resources/js/localization/messages/platform/en.ts
          git commit -m "Format localized Gift Code source management"
          git push origin HEAD:gift-code-researched-source-rollout-completion
