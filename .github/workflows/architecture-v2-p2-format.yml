name: Architecture V2 P2 Format

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/architecture-v2-p2-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out architecture-v2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format P2 files
        run: >-
          vendor/bin/pint
          app/Contexts/Accounts/Actions/RegisterUser.php
          app/Contexts/Accounts/Http/Controllers/AuthenticatedSessionController.php
          app/Contexts/Accounts/Http/Controllers/ConfirmPasswordController.php
          app/Contexts/Accounts/Http/Controllers/ProfileController.php
          app/Contexts/Accounts/Http/Controllers/RegistrationController.php
          app/Contexts/Accounts/Http/Controllers/ResetPasswordController.php
          app/Contexts/Accounts/Http/Controllers/TwoFactorChallengeController.php
          app/Contexts/Accounts/Http/Controllers/VerifyEmailController.php
          app/Contexts/Accounts/Models/User.php
          app/Contexts/Accounts/Services/TwoFactorManager.php
          app/Contexts/GameWorld/Models/Player.php
          bootstrap/app.php
          tests/Feature/Accounts/AccountLifecycleTest.php
          tests/Feature/Accounts/AuthenticationTest.php
          tests/Feature/GameWorld/PlayerContextSecurityTest.php

      - name: Remove one-off formatter
        run: rm -f .github/workflows/architecture-v2-p2-format.yml

      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'style(arch-v2): format P2 foundation'
          git push origin HEAD:architecture-v2
