name: CV4 Shell Hard Cutover Cleanup

on:
  push:
    branches:
      - agent/context-v4-convergence
    paths:
      - .github/workflows/cv4-shell-hard-cutover.yml

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out convergence branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/context-v4-convergence
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: |
          npm ci
          composer install --no-interaction --no-progress --prefer-dist

      - name: Remove legacy AppLayout contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for file in Path('resources/js/pages').rglob('*.vue'):
              text = file.read_text()
              if '<AppLayout' not in text:
                  continue

              def clean(match):
                  tag = match.group(0)
                  tag = re.sub(r'\s+:user="user"', '', tag)
                  tag = re.sub(r'\s+:has-player-alliance="[^"]*"', '', tag)
                  tag = re.sub(r'\s+:player-alliance-name="[^"]*"', '', tag)
                  return tag

              updated = re.sub(r'<AppLayout\b[\s\S]*?>', clean, text)
              if updated != text:
                  file.write_text(updated)
          PY

      - name: Delete replaced contracts and failed migration tooling
        run: |
          rm -f resources/js/types/player-context.ts
          rm -f app/Contexts/GameWorld/Players/Services/PlayerSwitchRouteResolver.php
          rm -f tools/cv4-p1-p4.mjs
          rm -f .github/workflows/cv4-p1-p4-migrate.yml
          rm -f .github/workflows/cv4-shell-hard-cutover.yml

      - name: Format migrated source
        run: |
          vendor/bin/pint --parallel
          npx prettier --write "resources/js/**/*.{ts,vue}"

      - name: Fail if replaced source contracts remain
        shell: bash
        run: |
          ! grep -R --line-number --fixed-string 'SharedPlayerContext' resources/js app
          ! grep -R --line-number --fixed-string 'playerContext' resources/js app
          ! grep -R --line-number --fixed-string 'has-player-alliance' resources/js/pages
          ! grep -R --line-number --fixed-string 'player-alliance-name' resources/js/pages
          ! grep -R --line-number --fixed-string 'PlayerSwitchRouteResolver' app

      - name: Commit shell cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete canonical game context shell cutover"
          git push origin HEAD:agent/context-v4-convergence
