name: Progression Final Integrity Apply

on:
  push:
    branches:
      - feature/progression-goal-planner-calculators-main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Reconcile product contract first
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'missing docs anchor in {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1))

          contract = 'docs/product/progression-goal-planner-calculators.md'
          patch(
              contract,
              'Status: Implementation contract — 2026-08-26',
              'Status: Implementation contract — 2026-08-27',
          )
          absence = 'When no factual progression release is published, the Planner renders an explicit read-only `no_dataset` state, performs no observation retrieval or calculation, and never fabricates an empty factual dataset.'
          patch(
              contract,
              absence,
              absence + ' The `no_dataset` state is reserved for true absence of a published release. Invalid JSON, unsupported schema, unreadable or missing required release files, checksum/integrity failures, or other published-dataset validation errors remain hard failures and must not be relabelled as dataset absence.',
          )

          ledger = 'docs/product/progression-goal-planner-calculators-delivery-ledger.md'
          row = '| PG-05C | No-dataset and prerequisite-boundary UX are explicit and non-speculative | In progress | No dataset renders a read-only `no_dataset` state without observation retrieval; direct source-text prerequisites remain `unknown` unless canonical identities support deterministic resolution |'
          patch(
              ledger,
              row,
              row + '\n| PG-05D | Dataset absence is distinguished from dataset integrity failure | In progress | `no_dataset` is emitted only for true release absence; invalid/corrupt published releases remain hard failures and are covered by permanent architecture tests |',
          )
          section = '### PG-05C — no dataset and prerequisite identity boundary\n\nIf no factual progression release is published, the Planner renders an explicit no-dataset state and stops before Alliance/Roster observation retrieval or calculation. It does not synthesize an empty release. Research prerequisites in the current release are source text rather than canonical edge identities; the Planner therefore displays those direct facts and keeps observed satisfaction `unknown`. Transitive prerequisite traversal is not inferred from names/prose and becomes eligible only when a future immutable dataset publishes canonical prerequisite identities/edges.\n'
          patch(
              ledger,
              section,
              section + '\n### PG-05D — dataset absence versus integrity failure\n\nThe read model may render `no_dataset` only when no factual progression release exists. A published release that cannot be read or validated is an integrity failure, not an empty catalogue: invalid JSON, unsupported schema, missing required files, checksum mismatches and other release-validation failures remain hard failures. This prevents corruption from being presented as ordinary product unavailability.\n',
          )
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product/progression-goal-planner-calculators.md docs/product/progression-goal-planner-calculators-delivery-ledger.md
          git commit -m 'docs: distinguish progression dataset absence from corruption'

      - name: Implement documented integrity boundary
        run: |
          mkdir -p app/Contexts/GameWorld/Progression/Exceptions
          cat > app/Contexts/GameWorld/Progression/Exceptions/NoProgressionDatasetPublished.php <<'PHP'
          <?php

          declare(strict_types=1);

          namespace App\Contexts\GameWorld\Progression\Exceptions;

          use RuntimeException;

          final class NoProgressionDatasetPublished extends RuntimeException
          {
          }
          PHP

          python - <<'PY'
          from pathlib import Path

          def patch(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'missing code anchor in {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1))

          query = 'app/Contexts/GameWorld/Progression/Queries/ProgressionDatasetQuery.php'
          patch(
              query,
              'namespace App\\Contexts\\GameWorld\\Progression\\Queries;\n\nuse App\\Contexts\\GameWorld\\Progression\\ValueObjects\\ProgressionDataset;',
              'namespace App\\Contexts\\GameWorld\\Progression\\Queries;\n\nuse App\\Contexts\\GameWorld\\Progression\\Exceptions\\NoProgressionDatasetPublished;\nuse App\\Contexts\\GameWorld\\Progression\\ValueObjects\\ProgressionDataset;',
          )
          patch(
              query,
              "throw new RuntimeException('No factual progression dataset is published.');",
              "throw new NoProgressionDatasetPublished('No factual progression dataset is published.');",
          )

          controller = 'app/ReadModels/Progression/Http/Controllers/ProgressionPlannerController.php'
          patch(
              controller,
              'use App\\Contexts\\GameWorld\\Progression\\Queries\\ProgressionDatasetQuery;',
              'use App\\Contexts\\GameWorld\\Progression\\Exceptions\\NoProgressionDatasetPublished;\nuse App\\Contexts\\GameWorld\\Progression\\Queries\\ProgressionDatasetQuery;',
          )
          patch(controller, 'use RuntimeException;\n', '')
          patch(controller, 'catch (RuntimeException)', 'catch (NoProgressionDatasetPublished)')
          PY

          cat > tests/v3/Architecture/ProgressionDatasetAbsenceBoundaryV3Test.php <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Tests\v3\Architecture;

          use Tests\v3\TestCase;

          final class ProgressionDatasetAbsenceBoundaryV3Test extends TestCase
          {
              public function test_no_dataset_state_is_reserved_for_true_release_absence(): void
              {
                  $query = file_get_contents(base_path('app/Contexts/GameWorld/Progression/Queries/ProgressionDatasetQuery.php'));
                  $controller = file_get_contents(base_path('app/ReadModels/Progression/Http/Controllers/ProgressionPlannerController.php'));
                  $planner = file_get_contents(base_path('resources/js/pages/Kingdom/Progression/Planner.vue'));

                  self::assertIsString($query);
                  self::assertIsString($controller);
                  self::assertIsString($planner);

                  self::assertStringContainsString('NoProgressionDatasetPublished', $query);
                  self::assertStringContainsString("throw new NoProgressionDatasetPublished('No factual progression dataset is published.');", $query);
                  self::assertStringContainsString('catch (NoProgressionDatasetPublished)', $controller);
                  self::assertStringNotContainsString('catch (RuntimeException)', $controller);
                  self::assertStringContainsString("'dataset' => null", $controller);
                  self::assertStringContainsString('data-testid="planner-no-dataset"', $planner);

                  $absenceCatch = strpos($controller, 'catch (NoProgressionDatasetPublished)');
                  $scopeLookup = strpos($controller, '$scope = $allianceScopes->findForPlayer');
                  self::assertIsInt($absenceCatch);
                  self::assertIsInt($scopeLookup);
                  self::assertLessThan($scopeLookup, $absenceCatch);
              }

              public function test_published_dataset_integrity_failures_are_not_collapsed_into_absence(): void
              {
                  $query = file_get_contents(base_path('app/Contexts/GameWorld/Progression/Queries/ProgressionDatasetQuery.php'));
                  self::assertIsString($query);

                  self::assertStringContainsString('Factual progression dataset does not satisfy a supported schema.', $query);
                  self::assertStringContainsString('Progression schema v2 release omitted required file:', $query);
                  self::assertStringContainsString('Factual progression dataset contains invalid JSON:', $query);
              }
          }
          PHP

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Verify integrity boundary
        run: |
          vendor/bin/pint app/Contexts/GameWorld/Progression/Exceptions/NoProgressionDatasetPublished.php app/Contexts/GameWorld/Progression/Queries/ProgressionDatasetQuery.php app/ReadModels/Progression/Http/Controllers/ProgressionPlannerController.php tests/v3/Architecture/ProgressionDatasetAbsenceBoundaryV3Test.php
          php artisan test tests/v3/Architecture/ProgressionDatasetAbsenceBoundaryV3Test.php tests/v3/Architecture/ProgressionPlannerArchitectureV3Test.php tests/v3/Contexts/GameWorld/Progression tests/v3/ReadModels/Progression
          vendor/bin/phpstan analyse app/Contexts/GameWorld/Progression/Exceptions/NoProgressionDatasetPublished.php app/Contexts/GameWorld/Progression/Queries/ProgressionDatasetQuery.php app/ReadModels/Progression/Http/Controllers/ProgressionPlannerController.php app/ReadModels/Progression/Queries/ProgressionPlannerQuery.php --no-progress

      - name: Commit implementation and remove applicator
        run: |
          git rm .github/workflows/progression-final-contract-apply.yml
          git add app/Contexts/GameWorld/Progression/Exceptions/NoProgressionDatasetPublished.php app/Contexts/GameWorld/Progression/Queries/ProgressionDatasetQuery.php app/ReadModels/Progression/Http/Controllers/ProgressionPlannerController.php tests/v3/Architecture/ProgressionDatasetAbsenceBoundaryV3Test.php
          git commit -m 'fix: distinguish progression dataset absence from corruption'
          git push
