name: Architecture V2 P5 Format

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/architecture-v2-p5-format.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Correct EventCore controller namespaces and format P5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('EventManagementController.php', 'EventOperationsController.php'):
              path = Path('app/Contexts/Operations/EventCore/Http/Controllers') / name
              source = path.read_text()
              source = source.replace(
                  'namespace App\\Contexts\\Platform\\EventAdministration\\Http\\Controllers;',
                  'namespace App\\Contexts\\Operations\\EventCore\\Http\\Controllers;',
                  1,
              )
              path.write_text(source)
          PY

          vendor/bin/pint \
            app/Contexts/Operations \
            app/Contexts/Intelligence/EventAnalysis \
            app/Contexts/Communications/Reminders \
            app/Contexts/Platform/EventAdministration \
            app/ReadModels/EventCalendar \
            app/ReadModels/EventHistory \
            tests/Architecture/ArchitectureV2OperationsTest.php \
            tests/Feature/Events \
            tests/Feature/KingPerks \
            tests/Feature/Integrations \
            tests/Feature/Contributions \
            routes/event-history.php \
            routes/king-perks.php \
            routes/platform.php \
            routes/web.php

          php -l app/Contexts/Operations/EventCore/Http/Controllers/EventManagementController.php
          php -l app/Contexts/Operations/EventCore/Http/Controllers/EventOperationsController.php

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'architecture-v2-bot'
          git config user.email 'architecture-v2-bot@users.noreply.github.com'
          git add app tests routes
          if git diff --cached --quiet; then
            echo 'No formatting changes.'
            exit 0
          fi
          git commit -m 'style(arch-v2): normalize P5 operations cut'
          git push origin HEAD:architecture-v2
