name: Format Phase 1

on:
  push:
    branches:
      - agent/phase-1-identity-tenancy
    paths:
      - 'app/**'
      - 'tests/**'
      - 'resources/**'
      - '.github/workflows/format-phase1.yml'

permissions:
  contents: write

concurrency:
  group: format-phase-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Phase 1 sources
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/phase-1-identity-tenancy

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Format sources
        run: |
          ./vendor/bin/pint
          npx prettier --write resources/

      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app tests resources
          git commit -m 'Format Phase 1 sources'
          git push origin HEAD:agent/phase-1-identity-tenancy
