name: Generate lock files

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: generate-lockfiles-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_sqlite, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Recover or regenerate Composer lock
        env:
          GH_TOKEN: ${{ github.token }}
          COMPOSER_ARTIFACT_ID: '8973953986'
          COMPOSER_ARTIFACT_SHA256: '9431c593cf957e2e2f629a99f666bd07f925cfb5cd22233bebe0a732702106df'
          COMPOSER_LOCK_SHA256: '2f69257d66854ba454817d317f81cba91c15332f7d225ebc63fbe9c4818e91be'
        shell: bash
        run: |
          set -euo pipefail
          artifact_zip="${RUNNER_TEMP}/composer-lock.zip"
          artifact_dir="${RUNNER_TEMP}/composer-lock"

          if gh api \
            --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${COMPOSER_ARTIFACT_ID}/zip" \
            > "$artifact_zip"; then
            printf '%s  %s\n' "$COMPOSER_ARTIFACT_SHA256" "$artifact_zip" | sha256sum --check --strict
            mkdir -p "$artifact_dir"
            unzip -q "$artifact_zip" -d "$artifact_dir"
            printf '%s  %s\n' "$COMPOSER_LOCK_SHA256" "$artifact_dir/composer.lock" | sha256sum --check --strict
            cp "$artifact_dir/composer.lock" composer.lock
            echo "Recovered the verified Composer lock artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f "$artifact_zip"
            composer update \
              --no-install \
              --no-interaction \
              --no-progress \
              --no-scripts
            echo "The verified artifact was unavailable; Composer regenerated the lock from reviewed constraints." >> "$GITHUB_STEP_SUMMARY"
          fi

          composer validate --strict

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Generate npm lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lock files
        shell: bash
        run: |
          set -euo pipefail
          git add composer.lock package-lock.json

          if git diff --cached --quiet -- composer.lock package-lock.json; then
            echo "Lock files are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add dependency lock files"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

          echo "The lockfile commit updates this pull request. A repository-owner commit that removes this temporary workflow will then trigger the final validation suite on the locked head." >> "$GITHUB_STEP_SUMMARY"
