name: Accounts Closeout Prettier

on:
  push:
    branches:
      - chatgpt/accounts-security-closeout

permissions:
  contents: write

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Format profile
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npx prettier --write resources/js/pages/Accounts/Governor/Profile.vue
          git diff --check

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/Accounts/Governor/Profile.vue
          git commit -m "Format localized account profile"
          git push origin HEAD:chatgpt/accounts-security-closeout
