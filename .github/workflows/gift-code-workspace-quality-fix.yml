name: Gift Code Workspace Quality Fix

on:
  push:
    branches:
      - gift-code-redemption-workspace

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gift-code-redemption-workspace

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Apply Pint to workspace PHP
        run: >-
          vendor/bin/pint
          app/Contexts/GameWorld/GiftCodes/Actions/CreateGiftCodeRedemptionSession.php
          app/Contexts/GameWorld/GiftCodes/Actions/QueueDueGiftCodeReminders.php
          app/Contexts/GameWorld/GiftCodes/Actions/QueueGiftCodeWorkspaceNotifications.php
          app/Contexts/GameWorld/GiftCodes/Actions/RebuildGiftCodeContributorProjections.php
          app/Contexts/GameWorld/GiftCodes/Http/Controllers/GiftCodeWorkspaceController.php
          app/Contexts/GameWorld/GiftCodes/Queries/GiftCodeWorkspaceQuery.php
          app/ReadModels/GiftCodes/Queries/GiftCodeAllianceCoverageQuery.php
          tests/v3/Contexts/GameWorld/GiftCodes/GiftCodeWorkspaceV3Test.php

      - name: Add workspace action-receipt messages
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('resources/js/localization/messages/core/en.ts')
          text = path.read_text()
          anchor = "    'gift-code-result-recorded': 'Governor Gift Code result recorded.',\n"
          addition = """    'gift-code-personal-state-updated': 'Personal Gift Code state updated.',
    'gift-code-session-created': 'Gift Code redemption run created.',
    'gift-code-session-abandoned': 'Gift Code redemption run abandoned.',
    'gift-code-session-item-prepared': 'Official Gift Code handoff prepared for this Governor.',
    'gift-code-session-item-recorded': 'Governor Gift Code result recorded and the run advanced.',
    'gift-code-session-item-skipped': 'Gift Code redemption item skipped for now.',
"""
          if 'gift-code-session-created' not in text:
              if anchor not in text:
                  raise SystemExit('Gift Code receipt anchor not found')
              text = text.replace(anchor, anchor + addition, 1)
          path.write_text(text)
          PY

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Format receipt catalogue
        run: npx prettier --write resources/js/localization/messages/core/en.ts

      - name: Commit quality fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/Contexts/GameWorld/GiftCodes app/ReadModels/GiftCodes/Queries/GiftCodeAllianceCoverageQuery.php tests/v3/Contexts/GameWorld/GiftCodes/GiftCodeWorkspaceV3Test.php resources/js/localization/messages/core/en.ts
          git commit -m "style: satisfy Gift Code workspace quality gates"
          git push origin HEAD:gift-code-redemption-workspace
