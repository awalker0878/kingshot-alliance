name: Gift Code Workspace Quality Fix

on:
  push:
    branches:
      - gift-code-redemption-workspace

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gift-code-redemption-workspace

      - name: Add Gift Code workspace action-receipt messages
        shell: bash
        run: |
          file=resources/js/localization/messages/core/en.ts
          if grep -q "gift-code-session-created" "$file"; then
            exit 0
          fi
          grep -q "gift-code-result-recorded" "$file"
          sed -i "/'gift-code-result-recorded'/a\    'gift-code-session-item-skipped': 'Gift Code redemption item skipped for now.'," "$file"
          sed -i "/'gift-code-result-recorded'/a\    'gift-code-session-item-recorded': 'Gift Code result saved and the run advanced.'," "$file"
          sed -i "/'gift-code-result-recorded'/a\    'gift-code-session-item-prepared': 'Gift Code handoff prepared.'," "$file"
          sed -i "/'gift-code-result-recorded'/a\    'gift-code-session-abandoned': 'Gift Code redemption run abandoned.'," "$file"
          sed -i "/'gift-code-result-recorded'/a\    'gift-code-session-created': 'Gift Code redemption run created.'," "$file"
          sed -i "/'gift-code-result-recorded'/a\    'gift-code-personal-state-updated': 'Personal Gift Code state updated.'," "$file"

      - name: Commit receipt messages
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add resources/js/localization/messages/core/en.ts
          git commit -m "fix: add Gift Code workspace receipt messages"
          git push origin HEAD:gift-code-redemption-workspace
