name: Gift Code Workspace Quality Fix

on:
  push:
    branches:
      - gift-code-redemption-workspace

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gift-code-redemption-workspace

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Apply Pint to workspace PHP
        run: vendor/bin/pint app/Contexts/GameWorld/GiftCodes/Actions/CreateGiftCodeRedemptionSession.php app/Contexts/GameWorld/GiftCodes/Actions/QueueDueGiftCodeReminders.php app/Contexts/GameWorld/GiftCodes/Actions/QueueGiftCodeWorkspaceNotifications.php app/Contexts/GameWorld/GiftCodes/Actions/RebuildGiftCodeContributorProjections.php app/Contexts/GameWorld/GiftCodes/Http/Controllers/GiftCodeWorkspaceController.php app/Contexts/GameWorld/GiftCodes/Queries/GiftCodeWorkspaceQuery.php app/ReadModels/GiftCodes/Queries/GiftCodeAllianceCoverageQuery.php tests/v3/Contexts/GameWorld/GiftCodes/GiftCodeWorkspaceV3Test.php

      - name: Commit Pint output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/Contexts/GameWorld/GiftCodes app/ReadModels/GiftCodes/Queries/GiftCodeAllianceCoverageQuery.php tests/v3/Contexts/GameWorld/GiftCodes/GiftCodeWorkspaceV3Test.php
          git commit -m "style: apply Pint to Gift Code workspace"
          git push origin HEAD:gift-code-redemption-workspace
