name: Governor Progression Boundary Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feature/screenshot-intake-governor-progression-main'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kingshot_test
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_test
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PULSE_ENABLED: false
    steps:
      - name: Check out Governor Progression branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/screenshot-intake-governor-progression-main
          fetch-depth: 0

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, gd, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --no-audit --no-fund

      - name: Add Governor Progression action receipt
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('resources/js/localization/messages/core/en.ts')
          text = path.read_text()
          key = "    'governor-progression-evidence-updated': 'Governor progression evidence updated.',\n"
          if key not in text:
              marker = "    'gift-code-issue-reported': 'Gift Code issue reported and status updated.',\n"
              if marker not in text:
                  raise SystemExit('Receipt insertion marker not found')
              text = text.replace(marker, marker + key, 1)
          path.write_text(text)
          PY
          npx prettier --write resources/js/localization/messages/core/en.ts

      - name: Verify repaired contracts
        run: |
          php artisan migrate:fresh --force
          vendor/bin/pint --test app/Contexts/Intelligence/Evidence app/Contexts/Intelligence/Roster tests/v3/Contexts/Intelligence/Evidence/GovernorProgressionEvidenceReferenceBoundaryV3Test.php tests/v3/Contexts/GameWorld/KingdomTransfers/TransferEvidenceBoundaryV3Test.php
          vendor/bin/phpstan analyse --memory-limit=1G app/Contexts/Intelligence/Evidence app/Contexts/Intelligence/Roster
          vendor/bin/phpunit --configuration phpunit.xml tests/v3/Contexts/Intelligence/Evidence/GovernorProgressionEvidenceReferenceBoundaryV3Test.php tests/v3/Contexts/GameWorld/KingdomTransfers/TransferEvidenceBoundaryV3Test.php
          node scripts/check-action-receipt-coverage.mjs
          npx prettier --check resources/js/localization/messages/core/en.ts

      - name: Commit receipt repair
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/js/localization/messages/core/en.ts
          git commit -m 'Add Governor Progression evidence action receipt'
          git push origin HEAD:feature/screenshot-intake-governor-progression-main
