name: Clean Domain Boundaries

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  clean:
    if: github.head_ref == 'agent/app-architecture-alignment' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/app-architecture-alignment
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Apply boundary cleanup
        run: python3 .github/scripts/clean_domain_boundaries.py
      - name: Complete explicit boundary repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          profile = Path('app/Domain/Content/Actions/UpdateAlliancePublicProfile.php')
          text = profile.read_text().replace(
              "$this->outbox->record('alliance.public_profile_updated', $locked, $locked, [",
              "$this->outbox->record('alliance.public_profile_updated', (string) $locked->id, $locked, [",
          )
          profile.write_text(text)

          controller = Path('app/Domain/Recruitment/Http/Controllers/RecruitmentCandidateController.php')
          text = controller.read_text().replace("            'membershipInvitation',\n", '')
          controller.write_text(text)

          # Preserve the complete Phase 1 Alliance aggregate while removing only Content-owned inverses.
          Path('app/Domain/Alliances/Models/Alliance.php').write_text(r'''<?php

declare(strict_types=1);

namespace App\Domain\Alliances\Models;

use App\Domain\Alliances\Enums\AllianceStatus;
use App\Domain\Authorization\Models\Role;
use App\Domain\Identity\Models\User;
use App\Domain\Memberships\Models\AllianceMembership;
use Illuminate\Database\Eloquent\Concerns\HasUlids;
use Illuminate\Database\Eloquent\Model;
use Illuminate\Database\Eloquent\Relations\BelongsTo;
use Illuminate\Database\Eloquent\Relations\HasMany;

final class Alliance extends Model
{
    use HasUlids;

    public $incrementing = false;

    protected $keyType = 'string';

    protected $fillable = [
        'name',
        'slug',
        'kingdom',
        'language',
        'timezone',
        'status',
        'created_by_user_id',
    ];

    protected function casts(): array
    {
        return [
            'status' => AllianceStatus::class,
        ];
    }

    /** @return BelongsTo<User, $this> */
    public function creator(): BelongsTo
    {
        return $this->belongsTo(User::class, 'created_by_user_id');
    }

    /** @return HasMany<AllianceMembership, $this> */
    public function memberships(): HasMany
    {
        return $this->hasMany(AllianceMembership::class);
    }

    /** @return HasMany<Role, $this> */
    public function roles(): HasMany
    {
        return $this->hasMany(Role::class);
    }
}
''')

          invitation = Path('tests/Feature/Memberships/InvitationReplacementTest.php')
          text = invitation.read_text()
          text = text.replace(
              'use App\\Domain\\Memberships\\Queries\\FindPendingInvitation;\n',
              'use App\\Domain\\Memberships\\Models\\Invitation;\nuse App\\Domain\\Memberships\\Queries\\FindPendingInvitation;\n',
          )
          text = text.replace(
              "        self::assertSame(InvitationStatus::Revoked, $first->invitation->refresh()->status);\n"
              "        self::assertNotNull($first->invitation->revoked_at);\n"
              "        self::assertSame(InvitationStatus::Pending, $second->invitation->refresh()->status);",
              "        $firstRecord = Invitation::query()->findOrFail($first->invitationId);\n"
              "        $secondRecord = Invitation::query()->findOrFail($second->invitationId);\n\n"
              "        self::assertSame(InvitationStatus::Revoked, $firstRecord->status);\n"
              "        self::assertNotNull($firstRecord->revoked_at);\n"
              "        self::assertSame(InvitationStatus::Pending, $secondRecord->status);",
          )
          text = text.replace('$first->invitation->id', '$first->invitationId')
          invitation.write_text(text)

          rally = Path('tests/Feature/Rallies/RallyCoordinationTest.php')
          text = rally.read_text().replace(
              'use App\\Domain\\Events\\Actions\\CreateEventRecommendedFormation;',
              'use App\\Domain\\Rallies\\Actions\\CreateEventRecommendedFormation;',
          )
          rally.write_text(text)

          reminders = Path('tests/Feature/Notifications/EventReminderDeliveryTest.php')
          text = reminders.read_text().replace(
              'use App\\Domain\\Events\\Actions\\CreateEventReminderRule;',
              'use App\\Domain\\Notifications\\Actions\\CreateEventReminderRule;',
          )
          reminders.write_text(text)
          PY
      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Format PHP
        run: vendor/bin/pint --parallel
      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G
      - name: Focused tests
        run: php artisan test tests/Architecture tests/Feature/Memberships tests/Feature/Recruitment tests/Feature/Content tests/Feature/Alliances tests/Feature/Rallies tests/Feature/Notifications
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Tighten domain ownership boundaries"
          git push origin HEAD:agent/app-architecture-alignment
