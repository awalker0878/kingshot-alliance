name: P5 Larastan Contract Repair

on:
  push:
    branches: [architecture-v2]
    paths: [.github/workflows/p5-larastan-contract-repair.yml]

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Tighten BattlePlans and EventAnalysis contracts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected anchor not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new))

          objective = 'app/Contexts/Operations/BattlePlans/Models/EventObjective.php'
          replace(
              objective,
              'final class EventObjective extends Model\n{',
              '/**\n * @property EventObjectiveStatus $status\n * @property-read EventOccurrence $occurrence\n * @property-read EventObjective|null $parent\n */\nfinal class EventObjective extends Model\n{',
          )
          replace(objective, '    public function occurrence(): BelongsTo\n', '    /** @return BelongsTo<EventOccurrence, $this> */\n    public function occurrence(): BelongsTo\n')
          replace(objective, '    public function parent(): BelongsTo\n', '    /** @return BelongsTo<EventObjective, $this> */\n    public function parent(): BelongsTo\n')
          replace(objective, '    public function children(): HasMany\n', '    /** @return HasMany<EventObjective, $this> */\n    public function children(): HasMany\n')
          replace(objective, '    public function assignments(): HasMany\n', '    /** @return HasMany<EventObjectiveAssignment, $this> */\n    public function assignments(): HasMany\n')

          assignment = 'app/Contexts/Operations/BattlePlans/Models/EventObjectiveAssignment.php'
          replace(
              assignment,
              'final class EventObjectiveAssignment extends Model\n{',
              '/**\n * @property-read EventObjective $objective\n * @property-read EventOccurrence $occurrence\n * @property-read EventRoster|null $roster\n * @property-read Player|null $player\n */\nfinal class EventObjectiveAssignment extends Model\n{',
          )
          replace(assignment, '    public function objective(): BelongsTo\n', '    /** @return BelongsTo<EventObjective, $this> */\n    public function objective(): BelongsTo\n')
          replace(assignment, '    public function occurrence(): BelongsTo\n', '    /** @return BelongsTo<EventOccurrence, $this> */\n    public function occurrence(): BelongsTo\n')
          replace(assignment, '    public function roster(): BelongsTo\n', '    /** @return BelongsTo<EventRoster, $this> */\n    public function roster(): BelongsTo\n')
          replace(assignment, '    public function player(): BelongsTo\n', '    /** @return BelongsTo<Player, $this> */\n    public function player(): BelongsTo\n')

          controller = 'app/Contexts/Operations/BattlePlans/Http/Controllers/EventBattlePlanController.php'
          replace(
              controller,
              "isset($validated['parent_id']) && $validated['parent_id'] !== null\n            ? EventObjective::query()",
              "isset($validated['parent_id'])\n            ? EventObjective::query()",
          )

          intelligence = 'app/Contexts/Intelligence/EventAnalysis/Queries/EventPlayerIntelligenceQuery.php'
          replace(
              intelligence,
              "return $players->map(fn (Player $player): array => $metrics[(string) $player->id])->all();",
              "return array_values($players->map(fn (Player $player): array => $metrics[(string) $player->id])->all());",
          )
          replace(
              intelligence,
              "            $playerScores = $scores->get($id, collect())->pluck('score')->map(static fn ($score): int => (int) $score);\n\n            $result[$id] = [",
              "            $playerScores = $scores->get($id, collect())->pluck('score')->map(static fn ($score): int => (int) $score);\n            $averageScore = $playerScores->avg();\n\n            $result[$id] = [",
          )
          replace(
              intelligence,
              "'averageScore' => $playerScores->isEmpty() ? null : (int) round($playerScores->avg()),",
              "'averageScore' => $averageScore === null ? null : (int) round((float) $averageScore),",
          )
          PY

          vendor/bin/pint \
            app/Contexts/Operations/BattlePlans/Models/EventObjective.php \
            app/Contexts/Operations/BattlePlans/Models/EventObjectiveAssignment.php \
            app/Contexts/Operations/BattlePlans/Http/Controllers/EventBattlePlanController.php \
            app/Contexts/Intelligence/EventAnalysis/Queries/EventPlayerIntelligenceQuery.php

      - name: Commit repair and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/p5-larastan-contract-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ARCH-V2: tighten P5 model and analysis contracts'
          git push origin HEAD:architecture-v2

      - name: Dispatch authoritative verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run architecture-v2-verification.yml --ref architecture-v2
