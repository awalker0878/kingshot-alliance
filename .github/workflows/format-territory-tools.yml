name: Format Territory Tools Source

on:
  pull_request:
    paths:
      - 'resources/js/pages/Kingdom/Territory/Tools.vue'
      - '.github/workflows/format-territory-tools.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format and commit source
        shell: bash
        run: |
          npx prettier resources/js/pages/Kingdom/Territory/Tools.vue --write
          if git diff --quiet -- resources/js/pages/Kingdom/Territory/Tools.vue; then
            echo 'Territory tools source already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/js/pages/Kingdom/Territory/Tools.vue
          git commit -m 'style(territory): format layout tools'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
