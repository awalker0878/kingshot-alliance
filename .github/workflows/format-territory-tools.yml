name: Format Territory Tools Source

on:
  pull_request:
    paths:
      - 'resources/js/pages/Kingdom/Territory/Tools.vue'
      - '.github/workflows/format-territory-tools.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format and emit source
        shell: bash
        run: |
          npx prettier resources/js/pages/Kingdom/Territory/Tools.vue --write
          echo 'TOOLS_VUE_BASE64_BEGIN'
          base64 -w0 resources/js/pages/Kingdom/Territory/Tools.vue
          echo
          echo 'TOOLS_VUE_BASE64_END'
