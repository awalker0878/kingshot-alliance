name: Phase 6 type fix

on:
  push:
    branches:
      - agent/phase-6-platform-scale-administration

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/phase-6-platform-scale-administration
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: python .github/scripts/phase6_type_fix.py
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write resources/js/pages/Platform/Administration/Index.vue
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/Platform/Administration/Index.vue
          git commit -m "Fix Phase 6 platform form typing"
          git push origin HEAD:agent/phase-6-platform-scale-administration
