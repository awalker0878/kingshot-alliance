name: V3 CA-P5 Close

on:
  push:
    branches:
      - architecture-v3-capability-alignment

permissions:
  contents: write

jobs:
  close:
    if: ${{ !contains(github.event.head_commit.message, 'complete CA-P5') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v3-capability-alignment
          fetch-depth: 0
      - name: Require P5 pass
        run: test -f ARCH_V3_P5_GATE_PASS && grep -qx PASS ARCH_V3_P5_GATE_PASS
      - name: Remove temporary P5 tooling
        run: rm -f .github/workflows/v3-p5-gate.yml .github/workflows/v3-p5-close.yml ARCH_V3_P5_GATE_PASS ARCH_V3_P5_GATE_FAIL.txt
      - name: Advance status
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('ARCH_V3_REWRITE_STATUS.md')
          t=p.read_text()
          start=t.index('## Phase CA-P5 — Communications cleanup')
          end=t.index('## Phase CA-P6 — Architecture enforcement')
          replacement='''## Phase CA-P5 — Communications cleanup\n\nStatus: COMPLETE\n\n### Done\n- Confirmed Communications exposes only the `Delivery` capability.\n- Added `tests/v3/Architecture/CommunicationsBoundaryV3Test.php`.\n- Enforced no `EventReminder*`, `KingPerkReminder*`, source reminder event names, source reminder completion handlers, or Operations imports inside Communications.\n- Event/KingPerk reminder meaning and completion behavior remain owned by Operations Participation/KingPerks.\n- Full V3 architecture/application validation passes with the Communications boundary enabled.\n- Temporary P5 gate workflow and sentinels removed.\n\n### Failed / blocked\n- None.\n\n'''
          t=t[:start]+replacement+t[end:]
          t=t.replace('## Phase CA-P6 — Architecture enforcement\n\nStatus: NOT STARTED','## Phase CA-P6 — Architecture enforcement\n\nStatus: IN PROGRESS')
          p.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(v3): complete CA-P5 Communications boundary [skip ci]"
          git push origin HEAD:architecture-v3-capability-alignment
