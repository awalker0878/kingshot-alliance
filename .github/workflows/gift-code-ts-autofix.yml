name: Gift Code TypeScript Autofix

on:
  push:
    branches:
      - gift-code-research-backed-acquisition

permissions:
  contents: write

concurrency:
  group: gift-code-ts-autofix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    name: Fix Gift Code source action payload type
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gift-code-research-backed-acquisition
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Fix payload type and format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('resources/js/pages/Platform/GiftCodes/Sources.vue')
          text = path.read_text()
          old = 'function runSourceAction(source: Source, action: string, data: Record<string, unknown> = {}): void {'
          new = 'function runSourceAction(\n  source: Source,\n  action: string,\n  data: Record<string, string | number | boolean | null> = {},\n): void {'
          if old not in text:
              raise SystemExit('Expected runSourceAction signature was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write resources/js/pages/Platform/GiftCodes/Sources.vue
          npx vue-tsc --noEmit

      - name: Remove one-shot workflow and commit fix
        shell: bash
        run: |
          git rm .github/workflows/gift-code-ts-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Gift Code source action payload type"
          git push origin HEAD:gift-code-research-backed-acquisition
