name: Screenshot Intake Normalize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/screenshot-intake-complete'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/screenshot-intake-complete
          fetch-depth: 0

      - name: Apply final source and documentation integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          evidence = Path('resources/js/pages/Operations/Events/Evidence.vue')
          text = evidence.read_text()
          text = text.replace("import { computed, reactive } from 'vue';", "import { reactive } from 'vue';")
          text = text.replace("const activeEvidence = computed(() => props.workspace.evidence[0] ?? null);\n", "")
          evidence.write_text(text)

          show = Path('resources/js/pages/Operations/Events/Show.vue')
          text = show.read_text()
          route = "`/events/${event.id}/screenshot-intake`"
          if route not in text:
              marker = "{{ t('events.show.manage') }}"
              marker_at = text.find(marker)
              if marker_at < 0:
                  raise SystemExit('Could not locate Event manage action')
              close_at = text.find('</Link>', marker_at)
              if close_at < 0:
                  raise SystemExit('Could not locate Event manage action closing tag')
              insert_at = close_at + len('</Link>')
              addition = '''
        <Link
          v-if="
            event.canManage &&
            event.eventTypeSlug === 'bear-hunt' &&
            event.capabilities.includes('results')
          "
          :href="`/events/${event.id}/screenshot-intake`"
          class="ks-command-link"
          data-variant="secondary"
        >
          {{ t('evidence.openIntake') }}
        </Link>'''
              text = text[:insert_at] + addition + text[insert_at:]
          show.write_text(text)

          product = Path('docs/product/screenshot-intake.md')
          text = product.read_text()
          replacements = {
              "`Operations/Results` owns accepted Bear Hunt battle reports, report entries and all derived Event result state. Cross-context writes use scalar IDs/value objects through owner Actions. `app/Workflows` coordinates the commit handshake but owns no business persistence.": "`Operations/Results` owns accepted Bear Hunt battle reports, report entries and all derived Event result state. Cross-context writes use scalar IDs/value objects through owner Actions. An `Intelligence/Evidence` application Action coordinates the commit handshake while owning no destination persistence.",
              "12. A workflow sends a scalar Bear Hunt report command to `Operations/Results`.": "12. The Evidence commit Action sends a scalar Bear Hunt report command to `Operations/Results`.",
              "`Evidence BeginCommitAttempt → Workflow BuildReviewedCommand → Operations RecordBearHuntBattleReport → Evidence MarkCommitSucceeded`": "`Evidence BeginCommitAttempt → Evidence CommitReviewedBearHuntEvidence → Operations RecordBearHuntBattleReport → Evidence MarkCommitSucceeded`",
              "Authorization is checked before expensive work where useful and reacquired at each protected write boundary. Jobs and workflows carry scalar IDs, never serialized Eloquent authority models.": "Authorization is checked before expensive work where useful and reacquired at each protected write boundary. Jobs and application Actions carry scalar IDs/value objects, never serialized Eloquent authority models.",
              "| 9 | Planned | Workflow-based scalar cross-context commit into `Operations/Results` with no foreign persistence writes. |": "| 9 | Planned | Evidence application-Action orchestration sends a scalar cross-context command into `Operations/Results` with no foreign persistence writes. |",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing product replacement: {old}')
              text = text.replace(old, new)
          product.write_text(text)

          reference = Path('docs/reference/screenshot-intake.md')
          text = reference.read_text()
          replacements = {
              "`app/Workflows/ScreenshotIntake` coordinates the scalar handoff and owns no business persistence.": "`Intelligence/Evidence` coordinates the scalar handoff through `CommitReviewedBearHuntEvidence`; the Action changes only Evidence commit-attempt state around the destination owner call and owns no Operations persistence.",
              "| `POST` | `/events/{occurrence}/screenshot-intake/reviews/{review}/commit` | Commit an approved review through the Screenshot Intake workflow into `Operations/Results`. |": "| `POST` | `/events/{occurrence}/screenshot-intake/reviews/{review}/commit` | Commit an approved review through the Evidence commit Action into `Operations/Results`. |",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing reference replacement: {old}')
              text = text.replace(old, new)
          reference.write_text(text)

          operations = Path('docs/operations/screenshot-intake.md')
          text = operations.read_text()
          text = text.replace(
              "2. `app/Workflows/ScreenshotIntake/CommitBearHuntEvidence` calls the scalar `Operations/Results` owner action.",
              "2. `Intelligence/Evidence/Actions/CommitReviewedBearHuntEvidence` calls the scalar `Operations/Results` owner Action.",
          )
          text = text.replace(
              "The command reports aggregate lifecycle counts, failed classification/extraction/commit counts, the oldest processing timestamp, retained-binary count and redacted count. It intentionally emits no screenshot name, OCR text, Player name, Alliance name, hashes or review contents.",
              "The command reports lifecycle counts; classification/extraction attempt counts, failure rates and average latency; reviewed/corrected row counts and correction rate; exact/visual duplicate events plus semantic duplicate rate; commit attempts/failure rate; retention failures; oldest-processing age; retained-binary count; and redacted count. It intentionally emits no screenshot name, OCR text, Player name, Alliance name, hashes or review contents.",
          )
          operations.write_text(text)
          PY

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: dom, gd, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply pinned formatters
        run: |
          vendor/bin/pint --parallel
          npx prettier --write resources/

      - name: Commit normalized source
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app docs resources tests Dockerfile bootstrap config database routes
          git commit -m 'Finish Screenshot Intake source integration'
          git push origin HEAD:feat/screenshot-intake-complete
