name: Architecture V2 P3 Architecture Fix

on:
  push:
    branches: [architecture-v2]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
      - name: Make empty-context dependency checks explicit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/Architecture/ArchitectureV2DependencyTest.php')
          source = path.read_text()
          needle = "    private function assertFilesDoNotImport(array $files, string ...$forbiddenImports): void\n    {\n        foreach ($files as $file) {"
          replacement = "    private function assertFilesDoNotImport(array $files, string ...$forbiddenImports): void\n    {\n        self::assertNotEmpty($forbiddenImports, 'Dependency checks must define at least one forbidden import.');\n\n        foreach ($files as $file) {"
          if needle not in source:
              raise SystemExit('Expected helper body not found')
          path.write_text(source.replace(needle, replacement, 1))
          PY
          rm -f .github/workflows/architecture-v2-debug.yml
          rm -f .github/workflows/architecture-v2-p3-architecture-fix.yml
      - name: Commit P3 architecture harness fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/Architecture/ArchitectureV2DependencyTest.php .github/workflows/architecture-v2-debug.yml .github/workflows/architecture-v2-p3-architecture-fix.yml
          git commit -m 'test: make empty V2 dependency checks explicit'
          git push origin HEAD:architecture-v2
