name: Format product language files

on:
  push:
    branches:
      - product/kingshot-language-alignment

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: product/kingshot-language-alignment
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Format product language files
        run: |
          npx prettier --write \
            resources/js/pages/Intelligence/Contributions/History.vue \
            resources/js/pages/Intelligence/KingdomWatch/AllianceDossier.vue \
            resources/js/pages/Intelligence/KingdomWatch/Diplomacy.vue \
            resources/js/pages/Intelligence/KingdomWatch/Reports.vue \
            resources/js/pages/Intelligence/Roster/Dossiers.vue
          git diff --check

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            resources/js/pages/Intelligence/Contributions/History.vue \
            resources/js/pages/Intelligence/KingdomWatch/AllianceDossier.vue \
            resources/js/pages/Intelligence/KingdomWatch/Diplomacy.vue \
            resources/js/pages/Intelligence/KingdomWatch/Reports.vue \
            resources/js/pages/Intelligence/Roster/Dossiers.vue
          git commit -m "Format localized product surfaces"
          git push origin HEAD:product/kingshot-language-alignment
