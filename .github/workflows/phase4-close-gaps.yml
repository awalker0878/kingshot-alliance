name: Phase 4 close gaps

on:
  push:
    branches:
      - agent/phase-4-recruitment
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase4-close-gaps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/phase-4-recruitment
          fetch-depth: 0
      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_sqlite, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --no-audit --no-fund
      - name: Wire question editing and recruiter navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          controller = Path('app/Http/Controllers/Alliance/RecruitmentManagementController.php')
          text = controller.read_text()
          marker = 'use App\\Application\\Recruitment\\IssueRecruitmentApplicationInvite;\n'
          if marker not in text:
              raise SystemExit('RecruitmentManagementController import marker missing')
          text = text.replace(marker, marker + 'use App\\Application\\Recruitment\\UpdateRecruitmentQuestion;\n', 1)

          method_marker = '    public function issueApplicationInvite(\n'
          if method_marker not in text:
              raise SystemExit('RecruitmentManagementController method marker missing')
          update_method = '''    public function updateQuestion(
        Request $request,
        AllianceContext $context,
        UpdateRecruitmentQuestion $update,
        string $question,
    ): RedirectResponse {
        $validated = $request->validate([
            'prompt' => ['required', 'string', 'max:240'],
            'help_text' => ['nullable', 'string', 'max:2000'],
            'type' => ['required', Rule::enum(RecruitmentQuestionType::class)],
            'options' => ['array', 'max:30'],
            'options.*' => ['string', 'max:160'],
            'required' => ['required', 'boolean'],
            'position' => ['required', 'integer', 'min:0', 'max:65535'],
            'active' => ['required', 'boolean'],
        ]);
        $alliance = $context->alliance();
        $record = RecruitmentQuestion::query()
            ->where('alliance_id', $alliance->id)
            ->whereKey($question)
            ->firstOrFail();

        $update->handle(
            $this->user($request),
            $alliance,
            $record,
            $validated['prompt'],
            RecruitmentQuestionType::from($validated['type']),
            (bool) $validated['required'],
            (int) $validated['position'],
            $validated['help_text'] ?? null,
            $validated['options'] ?? [],
            (bool) $validated['active'],
        );

        return back();
    }

'''
          text = text.replace(method_marker, update_method + method_marker, 1)
          controller.write_text(text)

          routes = Path('routes/web.php')
          text = routes.read_text()
          marker = '''            Route::post('/alliance/recruitment/questions', [RecruitmentManagementController::class, 'storeQuestion'])
                ->name('alliance.recruitment.questions.store');
'''
          if marker not in text:
              raise SystemExit('Recruitment question route marker missing')
          addition = marker + '''            Route::patch('/alliance/recruitment/questions/{question}', [RecruitmentManagementController::class, 'updateQuestion'])
                ->whereUlid('question')
                ->name('alliance.recruitment.questions.update');
'''
          routes.write_text(text.replace(marker, addition, 1))

          manage = Path('resources/js/pages/Alliance/Recruitment/Manage.vue')
          text = manage.read_text()
          text = text.replace(
              "import { Head, Link, useForm } from '@inertiajs/vue3';",
              "import { Head, Link, router, useForm } from '@inertiajs/vue3';",
              1,
          )
          text = text.replace("import { ref } from 'vue';", "import { reactive, ref } from 'vue';", 1)
          marker = "const questionOptions = ref('');\n"
          if marker not in text:
              raise SystemExit('Manage questionOptions marker missing')
          state = '''type QuestionEdit = {
  prompt: string;
  helpText: string;
  type: string;
  optionsText: string;
  required: boolean;
  position: number;
  active: boolean;
};

const questionEdits = reactive<Record<string, QuestionEdit>>({});
for (const question of props.questions) {
  questionEdits[question.id] = {
    prompt: question.prompt,
    helpText: question.helpText ?? '',
    type: question.type,
    optionsText: question.options.join('\\n'),
    required: question.required,
    position: question.position,
    active: question.active,
  };
}

function questionEdit(id: string): QuestionEdit {
  const edit = questionEdits[id];
  if (!edit) throw new Error(`Missing question edit state for ${id}`);
  return edit;
}

'''
          text = text.replace(marker, marker + state, 1)

          function_marker = 'function issueInvite(): void {\n'
          if function_marker not in text:
              raise SystemExit('Manage issueInvite marker missing')
          save_function = '''function saveQuestion(id: string): void {
  const edit = questionEdit(id);
  router.patch(
    `/alliance/recruitment/questions/${id}`,
    {
      prompt: edit.prompt,
      help_text: edit.helpText,
      type: edit.type,
      options: edit.optionsText
        .split('\\n')
        .map((value) => value.trim())
        .filter((value) => value !== ''),
      required: edit.required,
      position: edit.position,
      active: edit.active,
    },
    { preserveScroll: true },
  );
}

'''
          text = text.replace(function_marker, save_function + function_marker, 1)

          old_article = '''          <article
            v-for="question in questions"
            :key="question.id"
            class="rounded-xl border border-slate-800 p-4"
          >
            <div class="flex flex-wrap items-center gap-2 text-xs text-slate-500">
              <span class="capitalize">{{ question.type.replace('_', ' ') }}</span>
              <span>· position {{ question.position }}</span>
              <span>· {{ question.required ? 'required' : 'optional' }}</span>
              <span>· {{ question.active ? 'active' : 'inactive' }}</span>
            </div>
            <h3 class="mt-1 font-semibold">{{ question.prompt }}</h3>
            <p v-if="question.helpText" class="mt-1 text-sm text-slate-400">
              {{ question.helpText }}
            </p>
          </article>
'''
          new_article = '''          <article
            v-for="question in questions"
            :key="question.id"
            class="rounded-xl border border-slate-800 p-4"
          >
            <div class="grid gap-3">
              <div>
                <label class="text-xs font-medium text-slate-400" :for="`edit-question-${question.id}`">Prompt</label>
                <input
                  :id="`edit-question-${question.id}`"
                  v-model="questionEdit(question.id).prompt"
                  class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2"
                  maxlength="240"
                />
              </div>
              <div class="grid gap-3 sm:grid-cols-2">
                <div>
                  <label class="text-xs font-medium text-slate-400" :for="`edit-type-${question.id}`">Type</label>
                  <select
                    :id="`edit-type-${question.id}`"
                    v-model="questionEdit(question.id).type"
                    class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2"
                  >
                    <option v-for="type in questionTypes" :key="type" :value="type">{{ type.replace('_', ' ') }}</option>
                  </select>
                </div>
                <div>
                  <label class="text-xs font-medium text-slate-400" :for="`edit-position-${question.id}`">Position</label>
                  <input
                    :id="`edit-position-${question.id}`"
                    v-model.number="questionEdit(question.id).position"
                    class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2"
                    type="number"
                    min="0"
                    max="65535"
                  />
                </div>
              </div>
              <div>
                <label class="text-xs font-medium text-slate-400" :for="`edit-help-${question.id}`">Help text</label>
                <input
                  :id="`edit-help-${question.id}`"
                  v-model="questionEdit(question.id).helpText"
                  class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2"
                  maxlength="2000"
                />
              </div>
              <div v-if="['select', 'multi_select'].includes(questionEdit(question.id).type)">
                <label class="text-xs font-medium text-slate-400" :for="`edit-options-${question.id}`">Options, one per line</label>
                <textarea
                  :id="`edit-options-${question.id}`"
                  v-model="questionEdit(question.id).optionsText"
                  class="mt-1 min-h-24 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2"
                />
              </div>
              <div class="flex flex-wrap items-center gap-5 text-sm">
                <label class="flex items-center gap-2"><input v-model="questionEdit(question.id).required" type="checkbox" /> Required</label>
                <label class="flex items-center gap-2"><input v-model="questionEdit(question.id).active" type="checkbox" /> Active</label>
                <button class="rounded-lg border border-slate-700 px-3 py-2 font-semibold" type="button" @click="saveQuestion(question.id)">Save question</button>
              </div>
            </div>
          </article>
'''
          if old_article not in text:
              raise SystemExit('Manage existing question article block missing')
          manage.write_text(text.replace(old_article, new_article, 1))

          overview_controller = Path('app/Http/Controllers/Alliance/AllianceOverviewController.php')
          text = overview_controller.read_text()
          marker = '        $canManageEvents = $authorization->allows($user, $alliance, PermissionKey::EventManage);\n'
          if marker not in text:
              raise SystemExit('AllianceOverviewController event permission marker missing')
          text = text.replace(marker, marker + '        $canManageRecruitment = $authorization->allows($user, $alliance, PermissionKey::RecruitmentManage);\n', 1)
          marker = "                'canManageEvents' => $canManageEvents,\n"
          if marker not in text:
              raise SystemExit('AllianceOverviewController contentHub event prop marker missing')
          text = text.replace(marker, marker + "                'canManageRecruitment' => $canManageRecruitment,\n", 1)
          overview_controller.write_text(text)

          overview = Path('resources/js/pages/Alliance/Overview.vue')
          text = overview.read_text()
          marker = '    canManageEvents: boolean;\n'
          if marker not in text:
              raise SystemExit('Overview Vue canManageEvents marker missing')
          text = text.replace(marker, marker + '    canManageRecruitment: boolean;\n', 1)
          marker = '        <Link class="text-cyan-300 hover:text-cyan-200" href="/alliance/events">Events</Link>\n'
          if marker not in text:
              raise SystemExit('Overview Vue events link marker missing')
          recruitment_link = '''        <Link
          v-if="contentHub.canManageRecruitment"
          class="text-cyan-300 hover:text-cyan-200"
          href="/alliance/recruitment"
          >Recruitment</Link
        >
'''
          text = text.replace(marker, marker + recruitment_link, 1)
          overview.write_text(text)
          PY
      - name: Format changed files
        run: |
          vendor/bin/pint app/Application/Recruitment/UpdateRecruitmentQuestion.php app/Http/Controllers/Alliance/RecruitmentManagementController.php app/Http/Controllers/Alliance/AllianceOverviewController.php routes/web.php tests/Feature/Recruitment/RecruitmentHttpTest.php tests/Feature/Recruitment/RecruitmentMigrationRollbackTest.php tests/Feature/Recruitment/RecruitmentAccessibilityGuardTest.php
          npx prettier --write resources/js/pages/Alliance/Recruitment/Manage.vue resources/js/pages/Alliance/Overview.vue
      - name: Commit gap closure
        shell: bash
        run: |
          set -euo pipefail
          git add app/Application/Recruitment/UpdateRecruitmentQuestion.php app/Http/Controllers/Alliance/RecruitmentManagementController.php app/Http/Controllers/Alliance/AllianceOverviewController.php routes/web.php resources/js/pages/Alliance/Recruitment/Manage.vue resources/js/pages/Alliance/Overview.vue tests/Feature/Recruitment/RecruitmentHttpTest.php tests/Feature/Recruitment/RecruitmentMigrationRollbackTest.php tests/Feature/Recruitment/RecruitmentAccessibilityGuardTest.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Close Phase 4 recruitment product gaps'
          git push origin HEAD:agent/phase-4-recruitment
