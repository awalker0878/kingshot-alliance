name: Gift Code Workspace Documentation Reconciliation

on:
  push:
    branches:
      - gift-code-redemption-workspace

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gift-code-redemption-workspace

      - name: Reconcile product documentation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          catalogue = Path('docs/product/capability-catalogue.md')
          text = catalogue.read_text()
          old = "| Gift Codes | Current complete capability | Derive revisioned global trust/expiry/reward/applicability from append-only governed evidence; moderate and ingest approved sources under platform authority; guide current/all/failed/selected owned Governors through official handoff; deliver revision-aware lifecycle notifications; and expose bounded catalogue/API/webhook reads. | GameWorld/GiftCodes owns catalogue/source/evidence/redemption policy; Communications owns deliveries; Platform/Integrations owns external contracts; ReadModels composes overview/API reads |"
          new = "| Gift Codes | Current complete capability | Derive revisioned global trust/expiry/reward/applicability from append-only governed evidence; moderate and ingest approved sources under platform authority; provide an account-personal actionable workspace with persistent many-code/many-Governor redemption runs, reminders, structured rewards and privacy-gated redemption signals; expose authorized aggregate Alliance coverage and contributor projections without weakening evidence authority; and retain bounded catalogue/API/webhook reads plus the official Century Games handoff boundary. | GameWorld/GiftCodes owns catalogue/source/evidence/personal-workflow/session/redemption policy; Communications owns recipient routing/delivery; Alliance/Access authorizes aggregate coverage; Platform/Integrations owns external contracts; ReadModels composes overview/API/coverage reads |"
          if old not in text:
              raise SystemExit('Gift Codes catalogue row did not match expected baseline')
          catalogue.write_text(text.replace(old, new, 1))

          ledger = Path('docs/product/capability-delivery-ledger.md')
          text = ledger.read_text()
          anchor = "| Gift Code trust, discovery and redemption expansion | Complete | [Extension closeout](gift-code-extension-program.md), [ADR-0004](../architecture/adr/0004-gift-code-trust-from-append-only-evidence.md), [owner reference](../reference/gift-codes.md) and `GiftCodeBehaviorV3Test` |"
          row = "| Gift Code Redemption Workspace & Personalization | Complete | [Product contract](gift-code-redemption-workspace.md), [acceptance matrix](gift-code-redemption-workspace-acceptance.md), [delivery ledger](gift-code-redemption-workspace-delivery-ledger.md), [owner reference](../reference/gift-codes.md), `GiftCodeWorkspaceV3Test`, `GiftCodeRedemptionWorkspaceV3Test` and desktop/mobile `GiftCodes.spec.ts` |"
          if anchor not in text:
              raise SystemExit('Gift Code delivery-ledger anchor did not match expected baseline')
          if row not in text:
              text = text.replace(anchor, anchor + '\n' + row, 1)
          ledger.write_text(text)

          additions = {
              'docs/product/capability-gap-analysis.md': '''\n\n## Gift Code Redemption Workspace & Personalization\n\nThe completed Gift Code foundation is extended with account-personal actionable state and persistent many-code/many-Governor redemption sessions. Session items are orchestration only: current Player ownership, canonical Gift Code trust/expiry, qualified applicability, terminal redemption state and retry timing are re-resolved server-side, while `gift_code_redemptions` remains the authoritative Governor outcome ledger. Pin/snooze/dismiss/reminder state never mutates global catalogue truth.\n\nCommunications receives GiftCode-owned logical notification intent and retains endpoint, preference, quiet-hour, digest, provider retry and delivery ownership. Privacy-gated redemption signals remain observational and cannot establish canonical validity/applicability. Alliance coverage is aggregate and permission-gated; contributor projections cannot elevate community evidence to official authority. Signed source webhook ingestion feeds the same approved-source evidence path with replay protection and does not create a second trust path. The Century Games redemption centre remains the provider boundary; undocumented redemption automation remains out of scope.\n\nCanonical contract: [Gift Code Redemption Workspace & Personalization](gift-code-redemption-workspace.md), [acceptance matrix](gift-code-redemption-workspace-acceptance.md), and [delivery ledger](gift-code-redemption-workspace-delivery-ledger.md).\n''',
              'docs/product/experience/user-journeys.md': '''\n\n## Gift Code personal redemption workspace\n\n```text\nOpen Gift Code Workspace\n -> compose New / Ready / Expiring / Retry / In-progress / Snoozed / Completed from current catalogue truth and all currently owned Governors\n -> optionally pin, snooze, dismiss or schedule a personal reminder without changing global Gift Code truth\n -> start all-actionable, expiring, retry-ready or explicitly selected many-code/many-Governor redemption run\n -> reauthorize every Gift Code/Governor pair against current ownership, trust, expiry, qualified applicability and retry state\n -> copy Player ID and code, open the official Century Games centre, record observed outcome or skip\n -> persist progress and resume the run after reload/device change\n -> remove or mark unavailable any pending item invalidated by ownership/trust/expiry change\n```\n\nAuthorized Alliance officers may open aggregate Gift Code coverage only when the existing Alliance permission grants it. Coverage shows counts, not individual member redemption history, and never grants platform Gift Code moderation.\n''',
              'docs/frontend/FRONTEND-V3-CAPABILITY-MAP.md': '''\n\n## Gift Code Redemption Workspace\n\n- `/gift-codes/workspace` is the account-personal many-code/many-Governor action surface and is separate from the global catalogue/detail views.\n- Workspace views are New, Ready to redeem, Expiring soon, Retry ready, In progress, Snoozed and Completed.\n- Persistent redemption runs expose progress, current Governor/Gift Code, structured qualified reward display, copy controls, official-provider handoff, observed-result recording, skip/abandon and privacy-gated recent redemption signals.\n- Personal pin/snooze/dismiss/reminder actions affect only the account workflow projection.\n- `/gift-codes/workspace/alliance/{alliance}/coverage` is an authorized aggregate-only Alliance view and does not expose individual member histories.\n- Desktop and mobile Playwright coverage verifies workspace creation, persisted resume, skip/result progression, accessible controls and horizontal-overflow safety.\n''',
              'docs/product/README.md': '''\n\n### Gift Code Redemption Workspace & Personalization\n\n- [Product contract](gift-code-redemption-workspace.md)\n- [Acceptance matrix](gift-code-redemption-workspace-acceptance.md)\n- [Delivery ledger](gift-code-redemption-workspace-delivery-ledger.md)\n\nThis fresh-schema extension adds personal actionable state, persistent many-code/many-Governor redemption runs, Communications-backed reminders, privacy-gated redemption signals, structured reward presentation, signed approved-source webhook ingestion, authorized aggregate Alliance coverage and derived contributor projections without weakening the existing Gift Code trust/evidence model.\n''',
          }
          marker = 'Gift Code Redemption Workspace & Personalization'
          for name, addition in additions.items():
              path = Path(name)
              text = path.read_text()
              if marker not in text:
                  path.write_text(text.rstrip() + addition + '\n')
          PY

      - name: Commit reconciled documentation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/product/capability-catalogue.md docs/product/capability-delivery-ledger.md docs/product/capability-gap-analysis.md docs/product/experience/user-journeys.md docs/frontend/FRONTEND-V3-CAPABILITY-MAP.md docs/product/README.md
          git commit -m "docs: reconcile Gift Code workspace across product contracts"
          git push origin HEAD:gift-code-redemption-workspace
