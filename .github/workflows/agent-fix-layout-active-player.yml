name: Agent Fix Shell Active Governor Context

on:
  push:
    branches:
      - agent/full-ui-rewrite

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out rewrite branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/full-ui-rewrite
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Remove implicit first-Governor fallback from shell
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('resources/js/layouts/AppLayout.vue')
          text = path.read_text()
          old = """const activePlayer = computed(
            () =>
              playerContext.value.players.find(
                (player) => player.id === playerContext.value.activePlayerId,
              ) ??
              playerContext.value.players[0] ??
              null,
          );"""
          new = """const activePlayer = computed(() => {
            const activePlayerId = playerContext.value.activePlayerId;
            if (!activePlayerId) return null;

            return playerContext.value.players.find((player) => player.id === activePlayerId) ?? null;
          });"""
          if old not in text:
              raise SystemExit('Expected active Player fallback was not found in AppLayout.vue.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format shell
        run: npx prettier --write resources/js/layouts/AppLayout.vue

      - name: Run full frontend checks
        run: npm run check

      - name: Commit shell authority presentation fix
        shell: bash
        run: |
          if git diff --quiet -- resources/js/layouts/AppLayout.vue; then
            echo "No shell change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/layouts/AppLayout.vue
          git commit -m "fix shell active governor context"
          git push origin HEAD:agent/full-ui-rewrite
