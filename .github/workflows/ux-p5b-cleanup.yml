name: UX P5-B cleanup

on:
  push:
    branches:
      - ux/ux-001-experience-localization
    paths:
      - .ux-p5b-cleanup-trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ux/ux-001-experience-localization

      - name: Fix roster locale key
        run: perl -0pi -e 's/rosterManage\.trackedPlayers/roster.trackedPlayers/g' resources/js/pages/Alliance/RosterManage.vue

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Format frontend files
        run: >-
          npx prettier --write
          resources/js/pages/Alliance/RosterManage.vue
          resources/js/localization/messages/index.ts

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Apply Pint to UX-P5-B PHP files
        run: >-
          vendor/bin/pint
          app/Domain/Kingdoms/Http/Controllers/RosterController.php
          app/Domain/Kingdoms/Http/Controllers/RosterCsvController.php
          app/Domain/Kingdoms/Http/Controllers/PlayerSnapshotController.php
          tests/Architecture/RosterExperienceTest.php

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/Alliance/RosterManage.vue \
            resources/js/localization/messages/index.ts \
            app/Domain/Kingdoms/Http/Controllers/RosterController.php \
            app/Domain/Kingdoms/Http/Controllers/RosterCsvController.php \
            app/Domain/Kingdoms/Http/Controllers/PlayerSnapshotController.php \
            tests/Architecture/RosterExperienceTest.php
          if ! git diff --cached --quiet; then
            git commit -m "Clean up UX-P5-B roster validation"
            git push origin HEAD:ux/ux-001-experience-localization
          fi
