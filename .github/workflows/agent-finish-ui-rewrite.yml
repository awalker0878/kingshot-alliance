name: Agent Final UI Rewrite Sweep

on:
  push:
    branches:
      - agent/full-ui-rewrite

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out rewrite branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/full-ui-rewrite
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Rewrite remaining legacy screens
        run: python3 scripts/agent-finish-ui-rewrite.py

      - name: Format rewritten screens
        run: npx prettier --write resources/js/pages/Kingdom/RoyalCourt/Roles.vue resources/js/pages/Kingdom/RoyalCourt/Settings.vue resources/js/pages/Kingdom/Transfer/Completion.vue resources/js/pages/Intelligence/GloryLedger/Manage.vue resources/js/pages/Intelligence/KingdomWatch/Reports.vue resources/js/pages/Intelligence/Roster/History.vue resources/js/pages/Intelligence/Sharing/Index.vue resources/js/pages/Intelligence/Sharing/Manage.vue resources/js/pages/Public/Alliance/Show.vue resources/js/pages/Public/Alliance/Notice.vue resources/js/pages/Public/Recruitment/Apply.vue

      - name: Lint rewritten screens
        run: npx eslint resources/js/pages/Kingdom/RoyalCourt/Roles.vue resources/js/pages/Kingdom/RoyalCourt/Settings.vue resources/js/pages/Kingdom/Transfer/Completion.vue resources/js/pages/Intelligence/GloryLedger/Manage.vue resources/js/pages/Intelligence/KingdomWatch/Reports.vue resources/js/pages/Intelligence/Roster/History.vue resources/js/pages/Intelligence/Sharing/Index.vue resources/js/pages/Intelligence/Sharing/Manage.vue resources/js/pages/Public/Alliance/Show.vue resources/js/pages/Public/Alliance/Notice.vue resources/js/pages/Public/Recruitment/Apply.vue

      - name: Run full frontend checks
        run: npm run check

      - name: Commit final UI rewrite sweep
        shell: bash
        run: |
          if git diff --quiet -- resources/js/pages/; then
            echo "No remaining UI changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/
          git commit -m "finish full frontend ui rewrite"
          git push origin HEAD:agent/full-ui-rewrite
