name: Temporary Communications Formatter

on:
  push:
    branches:
      - communications-recipient-delivery-expansion

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: communications-recipient-delivery-expansion
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --no-audit --no-fund
      - name: Apply deterministic cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('resources/js/pages/Accounts/Notifications/Index.vue')
          text = page.read_text()
          old = ':key="preferenceScope">\n              <p v-if="preferenceScope === \'governor\' && !governorHasRoutingOverride"'
          new = ':key="form.timezone">\n              <p v-if="preferenceScope === \'governor\' && !governorHasRoutingOverride"'
          if old not in text:
              raise SystemExit('Expected routing-policy template key was not found.')
          page.write_text(text.replace(old, new, 1))

          core = Path('resources/js/localization/messages/core/en.ts')
          core_text = core.read_text()
          obsolete = "    'notification-dismissed': 'Notification dismissed.',\n"
          if obsolete not in core_text:
              raise SystemExit('Expected obsolete notification-dismissed receipt was not found.')
          core.write_text(core_text.replace(obsolete, '', 1))
          PY
      - name: Format PHP
        run: vendor/bin/pint
      - name: Format frontend
        run: npx prettier --write resources/js/pages/Accounts/Notifications/Index.vue resources/js/localization/communications-recipient-delivery-labels.ts resources/js/localization/loader.ts resources/js/localization/messages/core/en.ts public/service-worker.js
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Contexts/Communications/Delivery/Http/Controllers/NotificationCenterController.php app/Contexts/GameWorld/Players/Http/Middleware/HandleInertiaRequests.php resources/js/pages/Accounts/Notifications/Index.vue resources/js/localization/communications-recipient-delivery-labels.ts resources/js/localization/loader.ts resources/js/localization/messages/core/en.ts public/service-worker.js
          git commit -m 'chore: format communications recipient delivery expansion'
          git push origin HEAD:communications-recipient-delivery-expansion
