name: Accounts Sign-In UI Format

on:
  push:
    branches:
      - accounts-sign-in-methods-credential-evolution
    paths:
      - resources/js/localization/messages/account/en.ts
      - resources/js/localization/messages/auth/en.ts
      - resources/js/pages/Accounts/Access/ConfirmPassword.vue
      - resources/js/pages/Accounts/Access/Login.vue
      - resources/js/pages/Accounts/Access/Register.vue
      - resources/js/pages/Accounts/Governor/Profile.vue
      - .github/workflows/accounts-sign-in-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Format Accounts sign-in UI
        run: >-
          npx prettier --write
          resources/js/localization/messages/account/en.ts
          resources/js/localization/messages/auth/en.ts
          resources/js/pages/Accounts/Access/ConfirmPassword.vue
          resources/js/pages/Accounts/Access/Login.vue
          resources/js/pages/Accounts/Access/Register.vue
          resources/js/pages/Accounts/Governor/Profile.vue

      - name: Commit formatted files
        run: |
          if git diff --quiet -- resources/js/localization/messages/account/en.ts resources/js/localization/messages/auth/en.ts resources/js/pages/Accounts/Access/ConfirmPassword.vue resources/js/pages/Accounts/Access/Login.vue resources/js/pages/Accounts/Access/Register.vue resources/js/pages/Accounts/Governor/Profile.vue; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/localization/messages/account/en.ts resources/js/localization/messages/auth/en.ts resources/js/pages/Accounts/Access/ConfirmPassword.vue resources/js/pages/Accounts/Access/Login.vue resources/js/pages/Accounts/Access/Register.vue resources/js/pages/Accounts/Governor/Profile.vue
          git commit -m "style: format Accounts sign-in UI"
          git push origin HEAD:${GITHUB_REF_NAME}
