name: Accounts Sign-In UI Format

on:
  push:
    branches:
      - accounts-sign-in-methods-credential-evolution
    paths:
      - resources/js/localization/messages/account/en.ts
      - resources/js/localization/messages/auth/en.ts
      - resources/js/localization/messages/core/en.ts
      - resources/js/pages/Accounts/Access/ConfirmPassword.vue
      - resources/js/pages/Accounts/Access/Login.vue
      - resources/js/pages/Accounts/Access/Register.vue
      - resources/js/pages/Accounts/Governor/Profile.vue
      - .github/workflows/accounts-sign-in-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Reconcile Accounts sign-in localization
        run: |
          python - <<'PY'
          from pathlib import Path

          profile = Path('resources/js/pages/Accounts/Governor/Profile.vue')
          content = profile.read_text()
          content = content.replace(
              '<p class="ks-kicker">Google</p>',
              "<p class=\"ks-kicker\">{{ t('accountExperience.account.googleSignIn') }}</p>",
          )
          profile.write_text(content)

          catalogue = Path('resources/js/localization/messages/core/en.ts')
          content = catalogue.read_text()
          anchor = "    'password-updated': 'Password updated.',\n"
          additions = (
              "    'passkey-renamed': 'Passkey renamed.',\n"
              "    'password-added': 'Password sign-in added.',\n"
              "    'password-removed': 'Password sign-in removed.',\n"
          )
          if "'passkey-renamed':" not in content:
              if anchor not in content:
                  raise SystemExit('Receipt catalogue anchor not found')
              content = content.replace(anchor, additions + anchor)
          catalogue.write_text(content)
          PY

      - name: Format Accounts sign-in UI
        run: >-
          npx prettier --write
          resources/js/localization/messages/account/en.ts
          resources/js/localization/messages/auth/en.ts
          resources/js/localization/messages/core/en.ts
          resources/js/pages/Accounts/Access/ConfirmPassword.vue
          resources/js/pages/Accounts/Access/Login.vue
          resources/js/pages/Accounts/Access/Register.vue
          resources/js/pages/Accounts/Governor/Profile.vue

      - name: Commit reconciled files
        run: |
          if git diff --quiet -- resources/js/localization/messages/account/en.ts resources/js/localization/messages/auth/en.ts resources/js/localization/messages/core/en.ts resources/js/pages/Accounts/Access/ConfirmPassword.vue resources/js/pages/Accounts/Access/Login.vue resources/js/pages/Accounts/Access/Register.vue resources/js/pages/Accounts/Governor/Profile.vue; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/localization/messages/account/en.ts resources/js/localization/messages/auth/en.ts resources/js/localization/messages/core/en.ts resources/js/pages/Accounts/Access/ConfirmPassword.vue resources/js/pages/Accounts/Access/Login.vue resources/js/pages/Accounts/Access/Register.vue resources/js/pages/Accounts/Governor/Profile.vue
          git commit -m "fix: complete Accounts action receipt localization"
          git push origin HEAD:${GITHUB_REF_NAME}

# Temporary implementation-only formatter. Remove before delivery closeout.
