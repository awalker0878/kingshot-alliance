name: UX P5A2 Format Helper

on:
  push:
    branches:
      - ux/ux-001-experience-localization
    paths:
      - .github/workflows/ux-p5a2-format-helper.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ux/ux-001-experience-localization
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format Event Detail
        run: npx prettier --write resources/js/pages/Alliance/Events/Show.vue
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add resources/js/pages/Alliance/Events/Show.vue
          git diff --cached --quiet && exit 0
          git commit -m "Format UX-P5 event detail"
          git push origin HEAD:ux/ux-001-experience-localization
