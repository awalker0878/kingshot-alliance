name: P5 Alignment Repair

on:
  push:
    branches:
      - architecture-v2
    paths:
      - '.github/workflows/p5-alignment-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kingshot_test
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_test
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - name: Configure PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Verify schema
        run: php artisan migrate --force

      - name: Apply P5 ownership repair
        shell: bash
        run: |
          set -euo pipefail
          sed -i "/Path('tests\/Feature\/KingPerks').rmdir()/d" .github/p5_alignment_repair.py
          python3 .github/p5_alignment_repair.py

      - name: Format P5 contracts
        run: >-
          vendor/bin/pint
          app/Contexts/GameWorld/Governance/Services/KingdomMutationAuthority.php
          app/Contexts/Operations
          tests/Architecture/ArchitectureV2OperationsTest.php
          tests/Feature/Operations

      - name: Run P5 contracts
        run: >-
          php artisan test
          tests/Architecture/ArchitectureV2OperationsTest.php
          tests/Feature/Operations
          tests/Unit/Operations

      - name: Larastan P5 ownership
        run: >-
          vendor/bin/phpstan analyse --memory-limit=1536M
          app/Contexts/GameWorld/Governance/Services/KingdomMutationAuthority.php
          app/Contexts/Operations

      - name: Commit P5 alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p5-alignment-repair.yml .github/p5_alignment_repair.py
          git add app tests
          git commit -m 'test: align P5 acceptance with Operations ownership'
          git push origin HEAD:architecture-v2
