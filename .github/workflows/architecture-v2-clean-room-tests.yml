name: Architecture V2 Clean-Room Test Cutover

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/scripts/arch_v2_clean_room_tests.py'
      - '.github/scripts/arch_v2_clean_room_test_fixups.py'
      - '.github/workflows/architecture-v2-clean-room-tests.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: architecture-v2-clean-room-tests
  cancel-in-progress: false

jobs:
  cutover:
    name: Replace legacy tests with clean-room V2 suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kingshot_test
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_test
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Check out architecture-v2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate clean-room V2 tests from docs and final owners
        run: python3 .github/scripts/arch_v2_clean_room_tests.py

      - name: Apply clean-room harness corrections
        run: python3 .github/scripts/arch_v2_clean_room_test_fixups.py

      - name: Refresh Composer test autoload
        run: composer dump-autoload --no-interaction

      - name: Verify old tests are physically gone
        shell: bash
        run: |
          set -euo pipefail
          test -d tests/v2
          test "$(find tests -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)" = "v2"
          test ! -d tests/Feature
          test ! -d tests/Architecture
          test ! -d tests/Integration
          test ! -d tests/Performance
          test ! -d tests/TenantIsolation
          test ! -d tests/Unit
          test ! -d tests/RewriteInput
          bad="$(find tests/v2 -type f -name '*Test.php' ! -name '*V2Test.php' ! -path 'tests/v2/TestCase.php' ! -path 'tests/v2/Support/*' -print)"
          test -z "$bad" || { echo "$bad"; exit 1; }
          legacy="$(grep -R -n --include='*.php' 'App\\Domain\\' tests/v2 2>/dev/null || true)"
          test -z "$legacy" || { echo "$legacy"; exit 1; }

      - name: Format clean-room suite
        run: vendor/bin/pint tests/v2

      - name: Verify clean-room formatting
        run: vendor/bin/pint --test tests/v2

      - name: Verify PostgreSQL 18 fresh schema
        run: php artisan migrate:fresh --force

      - name: Run warning-free clean-room V2 PHPUnit suite
        run: >-
          php artisan test tests/v2
          --display-warnings
          --display-deprecations
          --display-phpunit-deprecations
          --fail-on-warning
          --fail-on-risky

      - name: Larastan all final V2 owners
        run: >-
          vendor/bin/phpstan analyse --memory-limit=1536M
          app/Contexts
          app/Shared
          app/Workflows
          app/ReadModels
          bootstrap/app.php
          bootstrap/providers.php
          routes

      - name: Configure Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify clean-room visual test discovery
        run: npx playwright test --list

      - name: Verify generated permanent V2 gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q "<directory>tests/v2</directory>" phpunit.xml
          ! grep -q "tests/Feature" phpunit.xml
          grep -q "testDir: './tests/v2/Visual'" playwright.config.ts
          grep -q "tests/v2" .github/workflows/architecture-v2-verification.yml
          grep -q "clean-room test suite" docs/codebase/testing.md

      - name: Commit verified clean-room test replacement
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin architecture-v2
          if [ "$(git rev-parse origin/architecture-v2)" != "$(git rev-parse HEAD)" ]; then
            echo "architecture-v2 advanced during verification; refusing non-fast-forward clean-room commit."
            exit 1
          fi

          # GitHub Actions tokens cannot update workflow files without workflows permission.
          # Preserve the checked-in verifier here and update it separately through the GitHub connector.
          git restore --source=HEAD -- .github/workflows/architecture-v2-verification.yml
          rm -rf playwright-report test-results
          rm .github/scripts/arch_v2_clean_room_tests.py
          rm .github/scripts/arch_v2_clean_room_test_fixups.py
          rm .github/workflows/architecture-v2-clean-room-tests.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ARCH-V2-TESTS: replace legacy suite with clean-room V2 tests"
          git push origin HEAD:architecture-v2
