name: Assistant UX Reconcile

on:
  pull_request:
    branches: [main]
    paths:
      - 'resources/js/pages/Assistant/Index.vue'
      - '.github/workflows/assistant-ux-reconcile.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Reconcile Assistant UX contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('resources/js/pages/Assistant/Index.vue')
          text = path.read_text()
          replacements = [
              (
                  "type AssistantPrompt = 'swordland_roster' | 'next_event' | 'bear_hunt_guide';",
                  "type AssistantPrompt = 'swordland_roster' | 'next_event' | 'bear_hunt_guide' | 'observation';",
              ),
              (
                  "const defaultPromptIds: AssistantPrompt[] = ['swordland_roster', 'next_event', 'bear_hunt_guide'];",
                  "const defaultPromptIds: AssistantPrompt[] = [\n  'swordland_roster',\n  'next_event',\n  'bear_hunt_guide',\n  'observation',\n];",
              ),
              (
                  "function promptLabel(prompt: AssistantPrompt): string {\n  if (prompt === 'swordland_roster') return t('assistant.prompts.swordland');\n  if (prompt === 'next_event') return t('assistant.prompts.nextEvent');\n  return t('assistant.prompts.bearGuide');\n}",
                  "function promptLabel(prompt: AssistantPrompt): string {\n  if (prompt === 'swordland_roster') return t('assistant.prompts.swordland');\n  if (prompt === 'next_event') return t('assistant.prompts.nextEvent');\n  if (prompt === 'bear_hunt_guide') return t('assistant.prompts.bearGuide');\n  return t('assistant.prompts.observation');\n}",
              ),
              (
                  '<main id="main-content" class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 lg:py-10">',
                  '<div class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 lg:py-10">',
              ),
              (
                  '              :aria-describedby="requestError ? \'assistant-request-status\' : undefined"',
                  '              aria-describedby="assistant-input-hint assistant-request-status"',
              ),
              (
                  '              <p class="text-xs text-[var(--ks-muted)]">',
                  '              <p id="assistant-input-hint" class="text-xs text-[var(--ks-muted)]">',
              ),
              (
                  '<p id="assistant-request-status" class="sr-only" aria-live="polite">\n              {{ busy ? t(\'assistant.asking\') : (requestError ?? \'\') }}\n            </p>',
                  '<p id="assistant-request-status" class="sr-only" role="status" aria-live="polite">\n              {{ busy ? t(\'assistant.asking\') : (requestError ?? latestAnnouncement) }}\n            </p>',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected UX fragment not found: {old[:90]!r}')
              text = text.replace(old, new, 1)
          marker = "const suggestedQuestions = computed<PromptOption[]>(() => {\n"
          if marker not in text:
              raise SystemExit('Suggested questions marker missing')
          insert_after = "  return prompts.map((id) => ({ id, label: promptLabel(id) }));\n});\n"
          if insert_after not in text:
              raise SystemExit('Suggested questions closing fragment missing')
          text = text.replace(
              insert_after,
              insert_after + "\nconst latestAnnouncement = computed(() => {\n  const latest = turns.value.at(-1);\n  return latest ? answerText(latest.response) : '';\n});\n",
              1,
          )
          closing = "    </main>\n  </AppLayout>"
          if closing not in text:
              raise SystemExit('Assistant nested main closing marker missing')
          text = text.replace(closing, "    </div>\n  </AppLayout>", 1)
          path.write_text(text)
          PY
          npx prettier --write resources/js/pages/Assistant/Index.vue
          rm .github/workflows/assistant-ux-reconcile.yml
          git diff --check
      - name: Commit UX reconciliation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/js/pages/Assistant/Index.vue .github/workflows/assistant-ux-reconcile.yml
          git commit -m 'fix(assistant): complete accessible localized UX states'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
