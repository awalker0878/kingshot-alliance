name: Kingdom Map spatial artifact preparation

# Temporary object-only publication transport; remove before merge readiness.
# Uses an already captured immutable evidence artifact. No upstream code execution,
# runtime database, ref update, merge or deployment is performed by this workflow.
on:
  push:
    branches: [astra/kingdom-map-workspace]
    paths: [.github/workflows/kingdom-map-spatial-artifact-preparation.yml]
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    if: github.repository == 'awalker0878/kingshot-alliance' && github.actor == 'awalker0878'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Retrieve the exact previously captured evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34734327953 --repo awalker0878/kingshot-alliance --name kingdom-map-resource-source --dir "$RUNNER_TEMP/evidence"
      - name: Generate and test source-derived artifacts without executing upstream code
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test tests/Contexts/GameWorld/KingdomMaps/Frontend/SpatialSource.test.ts
          node scripts/import-kingdom-map-spatial-source.mjs "$RUNNER_TEMP/evidence/ksmapper-core.js" "$RUNNER_TEMP/evidence/kingshot-resources-source.json" "$RUNNER_TEMP/spatial" > "$RUNNER_TEMP/generation-receipt.json"
      - name: Create only checksum-verified Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          expected = {
              'kingshot-terrain-2026-09-13.json': '877cdfb1901251783914d6ae4a1610e59f2adf3510107eaace3958e57dcfcfc1',
              'kingshot-resources-2026-09-13.json': '279977c38ffbbf7ff0fa6530098d512c0a49869a45f3b043718eb421bf9156cd',
          }
          receipts = []
          for filename, checksum in expected.items():
              raw = (root / 'spatial' / filename).read_bytes()
              if len(raw) > 2_000_000 or hashlib.sha256(raw).hexdigest() != checksum:
                  raise RuntimeError('Generated bytes differ from the locally reviewed artifact: ' + filename)
              response = subprocess.check_output([
                  'gh', 'api', '--method', 'POST', 'repos/awalker0878/kingshot-alliance/git/blobs', '--input', '-'
              ], input=json.dumps({'content': base64.b64encode(raw).decode(), 'encoding': 'base64'}).encode())
              blob = json.loads(response)
              expected_blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if blob['sha'] != expected_blob:
                  raise RuntimeError('Remote blob differs from reviewed bytes')
              receipts.append({'path': 'resources/data/kingdom-maps/artifacts/' + filename, 'bytes': len(raw), 'sha256': checksum, 'blob_sha': blob['sha']})
          out = root / 'spatial-receipt'
          out.mkdir()
          (out / 'receipt.json').write_text(json.dumps({'prepared_from_sha': os.environ['GITHUB_SHA'], 'source_artifact_id': 10310546321, 'files': receipts, 'ref_updated': False, 'upstream_code_executed': False}, indent=2) + '\n')
          (out / 'generation-receipt.json').write_bytes((root / 'generation-receipt.json').read_bytes())
          print((out / 'receipt.json').read_text())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kingdom-map-spatial-blob-receipt
          path: ${{ runner.temp }}/spatial-receipt
          retention-days: 1
          if-no-files-found: error
