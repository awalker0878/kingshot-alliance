name: Event UI Typecheck Fix

on:
  push:
    branches:
      - feature/event-contribution-history-p0

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/event-contribution-history-p0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fix Event form typings
        run: |
          python - <<'PY'
          from pathlib import Path

          manage = Path('resources/js/pages/Events/Manage.vue')
          text = manage.read_text()
          marker = "import { useLocale } from '../../localization';\n"
          alias = "\ntype FormDataValue = string | number | boolean | null | FormDataValue[] | { [key: string]: FormDataValue };\n"
          if alias.strip() not in text:
              text = text.replace(marker, marker + alias, 1)
          text = text.replace(
              "startsAt: string; endsAt: string; timezone: string; status: string; instructions: string | null; settings: Record<string, unknown>;",
              "startsAt: string; endsAt: string; timezone: string; status: string; instructions: string | null; settings: { [key: string]: FormDataValue };",
              1,
          )
          # Manage.vue has a differently formatted event declaration; replace its exact settings field too.
          text = text.replace("recurrenceUntilLocal: string | null; settings: Record<string, unknown>; capabilities:", "recurrenceUntilLocal: string | null; settings: { [key: string]: FormDataValue }; capabilities:", 1)
          manage.write_text(text)

          show = Path('resources/js/pages/Events/Show.vue')
          text = show.read_text()
          text = text.replace("const registrationForm = useForm({});", "const registrationForm = useForm<{ registration?: string }>({});", 1)
          show.write_text(text)
          PY
      - name: Format and validate
        run: |
          npx prettier --write resources/js/pages/Events/Manage.vue resources/js/pages/Events/Show.vue
          npx eslint resources/js/pages/Events/Manage.vue resources/js/pages/Events/Show.vue
          npm run types:check
      - name: Commit validated type fixes and remove workflow
        run: |
          git rm .github/workflows/event-ui-typecheck-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/js/pages/Events/Manage.vue resources/js/pages/Events/Show.vue
          git commit -m 'Fix Event UI form typing'
          git push origin HEAD:feature/event-contribution-history-p0
