name: Event History Pint Diagnostic

on:
  push:
    branches:
      - feature/event-contribution-history-p0

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Apply Pint to changed PHP
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.php')
          if ((${#files[@]})); then
            vendor/bin/pint "${files[@]}"
          fi
      - name: Print exact formatter diff
        run: git diff -- '*.php'
