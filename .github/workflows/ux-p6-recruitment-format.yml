name: UX P6 Recruitment formatter

on:
  workflow_dispatch:
  push:
    branches:
      - ux/ux-001-experience-localization
    paths:
      - .ux-p6-recruitment-format-trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out UX branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ux/ux-001-experience-localization

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply pinned Prettier
        run: npx prettier --write resources/js/localization/messages/recruitment.ts resources/js/pages/Alliance/Recruitment/Candidate.vue resources/js/pages/Alliance/Recruitment/Manage.vue resources/js/localization/messages/index.ts

      - name: Restore package script
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts['format:check'] = 'prettier --check resources/';
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Repair shell assertion and apply Pint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/Architecture/RecruitmentExperienceTest.php')
          text = p.read_text()
          text = text.replace('self::assertStringContainsString("\'name\' => (string) $user->name", $source);', 'self::assertStringContainsString("\'name\' => (string) \\$user->name", $source);')
          text = text.replace('self::assertStringContainsString("\'email\' => (string) $user->email", $source);', 'self::assertStringContainsString("\'email\' => (string) \\$user->email", $source);')
          p.write_text(text)
          PY
          vendor/bin/pint app/Domain/Recruitment/Http/Controllers/RecruitmentManagementController.php app/Domain/Recruitment/Http/Controllers/RecruitmentCandidateController.php tests/Feature/Recruitment/RecruitmentAccessibilityGuardTest.php tests/Architecture/RecruitmentExperienceTest.php

      - name: Commit canonical recruitment formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json resources/js/localization/messages/recruitment.ts resources/js/pages/Alliance/Recruitment/Candidate.vue resources/js/pages/Alliance/Recruitment/Manage.vue resources/js/localization/messages/index.ts app/Domain/Recruitment/Http/Controllers/RecruitmentManagementController.php app/Domain/Recruitment/Http/Controllers/RecruitmentCandidateController.php tests/Feature/Recruitment/RecruitmentAccessibilityGuardTest.php tests/Architecture/RecruitmentExperienceTest.php
          if ! git diff --cached --quiet; then
            git commit -m "Format UX-P6 recruitment experience"
            git push origin HEAD:ux/ux-001-experience-localization
          fi
