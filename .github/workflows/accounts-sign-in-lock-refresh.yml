name: Accounts Sign-In Dependency Lock Refresh

on:
  push:
    branches:
      - accounts-sign-in-methods-credential-evolution
    paths:
      - composer.json
      - composer.lock
      - package.json
      - package-lock.json
      - .github/workflows/accounts-sign-in-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-locks:
    if: ${{ !contains(github.event.head_commit.message, 'chore: refresh Accounts dependency locks') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Refresh Composer lock
        run: composer update laravel/passkeys --with-all-dependencies --no-interaction --no-progress

      - name: Refresh npm lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lock files
        run: |
          if git diff --quiet -- composer.lock package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock package-lock.json
          git commit -m "chore: refresh Accounts dependency locks"
          git push origin "HEAD:${GITHUB_REF_NAME}"
