name: Language Alignment Format Artifact

on:
  push:
    branches:
      - product/kingshot-language-alignment
  pull_request:
    paths:
      - 'resources/**'
      - '.github/workflows/language-alignment-format-artifact.yml'

permissions:
  contents: write

jobs:
  format:
    name: Produce formatted frontend artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: product/kingshot-language-alignment

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Format resources
        run: npm run format

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- resources; then
            echo 'Resources already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources
          git commit -m 'Format language alignment frontend'
          git push origin HEAD:product/kingshot-language-alignment
