name: Finalize KingShot Language Alignment

on:
  pull_request:
    paths:
      - 'scripts/_finalize_event_history_locales_*.py'
      - 'scripts/_finalize_language_surfaces.py'
      - '.github/workflows/language-alignment-format-artifact.yml'

permissions:
  contents: read

jobs:
  finalize:
    name: Export final language alignment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out alignment branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: product/kingshot-language-alignment

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply translated Event History catalogues
        run: |
          python scripts/_finalize_event_history_locales_a.py
          python scripts/_finalize_event_history_locales_b.py
          python scripts/_finalize_event_history_locales_c.py

      - name: Apply final presentation language cleanup
        run: python scripts/_finalize_language_surfaces.py

      - name: Format changed frontend sources
        run: npx prettier --write resources/ tests/v3/Visual/ApplicationShell.spec.ts .github/workflows/intelligence-verification.yml

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/_finalize_event_history_locales_a.py
          rm scripts/_finalize_event_history_locales_b.py
          rm scripts/_finalize_event_history_locales_c.py
          rm scripts/_finalize_language_surfaces.py
          rm .github/workflows/language-alignment-format-artifact.yml
          git diff --name-only > changed-files.txt
          git ls-files --others --exclude-standard >> changed-files.txt
          sort -u -o changed-files.txt changed-files.txt
          git diff --name-only --diff-filter=D > deleted-files.txt
          mkdir -p finalized
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            [ -e "$file" ] || continue
            mkdir -p "finalized/$(dirname "$file")"
            cp "$file" "finalized/$file"
          done < changed-files.txt
          cat changed-files.txt

      - name: Upload finalized language tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-language-alignment
          path: |
            finalized
            changed-files.txt
            deleted-files.txt
          if-no-files-found: error
          retention-days: 1
