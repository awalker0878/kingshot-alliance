name: Finalize KingShot Language Alignment

on:
  pull_request:
    paths:
      - 'scripts/_finalize_event_history_locales_*.py'
      - 'scripts/_finalize_language_surfaces.py'
      - '.github/workflows/language-alignment-format-artifact.yml'

permissions:
  contents: write

jobs:
  finalize:
    name: Publish final language alignment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out alignment branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: product/kingshot-language-alignment

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply translated Event History catalogues
        run: |
          python scripts/_finalize_event_history_locales_a.py
          python scripts/_finalize_event_history_locales_b.py
          python scripts/_finalize_event_history_locales_c.py

      - name: Apply final presentation language cleanup
        run: python scripts/_finalize_language_surfaces.py

      - name: Keep workflow files out of the generated product commit
        run: git checkout -- .github/workflows/intelligence-verification.yml

      - name: Format changed product sources
        run: npx prettier --write resources/ tests/v3/Visual/ApplicationShell.spec.ts

      - name: Remove temporary helper scripts
        shell: bash
        run: |
          rm scripts/_finalize_event_history_locales_a.py
          rm scripts/_finalize_event_history_locales_b.py
          rm scripts/_finalize_event_history_locales_c.py
          rm scripts/_finalize_language_surfaces.py

      - name: Commit final product language alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/language-alignment-format-artifact.yml
          if git diff --cached --quiet; then
            echo 'No product-language changes to commit.'
            exit 0
          fi
          git commit -m 'Complete final KingShot language alignment [skip ci]'
          git push origin HEAD:product/kingshot-language-alignment
