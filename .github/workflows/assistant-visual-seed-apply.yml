name: Assistant Visual Seed Apply

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/assistant-visual-seed-apply.yml'
      - '.github/workflows/visual-regression.yml'
      - 'tests/v3/Fixtures/AllianceAssistantVisualFixture.php'
      - 'tests/v3/Visual/AllianceAssistant.spec.ts'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Register Assistant visual fixture and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/visual-regression.yml')
          text = path.read_text()
          anchor = "          php artisan tinker --execute='\\Tests\\v3\\Fixtures\\KingdomTransferVisualFixture::seed();'\n"
          addition = anchor + "          php artisan tinker --execute='\\Tests\\v3\\Fixtures\\AllianceAssistantVisualFixture::seed();'\n"
          if anchor not in text:
              raise SystemExit('Visual fixture anchor not found')
          if 'AllianceAssistantVisualFixture::seed()' not in text:
              text = text.replace(anchor, addition, 1)
          path.write_text(text)
          PY
          rm .github/workflows/assistant-visual-seed-apply.yml
          git diff --check
      - name: Commit visual fixture registration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/visual-regression.yml .github/workflows/assistant-visual-seed-apply.yml
          git commit -m 'test(assistant): register visual fixture'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
