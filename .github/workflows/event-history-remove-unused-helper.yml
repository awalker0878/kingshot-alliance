name: Event History Remove Unused Helper

on:
  push:
    branches:
      - feature/event-contribution-history-p0

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/event-contribution-history-p0
          fetch-depth: 0
      - name: Remove unused attendance helper
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/Domain/Events/Queries/EventPlayerOccurrenceEvidenceQuery.php')
          text = path.read_text()
          block = '''    private function orWhereAttendance(Builder $query, Player $player, string $occurrenceColumn, string $status): Builder
          {
              return $query->orWhereExists(static function (Builder $subquery) use ($player, $occurrenceColumn, $status): void {
                  $subquery->selectRaw('1')
                      ->from('event_attendance as participation_attendance')
                      ->whereColumn('participation_attendance.occurrence_id', $occurrenceColumn)
                      ->where('participation_attendance.player_id', $player->id)
                      ->where('participation_attendance.status', $status);
              });
          }

          '''
          if block not in text:
              raise SystemExit('Unused helper block not found; refusing broad edit.')
          path.write_text(text.replace(block, '', 1))
      - name: Commit exact removal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Domain/Events/Queries/EventPlayerOccurrenceEvidenceQuery.php
          git commit -m 'Remove unused Event attendance query helper'
          git pull --rebase origin feature/event-contribution-history-p0
          git push origin HEAD:feature/event-contribution-history-p0
