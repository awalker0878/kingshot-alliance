name: CV4 Format Repair

on:
  pull_request:
    paths:
      - 'resources/**'
      - '.github/workflows/cv4-format-repair.yml'

permissions:
  contents: write

concurrency:
  group: cv4-format-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply repository lint and formatting
        run: |
          npm run lint
          npm run format

      - name: Commit deterministic formatting
        shell: bash
        run: |
          if git diff --quiet -- resources; then
            echo 'No formatter changes required.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources
          git commit -m 'format CV4 frontend with repository tooling'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
