name: Localization PR1 regeneration replay
on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  regeneration:
    if: github.head_ref == 'codex/localization-pr1-critical-baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source with translation baseline history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install reproducible frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch pinned original translation drafts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: 40730353999
          pattern: translation-draft-*
          merge-multiple: true
          path: .translation-output
          github-token: ${{ github.token }}

      - name: Verify saved drafts are complete
        shell: bash
        run: |
          for lang in ar de es fr id it ja ko pl pt-BR ru th tr vi zh-CN zh-TW; do
            test -s ".translation-output/${lang}.jsonl" || {
              echo "Missing original draft: ${lang}"; exit 1;
            }
          done

      - name: Reconstruct immutable pre-translation input
        run: node scripts/localization/export-input.mjs .translation-baseline-input 910544783e5c6897ea26a7aa239dcde8f0789cc1

      - name: Replay full catalogue compilation with preserved corrections
        run: |
          node scripts/localization/compile-catalogues.mjs .translation-baseline-input .translation-output
          npx prettier --write "resources/js/localization/messages/**/*.ts"

      - name: Verify recompilation produces no file diff
        run: |
          git diff --exit-code -- resources/js/localization/messages lang
          npm run check:localization-semantics
          npm run check:localization-completeness

      - name: Upload compiler diagnostic report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localization-pr1-regeneration-report
          path: .translation-output/compile-report.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
