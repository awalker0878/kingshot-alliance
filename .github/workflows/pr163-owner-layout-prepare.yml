name: PR 163 owner layout source preparation

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  source-preparation:
    if: >-
      github.repository == 'awalker0878/kingshot-alliance' &&
      github.event.pull_request.number == 163 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'astra/codebase-hardening' &&
      github.event.review.user.login == 'awalker0878' &&
      github.event.review.state == 'commented' &&
      github.event.review.body == 'Prepare the owner-first source inventory only; do not run tests or change refs.' &&
      github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.review.commit_id }}
          persist-credentials: false
      - name: Archive exact tracked source without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/owner-source.sha"
          git ls-tree -r HEAD > "$RUNNER_TEMP/owner-source-tree.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/owner-source.tar.gz" HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-layout-source
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/owner-source.sha
            ${{ runner.temp }}/owner-source-tree.txt
            ${{ runner.temp }}/owner-source.tar.gz
