name: Governor Progression Format Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feature/screenshot-intake-governor-progression-main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/screenshot-intake-governor-progression-main
          fetch-depth: 0
      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Format Governor Progression frontend files
        run: >-
          npx prettier --write
          resources/js/components/progression/GovernorProgressionScreenshotIntake.vue
          resources/js/components/transfers/TransferEvidencePanel.vue
          resources/js/pages/Kingdom/Progression/Governor.vue
      - name: Commit formatting repair
        shell: bash
        run: |
          if git diff --quiet -- \
            resources/js/components/progression/GovernorProgressionScreenshotIntake.vue \
            resources/js/components/transfers/TransferEvidencePanel.vue \
            resources/js/pages/Kingdom/Progression/Governor.vue; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            resources/js/components/progression/GovernorProgressionScreenshotIntake.vue \
            resources/js/components/transfers/TransferEvidencePanel.vue \
            resources/js/pages/Kingdom/Progression/Governor.vue
          git commit -m 'Format Governor Progression frontend'
          git push origin HEAD:feature/screenshot-intake-governor-progression-main
