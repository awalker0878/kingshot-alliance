name: Governor Progression Source Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feature/screenshot-intake-governor-progression-main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/screenshot-intake-governor-progression-main
          fetch-depth: 0
      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Expose source filename in evidence history
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('resources/js/components/progression/GovernorProgressionScreenshotIntake.vue')
          text = path.read_text()
          if '{{ item.originalName }}' not in text:
              needle = '''              </div>\n              <p class="mt-2 text-xs text-[var(--ks-muted)]">\n                {{ t('progression.expectedClass') }}: {{ labelForClass(item.expectedKind) }} ·\n'''
              replacement = '''              </div>\n              <p class="mt-2 text-xs break-all text-[var(--ks-muted)]">\n                {{ item.originalName }}\n              </p>\n              <p class="mt-1 text-xs text-[var(--ks-muted)]">\n                {{ t('progression.expectedClass') }}: {{ labelForClass(item.expectedKind) }} ·\n'''
              if needle not in text:
                  raise SystemExit('Expected Governor Progression evidence heading block was not found.')
              text = text.replace(needle, replacement, 1)
              path.write_text(text)
          PY
          npx prettier --write resources/js/components/progression/GovernorProgressionScreenshotIntake.vue
      - name: Commit source repair
        shell: bash
        run: |
          if git diff --quiet -- resources/js/components/progression/GovernorProgressionScreenshotIntake.vue; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/js/components/progression/GovernorProgressionScreenshotIntake.vue
          git commit -m 'Show Governor Progression evidence source filename'
          git push origin HEAD:feature/screenshot-intake-governor-progression-main
