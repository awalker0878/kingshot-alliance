name: Architecture V2 P5 History Imports

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/architecture-v2-p5-history-imports.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0
      - name: Align Intelligence Event history imports to capability owners
        shell: bash
        run: |
          set -euo pipefail
          file='app/Contexts/Intelligence/EventAnalysis/Queries/EventOrganizationHistoryQuery.php'
          sed -i \
            -e 's#App\\Contexts\\Operations\\EventCore\\Models\\EventAllianceResult#App\\Contexts\\Operations\\Results\\Models\\EventAllianceResult#g' \
            -e 's#App\\Contexts\\Operations\\EventCore\\Models\\EventAllianceResultMetric#App\\Contexts\\Operations\\Results\\Models\\EventAllianceResultMetric#g' \
            -e 's#App\\Contexts\\Operations\\EventCore\\Models\\EventMetricDefinition#App\\Contexts\\Operations\\Results\\Models\\EventMetricDefinition#g' \
            -e 's#App\\Contexts\\Operations\\EventCore\\Models\\EventPlayerContext#App\\Contexts\\Operations\\Participation\\Models\\EventPlayerContext#g' \
            -e 's#App\\Contexts\\Operations\\EventCore\\Models\\EventPlayerResult#App\\Contexts\\Operations\\Results\\Models\\EventPlayerResult#g' \
            -e 's#App\\Contexts\\Operations\\EventCore\\Models\\EventPlayerResultMetric#App\\Contexts\\Operations\\Results\\Models\\EventPlayerResultMetric#g' \
            -e 's#App\\Contexts\\Operations\\EventCore\\Models\\EventResult#App\\Contexts\\Operations\\Results\\Models\\EventResult#g' \
            -e 's#App\\Contexts\\Operations\\EventCore\\Models\\EventResultMetric#App\\Contexts\\Operations\\Results\\Models\\EventResultMetric#g' \
            "$file"
          php -l "$file"
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Contexts/Intelligence/EventAnalysis/Queries/EventOrganizationHistoryQuery.php
          git diff --cached --quiet && exit 0
          git commit -m 'fix(arch-v2): align Event history imports to capability owners'
          git push origin HEAD:architecture-v2
