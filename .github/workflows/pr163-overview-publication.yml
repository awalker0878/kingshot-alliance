name: PR 163 overview source preparation
on:
  pull_request_review:
    types: [submitted]
permissions:
  contents: write
jobs:
  prepare:
    if: >-
      github.repository == 'awalker0878/kingshot-alliance' &&
      github.event.pull_request.number == 163 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'astra/codebase-hardening' &&
      github.event.review.user.login == 'awalker0878' &&
      github.event.review.state == 'commented' &&
      github.event.review.body == 'Prepare verified overview objects only; no commits or refs.' &&
      github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.review.commit_id }}
          persist-credentials: false
      - name: Validate every source and result before preparing objects
        env:
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          base='https://api.github.com/repos/awalker0878/kingshot-alliance/git/blobs'
          headers={'Authorization':'Bearer '+os.environ['SOURCE_TOKEN'],'Accept':'application/vnd.github+json'}
          def digest(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          parts=[]
          for sha in ['f686788ffe9a29dda3abb91e74bc141c5d26c859','42aec6ab4d95c72c24f594872f537db5d8f0f69d']:
              with urllib.request.urlopen(urllib.request.Request(base+'/'+sha,headers=headers),timeout=30) as response:
                  data=base64.b64decode(json.load(response)['content'])
              assert digest(data)==sha
              parts.append(data)
          packed=base64.b64decode(b''.join(parts),validate=True)
          assert len(packed)==17608 and hashlib.sha256(packed).hexdigest()=='ce57cc107336a70724276e403d243745fafcc56355d26610e3cf8bf477c5b5b6'
          decoder=lzma.LZMADecompressor(memlimit=16777216)
          raw=decoder.decompress(packed,max_length=63369)
          assert decoder.eof and not decoder.unused_data and len(raw)==63368
          assert hashlib.sha256(raw).hexdigest()=='250b2dd0d996db3d450737fa7abd118312872d6e367868206ded3d33d0ce0294'
          payload=json.loads(raw)
          assert payload['id']=='HARD-095-overview-coverage' and len(payload['changes'])==54
          prepared={}
          for change in payload['changes']:
              path=pathlib.Path(change['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ['app','tests','docs','resources']
              assert not any(p.is_symlink() for p in [path,*path.parents])
              assert str(path) not in prepared
              old=path.read_bytes() if path.exists() else b''
              assert (digest(old) if path.exists() else None)==change['before'],str(path)+' source changed'
              lines=old.decode().splitlines(keepends=True)
              prior=0
              for start,end,text in change['hunks']:
                  assert isinstance(start,int) and isinstance(end,int) and isinstance(text,str)
                  assert prior<=start<=end<=len(lines)
                  prior=end
              for start,end,text in reversed(change['hunks']):
                  lines[start:end]=text.splitlines(keepends=True)
              data=''.join(lines).encode()
              assert digest(data)==change['after'],str(path)+' result mismatch'
              prepared[str(path)]=(data,change['after'])
          result=[]
          for path,(data,expected) in prepared.items():
              request=urllib.request.Request(base,data=json.dumps({'content':data.decode(),'encoding':'utf-8'}).encode(),headers=headers,method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:
                  assert json.load(response)['sha']==expected
              result.append({'path':path,'sha':expected})
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'overview-prepared'
          output.mkdir()
          receipt={'source_revision':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'objects':result,'commits_or_refs_written':False}
          (output/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: overview-exact-source
          path: ${{ runner.temp }}/overview-prepared
          retention-days: 3
          if-no-files-found: error
