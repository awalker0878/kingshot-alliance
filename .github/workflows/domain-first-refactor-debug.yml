name: Run domain-first refactor with failure capture

on:
  push:
    branches:
      - agent/app-architecture-alignment

permissions:
  contents: write

concurrency:
  group: domain-first-refactor-debug
  cancel-in-progress: true

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/app-architecture-alignment
          fetch-depth: 0

      - name: Extract and run canonical refactor script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/domain-first-refactor.yml').read_text().splitlines()
          marker = '      - name: Move runtime code into canonical domains'
          start = lines.index(marker)
          run_index = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          body = []
          for line in lines[run_index + 1:]:
              if line == '      - name: Commit refactor':
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              elif line == '':
                  body.append('')
              else:
                  raise RuntimeError(f'Unexpected workflow line while extracting refactor: {line!r}')
          Path('/tmp/domain-refactor.sh').write_text('\n'.join(body) + '\n')
          PY

          set +e
          bash /tmp/domain-refactor.sh > /tmp/domain-refactor.log 2>&1
          status=$?
          set -e

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if [ "$status" -ne 0 ]; then
            {
              echo '# Domain-first refactor failure'
              echo
              echo 'The one-shot architecture refactor failed before commit. Exact runner output follows.'
              echo
              echo '```text'
              tail -n 500 /tmp/domain-refactor.log
              echo '```'
            } > docs/domains/REFACTOR_FAILURE.md
            git add docs/domains/REFACTOR_FAILURE.md
            git commit -m "Capture domain refactor failure"
            git push origin HEAD:agent/app-architecture-alignment
            exit 0
          fi

          rm -f docs/domains/REFACTOR_FAILURE.md
          git add -A
          git commit -m "Align app runtime with domain-first implementation plan"
          git push origin HEAD:agent/app-architecture-alignment
