name: ARCH V2 P6 Observation Source Fix

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/arch-v2-p6-observation-source-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out architecture-v2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - name: Fix observation provenance PHPDoc
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/Domain/Kingdoms/Actions/RecordKingdomAllianceObservation.php')
          text = path.read_text(encoding='utf-8')
          old = '/** @param array<string,mixed> $provenance @return array<string,string|null> */'
          new = '''/**
     * @param array<string, mixed> $provenance
     * @return array<string, string|null>
     */'''
          if old not in text:
              raise SystemExit('Expected machineProvenance PHPDoc was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'awalker0878'
          git config user.email '52688461+awalker0878@users.noreply.github.com'
          git add app/Domain/Kingdoms/Actions/RecordKingdomAllianceObservation.php
          git commit -m 'ARCH-V2-P6: type observation provenance contract'
          git push origin HEAD:architecture-v2
