name: Factual Progression Type Fix

on:
  push:
    branches:
      - feature/factual-governor-progression
    paths:
      - .github/workflows/progression-type-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  type-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out feature head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/factual-governor-progression
          fetch-depth: 0

      - name: Apply explicit PHPStan collection shapes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          dataset = Path('app/Contexts/GameWorld/Progression/Queries/ProgressionDatasetQuery.php')
          text = dataset.read_text()
          text = text.replace(
              '/** @param array<string,mixed> $release @return list<string> */\n    private function releaseFiles',
              '/**\n     * @param  array<string,mixed>  $release\n     * @return list<string>\n     */\n    private function releaseFiles',
          )
          text = text.replace(
              '        $normalized = [];\n        foreach ($files as $file) {',
              '        /** @var array<string,true> $normalized */\n        $normalized = [];\n        foreach ($files as $file) {',
              1,
          )
          text = text.replace(
              '/** @param array<string,mixed> $release @param list<array<string,mixed>> $documents */\n    private function validateSources',
              '/**\n     * @param  array<string,mixed>  $release\n     * @param  list<array<string,mixed>>  $documents\n     */\n    private function validateSources',
          )
          text = text.replace(
              '/** @param array<mixed> $value @param array<string,true> $sourceIds */\n    private function validateSourceReferencesRecursively',
              '/**\n     * @param  array<mixed>  $value\n     * @param  array<string,true>  $sourceIds\n     */\n    private function validateSourceReferencesRecursively',
          )
          dataset.write_text(text)

          family = Path('app/Contexts/GameWorld/Progression/Queries/ProgressionFamilyQuery.php')
          text = family.read_text()
          row_type = 'list<array{path:string,values:array<string,string|null>,sourceIds:list<string>,confidence:string|null}>'

          text = text.replace(
              '    private function heroSkillRows(ProgressionDataset $dataset): array\n    {\n        $rows = [];',
              '    private function heroSkillRows(ProgressionDataset $dataset): array\n    {\n        /** @var '+row_type+' $rows */\n        $rows = [];',
          )
          text = text.replace(
              "                $values = [\n                    'Hero' => (string) ($hero['name'] ?? ''),\n                    'Skill' => is_string($skill['name'] ?? null) ? $skill['name'] : 'Unknown',\n                ];",
              "                /** @var array<string,string|null> $values */\n                $values = [\n                    'Hero' => (string) ($hero['name'] ?? ''),\n                    'Skill' => is_string($skill['name'] ?? null) ? $skill['name'] : 'Unknown',\n                ];",
          )
          text = text.replace(
              "                        $values = [\n                            'Entity' => is_string($page['name'] ?? null) ? $page['name'] : null,\n                            'Table' => is_string($table['heading'] ?? null) ? $table['heading'] : null,\n                        ];",
              "                        /** @var array<string,string|null> $values */\n                        $values = [\n                            'Entity' => is_string($page['name'] ?? null) ? $page['name'] : null,\n                            'Table' => is_string($table['heading'] ?? null) ? $table['heading'] : null,\n                        ];",
          )
          text = text.replace(
              "        $rows = [];\n        $this->flattenDocumentRows(\n            $document['data'] ?? $document,",
              "        /** @var "+row_type+" $rows */\n        $rows = [];\n        $this->flattenDocumentRows(\n            $document['data'] ?? $document,",
          )
          text = text.replace(
              '/** @return list<array{path:string,values:array<string,string|null>,sourceIds:list<string>,confidence:string|null}> */\n    private function academyRows(array $document): array',
              '/**\n     * @param  array<string,mixed>  $document\n     * @return list<array{path:string,values:array<string,string|null>,sourceIds:list<string>,confidence:string|null}>\n     */\n    private function academyRows(array $document): array',
          )
          text = text.replace(
              '    private function academyRows(array $document): array\n    {\n        $rows = [];',
              '    private function academyRows(array $document): array\n    {\n        /** @var '+row_type+' $rows */\n        $rows = [];',
          )
          text = text.replace(
              "                $values = [\n                    'Tree' => is_string($technology['tree'] ?? null) ? $technology['tree'] : null,\n                    'Technology' => is_string($technology['name'] ?? null) ? $technology['name'] : null,\n                    'Max level' => isset($technology['max_level']) ? (string) $technology['max_level'] : null,\n                ];",
              "                /** @var array<string,string|null> $values */\n                $values = [\n                    'Tree' => is_string($technology['tree'] ?? null) ? $technology['tree'] : null,\n                    'Technology' => is_string($technology['name'] ?? null) ? $technology['name'] : null,\n                    'Max level' => isset($technology['max_level']) ? (string) $technology['max_level'] : null,\n                ];",
          )
          text = text.replace(
              '     * @param  list<array{path:string,values:array<string,string|null>,sourceIds:list<string>,confidence:string|null}>  $rows\n     * @param  list<string>  $sourceIds',
              '     * @param  list<array{path:string,values:array<string,string|null>,sourceIds:list<string>,confidence:string|null}>  $rows\n     * @param-out  list<array{path:string,values:array<string,string|null>,sourceIds:list<string>,confidence:string|null}>  $rows\n     * @param  list<string>  $sourceIds',
          )
          text = text.replace(
              '        $values = [];\n        $nested = [];',
              '        /** @var array<string,string|null> $values */\n        $values = [];\n        $nested = [];',
          )
          text = text.replace(
              '/** @param mixed $value @param array<string,string|null> $target */\n    private function flattenScalarValues',
              '/**\n     * @param  array<string,string|null>  $target\n     * @param-out  array<string,string|null>  $target\n     */\n    private function flattenScalarValues',
          )
          text = text.replace(
              '/** @param mixed $value @return list<string> */\n    private function stringList',
              '/**\n     * @return list<string>\n     */\n    private function stringList',
          )
          family.write_text(text)
          PY

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format and validate query types
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/pint app/Contexts/GameWorld/Progression/Queries/ProgressionDatasetQuery.php app/Contexts/GameWorld/Progression/Queries/ProgressionFamilyQuery.php
          vendor/bin/phpstan analyse --memory-limit=1G app/Contexts/GameWorld/Progression/Queries/ProgressionDatasetQuery.php app/Contexts/GameWorld/Progression/Queries/ProgressionFamilyQuery.php

      - name: Commit validated type contracts
        shell: bash
        run: |
          set -euo pipefail
          git add app/Contexts/GameWorld/Progression/Queries/ProgressionDatasetQuery.php app/Contexts/GameWorld/Progression/Queries/ProgressionFamilyQuery.php
          if git diff --cached --quiet; then
            echo 'Progression query type contracts are already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: type factual progression query collections'
          git push origin HEAD:feature/factual-governor-progression
