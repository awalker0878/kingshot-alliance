name: PR 163 resume source

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  source:
    if: >-
      github.repository == 'awalker0878/kingshot-alliance' &&
      github.event.pull_request.number == 163 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'astra/codebase-hardening' &&
      github.event.review.user.login == 'awalker0878' &&
      github.event.review.state == 'commented' &&
      github.event.review.body == 'Export exact history for HARD-095 continuation.' &&
      github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.review.commit_id }}
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked source and Git objects without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hardening-resume"
          git rev-parse HEAD > "$RUNNER_TEMP/hardening-resume/revision.txt"
          git rev-parse origin/main > "$RUNNER_TEMP/hardening-resume/main.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/hardening-resume/tree.txt"
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/hardening-resume/source.tar.gz"
          git bundle create "$RUNNER_TEMP/hardening-resume/repository.bundle" HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hardening-resume-source
          path: ${{ runner.temp }}/hardening-resume
          retention-days: 1
          if-no-files-found: error
