name: KingdomMaps Manifest Reconcile Once

on:
  push:
    branches:
      - kingdommaps-research-evidence-expansion

permissions:
  contents: write

concurrency:
  group: kingdom-maps-manifest-reconcile-once
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: kingdommaps-research-evidence-expansion

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Reconcile immutable facility checksum
        shell: bash
        run: |
          artifact='resources/data/kingdom-maps/artifacts/kingshot-facilities-2026-09-06.json'
          release='resources/data/kingdom-maps/kingshot-evidence-backed-2026-09-06-v2.json'
          hash="$(sha256sum "$artifact" | awk '{print $1}')"
          echo "Formatted facility artifact SHA-256: $hash"
          HASH="$hash" RELEASE="$release" node <<'NODE'
          const fs = require('node:fs');
          const path = process.env.RELEASE;
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data.artifacts.facilities.sha256 = process.env.HASH;
          fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          NODE
          npx prettier --write "$release"

      - name: Commit reconciled manifest
        shell: bash
        run: |
          release='resources/data/kingdom-maps/kingshot-evidence-backed-2026-09-06-v2.json'
          if git diff --quiet -- "$release"; then
            echo 'Manifest already matches formatted artifact.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$release"
          git commit -m 'Reconcile KingdomMaps facility artifact checksum'
          git push origin HEAD:kingdommaps-research-evidence-expansion
