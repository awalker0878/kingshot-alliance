name: Phase 6 export formatter

on:
  push:
    branches:
      - agent/phase-6-platform-scale-administration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/phase-6-platform-scale-administration
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/pint app/Domain/Platform/Services/AllianceDataExportService.php
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Domain/Platform/Services/AllianceDataExportService.php
          git commit -m "Format Phase 6 export service"
          git push origin HEAD:agent/phase-6-platform-scale-administration
