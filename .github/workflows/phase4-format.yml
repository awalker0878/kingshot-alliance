name: Phase 4 format closeout

on:
  push:
    branches:
      - agent/phase-4-recruitment

permissions:
  contents: write

concurrency:
  group: phase4-format-closeout
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Phase 4 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/phase-4-recruitment
          fetch-depth: 0
      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply repository Prettier formatting
        run: npx prettier --write resources/js/pages/Alliance/Recruitment/Manage.vue resources/js/pages/Alliance/Overview.vue
      - name: Commit formatted files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- resources/js/pages/Alliance/Recruitment/Manage.vue resources/js/pages/Alliance/Overview.vue; then
            exit 0
          fi
          git add resources/js/pages/Alliance/Recruitment/Manage.vue resources/js/pages/Alliance/Overview.vue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Format Phase 4 recruitment surfaces'
          git push origin HEAD:agent/phase-4-recruitment
