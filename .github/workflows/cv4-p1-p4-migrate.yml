name: CV4 P1-P4 Hard Cutover

on:
  push:
    branches:
      - agent/context-v4-convergence
    paths:
      - .github/workflows/cv4-p1-p4-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out convergence branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/context-v4-convergence
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Apply hard cutover
        run: node tools/cv4-p1-p4.mjs

      - name: Format changed source
        run: |
          vendor/bin/pint --parallel
          npx prettier --write "resources/js/**/*.{ts,vue}" "docs/**/*.md"

      - name: Remove migration tooling
        run: |
          rm tools/cv4-p1-p4.mjs
          rm .github/workflows/cv4-p1-p4-migrate.yml

      - name: Commit cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Converge frontend on canonical game context"
          git push origin HEAD:agent/context-v4-convergence
