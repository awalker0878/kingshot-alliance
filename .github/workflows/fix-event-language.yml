name: Fix final Event language findings

on:
  push:
    branches:
      - product/kingshot-language-alignment

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: product/kingshot-language-alignment
          fetch-depth: 0

      - name: Replace ambiguous staged language
        shell: python
        run: |
          from pathlib import Path
          path = Path('resources/js/localization/messages/events/en.ts')
          source = path.read_text()
          source = source.replace(
              'Alliance combat Event combining staged objectives, rally coordination, and scoring.',
              'Alliance combat Event combining multiple objectives, Rally coordination, and scoring.',
          )
          source = source.replace(
              'Personal progression competition with staged scoring.',
              'Personal progression competition with scoring across multiple phases.',
          )
          path.write_text(source)

      - name: Commit language fix
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/localization/messages/events/en.ts
          git commit -m "Remove ambiguous staged Event wording"
          git push origin HEAD:product/kingshot-language-alignment
