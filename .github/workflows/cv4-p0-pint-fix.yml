name: CV4 P0 Pint Baseline Repair

on:
  push:
    branches:
      - agent/context-v4-convergence
    paths:
      - .github/workflows/cv4-p0-pint-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out convergence branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/context-v4-convergence
          fetch-depth: 0

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Apply repository Pint rules
        run: vendor/bin/pint --parallel

      - name: Remove one-shot workflow
        run: rm .github/workflows/cv4-p0-pint-fix.yml

      - name: Commit repaired baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Repair PHP style baseline for CV4 P0"
          git push origin HEAD:agent/context-v4-convergence
