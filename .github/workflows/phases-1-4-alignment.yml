              '- `/alliance/recruitment` requires authentication, verification, active-alliance context, and `recruitment.manage`.\n- Recruiter mutations additionally require recent password confirmation, are active-alliance scoped, and write audit/outbox records for significant changes.\n',
          )

          # The integrated source must have no leftover Phase 5 permission or Phase 2 recruitment-state column.
          for root in ['app', 'database', 'resources', 'tests']:
              for file in Path(root).rglob('*'):
                  if not file.is_file():
                      continue
                  if file.suffix not in {'.php', '.vue', '.ts', '.js'}:
                      continue
                  text = file.read_text(errors='ignore')
                  if 'ContributionManage' in text or 'contributions.manage' in text:
                      raise SystemExit(f'Future Phase 5 contribution permission remains in {file}')
                  if 'recruitment_status' in text:
                      raise SystemExit(f'Duplicate Phase 2 recruitment_status remains in {file}')

          public_vue = Path('resources/js/pages/Public/Alliance.vue').read_text()
          if 'upcomingActivitiesPhase' in public_vue or 'Event schedules arrive in Phase' in public_vue:
              raise SystemExit('Stale Phase 2 event placeholder remains')
          PY

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_sqlite, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --no-audit --no-fund

      - name: Format changed source
        run: |
          vendor/bin/pint app/Domain/Identity/Authorization/PermissionKey.php app/Domain/Identity/Authorization/DefaultAllianceRole.php app/Models/AllianceProfile.php app/Application/Content/UpdateAlliancePublicProfile.php app/Application/Recruitment/PublicRecruitmentQuery.php app/Http/Controllers/Alliance/ContentManagementController.php app/Http/Controllers/PublicAllianceController.php database/migrations/2026_08_07_010000_create_content_domain_tables.php routes/web.php tests/Feature/Content/ProfileMediaSecurityTest.php tests/Feature/Events/EventHttpTest.php tests/Feature/Recruitment/RecruitmentHttpTest.php
          npx prettier --write resources/js/pages/Alliance/ContentManage.vue resources/js/pages/Public/Alliance.vue

      - name: Run focused alignment tests
        run: |
          php artisan test tests/Feature/Identity/CreateAllianceTest.php tests/Feature/Content/ProfileMediaSecurityTest.php tests/Feature/Content/ContentAuthorizationIsolationTest.php tests/Feature/Events/EventHttpTest.php tests/Feature/Recruitment/RecruitmentHttpTest.php
          npm run check

      - name: Commit alignment changes
        shell: bash
        run: |
          set -euo pipefail
          git add app database docs resources routes tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align implemented phases 1 through 4'
          git push origin HEAD:agent/phases-1-4-alignment
