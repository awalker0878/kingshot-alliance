name: Phases 1-4 alignment patch

on:
  push:
    branches:
      - agent/phases-1-4-alignment

permissions:
  contents: write

concurrency:
  group: phases-1-4-alignment-patch
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out alignment branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/phases-1-4-alignment
          fetch-depth: 0

      - name: Apply integration alignment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          def replace_all(path: str, old: str, new: str, minimum: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} matches, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new))

          # Phase 1: do not pre-provision unimplemented Phase 5 capabilities.
          replace_once(
              'app/Domain/Identity/Authorization/PermissionKey.php',
              "    case ContributionManage = 'contributions.manage';\n",
              '',
          )
          replace_once(
              'app/Domain/Identity/Authorization/PermissionKey.php',
              "            self::RoleManage => 'Manage alliance roles and permissions.',\n",
              "            self::RoleManage => 'Manage alliance role assignments.',\n",
          )
          replace_once(
              'app/Domain/Identity/Authorization/PermissionKey.php',
              "            self::ContributionManage => 'Manage contribution and participation records.',\n",
              '',
          )
          replace_once(
              'app/Domain/Identity/Authorization/DefaultAllianceRole.php',
              "                PermissionKey::ContributionManage,\n",
              '',
          )

          # Phase 2/4: recruitment settings are the one authoritative recruitment state.
          status_enum = Path('app/Domain/Content/Enums/RecruitmentStatus.php')
          if not status_enum.exists():
              raise SystemExit('RecruitmentStatus enum is unexpectedly absent before cleanup')
          status_enum.unlink()

          replace_once(
              'database/migrations/2026_08_07_010000_create_content_domain_tables.php',
              "            $table->string('recruitment_status', 32)->default('closed')->index();\n",
              '',
          )

          profile = Path('app/Models/AllianceProfile.php')
          profile.write_text('''<?php

