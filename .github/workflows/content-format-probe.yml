name: Content Format Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Format frontend files and print canonical output
        run: |
          npx prettier --write resources/js/pages/Alliance/Rules/Index.vue resources/js/localization/messages/content/en.ts
          echo '===RULES_VUE_BEGIN==='
          cat resources/js/pages/Alliance/Rules/Index.vue
          echo '===RULES_VUE_END==='
          echo '===CONTENT_EN_BEGIN==='
          cat resources/js/localization/messages/content/en.ts
          echo '===CONTENT_EN_END==='
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          tools: composer:v2
      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Format PHP files and print canonical output
        run: |
          vendor/bin/pint app/Contexts/Alliance/Content/Queries/NoticeReactionSummaryQuery.php tests/v3/Contexts/Alliance/Content/AllianceContentGameParityBehaviorV3Test.php
          echo '===SUMMARY_QUERY_BEGIN==='
          cat app/Contexts/Alliance/Content/Queries/NoticeReactionSummaryQuery.php
          echo '===SUMMARY_QUERY_END==='
          echo '===BEHAVIOR_TEST_BEGIN==='
          cat tests/v3/Contexts/Alliance/Content/AllianceContentGameParityBehaviorV3Test.php
          echo '===BEHAVIOR_TEST_END==='
