name: Progression Source Refresh

on:
  workflow_dispatch:
  push:
    branches:
      - feature/factual-governor-progression
    paths:
      - scripts/progression/**
      - tests/Contexts/GameWorld/Progression/Unit/*_test.py
      - .github/workflows/progression-source-refresh.yml
      - docs/product/factual-governor-progression-source-inventory.md
  pull_request:
    branches:
      - main
    paths:
      - scripts/progression/**
      - tests/Contexts/GameWorld/Progression/Unit/*_test.py
      - .github/workflows/progression-source-refresh.yml
      - docs/product/factual-governor-progression.md
      - docs/product/factual-governor-progression-source-inventory.md

permissions:
  contents: read

concurrency:
  group: progression-source-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install refresh dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Verify acquisition comparison contracts
        run: python -m unittest discover -s tests/Contexts/GameWorld/Progression/Unit -p '*_test.py'

      - name: Verify checked-in factual release
        run: python scripts/progression/verify_release.py

      - name: Regenerate source-backed comparison candidate
        id: regenerate
        run: python scripts/progression/finalize_v2.py

      - name: Verify generated corpus and release contract
        run: python scripts/progression/verify_release.py

      - name: Verify immutable facts and record live acquisition evidence
        run: python scripts/progression/verify_regenerated.py --report storage/logs/progression-refresh-acquisition.json

      - name: Upload regenerated candidate and acquisition evidence
        if: ${{ !cancelled() && steps.regenerate.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: progression-refresh-review-${{ github.sha }}
          path: |
            resources/data/progression/kingshot-2026-08-23-v2
            storage/logs/progression-refresh-acquisition.json
          if-no-files-found: error
          retention-days: 7
