name: Progression Source Refresh

on:
  workflow_dispatch:
  push:
    branches:
      - feature/factual-governor-progression
    paths:
      - scripts/progression/**
      - .github/workflows/progression-source-refresh.yml
      - docs/product/factual-governor-progression-source-inventory.md
  pull_request:
    branches:
      - main
    paths:
      - scripts/progression/**
      - .github/workflows/progression-source-refresh.yml
      - docs/product/factual-governor-progression.md
      - docs/product/factual-governor-progression-source-inventory.md

permissions:
  contents: write

concurrency:
  group: progression-source-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: feature/factual-governor-progression
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install refresh dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Regenerate immutable source-backed release
        run: python scripts/progression/finalize_v2.py

      - name: Verify generated corpus and release contract
        run: python scripts/progression/verify_release.py

      - name: Verify checked-in release is reproducible
        run: git diff --exit-code -- resources/data/progression/kingshot-2026-08-23-v2

      - name: Reconcile product documentation
        run: python scripts/progression/reconcile_product_docs.py

      - name: Commit reconciled product documentation
        run: |
          if git diff --quiet -- docs/product; then
            echo "Product documentation already reconciled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/product
          git commit -m "Reconcile factual progression product documentation"
          git push origin HEAD:feature/factual-governor-progression
