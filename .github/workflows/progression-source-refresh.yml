name: Progression Source Refresh

on:
  workflow_dispatch:
  push:
    branches:
      - feature/factual-governor-progression
    paths:
      - scripts/progression/**
      - .github/workflows/progression-source-refresh.yml
      - docs/product/factual-governor-progression-source-inventory.md
  pull_request:
    branches:
      - main
    paths:
      - scripts/progression/**
      - .github/workflows/progression-source-refresh.yml
      - docs/product/factual-governor-progression.md
      - docs/product/factual-governor-progression-source-inventory.md

permissions:
  contents: write

concurrency:
  group: progression-source-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install refresh dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Regenerate immutable source-backed release
        run: python scripts/progression/finalize_v2.py

      - name: Verify generated corpus and release contract
        run: python scripts/progression/verify_release.py

      - name: Upload regenerated immutable candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: factual-progression-2026.08.23.2
          path: resources/data/progression/kingshot-2026-08-23-v2
          if-no-files-found: error
          retention-days: 7

      - name: Promote verified immutable candidate on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/factual-governor-progression'
        run: |
          if git diff --quiet -- resources/data/progression/kingshot-2026-08-23-v2; then
            echo "Checked-in progression release already matches regenerated candidate."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/data/progression/kingshot-2026-08-23-v2
          git commit -m "Update verified factual progression release"
          git push origin HEAD:feature/factual-governor-progression

      - name: Verify checked-in release is reproducible
        if: github.event_name != 'push' || github.ref != 'refs/heads/feature/factual-governor-progression'
        run: git diff --exit-code -- resources/data/progression/kingshot-2026-08-23-v2
