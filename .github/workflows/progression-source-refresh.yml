name: Progression Source Refresh

on:
  workflow_dispatch:
  push:
    branches:
      - feature/factual-governor-progression
    paths:
      - scripts/progression/**
      - .github/workflows/progression-source-refresh.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/progression/**
      - .github/workflows/progression-source-refresh.yml
      - docs/product/factual-governor-progression.md

permissions:
  contents: write

concurrency:
  group: progression-source-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install refresh dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Refresh immutable source-backed release
        run: python scripts/progression/refresh.py

      - name: Validate generated JSON and advisory-field exclusion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          release_dir = Path('resources/data/progression/kingshot-2026-08-23-v2')
          files = sorted(release_dir.glob('*.json'))
          assert files, 'No generated progression JSON files found.'
          blocked = {'tier_list','tierlist','ranking','recommended','recommendation','recommendations','investment_priority','upgrade_priority','priority_score','optimizer','optimization','best_use','best_for','f2p_rating','value_rating','longevity_rating'}

          def walk(value, path='root'):
              if isinstance(value, dict):
                  for key, child in value.items():
                      assert key.lower() not in blocked, f'Advisory field leaked into canonical release: {path}.{key}'
                      walk(child, f'{path}.{key}')
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, f'{path}[{index}]')

          for path in files:
              data = json.loads(path.read_text(encoding='utf-8'))
              walk(data, path.name)

          release = json.loads((release_dir / 'release.json').read_text(encoding='utf-8'))
          assert release['schema_version'] == 2
          assert release['dataset_version'] == '2026.08.23.2'
          assert 'source-lock.json' in release['files']
          academy = json.loads((release_dir / 'academy_research.json').read_text(encoding='utf-8'))
          assert len(academy['technologies']) == 191
          assert sum(len(t['levels']) for t in academy['technologies']) == 714
          gear = json.loads((release_dir / 'governor_gear.json').read_text(encoding='utf-8'))
          assert gear['source_meta']['count'] == 58
          war = json.loads((release_dir / 'war_academy.json').read_text(encoding='utf-8'))
          assert war['source_meta']['count'] == 30
          print(f'Validated {len(files)} generated JSON files.')
          PY

      - name: Upload generated immutable candidate
        uses: actions/upload-artifact@v4
        with:
          name: factual-progression-2026.08.23.2
          path: resources/data/progression/kingshot-2026-08-23-v2
          if-no-files-found: error
          retention-days: 7

      - name: Record generated immutable candidate on branch push
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- resources/data/progression/kingshot-2026-08-23-v2; then
            echo 'Generated release is already identical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/data/progression/kingshot-2026-08-23-v2
          git commit -m 'data: refresh factual progression 2026.08.23.2'
          git push origin "HEAD:${GITHUB_REF_NAME}"
