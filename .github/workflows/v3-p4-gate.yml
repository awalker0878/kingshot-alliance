name: V3 CA-P4 Gate

on:
  push:
    branches:
      - architecture-v3-capability-alignment

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, 'record CA-P4 gate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v3-capability-alignment
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Validate P4
        shell: bash
        run: |
          set +e
          rm -f ARCH_V3_P4_GATE_PASS ARCH_V3_P4_GATE_FAIL.txt
          {
            composer install --no-interaction --no-progress --prefer-dist &&
            composer dump-autoload --optimize --strict-psr &&
            find app bootstrap config database routes tests/v3 -type f -name '*.php' -print0 | xargs -0 -n1 php -l &&
            php artisan route:list --no-ansi > /tmp/routes.txt &&
            vendor/bin/phpunit tests/v3/Architecture
          } > /tmp/p4.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then printf 'PASS\n' > ARCH_V3_P4_GATE_PASS; else cp /tmp/p4.txt ARCH_V3_P4_GATE_FAIL.txt; fi
          exit 0
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ARCH_V3_P4_GATE_PASS ARCH_V3_P4_GATE_FAIL.txt || true
          git commit -m "chore(v3): record CA-P4 gate [skip ci]" || exit 0
          git push origin HEAD:architecture-v3-capability-alignment
