name: V3 CA-P3 Platform Actor Contract

on:
  push:
    branches:
      - architecture-v3-capability-alignment

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v3-capability-alignment
          fetch-depth: 0

      - name: Convert actor-only Platform dependencies to Accounts contract
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = [
              'app/Contexts/Platform/AllianceAdministration/Actions/ConfigureAlliancePlatform.php',
              'app/Contexts/Platform/AllianceAdministration/Actions/ManageAllianceLifecycle.php',
              'app/Contexts/Platform/AllianceAdministration/Services/AllianceFeatureService.php',
              'app/Contexts/Platform/DataGovernance/Services/AllianceDataExportService.php',
              'app/Contexts/Platform/DataGovernance/Services/LegalHoldService.php',
              'app/Contexts/Platform/EventAdministration/Actions/UpdateEventTypeScope.php',
          ]

          for filename in files:
              path = Path(filename)
              text = path.read_text()
              old_import = 'use App\\Contexts\\Accounts\\Identity\\Models\\User;'
              new_import = 'use App\\Contexts\\Accounts\\Identity\\ValueObjects\\AccountIdentity;'
              if old_import not in text:
                  raise SystemExit(f'expected User import missing: {filename}')
              text = text.replace(old_import, new_import)
              text = text.replace('User $actor', 'AccountIdentity $actor')
              text = text.replace('$actor->id', '$actor->userId')
              path.write_text(text)
          PY

      - name: Check changed PHP syntax
        run: |
          for file in \
            app/Contexts/Platform/AllianceAdministration/Actions/ConfigureAlliancePlatform.php \
            app/Contexts/Platform/AllianceAdministration/Actions/ManageAllianceLifecycle.php \
            app/Contexts/Platform/AllianceAdministration/Services/AllianceFeatureService.php \
            app/Contexts/Platform/DataGovernance/Services/AllianceDataExportService.php \
            app/Contexts/Platform/DataGovernance/Services/LegalHoldService.php \
            app/Contexts/Platform/EventAdministration/Actions/UpdateEventTypeScope.php; do
              php -l "$file"
          done

      - name: Remove one-use workflow
        run: rm -f .github/workflows/v3-p3-platform-actor-contract.yml

      - name: Commit Platform actor contract migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(v3): move Platform actor identity to Accounts contract [skip ci]"
          git push origin HEAD:architecture-v3-capability-alignment
