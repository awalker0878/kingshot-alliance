name: Architecture V2 Source Snapshot

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/architecture-v2-source-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Create source snapshot
        run: zip -qr architecture-v2-source.zip . -x '.git/*' 'architecture-v2-source.zip'

      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: architecture-v2-source
          path: architecture-v2-source.zip
          if-no-files-found: error
          retention-days: 1
