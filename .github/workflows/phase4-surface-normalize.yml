name: Phase 4 surface normalize

on:
  push:
    branches:
      - agent/phase-4-recruitment
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase4-surface-normalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/phase-4-recruitment
          fetch-depth: 0
      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_sqlite, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --no-audit --no-fund
      - name: Fix confirmed recruitment form type errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('resources/js/pages/Public/RecruitmentApply.vue')
          text = path.read_text()

          old = '''function answerError(questionId: string): string | undefined {
  return form.errors[`answers.${questionId}` as keyof typeof form.errors];
}
'''
          new = '''function formError(key: string): string | undefined {
  return (form.errors as Record<string, string | undefined>)[key];
}

function answerError(questionId: string): string | undefined {
  return formError(`answers.${questionId}`);
}

function stringAnswer(questionId: string): string {
  const value = form.answers[questionId];
  return typeof value === 'string' ? value : '';
}

function setStringAnswer(questionId: string, event: Event): void {
  const target = event.target;
  if (
    target instanceof HTMLInputElement ||
    target instanceof HTMLTextAreaElement ||
    target instanceof HTMLSelectElement
  ) {
    form.answers[questionId] = target.value;
  }
}
'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one answerError block; found {text.count(old)}')
          text = text.replace(old, new)

          replacements = {
              'v-model="form.answers[question.id]"\n                  class="mt-2 min-h-32': ':value="stringAnswer(question.id)"\n                  class="mt-2 min-h-32',
              'v-model="form.answers[question.id]"\n                  class="mt-2 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2"\n                  :required="question.required"\n                >': ':value="stringAnswer(question.id)"\n                  class="mt-2 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2"\n                  :required="question.required"\n                  @change="setStringAnswer(question.id, $event)"\n                >',
              'v-model="form.answers[question.id]"\n                  class="mt-2 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2"\n                  :required="question.required"\n                />': ':value="stringAnswer(question.id)"\n                  class="mt-2 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2"\n                  :required="question.required"\n                  @input="setStringAnswer(question.id, $event)"\n                />',
              'v-if="form.errors.application"': 'v-if="formError(\'application\')"',
              '{{ form.errors.application }}': "{{ formError('application') }}",
              'v-if="form.errors.application_token"': 'v-if="formError(\'application_token\')"',
              '{{ form.errors.application_token }}': "{{ formError('application_token') }}",
          }
          for old_text, new_text in replacements.items():
              if old_text not in text:
                  raise SystemExit(f'Missing expected recruitment form marker: {old_text[:90]}')
              text = text.replace(old_text, new_text, 1)

          textarea_marker = ':value="stringAnswer(question.id)"\n                  class="mt-2 min-h-32 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2"\n                  :required="question.required"\n                />'
          textarea_fixed = ':value="stringAnswer(question.id)"\n                  class="mt-2 min-h-32 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2"\n                  :required="question.required"\n                  @input="setStringAnswer(question.id, $event)"\n                />'
          if textarea_marker not in text:
              raise SystemExit('Missing long-text value marker')
          text = text.replace(textarea_marker, textarea_fixed, 1)

          path.write_text(text)
          PY
      - name: Normalize PHP surface
        run: vendor/bin/pint routes/web.php app/Http/Controllers/PublicAllianceController.php app/Http/Controllers/PublicRecruitmentController.php app/Http/Controllers/Alliance/RecruitmentManagementController.php app/Http/Controllers/Alliance/RecruitmentCandidateController.php
      - name: Normalize recruitment Vue pages
        run: npx prettier --write resources/js/pages/Public/RecruitmentApply.vue resources/js/pages/Alliance/Recruitment/Manage.vue resources/js/pages/Alliance/Recruitment/Candidate.vue resources/js/pages/Public/Alliance.vue
      - name: Commit normalization output
        shell: bash
        run: |
          set -euo pipefail
          git add routes/web.php app/Http/Controllers/PublicAllianceController.php app/Http/Controllers/PublicRecruitmentController.php app/Http/Controllers/Alliance/RecruitmentManagementController.php app/Http/Controllers/Alliance/RecruitmentCandidateController.php resources/js/pages/Public/RecruitmentApply.vue resources/js/pages/Alliance/Recruitment/Manage.vue resources/js/pages/Alliance/Recruitment/Candidate.vue resources/js/pages/Public/Alliance.vue
          if git diff --cached --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Normalize Phase 4 recruitment surface'
          git push origin HEAD:agent/phase-4-recruitment
