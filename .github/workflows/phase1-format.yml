name: Phase 1 formatter

on:
  push:
    branches:
      - agent/phase-1-identity-tenancy

permissions:
  contents: write

concurrency:
  group: phase1-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/phase-1-identity-tenancy
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply project formatter
        run: npm run format

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git add resources/

          if git diff --cached --quiet; then
            echo "Formatter output is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply Phase 1 frontend formatter"
          git push origin HEAD:agent/phase-1-identity-tenancy
