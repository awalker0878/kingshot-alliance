name: Phase 1 one-time formatter

on:
  push:
    branches:
      - agent/phase-1-identity-tenancy

permissions:
  contents: write

concurrency:
  group: phase1-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/phase-1-identity-tenancy
          fetch-depth: 0

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format reported PHP files
        run: vendor/bin/pint app/Application/Identity/TotpService.php tests/Unit/Identity/TotpServiceTest.php

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Format reported Vue files
        run: npx prettier --write resources/js/pages/Auth/TwoFactorChallenge.vue resources/js/pages/Profile.vue

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Application/Identity/TotpService.php tests/Unit/Identity/TotpServiceTest.php resources/js/pages/Auth/TwoFactorChallenge.vue resources/js/pages/Profile.vue
          git commit -m "style: normalize Phase 1 hardening files"
          git push origin HEAD:agent/phase-1-identity-tenancy
