name: Governor Progression Charm Boundary Repair

on:
  push:
    branches:
      - feature/screenshot-intake-governor-progression-main
    paths:
      - .github/workflows/governor-progression-charm-boundary-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/screenshot-intake-governor-progression-main
      - name: Remove synthetic Charm identity from v1 handoff
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"Expected patch text not found in {path}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1))

          validator = Path('app/Contexts/Intelligence/Roster/Services/GovernorProgressionObservationValidator.php')
          replace_once(
              validator,
              "$this->closedKeys($row, ['slot_id', 'charm_id', 'level'], \"payload.charms.$index\");",
              "$this->closedKeys($row, ['slot_id', 'level'], \"payload.charms.$index\");",
          )
          replace_once(
              validator,
              "            if (array_key_exists('charm_id', $row) && $row['charm_id'] !== null && $row['charm_id'] !== '') {\n                $item['charm_id'] = $this->identifier($row['charm_id'], 80, \"payload.charms.$index.charm_id\");\n            }\n",
              "",
          )
          replace_once(
              validator,
              "                throw ValidationException::withMessages([\"payload.charms.$index\" => 'A Charm slot must contain a reviewed identity or level.']);",
              "                throw ValidationException::withMessages([\"payload.charms.$index\" => 'A Charm slot must contain a reviewed level.']);",
          )

          vue = Path('resources/js/components/progression/GovernorProgressionScreenshotIntake.vue')
          replace_once(
              vue,
              "type ReviewCharmRow = {\n  slot_id: string;\n  charm_id: string;\n  level: string;\n};",
              "type ReviewCharmRow = {\n  slot_id: string;\n  level: string;\n};",
          )
          replace_once(
              vue,
              "  charm_name: t('progression.charmIdentity'),\n  charm_id: t('progression.charmIdentity'),",
              "  charm_name: t('progression.observedCharmName'),",
          )
          replace_once(
              vue,
              "    draft.charms = ordinals(item, 'charm_slot').map((ordinal) => ({\n      slot_id: value(item, 'charm_slot', ordinal),\n      charm_id: value(item, 'charm_name', ordinal)\n        .toLocaleLowerCase()\n        .replace(/[^a-z0-9._-]+/g, '-'),\n      level: value(item, 'charm_level', ordinal),\n    }));",
              "    draft.charms = ordinals(item, 'charm_slot').map((ordinal) => ({\n      slot_id: value(item, 'charm_slot', ordinal),\n      level: value(item, 'charm_level', ordinal),\n    }));",
          )
          replace_once(
              vue,
              "      if (charm.charm_id.trim()) row.charm_id = charm.charm_id.trim();\n",
              "",
          )
          replace_once(
              vue,
              "  reviewDraft.value.charms.push({ slot_id: '', charm_id: '', level: '' });",
              "  reviewDraft.value.charms.push({ slot_id: '', level: '' });",
          )
          replace_once(
              vue,
              'class="grid gap-2 rounded border border-[var(--ks-border)] p-3 sm:grid-cols-4"',
              'class="grid gap-2 rounded border border-[var(--ks-border)] p-3 sm:grid-cols-3"',
          )
          replace_once(
              vue,
              "                  <label class=\"text-xs text-[var(--ks-muted)]\">\n                    <span>{{ t('progression.charmIdentity') }}</span>\n                    <input\n                      v-model=\"charm.charm_id\"\n                      class=\"mt-1 min-h-11 w-full rounded border border-[var(--ks-border)] bg-black/20 px-2 text-sm\"\n                    />\n                  </label>\n",
              "",
          )

          catalogue = Path('resources/js/localization/messages/progression/en.ts')
          replace_once(
              catalogue,
              "    charmIdentity: 'Charm identity',",
              "    observedCharmName: 'Observed Charm name',",
          )
      - name: Commit repaired source
        run: |
          git config user.name "awalker0878"
          git config user.email "52688461+awalker0878@users.noreply.github.com"
          git add app/Contexts/Intelligence/Roster/Services/GovernorProgressionObservationValidator.php resources/js/components/progression/GovernorProgressionScreenshotIntake.vue resources/js/localization/messages/progression/en.ts
          git diff --cached --check
          git commit -m "Remove synthetic Governor Charm identity"
          git push origin HEAD:feature/screenshot-intake-governor-progression-main
