name: Architecture V2 P5 Operations Cut

on:
  push:
    branches:
      - architecture-v2
    paths:
      - '.github/workflows/architecture-v2-p5-cut.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute P5 hard cut
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import re

          root = Path('.')
          moves = []

          def namespace_for(path: Path) -> str:
              parts = path.with_suffix('').parts
              if parts[0] != 'app':
                  raise RuntimeError(path)
              return 'App\\' + '\\'.join(parts[1:-1])

          def fqcn_for(path: Path) -> str:
              return namespace_for(path) + '\\' + path.stem

          def move_php(src: str, dst: str):
              source = Path(src)
              target = Path(dst)
              if not source.exists():
                  raise SystemExit(f'Missing source: {source}')
              if target.exists():
                  raise SystemExit(f'Target already exists: {target}')
              old_fqcn = fqcn_for(source)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.move(str(source), str(target))
              text = target.read_text()
              old_ns = namespace_for(source)
              new_ns = namespace_for(target)
              marker = f'namespace {old_ns};'
              if marker not in text:
                  raise SystemExit(f'Expected namespace {marker} not found in {target}')
              target.write_text(text.replace(marker, f'namespace {new_ns};', 1))
              moves.append((old_fqcn, fqcn_for(target)))

          def move_tree(src_root: str, dst_root: str):
              source = Path(src_root)
              files = sorted(source.rglob('*.php'))
              if not files:
                  raise SystemExit(f'No PHP files under {source}')
              for path in files:
                  rel = path.relative_to(source)
                  move_php(str(path), str(Path(dst_root) / rel))

          # Whole operational capabilities.
          move_tree('app/Domain/Rallies', 'app/Contexts/Operations/Rallies')
          move_tree('app/Domain/KingPerks', 'app/Contexts/Operations/KingPerks')

          action_groups = {
              'EventCore': ['CancelEvent','CreateEvent','CreateEventFromTemplate','CreateEventTemplate','SaveEventPhase','UpdateEvent','UpdateEventTypeScope'],
              'Participation': ['CancelEventRegistration','RecordEventAttendance','RegisterForEvent','RespondToEvent'],
              'Polls': ['CastEventPollVote','SaveEventPoll'],
              'Rosters': ['AssignEventRosterPlayer','RecordEventRosterParticipation','RemoveEventRosterPlayer','RespondToEventRosterAssignment','SaveEventRoster'],
              'BattlePlans': ['AssignEventObjectiveTarget','RemoveEventObjectiveAssignment','SaveEventObjective'],
              'Results': ['SaveEventAllianceResult','SaveEventPlayerResult','SaveEventResult'],
          }
          model_groups = {
              'EventCore': ['Event','EventOccurrence','EventPhase','EventTemplate','EventType','EventTypeCapability','EventTypeScope'],
              'Participation': ['EventAttendance','EventPlayerContext','EventRegistration','EventResponse'],
              'Polls': ['EventPoll','EventPollOption','EventPollVote'],
              'Rosters': ['EventRoster','EventRosterMember'],
              'BattlePlans': ['EventObjective','EventObjectiveAssignment'],
              'Results': ['EventAllianceResult','EventAllianceResultMetric','EventMetricDefinition','EventPlayerResult','EventPlayerResultMetric','EventResult','EventResultMetric'],
          }
          query_groups = {
              'EventCore': ['EventAttentionQuery','EventCalendarQuery','EventTemplateQuery'],
              'Participation': ['EventEligiblePlayerQuery','EventParticipationQuery'],
              'Polls': ['EventPhasePollQuery'],
              'BattlePlans': ['EventObjectiveQuery'],
              'Results': ['EventResultQuery'],
              'Rosters': ['EventRosterQuery'],
          }
          intelligence_queries = [
              'EventAllianceHistoryQuery','EventContributionIntelligenceQuery','EventKingdomHistoryQuery',
              'EventOrganizationEvidenceQuery','EventOrganizationHistoryQuery','EventPlayerHistoryQuery',
              'EventPlayerHistorySummaryQuery','EventPlayerIntelligenceQuery','EventPlayerOccurrenceEvidenceQuery','EventTrendQuery',
          ]
          service_groups = {
              'EventCore': ['ActivePlayerEventVisibilityResolver','EventAuthorization','EventCapabilityGuard','EventCapabilityResolver','EventCreationContextResolver','EventCreationMutationAuthority','EventMutationAuthority','EventPhaseService','EventSchedulePolicyResolver','EventTargetResolver','EventTypeDefaultsResolver','EventTypeRegistry','EventVisibilityResolver','PlayerEventAuthorization','RecurrenceCalculator'],
              'Results': ['EventMetricCapture'],
              'Participation': ['EventParticipantAuthorization','EventPlayerContextFreezer','EventRegistrationWindow'],
              'Polls': ['EventPollTemplateMaterializer'],
              'Rosters': ['EventRosterAllianceSnapshotResolver','EventRosterAvailabilityService','EventRosterService'],
          }
          enum_groups = {
              'EventCore': ['EventCapability','EventCategory','EventOccurrenceStatus','EventPhaseStatus','EventPhaseType','EventRecurrencePolicy','EventScheduleSource','EventScope','EventStatus','RecurrenceFrequency'],
              'Participation': ['EventAttendanceStatus','EventRegistrationStatus','EventResponseChoice','EventResponseSource'],
              'Polls': ['EventPollStatus','EventPollType'],
              'Rosters': ['EventRosterMemberStatus','EventRosterType'],
              'BattlePlans': ['EventObjectiveStatus'],
              'Results': ['EventMetricAggregation','EventMetricSource','EventMetricSubject','EventMetricValueType'],
          }
          controller_groups = {
              'EventCore': ['EventManagementController','EventOperationsController','EventTypeAdministrationController'],
              'Participation': ['EventParticipationController'],
              'Rosters': ['EventRosterController'],
              'BattlePlans': ['EventBattlePlanController'],
              'Results': ['EventResultController'],
              'Reminders': ['EventReminderController'],
          }

          for group, names in action_groups.items():
              for name in names:
                  move_php(f'app/Domain/Events/Actions/{name}.php', f'app/Contexts/Operations/{group}/Actions/{name}.php')
          for group, names in model_groups.items():
              for name in names:
                  move_php(f'app/Domain/Events/Models/{name}.php', f'app/Contexts/Operations/{group}/Models/{name}.php')
          for group, names in query_groups.items():
              for name in names:
                  move_php(f'app/Domain/Events/Queries/{name}.php', f'app/Contexts/Operations/{group}/Queries/{name}.php')
          for name in intelligence_queries:
              move_php(f'app/Domain/Events/Queries/{name}.php', f'app/Contexts/Intelligence/EventAnalysis/Queries/{name}.php')
          for group, names in service_groups.items():
              for name in names:
                  move_php(f'app/Domain/Events/Services/{name}.php', f'app/Contexts/Operations/{group}/Services/{name}.php')
          for group, names in enum_groups.items():
              for name in names:
                  move_php(f'app/Domain/Events/Enums/{name}.php', f'app/Contexts/Operations/{group}/Enums/{name}.php')
          for group, names in controller_groups.items():
              for name in names:
                  move_php(f'app/Domain/Events/Http/Controllers/{name}.php', f'app/Contexts/Operations/{group}/Http/Controllers/{name}.php')

          move_php('app/Domain/Events/Http/Controllers/EventCalendarController.php', 'app/ReadModels/EventCalendar/Http/Controllers/EventCalendarController.php')
          move_php('app/Domain/Events/Http/Controllers/EventHistoryController.php', 'app/ReadModels/EventHistory/Http/Controllers/EventHistoryController.php')

          move_php('app/Domain/Events/Catalog/KingShotEventTypeCatalog.php', 'app/Contexts/Operations/EventCore/Catalog/KingShotEventTypeCatalog.php')
          move_php('app/Domain/Events/Catalog/KingShotEventMetricCatalog.php', 'app/Contexts/Operations/Results/Catalog/KingShotEventMetricCatalog.php')
          move_php('app/Domain/Events/ValueObjects/EventCreationMutationContext.php', 'app/Contexts/Operations/EventCore/ValueObjects/EventCreationMutationContext.php')
          move_php('app/Domain/Events/ValueObjects/EventMutationContext.php', 'app/Contexts/Operations/EventCore/ValueObjects/EventMutationContext.php')

          # Reminder policy belongs to Operations; delivery state belongs to Communications.
          move_php('app/Domain/Events/Enums/EventReminderAudience.php', 'app/Contexts/Operations/Reminders/Enums/EventReminderAudience.php')
          move_php('app/Domain/Events/Enums/EventReminderTrigger.php', 'app/Contexts/Operations/Reminders/Enums/EventReminderTrigger.php')
          move_php('app/Domain/Events/Enums/EventReminderDeliveryStatus.php', 'app/Contexts/Communications/Reminders/Enums/EventReminderDeliveryStatus.php')
          move_php('app/Domain/Notifications/Models/EventReminderRule.php', 'app/Contexts/Operations/Reminders/Models/EventReminderRule.php')
          move_php('app/Domain/Notifications/Actions/CreateEventReminderRule.php', 'app/Contexts/Operations/Reminders/Actions/CreateEventReminderRule.php')
          move_php('app/Domain/Notifications/Actions/DisableEventReminderRule.php', 'app/Contexts/Operations/Reminders/Actions/DisableEventReminderRule.php')
          move_php('app/Domain/Notifications/Actions/SyncEventPollDeadlineReminder.php', 'app/Contexts/Operations/Reminders/Actions/SyncEventPollDeadlineReminder.php')
          move_php('app/Domain/Notifications/Models/EventReminderDelivery.php', 'app/Contexts/Communications/Reminders/Models/EventReminderDelivery.php')
          move_php('app/Domain/Notifications/Models/KingPerkReminderDelivery.php', 'app/Contexts/Communications/Reminders/Models/KingPerkReminderDelivery.php')
          move_php('app/Domain/Notifications/Queries/EventReminderInboxQuery.php', 'app/ReadModels/EventCalendar/Queries/EventReminderInboxQuery.php')

          # Operations must not navigate into Communications delivery state.
          rule = Path('app/Contexts/Operations/Reminders/Models/EventReminderRule.php')
          text = rule.read_text()
          text = text.replace('use Illuminate\\Database\\Eloquent\\Relations\\HasMany;\n', '')
          text = re.sub(r'\n    public function deliveries\(\): HasMany\n    \{\n        return \$this->hasMany\(EventReminderDelivery::class, \'rule_id\'\);\n    \}\n', '\n', text)
          rule.write_text(text)

          # Ensure every Events PHP file was classified.
          leftovers = sorted(Path('app/Domain/Events').rglob('*.php'))
          if leftovers:
              raise SystemExit('Unclassified Event PHP files:\n' + '\n'.join(map(str, leftovers)))

          # Apply exact FQCN changes to all application/test/bootstrap PHP.
          replacements = dict(moves)
          for base_name in ('app','routes','tests','bootstrap','config','database'):
              base = Path(base_name)
              if not base.exists():
                  continue
              for path in base.rglob('*.php'):
                  source = path.read_text()
                  updated = source
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != source:
                      path.write_text(updated)

          # Delete obsolete legacy READMEs/empty roots.
          for legacy in ('app/Domain/Events','app/Domain/Rallies','app/Domain/KingPerks'):
              path = Path(legacy)
              if path.exists():
                  shutil.rmtree(path)

          # V2 roots may never import legacy domains.
          bad = []
          for root_name in ('app/Contexts','app/Shared','app/Workflows','app/ReadModels'):
              base = Path(root_name)
              for path in base.rglob('*.php'):
                  text = path.read_text()
                  if 'App\\Domain\\' in text:
                      bad.append(str(path))
          if bad:
              raise SystemExit('V2 files still import App\\Domain:\n' + '\n'.join(sorted(set(bad))))

          # No legacy P5 namespace may survive anywhere.
          stale = []
          pattern = re.compile(r'App\\Domain\\(?:Events|Rallies|KingPerks)\\')
          for base_name in ('app','routes','tests','bootstrap','config','database'):
              base = Path(base_name)
              if not base.exists():
                  continue
              for path in base.rglob('*.php'):
                  if pattern.search(path.read_text()):
                      stale.append(str(path))
          if stale:
              raise SystemExit('Legacy P5 namespace references remain:\n' + '\n'.join(sorted(set(stale))))

          # Namespace/path syntax sanity.
          for root_name in ('app/Contexts/Operations','app/Contexts/Intelligence','app/Contexts/Communications','app/ReadModels'):
              for path in Path(root_name).rglob('*.php'):
                  expected = f'namespace {namespace_for(path)};'
                  if expected not in path.read_text():
                      raise SystemExit(f'Namespace/path mismatch: {path} expected {expected}')
          PY

          find app/Contexts/Operations app/Contexts/Intelligence app/Contexts/Communications app/ReadModels \
            -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Commit P5 hard cut
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'architecture-v2-bot'
          git config user.email 'architecture-v2-bot@users.noreply.github.com'
          git add app routes tests bootstrap config database
          git status --short
          git commit -m 'refactor(arch-v2): consolidate operations context'
          git push origin HEAD:architecture-v2
