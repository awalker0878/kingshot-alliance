name: Territory Pint Probe

on:
  push:
    branches:
      - territory-plan-observed-reality-main

permissions:
  contents: write

jobs:
  pint-diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: territory-plan-observed-reality-main

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Apply exact Pint formatting
        shell: bash
        run: |
          vendor/bin/pint app/ReadModels/TerritoryPlanning/Queries/TerritoryReconciliationQuery.php
          if git diff --quiet -- app/ReadModels/TerritoryPlanning/Queries/TerritoryReconciliationQuery.php; then
            echo "Territory reconciliation query is already Pint-clean."
            exit 0
          fi
          git diff -- app/ReadModels/TerritoryPlanning/Queries/TerritoryReconciliationQuery.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ReadModels/TerritoryPlanning/Queries/TerritoryReconciliationQuery.php
          git commit -m "Apply Pint to Territory reconciliation query"
          git push origin HEAD:territory-plan-observed-reality-main
