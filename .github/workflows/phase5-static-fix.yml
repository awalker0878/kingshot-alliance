name: Phase 5 Static Fix

on:
  push:
    branches:
      - agent/phase-5-contributions-reporting

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/phase-5-contributions-reporting

      - name: Apply PHPStan fixes
        shell: python
        run: |
          from pathlib import Path

          controller = Path('app/Domain/Contributions/Http/Controllers/ContributionController.php')
          text = controller.read_text()
          text = text.replace("->findOrFail($validated['category_id']);", "->whereKey((string) $validated['category_id'])\n            ->firstOrFail();")
          text = text.replace("->findOrFail($validated['membership_id']);", "->whereKey((string) $validated['membership_id'])\n            ->firstOrFail();")
          text = text.replace("->findOrFail($validated['recipient_membership_id']);", "->whereKey((string) $validated['recipient_membership_id'])\n            ->firstOrFail();")
          controller.write_text(text)

          query = Path('app/Domain/Contributions/Queries/ContributionReportingQuery.php')
          text = query.read_text()
          text = text.replace(
              "        return ContributionRecord::query()\n            ->where('alliance_id', $alliance->id)",
              "        return array_values(ContributionRecord::query()\n            ->where('alliance_id', $alliance->id)",
              1,
          )
          text = text.replace("            ->all();\n    }\n\n    /** @param Collection<int, ContributionCategory>", "            ->all());\n    }\n\n    /** @param Collection<int, ContributionCategory>", 1)
          text = text.replace("'category' => $category?->name ?? 'Unknown category',", "'category' => $category->name,")
          text = text.replace("'unit' => $category?->unit ?? '',", "'unit' => $category->unit,")
          text = text.replace("'entries' => array_values($totals),", "'entries' => $totals,")
          query.write_text(text)

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Format PHP
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          vendor/bin/pint --parallel

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/Domain/Contributions
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix Phase 5 static analysis"
          git push
