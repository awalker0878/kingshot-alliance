name: V3 CA-P7 Report Artifact

on:
  push:
    branches:
      - architecture-v3-capability-alignment

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v3-capability-alignment
      - name: Require report
        run: test -f ARCH_V3_P7_LEAKAGE_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: v3-p7-leakage-report
          path: ARCH_V3_P7_LEAKAGE_REPORT.md
          if-no-files-found: error
          retention-days: 1
