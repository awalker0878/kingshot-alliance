name: Kingdom Transfer Group Provenance Once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.event.pull_request.head.ref == 'feature/kingdom-transfer-planning' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/kingdom-transfer-planning
      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dccc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --no-audit --no-fund
      - name: Expose official Group provenance in eligibility reads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: expected block not found')
              p.write_text(text.replace(old, new, 1))

          q = 'app/Contexts/GameWorld/KingdomTransfers/Queries/TransferEligibilityQuery.php'
          replace(
              q,
              '     *     officialGroup: string|null,\n',
              '     *     officialGroup: TransferGroup|null,\n',
          )
          replace(
              q,
              '''        $membership = [];
        $authoritative = [];
        foreach ($groups as $group) {
            foreach ($group->kingdoms as $kingdom) {
                $kingdomId = (string) $kingdom->id;
                $membership[$kingdomId] = $group->official_label;
                $authoritative[$kingdomId] = $group->source_type->isAuthoritative();
            }
        }
''',
              '''        $groupsByKingdom = [];
        foreach ($groups as $group) {
            foreach ($group->kingdoms as $kingdom) {
                $groupsByKingdom[(string) $kingdom->id] = $group;
            }
        }
''',
          )
          replace(
              q,
              '''            $sourceLabel = $membership[$sourceId] ?? null;
            $targetLabel = $membership[$targetId] ?? null;
            $groupState = $sourceLabel !== null
                && $targetLabel !== null
                && ($authoritative[$sourceId] ?? false)
                && ($authoritative[$targetId] ?? false)
                    ? TransferRequirementState::Met
                    : TransferRequirementState::Unknown;
''',
              '''            $sourceGroup = $groupsByKingdom[$sourceId] ?? null;
            $targetGroup = $groupsByKingdom[$targetId] ?? null;
            $sourceLabel = $sourceGroup instanceof TransferGroup ? $sourceGroup->official_label : null;
            $targetLabel = $targetGroup instanceof TransferGroup ? $targetGroup->official_label : null;
            $groupState = $sourceGroup instanceof TransferGroup
                && $targetGroup instanceof TransferGroup
                && $sourceGroup->source_type->isAuthoritative()
                && $targetGroup->source_type->isAuthoritative()
                    ? TransferRequirementState::Met
                    : TransferRequirementState::Unknown;
''',
          )
          replace(
              q,
              "                'officialGroup' => $targetLabel,\n",
              "                'officialGroup' => $targetGroup instanceof TransferGroup ? $targetGroup : null,\n",
          )

          c = 'app/Contexts/GameWorld/KingdomTransfers/Http/Controllers/TransferReadinessController.php'
          replace(
              c,
              'use App\\Contexts\\GameWorld\\KingdomTransfers\\Models\\TransferBlocker;\n',
              'use App\\Contexts\\GameWorld\\KingdomTransfers\\Models\\TransferBlocker;\nuse App\\Contexts\\GameWorld\\KingdomTransfers\\Models\\TransferGroup;\n',
          )
          replace(
              c,
              '     *     officialGroup: string|null,\n',
              '     *     officialGroup: TransferGroup|null,\n',
          )
          replace(
              c,
              "            'officialGroup' => $planning['officialGroup'] ?? null,\n",
              '''            'officialGroup' => ($planning['officialGroup'] ?? null) instanceof TransferGroup
                ? [
                    'label' => $planning['officialGroup']->official_label,
                    'sourceType' => $planning['officialGroup']->source_type->value,
                    'sourceReference' => $planning['officialGroup']->source_reference,
                    'observedAt' => $planning['officialGroup']->observed_at->toIso8601String(),
                ]
                : null,
''',
          )

          v = 'resources/js/pages/Kingdom/Transfer/Readiness.vue'
          replace(
              v,
              '  officialGroup: string | null;\n',
              '''  officialGroup: {
    label: string;
    sourceType: SourceType;
    sourceReference: string;
    observedAt: string;
  } | null;
''',
          )
          replace(
              v,
              '''              <dd class="mt-1 font-semibold">
                {{ p.officialGroup ?? t('kingdomP7D.needsVerification') }}
              </dd>
''',
              '''              <dd class="mt-1 font-semibold">
                {{ p.officialGroup?.label ?? t('kingdomP7D.needsVerification') }}
              </dd>
              <dd v-if="p.officialGroup" class="mt-1 text-xs text-[var(--ks-muted)]">
                {{ sourceLabel(p.officialGroup.sourceType) }} · {{ timestamp(p.officialGroup.observedAt) }}
              </dd>
              <dd v-if="p.officialGroup" class="mt-1 text-xs break-all text-[var(--ks-muted)]">
                {{ p.officialGroup.sourceReference }}
              </dd>
''',
          )
          replace(
              v,
              '''              <dd class="mt-1 font-semibold">
                {{
                  p.targetCondition?.powerCap == null
                    ? t('kingdomP7D.needsVerification')
                    : formatNumber(p.targetCondition.powerCap)
                }}
              </dd>
''',
              '''              <dd class="mt-1 font-semibold">
                {{
                  p.targetCondition?.powerCap == null
                    ? t('kingdomP7D.needsVerification')
                    : formatNumber(p.targetCondition.powerCap)
                }}
              </dd>
              <dd v-if="p.targetCondition" class="mt-1 text-xs text-[var(--ks-muted)]">
                {{ sourceLabel(p.targetCondition.sourceType) }} · {{ timestamp(p.targetCondition.observedAt) }}
              </dd>
              <dd v-if="p.targetCondition" class="mt-1 text-xs break-all text-[var(--ks-muted)]">
                {{ p.targetCondition.sourceReference }}
              </dd>
''',
          )
          replace(
              v,
              '''              <dd class="mt-1 text-xs text-[var(--ks-muted)]">
                {{
                  p.transferScore.observedAt
                    ? timestamp(p.transferScore.observedAt)
                    : t('kingdomP7D.noObservation')
                }}
              </dd>
''',
              '''              <dd class="mt-1 text-xs text-[var(--ks-muted)]">
                {{ sourceLabel(p.transferScore.sourceType) }} ·
                {{
                  p.transferScore.observedAt
                    ? timestamp(p.transferScore.observedAt)
                    : t('kingdomP7D.noObservation')
                }}
              </dd>
              <dd v-if="p.transferScore.sourceReference" class="mt-1 text-xs break-all text-[var(--ks-muted)]">
                {{ p.transferScore.sourceReference }}
              </dd>
''',
          )
          PY
          vendor/bin/pint app/Contexts/GameWorld/KingdomTransfers/Queries/TransferEligibilityQuery.php app/Contexts/GameWorld/KingdomTransfers/Http/Controllers/TransferReadinessController.php
          vendor/bin/pint --test app/Contexts/GameWorld/KingdomTransfers/Queries/TransferEligibilityQuery.php app/Contexts/GameWorld/KingdomTransfers/Http/Controllers/TransferReadinessController.php
          npx prettier --write resources/js/pages/Kingdom/Transfer/Readiness.vue
          npx prettier --check resources/js/pages/Kingdom/Transfer/Readiness.vue
      - name: Commit provenance read contract and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/kingdom-transfer-group-provenance-once.yml
          git add \
            app/Contexts/GameWorld/KingdomTransfers/Queries/TransferEligibilityQuery.php \
            app/Contexts/GameWorld/KingdomTransfers/Http/Controllers/TransferReadinessController.php \
            resources/js/pages/Kingdom/Transfer/Readiness.vue
          git commit -m "fix: expose transfer decision provenance"
          git push origin HEAD:feature/kingdom-transfer-planning
