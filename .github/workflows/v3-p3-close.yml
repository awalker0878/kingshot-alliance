name: V3 CA-P3 Close

on:
  push:
    branches:
      - architecture-v3-capability-alignment

permissions:
  contents: write

jobs:
  close:
    if: ${{ !contains(github.event.head_commit.message, 'complete CA-P3') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v3-capability-alignment
          fetch-depth: 0
      - name: Require final P3 validation pass
        run: test -f ARCH_V3_P3_FINAL_PASS && grep -qx PASS ARCH_V3_P3_FINAL_PASS
      - name: Remove temporary P3 tooling and reports
        shell: bash
        run: |
          rm -f \
            .github/workflows/v3-p3-audit.yml \
            .github/workflows/v3-p3-inventory.yml \
            .github/workflows/v3-source-snapshot.yml \
            .github/workflows/v3-p3-publish-inventory.yml \
            .github/workflows/v3-p3-publish-write-audit.yml \
            .github/workflows/v3-p3-publish-inventory.yml \
            .github/workflows/v3-p3-publish-write-audit.yml \
            .github/workflows/v3-p3-publish-inventory.yml \
            .github/workflows/v3-p3-gate.yml \
            .github/workflows/v3-p3-validation.yml \
            .github/workflows/v3-p3-final-gate.yml \
            .github/workflows/v3-p3-platform-model-relations.yml \
            .github/workflows/v3-p3-publish-write-audit.yml \
            .github/workflows/v3-p3-publish-inventory.yml \
            .github/workflows/v3-p3-invitation-call.yml \
            .github/workflows/v3-p3-remove-foreign-locks.yml \
            .github/workflows/v3-p3-close.yml \
            ARCH_V3_P3_FOREIGN_MODEL_INVENTORY.txt \
            ARCH_V3_P3_FOREIGN_WRITE_AUDIT.txt \
            ARCH_V3_P3_GATE_PASS \
            ARCH_V3_P3_GATE_FAIL.txt \
            ARCH_V3_P3_FINAL_PASS \
            ARCH_V3_P3_FINAL_FAIL.txt
      - name: Advance live status to CA-P4
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('ARCH_V3_REWRITE_STATUS.md')
          text = path.read_text()
          start = text.index('## Phase CA-P3 — Context-owned write APIs')
          end = text.index('## Phase CA-P4 — Workflow correction')
          p3 = '''## Phase CA-P3 — Context-owned write APIs\n\nStatus: COMPLETE\n\n### Done\n- Added V3 foreign-write ownership enforcement under `tests/v3/Architecture/CrossContextPersistenceV3Test.php`.\n- Eliminated foreign-context aggregate locks and mutations from business contexts.\n- Added immutable owner contracts for Accounts identity, GameWorld Players/Kingdoms, and Alliance lifecycle.\n- Added owner queries for account identity, Player/Kingdom/Alliance references, membership facts, storage usage, and Alliance permissions.\n- Reworked Platform Administrator authority around scalar `user_id` grants and Accounts identity snapshots; Platform no longer locks/navigates Accounts User rows for authorization.\n- Reworked account deletion into owner-coordinated operations: Alliance removes memberships, GameWorld releases Players, Accounts anonymizes the account, Platform owns only deletion-request state.\n- Reworked legal hold target validation through owner queries; Platform locks only Platform hold rows.\n- Reworked Platform Alliance configuration/usage/lifecycle/export APIs around scalar `alliance_id` and owner contracts.\n- Delegated Alliance lifecycle mutation to Alliance-owned `TransitionAllianceLifecycle`.\n- Delegated Event type scope writes from Platform EventAdministration to Operations-owned `ConfigureEventTypeScope`.\n- Removed direct foreign Player locks from Alliance creation and invitation issuance.\n- Removed invalid foreign-context row locks across the codebase; foreign owners now control their own lock boundaries.\n- Cross-context write invariant reached zero violations.\n- Full P3 validation passed: Composer install/discovery, strict PSR-4, PHP syntax, route boot, and all V3 architecture tests.\n- Temporary P3 audit workflows, inventories, reports, and sentinels removed after validation.\n\n### Intentionally deferred\n- Read-side foreign Model imports and cross-context Eloquent navigation are CA-P6/P7 enforcement work.\n- Workflow package correction remains CA-P4.\n- Communications semantic cleanup remains CA-P5.\n\n### Failed / blocked\n- None.\n\n'''
          text = text[:start] + p3 + text[end:]
          text = text.replace('## Phase CA-P4 — Workflow correction\n\nStatus: NOT STARTED', '## Phase CA-P4 — Workflow correction\n\nStatus: IN PROGRESS')
          path.write_text(text)
          PY
      - name: Commit closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(v3): complete CA-P3 owner write boundaries [skip ci]"
          git push origin HEAD:architecture-v3-capability-alignment
