name: Phase 4 diagnose PHP

on:
  push:
    branches:
      - agent/phase-4-recruitment
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase4-diagnose-php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kingshot_test
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_test
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: array
      REDIS_HOST: 127.0.0.1
      PULSE_ENABLED: 'false'
    steps:
      - name: Check out source branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/phase-4-recruitment
          fetch-depth: 0
      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare database
        run: php artisan migrate --force
      - name: Capture PHP gate diagnostics
        shell: bash
        run: |
          set +e
          vendor/bin/pint --parallel --test > /tmp/pint.log 2>&1
          PINT_STATUS=$?
          vendor/bin/phpstan analyse --memory-limit=1G --no-progress > /tmp/phpstan.log 2>&1
          PHPSTAN_STATUS=$?
          php artisan config:clear --ansi > /tmp/config.log 2>&1
          php artisan test --parallel > /tmp/tests.log 2>&1
          TEST_STATUS=$?
          set -e

          {
            echo "Phase 4 PHP diagnostic"
            echo "pint_status=${PINT_STATUS}"
            echo "phpstan_status=${PHPSTAN_STATUS}"
            echo "test_status=${TEST_STATUS}"
            echo
            echo "===== PINT (tail) ====="
            tail -n 80 /tmp/pint.log
            echo
            echo "===== PHPSTAN (tail) ====="
            tail -n 160 /tmp/phpstan.log
            echo
            echo "===== TESTS (tail) ====="
            tail -n 160 /tmp/tests.log
          } > docs/.phase4-php-diagnosis.txt
      - name: Commit diagnostic output
        shell: bash
        run: |
          set -euo pipefail
          git add docs/.phase4-php-diagnosis.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Capture Phase 4 PHP diagnostics'
          git push origin HEAD:agent/phase-4-recruitment
