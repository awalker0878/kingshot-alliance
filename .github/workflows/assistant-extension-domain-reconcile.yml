name: Assistant Extension Domain Reconcile

on:
  push:
    branches:
      - alliance-assistant-gameworld-extension

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[assistant-domain-done]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: alliance-assistant-gameworld-extension
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Reconcile owner semantics
        shell: python
        run: |
          from pathlib import Path

          assistant = Path('app/ReadModels/AllianceAssistant/Queries/AllianceAssistantQuery.php')
          text = assistant.read_text()
          old = "['not_met', 'unknown', 'conflicting']"
          new = "['unmet', 'unknown', 'conflicting']"
          if old not in text:
              raise SystemExit('expected transfer requirement state filter not found')
          assistant.write_text(text.replace(old, new, 1))

          facts = Path('app/Contexts/GameWorld/Progression/Queries/ProgressionFactQuery.php')
          text = facts.read_text()
          old = '''    public function answer(ProgressionFactRequest $request): ProgressionFactResult
    {
        $dataset = $this->datasets->latest();

        return match ($request->kind) {
'''
          new = '''    public function answer(ProgressionFactRequest $request): ProgressionFactResult
    {
        return $this->answerFromDataset($this->datasets->latest(), $request);
    }

    public function answerFromDataset(
        ProgressionDataset $dataset,
        ProgressionFactRequest $request,
    ): ProgressionFactResult {
        return match ($request->kind) {
'''
          if old not in text:
              raise SystemExit('expected ProgressionFactQuery answer block not found')
          facts.write_text(text.replace(old, new, 1))
      - run: ./vendor/bin/pint app/ReadModels/AllianceAssistant/Queries/AllianceAssistantQuery.php app/Contexts/GameWorld/Progression/Queries/ProgressionFactQuery.php
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/assistant-extension-domain-reconcile.yml
          git add app/ReadModels/AllianceAssistant/Queries/AllianceAssistantQuery.php app/Contexts/GameWorld/Progression/Queries/ProgressionFactQuery.php
          git diff --check
          git commit -m 'fix: preserve owner transfer and conflict semantics [assistant-domain-done]'
          git push origin HEAD:alliance-assistant-gameworld-extension
