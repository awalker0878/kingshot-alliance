name: PR 163 prepare database reset optimization

on:
  push:
    branches: [astra/codebase-hardening]
    paths:
      - .github/pr163-optimize-database-resets.py
      - .github/workflows/pr163-prepare-database-resets.yml

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'awalker0878/kingshot-alliance' && github.ref == 'refs/heads/astra/codebase-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify preparation input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = d0cba0ca151246a85f257971104b765563a5fb0c
          test -f .github/pr163-optimize-database-resets.py
          python -m py_compile .github/pr163-optimize-database-resets.py
          rm -rf .github/__pycache__
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD']).decode().splitlines())
          assert changed == {'.github/workflows/pr163-prepare-database-resets.yml'}, changed
          PY

      - name: Apply reviewed database reset migration
        run: python .github/pr163-optimize-database-resets.py

      - name: Verify reset migration shape without executing tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('docs/codebase/test-database-reset-migration.json').read_text())
          converted = manifest['converted']
          retained = manifest['retained_database_migrations']
          assert manifest['integration_candidates'] == 47
          assert len(converted) >= 40
          assert manifest['behavioral_changes'] is False
          assert manifest['tests_executed'] is False
          assert not Path('.github/pr163-optimize-database-resets.py').exists()

          for row in converted:
              source = Path(row['path']).read_text()
              assert 'use Illuminate\\Foundation\\Testing\\DatabaseTruncation;' in source, row['path']
              assert '    use DatabaseTruncation;' in source, row['path']
              assert 'DatabaseMigrations' not in source, row['path']

          for row in retained:
              source = Path(row['path']).read_text()
              assert 'use Illuminate\\Foundation\\Testing\\DatabaseMigrations;' in source, row['path']
              assert '    use DatabaseMigrations;' in source, row['path']

          for path in manifest['feature_database_migrations_unchanged']:
              source = Path(path).read_text()
              assert 'DatabaseMigrations' in source, path

          print(f"Prepared {len(converted)} truncation conversions; retained {len(retained)} schema-sensitive Integration classes. No tests executed.")
          PY
          git diff --check

      - name: Prepare exact unreferenced Git tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr163-prepare-database-resets.yml
          git add -A
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          def git(*args: str) -> str:
              return subprocess.check_output(['git', *args]).decode().strip()

          expected_full_tree = git('write-tree')
          workflow = '.github/workflows/pr163-prepare-database-resets.yml'
          entries = []
          raw = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-status', '--no-renames', '-z']
          ).decode().split('\0')

          for index in range(0, len(raw) - 1, 2):
              status, path = raw[index:index + 2]
              allowed = (
                  path.startswith('tests/Integration/')
                  or path == 'docs/codebase/test-database-reset-migration.json'
                  or path == '.github/pr163-optimize-database-resets.py'
                  or path == workflow
              )
              assert allowed, path
              if path == workflow:
                  continue
              entry = {'path': path, 'mode': '100644', 'type': 'blob'}
              if status == 'D':
                  entry['sha'] = None
              else:
                  entry['content'] = Path(path).read_text()
              entries.append(entry)

          payload = json.dumps({
              'base_tree': git('rev-parse', 'HEAD^{tree}'),
              'tree': entries,
          }).encode()
          request = urllib.request.Request(
              'https://api.github.com/repos/awalker0878/kingshot-alliance/git/trees',
              data=payload,
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              result = json.load(response)

          evidence = {
              'source_commit': git('rev-parse', 'HEAD'),
              'partial_tree_sha': result['sha'],
              'expected_full_tree_sha': expected_full_tree,
              'workflow_to_delete': workflow,
              'tests_executed': False,
              'branch_updated': False,
          }
          out = Path(os.environ['RUNNER_TEMP'], 'prepared-database-reset-tree.json')
          out.write_text(json.dumps(evidence, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f"PARTIAL_TREE_SHA={result['sha']}\n")
              env.write(f"EXPECTED_FULL_TREE_SHA={expected_full_tree}\n")
          print(json.dumps(evidence))
          PY

      - name: Publish preparation status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"database-reset-preparation-no-tests\",\"description\":\"partial ${PARTIAL_TREE_SHA}; no tests executed\"}"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"database-reset-expected-tree-no-tests\",\"description\":\"expected ${EXPECTED_FULL_TREE_SHA}; no tests executed\"}"

      - name: Publish preparation failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"database-reset-preparation-no-tests","description":"reset preparation failed; no tests executed"}'

      - name: Retain preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr163-prepared-database-reset-tree-no-tests
          path: ${{ runner.temp }}/prepared-database-reset-tree.json
          if-no-files-found: warn
          retention-days: 7
