name: Alliance Format Capture

on:
  push:
    branches:
      - alliance-capability-expansion

permissions:
  contents: write

jobs:
  format:
    name: Apply Prettier output
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: alliance-capability-expansion

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Format remaining Alliance expansion frontend
        run: |
          npx prettier --write \
            resources/js/pages/Alliance/Overview.vue \
            resources/js/pages/Intelligence/Roster/History.vue

      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- \
            resources/js/pages/Alliance/Overview.vue \
            resources/js/pages/Intelligence/Roster/History.vue; then
            echo "No formatting changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            resources/js/pages/Alliance/Overview.vue \
            resources/js/pages/Intelligence/Roster/History.vue
          git commit -m "Fix Alliance frontend formatting"
          git push origin HEAD:alliance-capability-expansion
