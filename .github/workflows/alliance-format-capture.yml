name: Alliance Expansion Finalizer

on:
  push:
    branches:
      - alliance-capability-expansion

permissions:
  contents: write

jobs:
  finalize:
    name: Apply final integration and documentation reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: alliance-capability-expansion

      - name: Apply staged finalization
        run: python3 .github/alliance-finalize.py

      - name: Commit final candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete Alliance expansion integration and documentation"
          git push origin HEAD:alliance-capability-expansion
