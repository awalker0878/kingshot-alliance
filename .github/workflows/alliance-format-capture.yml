name: Alliance Expansion Finalizer

on:
  push:
    branches:
      - alliance-capability-expansion

permissions:
  contents: write

jobs:
  finalize:
    name: Apply final integration and documentation reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: alliance-capability-expansion

      - name: Apply deterministic finalization patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

