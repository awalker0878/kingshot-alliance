name: King Perks Verification

on:
  pull_request:
    paths:
      - 'app/Contexts/Operations/KingPerks/**'
      - 'app/Contexts/Operations/EventCore/Models/Event.php'
      - 'app/Contexts/Operations/EventCore/Models/EventOccurrence.php'
      - 'app/Contexts/Operations/Reminders/**'
      - 'bootstrap/app.php'
      - 'config/operations.php'
      - 'database/migrations/*king_perk*'
      - 'resources/js/pages/KingPerks/**'
      - 'routes/king-perks.php'
      - 'tests/Feature/KingPerks/**'
      - 'tests/Unit/KingPerks/**'
      - 'tsconfig.king-perks.json'
      - 'vite.king-perks.config.ts'
      - '.github/workflows/king-perks-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: king-perks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: King Perks backend contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kingshot_test
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_test
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify King Perks V1 hard cut
        shell: bash
        run: |
          set -euo pipefail
          test ! -d app/Domain/KingPerks
          matches=$(grep -R -n -E --include='*.php' 'App\\Domain\\KingPerks\\' app routes bootstrap config database tests 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            exit 1
          fi

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PostgreSQL schema and migration
        run: php artisan migrate --force

      - name: Pint King Perks files
        run: >-
          vendor/bin/pint --test
          app/Contexts/Operations/KingPerks
          app/Contexts/Operations/EventCore/Models/Event.php
          app/Contexts/Operations/EventCore/Models/EventOccurrence.php
          app/Contexts/Operations/Reminders
          bootstrap/app.php
          config/operations.php
          database/migrations/2026_08_15_083000_create_king_perk_tables.php
          routes/king-perks.php
          tests/Feature/KingPerks
          tests/Unit/KingPerks

      - name: Larastan King Perks capability
        run: >-
          vendor/bin/phpstan analyse --memory-limit=1G
          app/Contexts/Operations/KingPerks
          app/Contexts/Operations/EventCore/Models/Event.php
          app/Contexts/Operations/EventCore/Models/EventOccurrence.php
          app/Contexts/Operations/Reminders
          bootstrap/app.php
          config/operations.php
          routes/king-perks.php

      - name: King Perks backend tests
        shell: bash
        run: |
          set -uo pipefail
          set +e
          php artisan test tests/Feature/KingPerks tests/Unit/KingPerks 2>&1 | tee king-perks-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            details=$(tail -n 120 king-perks-tests.log)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=King Perks backend tests failed::$details"
            exit "$status"
          fi

  frontend:
    name: King Perks frontend contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint King Perks pages
        run: npx eslint resources/js/pages/KingPerks

      - name: Prettier King Perks pages
        run: npx prettier --check resources/js/pages/KingPerks

      - name: King Perks Vue TypeScript contract
        run: npx vue-tsc --noEmit -p tsconfig.king-perks.json

      - name: Targeted production build
        run: npx vite build --config vite.king-perks.config.ts
