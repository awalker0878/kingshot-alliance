name: Architecture V2 Verification

on:
  pull_request:
    branches: [main, '2.1']
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'docs/**'
      - 'routes/**'
      - 'resources/js/**'
      - 'scripts/**'
      - 'tests/v2/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'phpunit.xml'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/architecture-v2-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-contract:
    name: Final V2 application contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kingshot_test
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_test
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Verify canonical V2 source shape
        shell: bash
        run: |
          set -euo pipefail
          test ! -d app/Domain
          test ! -d app/Shared/Audit
          test ! -d app/Shared/Messaging
          test ! -d tests/Feature
          test ! -d tests/Architecture
          test ! -d tests/Integration
          test ! -d tests/Performance
          test ! -d tests/TenantIsolation
          test ! -d tests/Unit
          test ! -d tests/RewriteInput
          test -d tests/v2/Architecture
          test -d tests/v2/Contexts
          test -d tests/v2/ReadModels
          test -d tests/v2/Shared
          test -d tests/v2/Support
          test -d tests/v2/Visual
          test -d tests/v2/Workflows
          test -d app/Contexts/Alliance/Access
          test -d app/Contexts/Operations/Access
          test -d app/Contexts/Intelligence/Access
          test -d app/Contexts/Communications/Delivery
          test -d app/Contexts/Platform/Integrations
          test -d app/Shared/Infrastructure/AuditTrail
          test -d app/Shared/Infrastructure/Messaging/Outbox
          test -d app/Contexts/GameWorld/KingdomTransfers
          test -d app/Workflows/PlayerContext
          test -d app/ReadModels/KingdomSettings
          test ! -d app/Workflows/KingdomTransfer
          test ! -d tests/v2/Workflows/KingdomTransfer
          test ! -d app/Contexts/Operations/Reminders
          test ! -d tests/v2/Contexts/Operations/Reminders
          test ! -e tests/v2/Architecture/CapabilityCoverageV2Test.php
          test ! -e docs/architecture/decisions/0004-transactional-mutation-authority.md
          test -e docs/architecture/decisions/0004-transactional-write-authorization.md
          test ! -e .github/scripts/arch_v2_clean_room_tests.py
          test ! -e .github/scripts/arch_v2_clean_room_test_fixups.py
          test ! -e .github/workflows/architecture-v2-clean-room-tests.yml

          expected_contexts='Accounts Alliance Communications GameWorld Intelligence Operations Platform'
          actual_contexts="$(find app/Contexts -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tr '\n' ' ' | sed 's/ $//')"
          [ "$actual_contexts" = "$expected_contexts" ] || { echo "Unexpected business contexts: $actual_contexts"; exit 1; }

          expected_operations='Access BattlePlans EventCore KingPerks Participation Polls Rallies Results Rosters'
          actual_operations="$(find app/Contexts/Operations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tr '\n' ' ' | sed 's/ $//')"
          [ "$actual_operations" = "$expected_operations" ] || { echo "Unexpected Operations capabilities: $actual_operations"; exit 1; }

          runtime_matches=$(grep -R -n --include='*.php' 'App\\Domain\\' app routes bootstrap config database tests/v2 2>/dev/null || true)
          test -z "$runtime_matches" || { echo "$runtime_matches"; exit 1; }

          old_shared_matches=$(grep -R -n -E --include='*.php' 'App\\Shared\\(Audit|Messaging)\\' app routes bootstrap config database tests/v2 2>/dev/null || true)
          test -z "$old_shared_matches" || { echo "$old_shared_matches"; exit 1; }

          compatibility_paths=$(find app -type d \( -iname 'legacy' -o -iname 'compat' -o -iname 'compatibility' -o -iname 'shim' -o -iname 'legacy*' -o -iname 'compat*' -o -iname 'shim*' \) -print)
          test -z "$compatibility_paths" || { echo "$compatibility_paths"; exit 1; }

          alias_matches=$(grep -R -n --include='*.php' 'class_alias(' app routes bootstrap config database 2>/dev/null || true)
          test -z "$alias_matches" || { echo "$alias_matches"; exit 1; }

          bad=$(find tests/v2 -type f -name '*Test.php' ! -name '*V2Test.php' ! -path 'tests/v2/TestCase.php' ! -path 'tests/v2/Support/*' -print)
          test -z "$bad" || { echo "$bad"; exit 1; }

          grep -q '<directory>tests/v2</directory>' phpunit.xml
          ! grep -q 'tests/Feature' phpunit.xml
          grep -q "testDir: './tests/v2/Visual'" playwright.config.ts

      - name: Verify Player and Kingdom ownership boundaries
        shell: bash
        run: |
          set -euo pipefail
          player='app/Contexts/GameWorld/Models/Player.php'
          test -f "$player"
          grep -q 'user_id' "$player"
          if grep -n -E 'App\\Contexts\\Accounts\\Models\\User|belongsTo\(User::class|function[[:space:]]+user[[:space:]]*\(' "$player"; then
            echo 'GameWorld Player must not navigate into Accounts.'
            exit 1
          fi
          test -f app/Contexts/GameWorld/Governance/Http/Controllers/KingdomRoleController.php
          test ! -e app/Contexts/Alliance/Access/Http/Controllers/KingdomRoleController.php

      - name: Verify transactional write ownership
        shell: bash
        run: |
          set -euo pipefail
          if find app -type f -name '*MutationAuthority.php' | grep -q .; then
            echo 'MutationAuthority files remain:'
            find app -type f -name '*MutationAuthority.php'
            exit 1
          fi
          if grep -R -n -E 'MutationAuthority' app routes bootstrap --include='*.php'; then
            echo 'MutationAuthority references remain.'
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          authorization_files = sorted(Path('app/Contexts').rglob('*Authorization.php'))
          assert authorization_files, 'No context authorization services found.'
          forbidden = ('lockForUpdate', 'sharedLock', 'transactionLevel', 'DB::transaction', 'WriteState', 'MutationAuthority')
          for path in authorization_files:
              source = path.read_text()
              for needle in forbidden:
                  assert needle not in source, f'{path} contains transactional/write-state concern: {needle}'

          write_states = [
              Path('app/Contexts/Alliance/Access/Services/AllianceWriteState.php'),
              Path('app/Contexts/GameWorld/Governance/Services/KingdomWriteState.php'),
              Path('app/Contexts/GameWorld/Governance/Services/PlayerWriteState.php'),
              Path('app/Contexts/Operations/EventCore/Services/EventWriteState.php'),
              Path('app/Contexts/Platform/Access/Services/PlatformWriteState.php'),
          ]
          for path in write_states:
              assert path.is_file(), f'Missing write-state service: {path}'
              source = path.read_text()
              assert 'transactionLevel' in source, f'{path} must require an owning transaction.'
              assert 'lockForUpdate' in source, f'{path} must stabilize mutable state.'
              assert 'Permission::' not in source, f'{path} must not interpret permission vocabulary.'
              assert 'MutationAuthority' not in source, f'{path} must not recreate the removed abstraction.'
          PY

          for owner in \
            app/Contexts/Alliance/Core/Actions/CreateAlliance.php \
            app/Contexts/Alliance/Membership/Actions/TransferAllianceLeadership.php \
            app/Contexts/GameWorld/Governance/Actions/AssignKingdomRole.php \
            app/Contexts/Operations/EventCore/Actions/CreateEvent.php \
            app/Contexts/Operations/KingPerks/Services/KingPerkScheduler.php \
            app/Contexts/GameWorld/KingdomTransfers/Actions/TransitionTransferPlan.php; do
            grep -q 'DB::transaction' "$owner" || { echo "$owner does not own its transaction boundary"; exit 1; }
          done

          http_writes=$(grep -R -n --include='*.php' -E '(DB::(insert|update|delete|statement|transaction)|->(save|delete|update|insert|create)\()' app/Contexts/*/*/Http app/Contexts/*/Http app/Workflows/*/Http 2>/dev/null || true)
          test -z "$http_writes" || { echo "$http_writes"; echo 'HTTP adapters must not own writes.'; exit 1; }

      - name: Verify Communications and reminder ownership
        shell: bash
        run: |
          set -euo pipefail
          test -f app/Contexts/Communications/Delivery/Models/NotificationDelivery.php
          test -f app/Contexts/Communications/Delivery/Models/NotificationPreference.php
          test -f app/Contexts/Communications/Delivery/Services/NotificationDeliveryService.php
          test -f app/Contexts/Operations/Participation/Reminders/Actions/QueueDueEventReminders.php
          test -f app/Contexts/Operations/KingPerks/Actions/QueueDueKingPerkReminders.php
          test -f tests/v2/Contexts/Operations/Participation/Reminders/CapabilitySurfaceV2Test.php

          if grep -R -n -E 'App\\Contexts\\(Operations|Alliance|GameWorld)\\' app/Contexts/Communications --include='*.php'; then
            echo 'Communications imports a business-owning context.'
            exit 1
          fi
          if grep -R -n --include='*.php' -E 'EventReminderDelivery|KingPerkReminderDelivery|ReminderDeliveryStatus' app tests/v2; then
            echo 'Legacy business-specific reminder delivery types remain.'
            exit 1
          fi
          if grep -R -n --include='*.php' -E "Schema::create\('(event_reminder_deliveries|king_perk_reminder_deliveries)'" database/migrations; then
            echo 'Fresh schema still creates legacy reminder delivery tables.'
            exit 1
          fi

      - name: Verify Kingdom Transfer ownership
        shell: bash
        run: |
          set -euo pipefail
          test -f app/Contexts/GameWorld/KingdomTransfers/Access/Enums/TransferPermission.php
          test -f app/Contexts/GameWorld/KingdomTransfers/Access/Services/TransferAuthorization.php
          test -f tests/v2/Contexts/GameWorld/KingdomTransfers/CapabilitySurfaceV2Test.php
          grep -R -n --include='*.php' 'TransferPermission::Manage' app/Contexts/GameWorld/KingdomTransfers >/dev/null
          if grep -R -n --include='*.php' 'App\\Contexts\\Intelligence\\Access\\' app/Contexts/GameWorld/KingdomTransfers; then
            echo 'Kingdom Transfer must not depend on Intelligence authorization.'
            exit 1
          fi
          if grep -R -n --include='*.php' 'IntelligencePermission::KingdomManage' app/Contexts/GameWorld/KingdomTransfers; then
            echo 'Kingdom Transfer must own its permission vocabulary.'
            exit 1
          fi

      - name: Verify Workflows and ReadModels are composition-only
        shell: bash
        run: |
          set -euo pipefail
          workflow_owners=$(find app/Workflows -type f \( -path '*/Models/*' -o -path '*/Migrations/*' -o -path '*/Repositories/*' -o -path '*/Access/*' \) -print)
          test -z "$workflow_owners" || { echo "$workflow_owners"; exit 1; }
          workflow_persistence=$(grep -R -n --include='*.php' -E 'extends Model|Schema::' app/Workflows 2>/dev/null || true)
          test -z "$workflow_persistence" || { echo "$workflow_persistence"; exit 1; }
          context_to_workflow=$(grep -R -n --include='*.php' 'App\\Workflows\\' app/Contexts 2>/dev/null || true)
          test -z "$context_to_workflow" || { echo "$context_to_workflow"; exit 1; }

          read_model_writes=$(grep -R -n --include='*.php' -E '(DB::(insert|update|delete|statement|transaction)|->(save|delete|update|insert|create)\()' app/ReadModels 2>/dev/null || true)
          test -z "$read_model_writes" || { echo "$read_model_writes"; echo 'ReadModels must remain read-only.'; exit 1; }

      - name: Verify architecture governance is current
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -i -E 'capability coverage|capability-coverage|mutation authority' docs --include='*.md'; then
            echo 'Superseded architecture governance vocabulary remains.'
            exit 1
          fi
          test -f docs/governance/architecture-compliance.md
          test -f tests/v2/Architecture/ArchitectureComplianceV2Test.php
          test -f tests/v2/Architecture/ArchitectureBoundariesV2Test.php
          test -f tests/v2/Architecture/MutationSafetyV2Test.php

      - name: Create test environment file
        run: touch .env

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Verify PostgreSQL 18 fresh schema
        run: php artisan migrate:fresh --force

      - name: Verify PHP formatting
        run: >-
          vendor/bin/pint --test
          tests/v2
          app/Contexts
          app/Shared
          app/Workflows
          app/ReadModels
          bootstrap/app.php
          bootstrap/providers.php
          routes

      - name: Run strict clean-room V2 PHPUnit suite
        run: >-
          php artisan test tests/v2
          --display-warnings
          --display-deprecations
          --display-phpunit-deprecations
          --fail-on-warning
          --fail-on-risky

      - name: Larastan all final V2 owners
        run: >-
          vendor/bin/phpstan analyse --memory-limit=1536M
          app/Contexts
          app/Shared
          app/Workflows
          app/ReadModels
          bootstrap/app.php
          bootstrap/providers.php
          routes

      - name: Configure Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify frontend source
        run: npm run check

      - name: Verify V2 visual test discovery
        run: npx playwright test --list
