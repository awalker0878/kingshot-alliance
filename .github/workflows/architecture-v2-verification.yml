name: Architecture V2 Verification
# P5 verification: operational V1 roots must remain absent and Operations must stay downstream-clean.

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Contexts/**'
      - 'app/Shared/**'
      - 'app/Workflows/**'
      - 'app/ReadModels/**'
      - 'app/Domain/Notifications/**'
      - 'app/Domain/Contributions/**'
      - 'app/Domain/Integrations/**'
      - 'bootstrap/app.php'
      - 'bootstrap/providers.php'
      - 'config/accounts.php'
      - 'config/alliance.php'
      - 'config/auth.php'
      - 'config/game_world.php'
      - 'config/operations.php'
      - 'database/**'
      - 'routes/account.php'
      - 'routes/console.php'
      - 'routes/event-history.php'
      - 'routes/king-perks.php'
      - 'routes/platform.php'
      - 'routes/web.php'
      - 'tests/Architecture/**'
      - 'tests/Feature/Accounts/**'
      - 'tests/Feature/GameWorld/**'
      - 'tests/Feature/Alliances/**'
      - 'tests/Feature/Memberships/**'
      - 'tests/Feature/Recruitment/**'
      - 'tests/Feature/Content/**'
      - 'tests/Feature/Events/**'
      - 'tests/Feature/KingPerks/**'
      - 'tests/Feature/Integrations/**'
      - 'tests/Feature/Contributions/**'
      - 'tests/TenantIsolation/Alliances/**'
      - 'tests/Unit/Accounts/**'
      - 'tests/Unit/Authorization/**'
      - 'docs/product/architecture-v2-*.md'
      - '.github/workflows/architecture-v2-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-contract:
    name: V2 architecture through P5 Operations cut
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kingshot_test
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_test
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Verify V1 hard cuts are absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -d app/Domain/Authorization
          test ! -d app/Domain/Events
          test ! -d app/Domain/Rallies
          test ! -d app/Domain/KingPerks

          matches=$(grep -R -n -E --include='*.php' 'App\\Domain\\(Authorization|Events|Rallies|KingPerks)\\' app routes bootstrap config database tests 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            exit 1
          fi

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Verify PostgreSQL schema
        run: php artisan migrate --force

      - name: Check V2 through P5 PHP formatting
        shell: bash
        run: |
          set -o pipefail
          set +e
          vendor/bin/pint --test \
            tests/Architecture \
            tests/Feature/Accounts \
            tests/Feature/GameWorld \
            tests/Feature/Alliances \
            tests/Feature/Memberships \
            tests/Feature/Recruitment \
            tests/Feature/Content \
            tests/Feature/Events \
            tests/Feature/KingPerks \
            tests/Feature/Integrations \
            tests/Feature/Contributions \
            tests/TenantIsolation/Alliances \
            tests/Unit/Accounts \
            tests/Unit/Authorization \
            app/Contexts \
            app/Shared \
            app/Workflows \
            app/ReadModels \
            bootstrap/app.php \
            bootstrap/providers.php \
            config/accounts.php \
            config/alliance.php \
            config/auth.php \
            config/game_world.php \
            config/operations.php \
            database/factories/UserFactory.php \
            routes/account.php \
            routes/console.php \
            routes/event-history.php \
            routes/king-perks.php \
            routes/platform.php \
            routes/web.php 2>&1 | tee pint-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            details=$(tail -n 60 pint-tests.log)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=Architecture V2 formatting failed::$details"
            exit "$status"
          fi

      - name: Run V2 architecture tests
        shell: bash
        run: |
          set -o pipefail
          set +e
          php artisan test \
            tests/Architecture/ArchitectureV2DependencyTest.php \
            tests/Architecture/ArchitectureV2AllianceTest.php \
            tests/Architecture/ArchitectureV2OperationsTest.php \
            tests/Architecture/AccountExperienceTest.php \
            tests/Architecture/UserExperienceLocalizationFoundationTest.php \
            2>&1 | tee architecture-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            details=$(tail -n 100 architecture-tests.log)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=Architecture V2 tests failed::$details"
            exit "$status"
          fi

      - name: Larastan P2 through P5 contexts
        run: >-
          vendor/bin/phpstan analyse --memory-limit=1536M
          app/Contexts/Accounts
          app/Contexts/GameWorld
          app/Contexts/Alliance
          app/Contexts/Operations
          app/Contexts/Intelligence
          app/Contexts/Communications
          app/Contexts/Platform/Access
          app/Contexts/Platform/EventAdministration
          app/Shared
          app/Workflows
          app/ReadModels
          bootstrap/app.php
          bootstrap/providers.php
          database/factories/UserFactory.php
          routes/console.php
          routes/event-history.php
          routes/king-perks.php
          routes/platform.php

      - name: Run Accounts and GameWorld foundation tests
        run: >-
          php artisan test
          tests/Feature/Accounts
          tests/Feature/GameWorld
          tests/Unit/Accounts
          tests/Unit/Authorization/KingdomRoleVocabularyTest.php

      - name: Run Alliance bounded-context tests
        run: >-
          php artisan test
          tests/Feature/Alliances
          tests/Feature/Memberships
          tests/Feature/Recruitment
          tests/Feature/Content
          tests/TenantIsolation/Alliances
          tests/Unit/Authorization/AllianceRankPermissionsTest.php

      - name: Run Operations bounded-context tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t rally_tests < <(find tests -type f \( -name '*Rally*Test.php' -o -name '*Rallies*Test.php' \) -print | sort)
          php artisan test \
            tests/Feature/Events \
            tests/Feature/KingPerks \
            tests/Feature/Integrations \
            tests/Feature/Contributions \
            "${rally_tests[@]}"
