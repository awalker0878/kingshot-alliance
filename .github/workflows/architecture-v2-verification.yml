name: Architecture V2 Verification
# P7 verification: completed hard cuts remain absent; V2 context-owned tests define acceptance.

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Contexts/**'
      - 'app/Domain/**'
      - 'app/Shared/**'
      - 'app/Workflows/**'
      - 'app/ReadModels/**'
      - 'bootstrap/app.php'
      - 'bootstrap/providers.php'
      - 'config/accounts.php'
      - 'config/alliance.php'
      - 'config/auth.php'
      - 'config/game_world.php'
      - 'config/operations.php'
      - 'database/**'
      - 'routes/account.php'
      - 'routes/console.php'
      - 'routes/event-history.php'
      - 'routes/king-perks.php'
      - 'routes/platform.php'
      - 'routes/web.php'
      - 'tests/Architecture/**'
      - 'tests/Feature/Accounts/**'
      - 'tests/Feature/GameWorld/**'
      - 'tests/Feature/Alliance/**'
      - 'tests/Feature/Operations/**'
      - 'tests/Feature/Intelligence/**'
      - 'tests/Feature/Communications/**'
      - 'tests/Feature/Platform/**'
      - 'tests/Feature/Contributions/AllianceContributionReportQueryTest.php'
      - 'tests/Integration/Platform/OutboxPublisherTest.php'
      - 'tests/RewriteInput/Communications/**'
      - 'tests/TenantIsolation/Alliance/**'
      - 'tests/Unit/Accounts/**'
      - 'tests/Unit/Alliance/**'
      - 'tests/Unit/GameWorld/**'
      - 'tests/Unit/Operations/**'
      - 'tests/Unit/Intelligence/**'
      - 'docs/product/architecture-v2-*.md'
      - '.github/workflows/architecture-v2-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-contract:
    name: V2 architecture through P7 Communications Platform cut
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kingshot_test
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_test
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Verify completed V1 hard cuts are absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -d app/Domain/Authorization
          test ! -d app/Domain/Events
          test ! -d app/Domain/Rallies
          test ! -d app/Domain/KingPerks
          test ! -d app/Domain/Contributions
          test ! -d app/Domain/Notifications
          test ! -d app/Domain/Integrations
          test ! -d app/Domain/Platform
          test ! -d app/Shared/Audit
          test ! -d app/Shared/Messaging
          test ! -d tests/RewriteInput/Communications

          test -d app/Contexts/Communications/Reminders
          test -d app/Contexts/Platform/Integrations
          test -d app/Shared/Infrastructure/AuditTrail
          test -d app/Shared/Infrastructure/Messaging/Outbox
          test -d tests/Feature/Communications
          test -d tests/Feature/Platform

          runtime_matches=$(grep -R -n -E --include='*.php' 'App\\Domain\\(Authorization|Events|Rallies|KingPerks|Contributions|Notifications|Integrations|Platform)\\|App\\Shared\\(Audit|Messaging)\\' app routes bootstrap config database 2>/dev/null || true)
          if [ -n "$runtime_matches" ]; then
            echo "$runtime_matches"
            exit 1
          fi

          p7_test_matches=$(grep -R -n -E --include='*.php' 'App\\Domain\\(Notifications|Integrations|Platform)\\|App\\Shared\\(Audit|Messaging)\\' tests 2>/dev/null || true)
          if [ -n "$p7_test_matches" ]; then
            echo "$p7_test_matches"
            exit 1
          fi

      - name: Verify downstream contexts own Alliance authorization interpretation
        shell: bash
        run: |
          set -euo pipefail
          matches=$(grep -R -n --include='*.php' -E 'App\\Contexts\\Alliance\\Access\\Services\\Alliance(Authorization|MutationAuthority)' app/Contexts/Operations app/Contexts/Intelligence 2>/dev/null | grep -v '/Access/Services/' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            exit 1
          fi

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Verify PostgreSQL schema
        run: php artisan migrate:fresh --force

      - name: Check V2 through P7 PHP formatting
        shell: bash
        run: |
          set -o pipefail
          set +e
          vendor/bin/pint --test \
            tests/Architecture \
            tests/Feature/Accounts \
            tests/Feature/GameWorld \
            tests/Feature/Alliance \
            tests/Feature/Operations \
            tests/Feature/Intelligence \
            tests/Feature/Communications \
            tests/Feature/Platform \
            tests/Feature/Contributions/AllianceContributionReportQueryTest.php \
            tests/Integration/Platform/OutboxPublisherTest.php \
            tests/TenantIsolation/Alliance \
            tests/Unit/Accounts \
            tests/Unit/Alliance \
            tests/Unit/GameWorld \
            tests/Unit/Operations \
            app/Contexts \
            app/Shared \
            app/Workflows \
            app/ReadModels \
            app/Domain/Kingdoms/Models/TransferPlan.php \
            bootstrap/app.php \
            bootstrap/providers.php \
            config/accounts.php \
            config/alliance.php \
            config/auth.php \
            config/game_world.php \
            config/operations.php \
            database/factories/UserFactory.php \
            routes/account.php \
            routes/console.php \
            routes/event-history.php \
            routes/king-perks.php \
            routes/platform.php \
            routes/web.php 2>&1 | tee pint-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            details=$(tail -n 60 pint-tests.log)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=Architecture V2 formatting failed::$details"
            exit "$status"
          fi

      - name: Run V2 architecture tests
        shell: bash
        run: |
          set -o pipefail
          set +e
          php artisan test \
            tests/Architecture/ArchitectureV2DependencyTest.php \
            tests/Architecture/ArchitectureV2AllianceTest.php \
            tests/Architecture/ArchitectureV2OperationsTest.php \
            tests/Architecture/ArchitectureV2IntelligenceTest.php \
            tests/Architecture/ArchitectureV2PlatformTest.php \
            tests/Architecture/AccountExperienceTest.php \
            tests/Architecture/UserExperienceLocalizationFoundationTest.php \
            2>&1 | tee architecture-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            details=$(tail -n 100 architecture-tests.log)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=Architecture V2 tests failed::$details"
            exit "$status"
          fi

      - name: Larastan P2 through P7 contexts
        run: >-
          vendor/bin/phpstan analyse --memory-limit=1536M
          app/Contexts/Accounts
          app/Contexts/GameWorld
          app/Contexts/Alliance
          app/Contexts/Operations
          app/Contexts/Intelligence
          app/Contexts/Communications
          app/Contexts/Platform
          app/Shared
          app/Workflows
          app/ReadModels
          app/Domain/Kingdoms/Models/TransferPlan.php
          bootstrap/app.php
          bootstrap/providers.php
          database/factories/UserFactory.php
          routes/console.php
          routes/event-history.php
          routes/king-perks.php
          routes/platform.php

      - name: Run Accounts and GameWorld foundation tests
        run: >-
          php artisan test
          tests/Feature/Accounts
          tests/Feature/GameWorld
          tests/Unit/Accounts
          tests/Unit/GameWorld

      - name: Run Alliance bounded-context tests
        run: >-
          php artisan test
          tests/Feature/Alliance
          tests/TenantIsolation/Alliance
          tests/Unit/Alliance

      - name: Run V2 Operations bounded-context tests
        shell: bash
        run: |
          set -uo pipefail
          set +e
          php artisan test tests/Feature/Operations tests/Unit/Operations 2>&1 | tee operations-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            details=$(tail -n 120 operations-tests.log)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=V2 Operations tests failed::$details"
            exit "$status"
          fi

      - name: Run V2 Intelligence bounded-context tests
        shell: bash
        run: |
          set -uo pipefail
          set +e
          php artisan test tests/Feature/Intelligence 2>&1 | tee intelligence-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            details=$(tail -n 120 intelligence-tests.log)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=V2 Intelligence tests failed::$details"
            exit "$status"
          fi

      - name: Run V2 Communications delivery tests
        run: php artisan test tests/Feature/Communications

      - name: Run V2 Platform and integration tests
        run: php artisan test tests/Feature/Platform

      - name: Run P7 contribution reporting contract
        run: php artisan test tests/Feature/Contributions/AllianceContributionReportQueryTest.php

      - name: Run P7 Shared outbox publisher contract
        run: php artisan test tests/Integration/Platform/OutboxPublisherTest.php
