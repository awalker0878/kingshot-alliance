name: Architecture V2 Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Contexts/**'
      - 'app/Shared/**'
      - 'app/Workflows/**'
      - 'app/ReadModels/**'
      - 'app/Domain/Authorization/**'
      - 'bootstrap/app.php'
      - 'bootstrap/providers.php'
      - 'config/accounts.php'
      - 'config/alliance.php'
      - 'config/auth.php'
      - 'config/game_world.php'
      - 'config/operations.php'
      - 'database/factories/UserFactory.php'
      - 'routes/account.php'
      - 'routes/web.php'
      - 'tests/Architecture/**'
      - 'tests/Feature/Accounts/**'
      - 'tests/Feature/GameWorld/**'
      - 'tests/Feature/Alliances/**'
      - 'tests/Feature/Memberships/**'
      - 'tests/Feature/Recruitment/**'
      - 'tests/Feature/Content/**'
      - 'tests/TenantIsolation/Alliances/**'
      - 'tests/Unit/Accounts/**'
      - 'tests/Unit/Authorization/AllianceRankPermissionsTest.php'
      - 'docs/product/architecture-v2-*.md'
      - '.github/workflows/architecture-v2-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-contract:
    name: V2 architecture through P3 plus P4 access cut
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kingshot_test
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_test
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Inventory remaining V1 Authorization references
        shell: bash
        run: |
          matches=$(grep -R -l -F --include='*.php' 'App\Domain\Authorization' app routes tests bootstrap config database 2>/dev/null || true)
          if [ -n "$matches" ]; then
            details=${matches//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::warning title=P4 remaining V1 Authorization references::$details"
          fi

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Verify PostgreSQL schema
        run: php artisan migrate --force

      - name: Check V2 through P4 PHP formatting
        shell: bash
        run: |
          set -o pipefail
          set +e
          vendor/bin/pint --test \
            tests/Architecture \
            tests/Feature/Accounts \
            tests/Feature/GameWorld \
            tests/Feature/Alliances \
            tests/Feature/Memberships \
            tests/Feature/Recruitment \
            tests/Feature/Content \
            tests/TenantIsolation/Alliances \
            tests/Unit/Accounts \
            tests/Unit/Authorization/AllianceRankPermissionsTest.php \
            app/Contexts \
            app/Shared \
            app/Workflows \
            app/ReadModels \
            bootstrap/app.php \
            bootstrap/providers.php \
            config/accounts.php \
            config/alliance.php \
            config/auth.php \
            config/game_world.php \
            config/operations.php \
            database/factories/UserFactory.php \
            routes/account.php \
            routes/web.php 2>&1 | tee pint-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            details=$(tail -n 40 pint-tests.log)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=Architecture V2 formatting failed::$details"
            exit "$status"
          fi

      - name: Run V2 architecture tests
        shell: bash
        run: |
          set -o pipefail
          set +e
          php artisan test \
            tests/Architecture/ArchitectureV2DependencyTest.php \
            tests/Architecture/ArchitectureV2AllianceTest.php \
            tests/Architecture/AccountExperienceTest.php \
            tests/Architecture/UserExperienceLocalizationFoundationTest.php \
            2>&1 | tee architecture-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            details=$(tail -n 80 architecture-tests.log)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=Architecture V2 tests failed::$details"
            exit "$status"
          fi

      - name: Larastan P2 through P4 contexts
        run: >-
          vendor/bin/phpstan analyse --memory-limit=1G
          app/Contexts/Accounts
          app/Contexts/GameWorld
          app/Contexts/Alliance
          app/Shared
          app/Workflows
          app/ReadModels/AllianceDashboard
          bootstrap/app.php
          bootstrap/providers.php
          database/factories/UserFactory.php

      - name: Run Accounts and GameWorld foundation tests
        run: >-
          php artisan test
          tests/Feature/Accounts
          tests/Feature/GameWorld
          tests/Unit/Accounts

      - name: Run Alliance bounded-context tests
        run: >-
          php artisan test
          tests/Feature/Alliances
          tests/Feature/Memberships
          tests/Feature/Recruitment
          tests/Feature/Content
          tests/TenantIsolation/Alliances
          tests/Unit/Authorization/AllianceRankPermissionsTest.php
