name: Architecture V2 Verification
# V2 verification: rewritten contracts are isolated under lowercase v2 folders and named *V2Test.

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'routes/**'
      - 'tests/Architecture/v2/**'
      - 'tests/Feature/**/v2/**'
      - 'tests/Support/V2/**'
      - '.github/workflows/architecture-v2-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-contract:
    name: V2 architecture and rewritten contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kingshot_test
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_test
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Verify final V1 runtime hard cut
        shell: bash
        run: |
          set -euo pipefail
          test ! -d app/Domain
          test ! -d app/Shared/Audit
          test ! -d app/Shared/Messaging
          test ! -d tests/RewriteInput/Communications

          test -d app/Contexts/Communications/Reminders
          test -d app/Contexts/Platform/Integrations
          test -d app/Shared/Infrastructure/AuditTrail
          test -d app/Shared/Infrastructure/Messaging/Outbox
          test -d app/Workflows/KingdomTransfer
          test -d app/Workflows/PlayerContext
          test -d app/ReadModels/KingdomSettings

          runtime_matches=$(grep -R -n --include='*.php' 'App\\Domain\\' app routes bootstrap config database 2>/dev/null || true)
          if [ -n "$runtime_matches" ]; then
            echo "$runtime_matches"
            exit 1
          fi

          old_shared_matches=$(grep -R -n -E --include='*.php' 'App\\Shared\\(Audit|Messaging)\\' app routes bootstrap config database 2>/dev/null || true)
          if [ -n "$old_shared_matches" ]; then
            echo "$old_shared_matches"
            exit 1
          fi

      - name: Verify rewritten test naming boundary
        shell: bash
        run: |
          set -euo pipefail
          test -d tests/Architecture/v2
          test -d tests/Feature/Accounts/Core/v2
          test -d tests/Feature/GameWorld/Core/v2
          test -d tests/Feature/GameWorld/Governance/v2
          test -d tests/Feature/Operations/EventCore/v2
          test -d tests/Feature/Operations/Reminders/v2
          test -d tests/Feature/Intelligence/Observations/v2

          while IFS= read -r file; do
            case "$(basename "$file")" in
              *V2Test.php) ;;
              *) echo "Rewritten test must end in V2Test.php: $file"; exit 1 ;;
            esac
          done < <(find tests/Architecture/v2 tests/Feature -type f -path '*/v2/*.php' | sort)

      - name: Verify Player persistence ownership
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n --include='*.php' 'PersistPlayerIdentity' app/Contexts/Intelligence/Roster app/Workflows/KingdomTransfer >/dev/null
          grep -R -n --include='*.php' 'ClaimPlayerAccount' app/Contexts/Alliance/Membership >/dev/null

          if grep -R -n --include='*.php' 'Player::query()->create(' app/Contexts/Intelligence app/Workflows/KingdomTransfer; then
            exit 1
          fi

      - name: Verify Kingdom Transfer owns its authorization policy
        shell: bash
        run: |
          set -euo pipefail
          test -f app/Workflows/KingdomTransfer/Access/Enums/TransferPermission.php
          test -f app/Workflows/KingdomTransfer/Access/Services/TransferAuthorization.php
          test -f app/Workflows/KingdomTransfer/Access/Services/TransferMutationAuthority.php
          grep -R -n --include='*.php' 'TransferPermission::Manage' app/Workflows/KingdomTransfer >/dev/null

          if grep -R -n --include='*.php' 'App\\Contexts\\Intelligence\\Access\\' app/Workflows/KingdomTransfer; then
            exit 1
          fi

          if grep -R -n --include='*.php' 'IntelligencePermission::KingdomManage' app/Workflows/KingdomTransfer; then
            exit 1
          fi

      - name: Verify downstream contexts own Alliance authorization interpretation
        shell: bash
        run: |
          set -euo pipefail
          matches=$(grep -R -n --include='*.php' -E 'App\\Contexts\\Alliance\\Access\\Services\\Alliance(Authorization|MutationAuthority)' app/Contexts/Operations app/Contexts/Intelligence 2>/dev/null | grep -v '/Access/Services/' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            exit 1
          fi

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Verify PostgreSQL schema
        run: php artisan migrate:fresh --force

      - name: Check V2 PHP formatting
        run: >-
          vendor/bin/pint --test
          tests/Architecture/v2
          tests/Feature/Accounts/Core/v2
          tests/Feature/GameWorld/Core/v2
          tests/Feature/GameWorld/Governance/v2
          tests/Feature/Operations/EventCore/v2
          tests/Feature/Operations/Reminders/v2
          tests/Feature/Intelligence/Observations/v2
          tests/Support/V2
          app/Contexts
          app/Shared
          app/Workflows
          app/ReadModels
          bootstrap/app.php
          bootstrap/providers.php
          config/accounts.php
          config/alliance.php
          config/auth.php
          config/game_world.php
          config/operations.php
          database/factories/UserFactory.php
          routes/account.php
          routes/console.php
          routes/event-history.php
          routes/king-perks.php
          routes/kingdoms.php
          routes/platform.php
          routes/web.php

      - name: Run rewritten V2 architecture regression suite
        run: php artisan test tests/Architecture/v2

      - name: Larastan final owners
        run: >-
          vendor/bin/phpstan analyse --memory-limit=1536M
          app/Contexts/Accounts
          app/Contexts/GameWorld
          app/Contexts/Alliance
          app/Contexts/Operations
          app/Contexts/Intelligence
          app/Contexts/Communications
          app/Contexts/Platform
          app/Shared
          app/Workflows
          app/ReadModels
          bootstrap/app.php
          bootstrap/providers.php
          database/factories/UserFactory.php
          routes/account.php
          routes/console.php
          routes/event-history.php
          routes/king-perks.php
          routes/kingdoms.php
          routes/platform.php

      - name: Run rewritten Accounts V2 contracts
        run: php artisan test tests/Feature/Accounts/Core/v2

      - name: Run rewritten GameWorld V2 contracts
        run: >-
          php artisan test
          tests/Feature/GameWorld/Core/v2
          tests/Feature/GameWorld/Governance/v2

      - name: Run rewritten Operations V2 contracts
        run: >-
          php artisan test
          tests/Feature/Operations/EventCore/v2
          tests/Feature/Operations/Reminders/v2

      - name: Run rewritten Intelligence V2 contracts
        run: php artisan test tests/Feature/Intelligence/Observations/v2
