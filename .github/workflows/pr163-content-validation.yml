name: PR 163 Content workspace verification
on:
  pull_request_review:
    types: [submitted]
permissions:
  contents: read
concurrency:
  group: content-workspace-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual:
    if: >-
      github.repository == 'awalker0878/kingshot-alliance' &&
      github.event.pull_request.number == 163 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'astra/codebase-hardening' &&
      github.event.review.user.login == 'awalker0878' &&
      github.event.review.state == 'commented' &&
      github.event.review.body == 'Verify current HARD-106 browser contracts without retries.' &&
      github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kingshot_visual
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_visual"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: '01234567890123456789012345678901'
      APP_DEBUG: false
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_visual
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      MAIL_MAILER: array
      PULSE_ENABLED: false
      GIFT_CODES_MODERATION: true
      GIFT_CODES_REDEMPTION_WORKSPACE: true
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
      PLAYWRIGHT_USE_SYSTEM_CHROME: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.review.commit_id }}
          persist-credentials: false
      - name: Record exact source
        run: |
          mkdir -p "$RUNNER_TEMP/content-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/content-evidence/revision.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/content-evidence/tree.txt"
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/content-evidence/source.tar.gz"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, gd, intl, mbstring, pdo_pgsql, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - uses: ./.github/actions/composer-package-cache
      - run: composer install --no-interaction --no-progress --prefer-dist
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:source-contracts
      - name: Use the normal visual fixture commands
        run: |
          python - <<'PY'
          import pathlib,re,subprocess,textwrap
          source=pathlib.Path('.github/workflows/visual-regression.yml').read_text()
          sections=source.split('      - name: Prepare visual database\n')
          assert len(sections)==2
          body=sections[1].split('\n      - name:',1)[0]
          commands=re.search(r'        run: \|\n((?:          .*\n|\n)+)',body+'\n')
          assert commands
          subprocess.run(['bash','-euo','pipefail','-c',textwrap.dedent(commands.group(1))],check=True)
          PY
      - run: npm run build
      - name: Start isolated application
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/content-evidence/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/content-server.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/content-evidence/server.log"
          exit 1
      - name: Verify existing Content and broadcast journeys
        run: npm run test:visual -- tests/ReadModels/AnnouncementBroadcastManagement/Browser --retries=0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: hard106-browser-evidence
          path: |
            ${{ runner.temp }}/content-evidence
            test-results/visual
            playwright-report
          retention-days: 3
          if-no-files-found: error
      - name: Stop application
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/content-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/content-server.pid")" 2>/dev/null || true
          fi
