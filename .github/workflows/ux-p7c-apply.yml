name: UX P7C Apply

on:
  push:
    branches:
      - ux/ux-001-experience-localization
    paths:
      - .ux-p7c-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply P7-C management and guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          controller = Path('app/Domain/Kingdoms/Http/Controllers/KingdomIntelligenceSharingController.php')
          text = controller.read_text()
          marker = "return Inertia::render('Alliance/KingdomSharing', [\n            'alliance' =>"
          if marker in text:
              text = text.replace(marker, "return Inertia::render('Alliance/KingdomSharing', [\n            'user' => [\n                'name' => (string) $user->name,\n                'email' => (string) $user->email,\n            ],\n            'alliance' =>", 1)
          marker = "return Inertia::render('Alliance/KingdomSharingManage', [\n            'alliance' =>"
          if marker in text:
              text = text.replace(marker, "return Inertia::render('Alliance/KingdomSharingManage', [\n            'user' => [\n                'name' => (string) $user->name,\n                'email' => (string) $user->email,\n            ],\n            'alliance' =>", 1)
          controller.write_text(text)

          locale = Path('resources/js/localization/messages/kingdom-p7c.ts')
          text = locale.read_text()
          if "manageEyebrow:" not in text:
              marker = "  olderObservations: 'Older observations',\n} as const;"
              lines = [
                  "  olderObservations: 'Older observations',",
                  "  manageEyebrow: 'Kingdom sharing controls',",
                  "  manageTitle: 'Sharing agreements',",
                  "  manageSubtitle: '{alliance} · Kingdom {kingdom}. Sharing is directional, same-Kingdom, and explicit per tracked game alliance.',",
                  "  receivedFacts: 'Received facts',",
                  "  notConfigured: 'Not configured',",
                  "  inviteAlliance: 'Invite another Alliance',",
                  "  inviteHelp: 'The one-time invitation is shown only after creation. An active agreement still shares nothing until a tracked game alliance is explicitly granted.',",
                  "  createInvitation: 'Create one-time invitation',",
                  "  creating: 'Creating…',",
                  "  kingdomRequired: 'Configure the Alliance Kingdom before creating a sharing invitation.',",
                  "  invitationCreateFailed: 'The invitation could not be created. Confirm your password and try again.',",
                  "  invitationTryAgain: 'The invitation could not be created. Try again.',",
                  "  issuedInvitation: 'One-time invitation value',",
                  "  copyInvitation: 'Copy value',",
                  "  clearInvitation: 'Clear from this page',",
                  "  respondInvitation: 'Respond to an invitation',",
                  "  respondHelp: 'Enter the one-time value supplied by another Alliance manager. Acceptance succeeds only while both Alliances match the captured Kingdom.',",
                  "  invitationValue: 'Invitation value',",
                  "  acceptInvitation: 'Accept invitation',",
                  "  declineInvitation: 'Decline invitation',",
                  "  outboundSharing: 'Outbound sharing',",
                  "  outboundHelp: 'An active agreement still shares nothing until you explicitly grant a tracked game alliance.',",
                  "  inboundSharing: 'Inbound sharing',",
                  "  inboundHelp: 'Active sources may share only targets they explicitly grant.',",
                  "  agreements: 'Agreements',",
                  "  pendingRecipient: 'Pending recipient',",
                  "  state: 'State',",
                  "  invitationExpires: 'Invitation expires {date}',",
                  "  revoke: 'Revoke',",
                  "  explicitTargets: 'Explicit targets',",
                  "  noTagShort: 'No tag',",
                  "  remove: 'Remove',",
                  "  noTargets: 'No targets are shared by this agreement.',",
                  "  grantTarget: 'Grant tracked game alliance',",
                  "  chooseTarget: 'Choose a tracked game alliance',",
                  "  shareTarget: 'Share target',",
                  "  noOutbound: 'No outbound sharing agreements yet.',",
                  "  sourceAllianceManage: 'Source Alliance',",
                  "  acceptedAt: 'Accepted',",
                  "  action: 'Action',",
                  "  leaveSharing: 'Leave sharing',",
                  "  terminal: 'Terminal',",
                  "  noInbound: 'No inbound sharing agreements yet.',",
                  "} as const;",
              ]
              text = text.replace(marker, '\n'.join(lines), 1)
          locale.write_text(text)

          page = Path('resources/js/pages/Alliance/KingdomSharingManage.vue')
          text = page.read_text()
          if "AppLayout from '../../layouts/AppLayout.vue'" not in text:
              text = text.replace("import { reactive, ref } from 'vue';", "import { reactive, ref } from 'vue';\n\nimport AppLayout from '../../layouts/AppLayout.vue';\nimport { useLocale } from '../../localization';", 1)
          if "user: { name: string; email: string };" not in text:
              text = text.replace("const props = defineProps<{\n  alliance:", "const props = defineProps<{\n  user: { name: string; email: string };\n  alliance:", 1)
          if "const { t, formatDate: localeFormatDate, formatNumber } = useLocale();" not in text:
              text = text.replace("}>();\n\nconst invitationToken", "}>();\n\nconst { t, formatDate: localeFormatDate, formatNumber } = useLocale();\n\nconst invitationToken", 1)
          text = text.replace("invitationError.value =\n        'The invitation could not be created. Confirm your password and try again.';", "invitationError.value = t('kingdomP7C.invitationCreateFailed');")
          text = text.replace("invitationError.value = 'The invitation could not be created. Try again.';", "invitationError.value = t('kingdomP7C.invitationTryAgain');")
          old_format = "function formatDate(value: string | null): string {\n  if (!value) return '—';\n  return new Intl.DateTimeFormat(undefined, {\n    dateStyle: 'medium',\n    timeStyle: 'short',\n  }).format(new Date(value));\n}"
          new_format = "function formatDate(value: string | null): string {\n  return value ? localeFormatDate(value, { dateStyle: 'medium', timeStyle: 'short' }) : '—';\n}"
          text = text.replace(old_format, new_format, 1)
          text = text.replace('<Head title="Manage shared Kingdom intelligence" />', '<Head :title="`${t(\'kingdomP7C.manageTitle\')} · ${alliance.name}`" />', 1)
          text = text.replace('<main class="mx-auto min-h-screen max-w-6xl px-6 py-12 lg:px-8">', '<AppLayout :user="user" :alliance-name="alliance.name" :has-active-alliance="true">', 1)
          text = text.replace('</main>\n</template>', '</AppLayout>\n</template>', 1)

          replacements = [
              ('Shared intelligence', "{{ t('kingdomP7C.manageEyebrow') }}"),
              ('Manage sharing', "{{ t('kingdomP7C.manageTitle') }}"),
              ('Shared facts', "{{ t('kingdomP7C.receivedFacts') }}"),
              ('Invite another Alliance', "{{ t('kingdomP7C.inviteAlliance') }}"),
              ("{{ invitationBusy ? 'Creating…' : 'Create one-time invitation' }}", "{{ invitationBusy ? t('kingdomP7C.creating') : t('kingdomP7C.createInvitation') }}"),
              ('Configure the Alliance Kingdom before creating a sharing invitation.', "{{ t('kingdomP7C.kingdomRequired') }}"),
              ('One-time invitation token', "{{ t('kingdomP7C.issuedInvitation') }}"),
              ('Copy token', "{{ t('kingdomP7C.copyInvitation') }}"),
              ('Clear from this page', "{{ t('kingdomP7C.clearInvitation') }}"),
              ('Respond to an invitation', "{{ t('kingdomP7C.respondInvitation') }}"),
              ('Invitation token', "{{ t('kingdomP7C.invitationValue') }}"),
              ('Accept invitation', "{{ t('kingdomP7C.acceptInvitation') }}"),
              ('Decline invitation', "{{ t('kingdomP7C.declineInvitation') }}"),
              ('Outbound sharing', "{{ t('kingdomP7C.outboundSharing') }}"),
              ("{{ sharing.outbound.length }} agreement(s)", "{{ formatNumber(sharing.outbound.length) }} {{ t('kingdomP7C.agreements') }}"),
              ("{{ share.recipientAlliance?.name ?? 'Pending recipient' }}", "{{ share.recipientAlliance?.name ?? t('kingdomP7C.pendingRecipient') }}"),
              ('Revoke', "{{ t('kingdomP7C.revoke') }}"),
              ('Explicit targets', "{{ t('kingdomP7C.explicitTargets') }}"),
              ("{{ target.tag ?? 'No tag' }} · {{ target.state }}", "{{ target.tag ?? t('kingdomP7C.noTagShort') }} · {{ target.state }}"),
              ('Remove', "{{ t('kingdomP7C.remove') }}"),
              ('No targets are shared by this agreement.', "{{ t('kingdomP7C.noTargets') }}"),
              ('Grant tracked game alliance', "{{ t('kingdomP7C.grantTarget') }}"),
              ('Choose a tracked game alliance', "{{ t('kingdomP7C.chooseTarget') }}"),
              ('Share target', "{{ t('kingdomP7C.shareTarget') }}"),
              ('No outbound sharing agreements yet.', "{{ t('kingdomP7C.noOutbound') }}"),
              ('Inbound sharing', "{{ t('kingdomP7C.inboundSharing') }}"),
              ("{{ sharing.inbound.length }} agreement(s)", "{{ formatNumber(sharing.inbound.length) }} {{ t('kingdomP7C.agreements') }}"),
              ('Source Alliance', "{{ t('kingdomP7C.sourceAllianceManage') }}"),
              ('Accepted', "{{ t('kingdomP7C.acceptedAt') }}"),
              ('Action', "{{ t('kingdomP7C.action') }}"),
              ('Leave sharing', "{{ t('kingdomP7C.leaveSharing') }}"),
              ('Terminal', "{{ t('kingdomP7C.terminal') }}"),
              ('No inbound sharing agreements yet.', "{{ t('kingdomP7C.noInbound') }}"),
          ]
          for old, new in replacements:
              text = text.replace(old, new)

          text = text.replace("{{ alliance.name }} · current Kingdom {{ alliance.kingdom ?? 'not configured' }}. Sharing\n          is directional, same-Kingdom, and explicit per tracked game alliance.", "{{ t('kingdomP7C.manageSubtitle', { alliance: alliance.name, kingdom: alliance.kingdom ?? t('kingdomP7C.notConfigured') }) }}")
          text = text.replace('The invitation secret is shown only after creation. Send it to an authorized manager of the\n        intended Alliance using a channel you trust. The token alone does not expose intelligence.', "{{ t('kingdomP7C.inviteHelp') }}")
          text = text.replace('Enter the one-time token supplied by another Alliance manager. Acceptance succeeds only when\n        both Alliances are currently in the captured Kingdom.', "{{ t('kingdomP7C.respondHelp') }}")
          text = text.replace('An active agreement still shares nothing until you explicitly grant a tracked game\n            alliance.', "{{ t('kingdomP7C.outboundHelp') }}")
          text = text.replace('Active sources may share only targets they explicitly grant.', "{{ t('kingdomP7C.inboundHelp') }}")
          text = text.replace('State {{ share.state }} · invitation expires\n                {{ formatDate(share.invitationExpiresAt) }}', "{{ t('kingdomP7C.state') }} {{ share.state }} · {{ t('kingdomP7C.invitationExpires', { date: formatDate(share.invitationExpiresAt) }) }}")

          class_replacements = [
              ('mt-10 rounded-2xl border border-slate-800 bg-slate-900/70 p-6', 'ks-surface mt-6 p-5 sm:p-6'),
              ('mt-8 rounded-2xl border border-slate-800 bg-slate-900/70 p-6', 'ks-surface mt-6 p-5 sm:p-6'),
              ('rounded-xl border border-slate-800 bg-slate-950/60 p-5', 'rounded-[var(--ks-radius-md)] border border-[var(--ks-border)] bg-white/[0.02] p-5'),
              ('text-cyan-300', 'text-[var(--ks-blue-strong)]'),
              ('bg-cyan-300', 'bg-[var(--ks-gold)]'),
              ('border-cyan-800', 'border-[var(--ks-border)]'),
              ('border-slate-800', 'border-[var(--ks-border)]'),
              ('border-slate-700', 'border-[var(--ks-border)]'),
              ('bg-slate-950', 'bg-[var(--ks-bg)]'),
              ('text-slate-100', 'text-[var(--ks-text)]'),
              ('text-slate-200', 'text-[var(--ks-text)]'),
              ('text-slate-300', 'text-[var(--ks-text-secondary)]'),
              ('text-slate-400', 'text-[var(--ks-text-muted)]'),
              ('text-slate-500', 'text-[var(--ks-text-muted)]'),
              ('text-rose-300', 'text-red-200'),
              ('border-rose-800', 'border-red-400/30'),
              ('text-amber-300', 'text-amber-200'),
              ('border-amber-700', 'border-amber-400/30'),
              ('border-amber-800', 'border-amber-400/30'),
              ('bg-amber-950/40', 'bg-amber-500/10'),
          ]
          for old, new in class_replacements:
              text = text.replace(old, new)
          page.write_text(text)

          accessibility = Path('tests/Architecture/KingdomAccessibilityTest.php')
          text = accessibility.read_text()
          marker = "            'KingdomAllianceIntelligence.vue',\n        ];"
          if marker in text:
              text = text.replace(marker, "            'KingdomAllianceIntelligence.vue',\n            'KingdomSharing.vue',\n            'KingdomSharingManage.vue',\n        ];", 1)
          accessibility.write_text(text)
          PY

          cat > tests/Architecture/KingdomP7CExperienceTest.php <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Tests\Architecture;

          use PHPUnit\Framework\TestCase;

          final class KingdomP7CExperienceTest extends TestCase
          {
              public function test_sharing_surfaces_preserve_routes_and_shared_shell(): void
              {
                  $root = dirname(__DIR__, 2);
                  $routes = file_get_contents($root.'/routes/kingdoms.php');
                  $controller = file_get_contents($root.'/app/Domain/Kingdoms/Http/Controllers/KingdomIntelligenceSharingController.php');
                  $member = file_get_contents($root.'/resources/js/pages/Alliance/KingdomSharing.vue');
                  $manage = file_get_contents($root.'/resources/js/pages/Alliance/KingdomSharingManage.vue');
                  self::assertIsString($routes);
                  self::assertIsString($controller);
                  self::assertIsString($member);
                  self::assertIsString($manage);

                  foreach ([
                      '/alliance/kingdom-sharing',
                      '/alliance/kingdom-sharing/manage',
                      '/alliance/kingdom-sharing/invitations',
                      '/alliance/kingdom-sharing/invitations/accept',
                      '/alliance/kingdom-sharing/invitations/decline',
                      '/alliance/kingdom-sharing/{share}/revoke',
                      '/alliance/kingdom-sharing/{share}/leave',
                      '/alliance/kingdom-sharing/{share}/targets/{tracking}',
                      '/alliance/kingdom-sharing/{share}/targets/{target}/remove',
                  ] as $route) {
                      self::assertStringContainsString($route, $routes);
                  }

                  self::assertStringContainsString("Route::middleware('password.confirm')->group", $routes);
                  self::assertStringContainsString("'user' => [", $controller);
                  foreach ([$member, $manage] as $source) {
                      self::assertStringContainsString('AppLayout', $source);
                      self::assertStringNotContainsString('<main', $source);
                      self::assertStringContainsString('kingdomP7C.', $source);
                  }
              }

              public function test_visual_mockup_does_not_expand_sharing_scope(): void
              {
                  $root = dirname(__DIR__, 2).'/resources/js/pages/Alliance/';
                  $source = file_get_contents($root.'KingdomSharing.vue').file_get_contents($root.'KingdomSharingManage.vue');
                  self::assertIsString($source);
                  foreach ([
                      'Public Links',
                      'People with Access',
                      'Access Matrix',
                      'Share Activity',
                      'Export Kingdom Data',
                      'Create Share',
                      'Share Settings',
                      'Public Link',
                      'QR Code',
                      'Threat Score',
                      'Share All',
                      'Bulk Share',
                  ] as $mockupOnly) {
                      self::assertStringNotContainsString($mockupOnly, $source);
                  }
              }
          }
          PHP

          npm ci
          npx prettier --write resources/js/localization/messages/kingdom-p7c.ts resources/js/pages/Alliance/KingdomSharingManage.vue resources/js/pages/Alliance/KingdomSharing.vue resources/js/localization/messages/index.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/Domain/Kingdoms/Http/Controllers/KingdomIntelligenceSharingController.php resources/js/localization/messages/kingdom-p7c.ts resources/js/pages/Alliance/KingdomSharing.vue resources/js/pages/Alliance/KingdomSharingManage.vue tests/Architecture/KingdomAccessibilityTest.php tests/Architecture/KingdomP7CExperienceTest.php
          git commit -m "UX-P7-C: complete Kingdom sharing experience"
          git push
