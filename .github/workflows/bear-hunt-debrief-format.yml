name: Bear Hunt Debrief Format

on:
  push:
    branches:
      - feature/bear-hunt-debrief

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/bear-hunt-debrief

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format Bear Hunt PHP
        run: vendor/bin/pint app/ReadModels/EventAnalysis/Queries/BearHuntDebriefQuery.php app/ReadModels/EventAnalysis/Queries/BearHuntRunHistoryQuery.php app/Contexts/Operations/Results/Queries/BearHuntDebriefResultQuery.php

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Format Bear Hunt frontend
        run: npx prettier --write resources/js/localization/messages/debrief/ar.ts resources/js/localization/messages/debrief/th.ts resources/js/pages/Operations/Events/BearHuntDebrief.vue resources/js/pages/Operations/Events/Show.vue

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ReadModels/EventAnalysis/Queries/BearHuntDebriefQuery.php \
            app/ReadModels/EventAnalysis/Queries/BearHuntRunHistoryQuery.php \
            app/Contexts/Operations/Results/Queries/BearHuntDebriefResultQuery.php \
            resources/js/localization/messages/debrief/ar.ts \
            resources/js/localization/messages/debrief/th.ts \
            resources/js/pages/Operations/Events/BearHuntDebrief.vue \
            resources/js/pages/Operations/Events/Show.vue
          git commit -m "Format Bear Hunt Debrief"
          git push origin HEAD:feature/bear-hunt-debrief
