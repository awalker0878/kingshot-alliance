name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: PHP quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kingshot_test
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_test
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: array
      REDIS_HOST: 127.0.0.1
      PULSE_ENABLED: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify Composer lockfile
        run: test -f composer.lock

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest and lockfile
        run: composer validate --strict

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check dependency advisories
        run: composer audit

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run PHP checks
        run: composer check

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify npm lockfile
        run: test -f package-lock.json

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Check dependency advisories
        run: npm audit --audit-level=high

      - name: Run frontend checks
        run: npm run check

  container:
    name: Container, staging, and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend
      - frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create CI staging environment
        shell: bash
        run: |
          cat > .env.staging.ci <<'EOF'
          APP_NAME="Kingshot Alliance"
          APP_ENV=staging
          APP_KEY=base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
          APP_DEBUG=false
          APP_URL=http://127.0.0.1:18080
          APP_TIMEZONE=UTC
          LOG_CHANNEL=stack
          LOG_STACK=stderr
          LOG_LEVEL=info
          DB_CONNECTION=pgsql
          DB_HOST=postgres
          DB_PORT=5432
          DB_DATABASE=kingshot_staging
          DB_USERNAME=kingshot_staging
          DB_PASSWORD=kingshot-staging-ci
          CACHE_STORE=redis
          SESSION_DRIVER=redis
          SESSION_ENCRYPT=true
          SESSION_SECURE_COOKIE=false
          QUEUE_CONNECTION=redis
          REDIS_CLIENT=phpredis
          REDIS_HOST=redis
          REDIS_PASSWORD=null
          REDIS_PORT=6379
          FILESYSTEM_DISK=local
          MAIL_MAILER=log
          MAIL_FROM_ADDRESS=noreply@example.test
          MAIL_FROM_NAME="Kingshot Alliance"
          PULSE_ENABLED=false
          HORIZON_PREFIX=kingshot_staging_ci_horizon:
          SECURITY_CSP_ENABLED=true
          EOF

          echo "APP_IMAGE=kingshot-alliance:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "STAGING_ENV_FILE=.env.staging.ci" >> "$GITHUB_ENV"
          echo "STAGING_HTTP_PORT=18080" >> "$GITHUB_ENV"

      - name: Validate scripts, exclusions, and Compose configurations
        run: |
          for script in bin/*; do
            sh -n "$script"
          done

          sh bin/check-build-context
          cp .env.example .env
          docker compose config --quiet
          docker compose --env-file .env.staging.ci -f docker-compose.staging.yml config --quiet

      - name: Build production image
        run: |
          docker build \
            --target runtime \
            --build-arg APP_VERSION="${GITHUB_REF_NAME}" \
            --build-arg RELEASE_SHA="${GITHUB_SHA}" \
            --tag "${APP_IMAGE}" \
            .

      - name: Run ephemeral staging deployment
        shell: bash
        run: |
          compose=(docker compose --env-file .env.staging.ci -f docker-compose.staging.yml)
          "${compose[@]}" --profile release run --rm release
          "${compose[@]}" up -d app web worker scheduler

          for attempt in $(seq 1 30); do
            running_services="$("${compose[@]}" ps --status running --services)"
            services_ready=true

            for service in app web worker scheduler; do
              if ! grep -qx "$service" <<< "$running_services"; then
                services_ready=false
              fi
            done

            if [ "$services_ready" = true ] \
              && curl --fail --silent http://127.0.0.1:18080/up >/dev/null \
              && curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          "${compose[@]}" ps
          exit 1

      - name: Demonstrate backup and restore
        shell: bash
        run: |
          export COMPOSE_FILE=docker-compose.staging.yml
          export ENV_FILE=.env.staging.ci
          export BACKUP_DIR="${RUNNER_TEMP}/backups"

          ./bin/backup
          backup_file="$(find "$BACKUP_DIR" -name 'database-*.sql.gz' -print -quit)"
          test -n "$backup_file"

          CONFIRM_RESTORE=YES ./bin/restore "$backup_file"

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          exit 1

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.APP_IMAGE }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Show staging logs on failure
        if: failure()
        run: docker compose --env-file .env.staging.ci -f docker-compose.staging.yml logs --tail=150

      - name: Remove ephemeral staging environment
        if: always()
        run: docker compose --env-file .env.staging.ci -f docker-compose.staging.yml down -v --remove-orphans
