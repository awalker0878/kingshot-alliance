name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-slice-c2:
    name: Format Slice C2 and restore CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Slice C2 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/kingdoms-001-slice-c2
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Format intelligence page and restore protected CI
        shell: bash
        run: |
          npx prettier --write resources/js/pages/Alliance/RosterIntelligence.vue
          git fetch origin agent/kingdoms-001-slice-c1
          git show origin/agent/kingdoms-001-slice-c1:.github/workflows/ci.yml > .github/workflows/ci.yml

          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/Alliance/RosterIntelligence.vue .github/workflows/ci.yml
          git commit -m "Format Slice C2 intelligence page"
          git push origin HEAD:agent/kingdoms-001-slice-c2
