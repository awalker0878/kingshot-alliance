name: Reorganize Docs and Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reorganize:
    if: github.head_ref == 'agent/app-architecture-alignment' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/app-architecture-alignment
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Apply repository structure
        run: python3 .github/scripts/reorganize_repo_structure.py
      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Format moved PHP tests
        run: vendor/bin/pint --parallel
      - name: Validate structure tests
        run: php artisan test tests/Architecture
      - name: Commit reorganization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Align docs and tests with implementation plan structure"
          git push origin HEAD:agent/app-architecture-alignment
