name: Temporary KingdomTransfers Formatter

on:
  push:
    branches:
      - kingdom-transfers-official-rules-capacity
    paths:
      - .github/workflows/temporary-kingdom-transfers-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: kingdom-transfers-official-rules-capacity
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Complete officer capacity UI and boolean projection
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          manage = 'resources/js/pages/Kingdom/Transfer/Manage.vue'
          replace_once(manage,
          """  classification: string;\n  sourceType: SourceType;""",
          """  classification: string | null;\n  heroGeneration: number | null;\n  truegoldLevel: number | null;\n  characterAgeThresholdDays: number | null;\n  sourceType: SourceType;""")
          replace_once(manage,
          """type Cohort = {""",
          """type Capacity = {\n  id: string;\n  kingdom: string;\n  ordinaryInvitesUsed: number | null;\n  transferOpensUsed: number | null;\n  specialInvitesAvailable: number | null;\n  sourceType: SourceType;\n  sourceReference: string;\n  observedAt: string;\n  isCorrection: boolean;\n};\ntype Cohort = {""")
          replace_once(manage,
          """  conditions: Condition[];\n  cohorts: Cohort[];""",
          """  conditions: Condition[];\n  capacities: Capacity[];\n  cohorts: Cohort[];""")
          replace_once(manage,
          """  classification: 'ordinary',\n  source_type: 'in_game' as SourceType,""",
          """  classification: 'ordinary',\n  hero_generation: '',\n  truegold_level: '',\n  character_age_threshold_days: '',\n  source_type: 'in_game' as SourceType,""")
          replace_once(manage,
          """const cohortForm = useForm({""",
          """const capacityForm = useForm({\n  kingdom_number: '',\n  ordinary_invites_used: '',\n  transfer_opens_used: '',\n  special_invites_available: '',\n  source_type: 'in_game' as SourceType,\n  source_reference: 'KingShot target Kingdom transfer capacity screen',\n  observed_at: local(),\n  is_correction: false,\n});\nconst cohortForm = useForm({""")
          replace_once(manage,
          """      power_cap: conditionForm.power_cap === '' ? null : Number(conditionForm.power_cap),\n    },""",
          """      power_cap: conditionForm.power_cap === '' ? null : Number(conditionForm.power_cap),\n      hero_generation:\n        conditionForm.hero_generation === '' ? null : Number(conditionForm.hero_generation),\n      truegold_level:\n        conditionForm.truegold_level === '' ? null : Number(conditionForm.truegold_level),\n      character_age_threshold_days:\n        conditionForm.character_age_threshold_days === ''\n          ? null\n          : Number(conditionForm.character_age_threshold_days),\n    },""")
          replace_once(manage,
          """function createCohort(): void {""",
          """function recordCapacity(): void {\n  if (!props.mutablePlan) return;\n  router.post(\n    `/alliance/transfers/windows/${props.mutablePlan.window.id}/capacity`,\n    {\n      ...capacityForm.data(),\n      kingdom_number: Number(capacityForm.kingdom_number),\n      ordinary_invites_used:\n        capacityForm.ordinary_invites_used === '' ? null : Number(capacityForm.ordinary_invites_used),\n      transfer_opens_used:\n        capacityForm.transfer_opens_used === '' ? null : Number(capacityForm.transfer_opens_used),\n      special_invites_available:\n        capacityForm.special_invites_available === ''\n          ? null\n          : Number(capacityForm.special_invites_available),\n    },\n    { preserveScroll: true },\n  );\n}\nfunction createCohort(): void {""")
          replace_once(manage,
          """                <option value=\"unknown\">{{ t('kingdomP7D.unknown') }}</option>\n              </select></label\n            ><label\n              >{{ t('kingdomP7D.sourceType')""",
          """                <option value=\"unknown\">{{ t('kingdomP7D.unknown') }}</option>\n              </select></label\n            ><label\n              >{{ t('kingdomP7D.targetHeroGeneration')\n              }}<input\n                v-model=\"conditionForm.hero_generation\"\n                class=\"ks-input mt-1 w-full\"\n                min=\"1\"\n                type=\"number\" /></label\n            ><label\n              >{{ t('kingdomP7D.targetTruegoldLevel')\n              }}<input\n                v-model=\"conditionForm.truegold_level\"\n                class=\"ks-input mt-1 w-full\"\n                min=\"0\"\n                type=\"number\" /></label\n            ><label\n              >{{ t('kingdomP7D.targetCharacterAgeThresholdDays')\n              }}<input\n                v-model=\"conditionForm.character_age_threshold_days\"\n                class=\"ks-input mt-1 w-full\"\n                min=\"90\"\n                max=\"180\"\n                type=\"number\" /></label\n            ><label\n              >{{ t('kingdomP7D.sourceType')""")
          replace_once(manage,
          """            <p class=\"mt-1 text-xs break-all text-[var(--ks-muted)]\">\n              {{ sourceLabel(c.sourceType) }} · {{ ts(c.observedAt) }} · {{ c.sourceReference }}\n            </p>""",
          """            <p class=\"mt-2 text-sm text-[var(--ks-text-secondary)]\">\n              {{ t('kingdomP7D.targetHeroGeneration') }}: {{ c.heroGeneration ?? '—' }} ·\n              {{ t('kingdomP7D.targetTruegoldLevel') }}: {{ c.truegoldLevel ?? '—' }} ·\n              {{ t('kingdomP7D.targetCharacterAgeThresholdDays') }}:\n              {{ c.characterAgeThresholdDays ?? '—' }}\n            </p>\n            <p class=\"mt-1 text-xs break-all text-[var(--ks-muted)]\">\n              {{ sourceLabel(c.sourceType) }} · {{ ts(c.observedAt) }} · {{ c.sourceReference }}\n            </p>""")
          marker = """      <section class=\"ks-surface mt-5 p-5\">\n        <h2 class=\"text-xl font-semibold\">{{ t('kingdomP7D.planningCohorts') }}</h2>"""
          capacity_section = """      <section class=\"mt-5 grid gap-5 xl:grid-cols-2\">\n        <form class=\"ks-surface p-5\" @submit.prevent=\"recordCapacity\">\n          <h2 class=\"text-xl font-semibold\">{{ t('kingdomP7D.capacityObservationTitle') }}</h2>\n          <p class=\"mt-2 text-sm text-[var(--ks-muted)]\">{{ t('kingdomP7D.capacityObservationHelp') }}</p>\n          <div class=\"mt-3 grid gap-3 sm:grid-cols-2\">\n            <label>{{ t('kingdomP7D.destinationKingdom') }}<input v-model=\"capacityForm.kingdom_number\" class=\"ks-input mt-1 w-full\" min=\"1\" required type=\"number\" /></label>\n            <label>{{ t('kingdomP7D.ordinaryInvitesUsed') }}<input v-model=\"capacityForm.ordinary_invites_used\" class=\"ks-input mt-1 w-full\" min=\"0\" type=\"number\" /></label>\n            <label>{{ t('kingdomP7D.transferOpensUsed') }}<input v-model=\"capacityForm.transfer_opens_used\" class=\"ks-input mt-1 w-full\" min=\"0\" type=\"number\" /></label>\n            <label>{{ t('kingdomP7D.specialInvitesAvailable') }}<input v-model=\"capacityForm.special_invites_available\" class=\"ks-input mt-1 w-full\" min=\"0\" max=\"3\" type=\"number\" /></label>\n            <label>{{ t('kingdomP7D.sourceType') }}<select v-model=\"capacityForm.source_type\" class=\"ks-input mt-1 w-full\"><option v-for=\"s in sourceTypes\" :key=\"s\" :value=\"s\">{{ sourceLabel(s) }}</option></select></label>\n            <label>{{ t('kingdomP7D.observedAt') }}<input v-model=\"capacityForm.observed_at\" class=\"ks-input mt-1 w-full\" required type=\"datetime-local\" /></label>\n            <label class=\"sm:col-span-2\">{{ t('kingdomP7D.sourceReference') }}<input v-model=\"capacityForm.source_reference\" class=\"ks-input mt-1 w-full\" required /></label>\n            <label class=\"flex items-end gap-2 sm:col-span-2\"><input v-model=\"capacityForm.is_correction\" type=\"checkbox\" />{{ t('kingdomP7D.authoritativeCorrection') }}</label>\n          </div>\n          <button class=\"mt-3 rounded-lg bg-[var(--ks-gold)] px-4 py-2 font-bold text-[var(--ks-ink)]\">{{ t('kingdomP7D.recordCapacityObservation') }}</button>\n        </form>\n        <div class=\"ks-surface p-5\">\n          <h2 class=\"text-xl font-semibold\">{{ t('kingdomP7D.capacityHistory') }}</h2>\n          <p class=\"mt-2 text-sm text-[var(--ks-muted)]\">{{ t('kingdomP7D.observedFactsHelp') }}</p>\n          <article v-for=\"c in capacities\" :key=\"c.id\" class=\"mt-3 rounded-xl border border-[var(--ks-border)] p-3\">\n            <strong>{{ t('kingdomP7D.kingdomValue', { kingdom: c.kingdom }) }}</strong>\n            <p class=\"mt-2 text-sm\">{{ t('kingdomP7D.ordinaryInvitesUsed') }}: {{ c.ordinaryInvitesUsed ?? '—' }} · {{ t('kingdomP7D.transferOpensUsed') }}: {{ c.transferOpensUsed ?? '—' }} · {{ t('kingdomP7D.specialInvitesAvailable') }}: {{ c.specialInvitesAvailable ?? '—' }}</p>\n            <p class=\"mt-1 text-xs break-all text-[var(--ks-muted)]\">{{ sourceLabel(c.sourceType) }} · {{ ts(c.observedAt) }} · {{ c.sourceReference }}</p>\n          </article>\n          <p v-if=\"!capacities.length\" class=\"mt-3 text-sm text-[var(--ks-muted)]\">{{ t('kingdomP7D.capacityUnknown') }}</p>\n        </div>\n      </section>\n""" + marker
          replace_once(manage, marker, capacity_section)

          translations = 'resources/js/localization/messages/transfers/en.ts'
          replace_once(translations,
          """    capacityPlanning: 'Target capacity planning',""",
          """    capacityObservationTitle: 'Observed KingShot capacity',\n    capacityObservationHelp:\n      'Record the current in-game slot consumption and Special Invite inventory. These are sourced game facts; Alliance reservations remain separate planning intent.',\n    recordCapacityObservation: 'Record capacity observation',\n    capacityHistory: 'Observed capacity history',\n    observedFactsHelp:\n      'These rows are sourced observations from KingShot or official publications. They are not Alliance reservations.',\n    ordinaryInvitesUsed: 'Ordinary Invites used',\n    transferOpensUsed: 'Transfer Opens used',\n    specialInvitesAvailable: 'Special Invites available',\n    capacityPlanning: 'Target capacity planning',""")

          readiness_controller = 'app/Contexts/GameWorld/KingdomTransfers/Http/Controllers/TransferReadinessController.php'
          replace_once(readiness_controller,
          """                : ($observation->kind->value === 'in_game_rules_verified'\n                    ? $observation->boolean_value\n                    : $observation->text_value),""",
          """                : ($observation->kind->usesBooleanValue()\n                    ? $observation->boolean_value\n                    : $observation->text_value),""")
          PY
      - name: Produce canonical Prettier output
        run: npx prettier --write resources/js/components/transfers/TransferEvidencePanel.vue resources/js/pages/Kingdom/Transfer/Readiness.vue resources/js/pages/Kingdom/Transfer/Manage.vue resources/js/localization/messages/transfers/en.ts
      - name: Commit canonical output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Contexts/GameWorld/KingdomTransfers/Http/Controllers/TransferReadinessController.php resources/js/components/transfers/TransferEvidencePanel.vue resources/js/pages/Kingdom/Transfer/Readiness.vue resources/js/pages/Kingdom/Transfer/Manage.vue resources/js/localization/messages/transfers/en.ts
          git diff --cached --check
          git commit -m 'Complete KingdomTransfers officer capacity workflow'
          git push origin HEAD:kingdom-transfers-official-rules-capacity
