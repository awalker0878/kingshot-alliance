name: P5 Roster Contract Repair

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/p5-roster-contract-repair.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dccc5834248c87452386958240
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Repair Roster query and mutation contracts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          query = Path('app/Contexts/Operations/Rosters/Queries/EventRosterQuery.php')
          text = query.read_text()
          text = text.replace(
              "        return EventRosterMember::query()\n",
              "        return array_values(EventRosterMember::query()\n",
              1,
          )
          first_end = text.find('->all();')
          if first_end < 0:
              raise SystemExit('forPlayer ->all not found')
          text = text[:first_end] + text[first_end:].replace('->all();', '->all());', 1)

          needle = "        return $event->occurrences\n"
          idx = text.find(needle)
          if idx >= 0:
              text = text[:idx] + text[idx:].replace(needle, "        return array_values($event->occurrences\n", 1)
              end = text.find('->all();', idx)
              if end < 0:
                  raise SystemExit('management ->all not found')
              text = text[:end] + text[end:].replace('->all();', '->all());', 1)
          query.write_text(text)

          action = Path('app/Contexts/Operations/Rosters/Actions/AssignEventRosterPlayer.php')
          text = action.read_text()
          old = """            $alreadyOccupies = $member instanceof EventRosterMember && $member->status->occupiesSlot();
            $activeCount = EventRosterMember::query()"""
          new = """            $memberId = $member instanceof EventRosterMember ? $member->id : null;
            $alreadyOccupies = $member instanceof EventRosterMember && $member->status->occupiesSlot();
            $activeCount = EventRosterMember::query()"""
          if old not in text:
              raise SystemExit('member occupancy block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              "->when($member instanceof EventRosterMember, static fn ($query) => $query->where('id', '!=', $member->id))",
              "->when($memberId !== null, static fn ($query) => $query->where('id', '!=', $memberId))",
              1,
          )
          action.write_text(text)
          PY
          vendor/bin/pint app/Contexts/Operations/Rosters
      - name: Commit and self-remove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p5-roster-contract-repair.yml
          git add app/Contexts/Operations/Rosters
          git commit -m 'ARCH-V2: repair Roster contracts'
          git push origin HEAD:architecture-v2
      - name: Dispatch verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/architecture-v2-verification.yml/dispatches \
            -d '{"ref":"architecture-v2"}'
