name: UX P5-B formatter

on:
  push:
    branches:
      - ux/ux-001-experience-localization
    paths:
      - .ux-p5b-format-trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ux/ux-001-experience-localization

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply pinned Prettier
        run: >-
          npx prettier --write
          resources/js/pages/Alliance/Roster.vue
          resources/js/pages/Alliance/RosterIntelligence.vue
          resources/js/pages/Alliance/RosterManage.vue
          resources/js/pages/Alliance/RosterImport.vue
          resources/js/pages/Alliance/RosterHistory.vue
          resources/js/localization/messages/roster-management.ts
          resources/js/localization/messages/roster-workflows.ts
          resources/js/localization/messages/roster-workflow-overrides.ts
          resources/js/localization/messages/index.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/Alliance/Roster.vue \
            resources/js/pages/Alliance/RosterIntelligence.vue \
            resources/js/pages/Alliance/RosterManage.vue \
            resources/js/pages/Alliance/RosterImport.vue \
            resources/js/pages/Alliance/RosterHistory.vue \
            resources/js/localization/messages/roster-management.ts \
            resources/js/localization/messages/roster-workflows.ts \
            resources/js/localization/messages/roster-workflow-overrides.ts \
            resources/js/localization/messages/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format UX-P5-B roster files"
            git push origin HEAD:ux/ux-001-experience-localization
          fi
