name: UX P8 Apply

on:
  push:
    branches:
      - ux/ux-001-experience-localization
    paths:
      - .ux-p8-apply

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out UX branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ux/ux-001-experience-localization
          fetch-depth: 0

      - name: Add AppLayout identity payload
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/Domain/Platform/Http/Controllers/PlatformAdministrationController.php')
          source = path.read_text()
          needle = "        return Inertia::render('Platform/Administration/Index', [\n            'platform' => $dashboard,"
          replacement = "        return Inertia::render('Platform/Administration/Index', [\n            'user' => [\n                'name' => (string) $user->name,\n                'email' => (string) $user->email,\n            ],\n            'platform' => $dashboard,"
          if needle not in source:
              raise SystemExit('Expected platform render payload was not found')
          path.write_text(source.replace(needle, replacement, 1))

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Format and validate frontend
        run: |
          npm ci
          npx prettier --write resources/js/pages/Platform/Administration/Index.vue resources/js/localization/messages/platform-p8.ts resources/js/localization/messages/index.ts
          npm run check

      - name: Verify P8 scope boundary
        shell: python
        run: |
          from pathlib import Path
          page = Path('resources/js/pages/Platform/Administration/Index.vue').read_text()
          controller = Path('app/Domain/Platform/Http/Controllers/PlatformAdministrationController.php').read_text()
          for required in [
              "<AppLayout :user=\"props.user\">",
              "adminForm.post('/platform/administrators')",
              "provisionForm.post('/platform/alliances')",
              "hasMessageCatalogue(locale.code)",
              "'user' => [",
          ]:
              if required not in page and required not in controller:
                  raise SystemExit(f'Missing P8 contract: {required}')
          for unsupported in [
              '/platform/audit',
              '/platform/backups',
              '/platform/roles',
              '/platform/localization',
          ]:
              if unsupported in page:
                  raise SystemExit(f'Unsupported P8 route: {unsupported}')

      - name: Commit P8 apply and self-clean
        run: |
          rm -f .github/workflows/ux-p8-apply.yml .ux-p8-apply
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Domain/Platform/Http/Controllers/PlatformAdministrationController.php resources/js/pages/Platform/Administration/Index.vue resources/js/localization/messages/platform-p8.ts resources/js/localization/messages/index.ts .github/workflows/ux-p8-apply.yml .ux-p8-apply
          git commit -m 'Finalize UX-P8 platform administration experience'
          git push origin HEAD:ux/ux-001-experience-localization
