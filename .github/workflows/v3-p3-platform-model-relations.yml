name: V3 CA-P3 Platform Model Relations

on:
  push:
    branches:
      - architecture-v3-capability-alignment

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v3-capability-alignment
          fetch-depth: 0
      - name: Remove Alliance Eloquent navigation from Platform integration models
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('app/Contexts/Platform/Integrations/Models/ApiCredential.php'),
              Path('app/Contexts/Platform/Integrations/Models/WebhookDelivery.php'),
              Path('app/Contexts/Platform/Integrations/Models/WebhookSubscription.php'),
          ]
          for path in files:
              text = path.read_text()
              text = re.sub(r'^use App\\Contexts\\Alliance\\[^;]*\\Models\\Alliance;\n', '', text, flags=re.M)
              text = re.sub(r'^use Illuminate\\Database\\Eloquent\\Relations\\BelongsTo;\n', '', text, flags=re.M)
              text = re.sub(
                  r'\n\s*/\*\*[^\n]*BelongsTo[^\n]*\*/\n\s*public function alliance\(\): BelongsTo\n\s*\{\n\s*return \$this->belongsTo\(Alliance::class\);\n\s*\}\n?',
                  '\n',
                  text,
                  flags=re.M,
              )
              text = re.sub(
                  r'\n\s*public function alliance\(\): BelongsTo\n\s*\{\n\s*return \$this->belongsTo\(Alliance::class\);\n\s*\}\n?',
                  '\n',
                  text,
                  flags=re.M,
              )
              path.write_text(text)
          PY
      - run: php -l app/Contexts/Platform/Integrations/Models/ApiCredential.php && php -l app/Contexts/Platform/Integrations/Models/WebhookDelivery.php && php -l app/Contexts/Platform/Integrations/Models/WebhookSubscription.php
      - run: rm -f .github/workflows/v3-p3-platform-model-relations.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(v3): remove Platform foreign model relations [skip ci]"
          git push origin HEAD:architecture-v3-capability-alignment
