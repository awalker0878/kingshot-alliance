name: Architecture V2 P5 Controller Boundary

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/architecture-v2-p5-controller-boundary.yml'

permissions:
  contents: write

jobs:
  move-controller:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0
      - name: Move cross-context Event management UI orchestration downstream
        shell: bash
        run: |
          set -euo pipefail
          source='app/Contexts/Operations/EventCore/Http/Controllers/EventManagementController.php'
          target='app/Contexts/Platform/EventOperations/Http/Controllers/EventManagementController.php'
          test -f "$source"
          mkdir -p "$(dirname "$target")"
          mv "$source" "$target"
          sed -i 's#namespace App\\Contexts\\Operations\\EventCore\\Http\\Controllers;#namespace App\\Contexts\\Platform\\EventOperations\\Http\\Controllers;#' "$target"
          sed -i 's#use App\\Contexts\\Operations\\EventCore\\Http\\Controllers\\EventManagementController;#use App\\Contexts\\Platform\\EventOperations\\Http\\Controllers\\EventManagementController;#' routes/web.php
          if grep -R -n -E --include='*.php' 'App\\Contexts\\(Intelligence|Communications|Platform)\\|App\\ReadModels\\' app/Contexts/Operations; then
            echo 'Operations still has a downstream dependency.'
            exit 1
          fi
          php -l "$target"
          php -l routes/web.php
      - name: Commit boundary correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Contexts/Operations app/Contexts/Platform/EventOperations routes/web.php
          git diff --cached --quiet && exit 0
          git commit -m 'refactor(arch-v2): move Event management UI composition downstream'
          git push origin HEAD:architecture-v2
