name: Architecture V2 P3 Format

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/architecture-v2-p3-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out architecture-v2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format P3 verification surface
        run: >-
          vendor/bin/pint
          app/Contexts/Alliance
          app/Shared
          app/ReadModels/AllianceDashboard
          app/Domain/Authorization
          tests/Architecture/ArchitectureV2DependencyTest.php
          tests/Feature/Alliances
          tests/Feature/Memberships
          tests/Feature/Recruitment
          tests/Feature/Content
          tests/TenantIsolation/Alliances
          tests/Unit/Authorization/AllianceRankPermissionsTest.php
          routes/web.php

      - name: Remove one-off formatter
        run: rm -f .github/workflows/architecture-v2-p3-format.yml

      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'style(arch-v2): format P3 Alliance context'
          git push origin HEAD:architecture-v2
