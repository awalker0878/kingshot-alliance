name: UX P5B Roster Helper

on:
  push:
    branches:
      - ux/ux-001-experience-localization

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply UX-P5-B roster experience'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ux/ux-001-experience-localization
          fetch-depth: 1

      - name: Write P5-B files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, json, os, pathlib, urllib.request

          root = pathlib.Path('.')
          token = os.environ['GH_TOKEN']

          def fetch_blob(sha: str) -> bytes:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/awalker0878/kingshot-alliance/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  payload = json.load(response)
              return base64.b64decode(payload['content'])

          roster_b64 = ''.join(path.read_text() for path in sorted((root / '.ci-p5b').glob('roster.*.b64')))
          test_b64 = (root / '.ci-p5b/test.b64').read_text()

          (root / 'resources/js/pages/Alliance/Roster.vue').write_bytes(fetch_blob('d7edbf8bf80f85740bdb12285330ea1c634aebee'))
          (root / 'resources/js/pages/Alliance/RosterIntelligence.vue').write_bytes(fetch_blob('17675283f6a7b28e775dc04d4d2ed0a17cb72af1'))
          (root / 'resources/js/localization/messages/roster.ts').write_bytes(gzip.decompress(base64.b64decode(roster_b64)))
          (root / 'tests/Architecture/RosterExperienceTest.php').write_bytes(gzip.decompress(base64.b64decode(test_b64)))

          index = root / 'resources/js/localization/messages/index.ts'
          source = index.read_text()
          source = source.replace("import { publicMessages } from './public';", "import { publicMessages } from './public';\nimport { rosterMessages } from './roster';")
          source = source.replace("type PublicExtraMessageTree = (typeof publicExtraMessages)['en'];", "type PublicExtraMessageTree = (typeof publicExtraMessages)['en'];\ntype RosterMessageTree = (typeof rosterMessages)['en'];")
          source = source.replace('  PublicExtraMessageTree;', '  PublicExtraMessageTree &\n  RosterMessageTree;')
          source = source.replace('      ...publicExtraMessages[locale],', '      ...publicExtraMessages[locale],\n      ...rosterMessages[locale],')
          index.write_text(source)

          for relative, component in [
              ('app/Domain/Kingdoms/Http/Controllers/RosterController.php', 'Alliance/Roster'),
              ('app/Domain/Kingdoms/Http/Controllers/RosterIntelligenceController.php', 'Alliance/RosterIntelligence'),
          ]:
              path = root / relative
              source = path.read_text()
              needle = f"return Inertia::render('{component}', [\n            'alliance' => ["
              replacement = f"return Inertia::render('{component}', [\n            'user' => [\n                'name' => (string) $user->name,\n                'email' => (string) $user->email,\n            ],\n            'alliance' => ["
              if needle not in source:
                  raise SystemExit(f'controller insertion point missing: {relative}')
              path.write_text(source.replace(needle, replacement, 1))

          accessibility = root / 'tests/Architecture/KingdomAccessibilityTest.php'
          source = accessibility.read_text()
          old = "            self::assertStringContainsString('<main', $source, $page.' must retain a main landmark.');\n            self::assertStringContainsString('<h1', $source, $page.' must retain a primary heading.');"
          new = "            if (in_array($page, ['Roster.vue', 'RosterIntelligence.vue'], true)) {\n                self::assertStringContainsString('AppLayout', $source, $page.' must inherit the shared app landmark.');\n                self::assertStringNotContainsString('<main', $source, $page.' must not duplicate the shared main landmark.');\n            } else {\n                self::assertStringContainsString('<main', $source, $page.' must retain a main landmark.');\n            }\n            self::assertStringContainsString('<h1', $source, $page.' must retain a primary heading.');"
          if old not in source:
              raise SystemExit('accessibility assertion insertion point missing')
          accessibility.write_text(source.replace(old, new, 1))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Format frontend files
        run: |
          npm ci
          npx prettier --write \
            resources/js/pages/Alliance/Roster.vue \
            resources/js/pages/Alliance/RosterIntelligence.vue \
            resources/js/localization/messages/roster.ts \
            resources/js/localization/messages/index.ts

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Format PHP files
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          vendor/bin/pint \
            app/Domain/Kingdoms/Http/Controllers/RosterController.php \
            app/Domain/Kingdoms/Http/Controllers/RosterIntelligenceController.php \
            tests/Architecture/KingdomAccessibilityTest.php \
            tests/Architecture/RosterExperienceTest.php

      - name: Commit P5-B
        run: |
          git config user.name awalker0878
          git config user.email 52688461+awalker0878@users.noreply.github.com
          git add \
            resources/js/pages/Alliance/Roster.vue \
            resources/js/pages/Alliance/RosterIntelligence.vue \
            resources/js/localization/messages/roster.ts \
            resources/js/localization/messages/index.ts \
            app/Domain/Kingdoms/Http/Controllers/RosterController.php \
            app/Domain/Kingdoms/Http/Controllers/RosterIntelligenceController.php \
            tests/Architecture/KingdomAccessibilityTest.php \
            tests/Architecture/RosterExperienceTest.php
          git commit -m 'Apply UX-P5-B roster experience'
          git push origin HEAD:ux/ux-001-experience-localization
