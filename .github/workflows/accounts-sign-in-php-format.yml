name: Accounts Sign-In PHP Format

on:
  push:
    branches:
      - accounts-sign-in-methods-credential-evolution
    paths:
      - app/Contexts/Accounts/Authentication/Models/AccountPasskey.php
      - app/Contexts/Accounts/Authentication/Providers/AuthenticationServiceProvider.php
      - app/Contexts/Accounts/Authentication/Services/GoogleAuthenticationOperation.php
      - app/Contexts/Accounts/Authentication/Services/RecentAuthentication.php
      - app/Contexts/Accounts/Identity/Queries/AccountIdentityQuery.php
      - .github/workflows/accounts-sign-in-php-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format Accounts sign-in PHP
        run: vendor/bin/pint app/Contexts/Accounts/Authentication/Models/AccountPasskey.php app/Contexts/Accounts/Authentication/Providers/AuthenticationServiceProvider.php app/Contexts/Accounts/Authentication/Services/GoogleAuthenticationOperation.php app/Contexts/Accounts/Authentication/Services/RecentAuthentication.php app/Contexts/Accounts/Identity/Queries/AccountIdentityQuery.php

      - name: Commit formatted files
        run: |
          if git diff --quiet -- app/Contexts/Accounts/Authentication/Models/AccountPasskey.php app/Contexts/Accounts/Authentication/Providers/AuthenticationServiceProvider.php app/Contexts/Accounts/Authentication/Services/GoogleAuthenticationOperation.php app/Contexts/Accounts/Authentication/Services/RecentAuthentication.php app/Contexts/Accounts/Identity/Queries/AccountIdentityQuery.php; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Contexts/Accounts/Authentication/Models/AccountPasskey.php app/Contexts/Accounts/Authentication/Providers/AuthenticationServiceProvider.php app/Contexts/Accounts/Authentication/Services/GoogleAuthenticationOperation.php app/Contexts/Accounts/Authentication/Services/RecentAuthentication.php app/Contexts/Accounts/Identity/Queries/AccountIdentityQuery.php
          git commit -m "style: format Accounts sign-in PHP"
          git push origin HEAD:${GITHUB_REF_NAME}
