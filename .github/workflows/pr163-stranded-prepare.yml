name: PR 163 stranded source preparation

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write

jobs:
  source-preparation:
    if: >-
      github.repository == 'awalker0878/kingshot-alliance' &&
      github.event.pull_request.number == 163 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'astra/codebase-hardening' &&
      github.event.review.user.login == 'awalker0878' &&
      github.event.review.state == 'commented' &&
      github.event.review.body == 'Prepare stranded-file source trees only; no tests, commits or ref changes.' &&
      github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.review.commit_id }}
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: simplexml
          coverage: none
      - name: Prepare source objects without test or application execution
        env:
          SOURCE_TREE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python .github/pr163-stranded-prepare.py --publish-trees --output "$RUNNER_TEMP/stranded-source"
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/stranded-source/prepared-source.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: stranded-source-trees
          path: ${{ runner.temp }}/stranded-source
          retention-days: 1
          if-no-files-found: error
