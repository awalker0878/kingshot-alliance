name: P5 Rally Query List Repair

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/p5-rally-query-list-repair.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Normalize list-returning Rally query methods
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/Contexts/Operations/Rallies/Queries/EventRallyQuery.php')
          text = path.read_text()

          starts = [
              "        return EventRecommendedFormation::query()\n",
              "        return RallyGroup::query()\n",
              "        return RallyAssignment::query()\n",
          ]
          # First occurrence: recommendations; second RallyGroup occurrence: groupsForPlayer;
          # later RallyGroup occurrence: managementGroups. RallyAssignment is myAssignments.
          for needle in starts:
              pos = 0
              while True:
                  idx = text.find(needle, pos)
                  if idx < 0:
                      break
                  text = text[:idx] + text[idx:].replace(needle, needle.replace('return ', 'return array_values('), 1)
                  end = text.find('->all();', idx)
                  if end < 0:
                      raise SystemExit(f'missing ->all() after {needle!r}')
                  text = text[:end] + text[end:].replace('->all();', '->all());', 1)
                  pos = end + len('->all());')

          path.write_text(text)
          PY
          vendor/bin/pint app/Contexts/Operations/Rallies
      - name: Commit and self-remove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p5-rally-query-list-repair.yml
          git add app/Contexts/Operations/Rallies
          git commit -m 'ARCH-V2: normalize Rally query list contracts'
          git push origin HEAD:architecture-v2
      - name: Dispatch verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/architecture-v2-verification.yml/dispatches \
            -d '{"ref":"architecture-v2"}'
