name: Territory Documentation Finalize

on:
  push:
    branches:
      - territory-closeout-prep
    paths:
      - .github/workflows/territory-docs-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Territory branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: territory-closeout-prep
          fetch-depth: 0
      - name: Repair global Territory ledger row
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/product/capability-delivery-ledger.md')
          text = path.read_text()
          malformed = '| Territory Planner — Plan vs Observed Reality | Complete | [Territory plan versus observed reality](territory-plan-observed-reality.md) | Published Territory revisions remain immutable desired state; Evidence owns reviewed source provenance; Observations owns append-only accepted spatial facts; KingdomMaps owns geometry; ReadModels composes authorized comparison without plan mutation. |'
          corrected = '| Territory Planner — Plan vs Observed Reality | Complete | [Territory plan versus observed reality](territory-plan-observed-reality.md). Published Territory revisions remain immutable desired state; Evidence owns reviewed source provenance; Observations owns append-only accepted spatial facts; KingdomMaps owns geometry; ReadModels composes authorized comparison without plan mutation. |'
          if malformed in text:
              text = text.replace(malformed, corrected, 1)
          elif corrected not in text:
              raise SystemExit('Could not locate Territory global-ledger row to repair.')
          path.write_text(text)
          PY
          git diff --check
          git diff -- docs/product/capability-delivery-ledger.md
      - name: Commit repaired product documentation
        shell: bash
        run: |
          if git diff --quiet -- docs/product; then
            echo 'Global Territory ledger row already repaired.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/product
          git commit -m "docs: repair Territory global ledger row"
          git push origin HEAD:territory-closeout-prep
