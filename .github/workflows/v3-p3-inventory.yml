name: V3 CA-P3 Foreign Model Inventory

on:
  push:
    branches:
      - architecture-v3-capability-alignment

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build foreign-model inventory
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('app/Contexts')
          pattern = re.compile(r'^use App\\Contexts\\([A-Za-z0-9_]+)\\([^;]*\\Models\\[^;]+);', re.M)
          rows = []
          for context_path in sorted(p for p in root.iterdir() if p.is_dir()):
              context = context_path.name
              for path in sorted(context_path.rglob('*.php')):
                  text = path.read_text()
                  for match in pattern.finditer(text):
                      foreign = match.group(1)
                      if foreign != context:
                          rows.append(f'{context}|{path.as_posix()}|{foreign}|{match.group(0)}')
          Path('/tmp/v3-p3-foreign-models.txt').write_text('\n'.join(rows) + ('\n' if rows else ''))
          print(f'{len(rows)} foreign model imports')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3-p3-foreign-model-inventory
          path: /tmp/v3-p3-foreign-models.txt
          if-no-files-found: error
