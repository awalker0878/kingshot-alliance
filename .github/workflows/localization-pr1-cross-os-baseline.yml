name: Localization pinned baseline cross-OS
on:
  pull_request:

permissions:
  contents: read

jobs:
  macos-pinned-baseline:
    if: github.head_ref == 'codex/localization-pr1-critical-baseline'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository with immutable baseline history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Export pinned English and translated catalogues on macOS
        run: npm run localization:baseline
      - name: Compare all portable baseline fingerprints to Ubuntu artifact
        run: node scripts/check-localization-baseline-fingerprints.mjs --pinned-only
