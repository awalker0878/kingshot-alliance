name: Kingdom Transfer Global Ledger Reconcile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.event.pull_request.head.ref == 'feature/kingdom-transfer-planning' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/kingdom-transfer-planning
          fetch-depth: 0

      - name: Reconcile global product truth
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ledger = Path('docs/product/capability-delivery-ledger.md')
          text = ledger.read_text()
          old = 'Implementation candidate `4ee688508f8ef741bb1c43d8909f747743cf9526` completed the product, domain, persistence, authorization, UX, accessibility/localization-path, provenance, observability, tests, query-budget and deterministic visual requirements. The repository\'s standard release gate set passed on that candidate; final status-only documentation repeats the normal gates before merge.'
          new = 'A previous implementation candidate passed the standard release gates, but final code→spec reconciliation reopened the Evidence-provenance slice: Evidence-backed transfer facts must prove same-Alliance ownership and latest approved review through the Intelligence/Evidence owner contract, and manual forms must not claim an Evidence source without that authorized reference. The program remains active until the corrected candidate passes the complete gate set again.'
          if old not in text:
              raise SystemExit('global delivery candidate paragraph not found')
          text = text.replace(old, new, 1)
          for phase in ('3', '4', '7', '11', '12'):
              text = text.replace(f'| {phase} | Complete |', f'| {phase} | In progress |', 1)
          old = 'The queue is closed. The exact Transfer Pass formula remains evidence-gated because no authoritative version-bounded formula is available; observed required-pass facts are supported and missing formula evidence never produces false eligibility.'
          new = 'The queue is reopened for the Evidence-provenance correction and final immutable-head verification. The exact Transfer Pass formula remains evidence-gated because no authoritative version-bounded formula is available; observed required-pass facts are supported and missing formula evidence never produces false eligibility.'
          if old not in text:
              raise SystemExit('global delivery closeout sentence not found')
          ledger.write_text(text.replace(old, new, 1))

          gap = Path('docs/product/capability-gap-analysis.md')
          text = gap.read_text()
          old = 'Kingdom Transfer Planning is implemented end-to-end and is no longer a product capability gap. It preserves participant/readiness/blocker/completion planning while adding sourced Transfer Windows, official window-scoped Transfer Groups, target Power Caps/classification, append-only Governor observations, deterministic eligibility requirements, explicit stale/conflicting/unknown handling, read-vs-manage authority, responsive decision-first UX, bounded queries and deterministic visual regression. The exact Transfer Pass formula remains evidence-gated because authoritative public material does not publish it; observed in-game required-pass counts are supported without inventing formula truth.'
          new = 'Kingdom Transfer Planning is in final provenance reconciliation rather than closed. The implemented capability preserves participant/readiness/blocker/completion planning while adding sourced Transfer Windows, official window-scoped Transfer Groups, target Power Caps/classification, append-only Governor observations, deterministic eligibility requirements, explicit stale/conflicting/unknown handling, read-vs-manage authority, responsive decision-first UX, bounded queries and deterministic visual regression. Final audit reopened the Evidence-reference boundary so Evidence-backed facts must prove same-Alliance ownership and latest approved review before they may satisfy eligibility; the corrected candidate must repeat all release gates before the capability is removed from the active gap queue. The exact Transfer Pass formula remains evidence-gated because authoritative public material does not publish it; observed in-game required-pass counts are supported without inventing formula truth.'
          if old not in text:
              raise SystemExit('gap analysis Kingdom Transfer paragraph not found')
          text = text.replace(old, new, 1)
          old = '| Complete | Kingdom Transfer Planning | Sourced, window-scoped transfer eligibility with explicit next actions, provenance/freshness and independent Alliance readiness | GameWorld/KingdomTransfers owns transfer facts/rules; no invented Transfer Pass formula or community-derived eligibility truth |'
          new = '| In progress | Kingdom Transfer Planning | Sourced, window-scoped transfer eligibility with explicit next actions, provenance/freshness and independent Alliance readiness; final Evidence-boundary reconciliation and gate proof remain open | GameWorld/KingdomTransfers owns transfer facts/rules; Evidence references remain Intelligence/Evidence-owned and same-Alliance/latest-approved; no invented Transfer Pass formula or community-derived eligibility truth |'
          if old not in text:
              raise SystemExit('gap analysis priority row not found')
          gap.write_text(text.replace(old, new, 1))
          PY

      - name: Commit global reconciliation and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/kingdom-transfer-global-ledger-reconcile.yml
          git add docs/product/capability-delivery-ledger.md docs/product/capability-gap-analysis.md
          git commit -m "docs: reopen transfer provenance closeout"
          git push origin HEAD:feature/kingdom-transfer-planning
