name: KingdomMaps Assurance

on:
  pull_request:
    paths:
      - 'app/Contexts/GameWorld/KingdomMaps/**'
      - 'app/Contexts/Intelligence/Observations/Actions/RecordSpatialObservationEvidence.php'
      - 'app/Contexts/Operations/TerritoryPlanning/**'
      - 'app/ReadModels/TerritoryPlanning/**'
      - 'bootstrap/providers.php'
      - 'resources/data/kingdom-maps/**'
      - 'resources/js/features/territory-planner/**'
      - 'resources/js/pages/Kingdom/Territory/**'
      - 'tests/Contexts/Operations/TerritoryPlanning/**'
      - 'tests/ReadModels/TerritoryPlanning/**'
      - 'tests/Contexts/GameWorld/KingdomMaps/**'
      - 'scripts/check-territory-geometry-parity.mjs'
      - '.github/workflows/kingdom-maps-assurance.yml'
  push:
    branches:
      - main
    paths:
      - 'app/Contexts/GameWorld/KingdomMaps/**'
      - 'resources/data/kingdom-maps/**'
      - 'resources/js/features/territory-planner/**'
      - 'resources/js/pages/Kingdom/Territory/**'
      - 'tests/Contexts/Operations/TerritoryPlanning/**'
      - 'tests/ReadModels/TerritoryPlanning/**'
      - 'tests/Contexts/GameWorld/KingdomMaps/**'
      - 'scripts/check-territory-geometry-parity.mjs'
      - '.github/workflows/kingdom-maps-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kingdom-maps-assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kingdom-maps:
    name: KingdomMaps release and geometry
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kingshot_test
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_test
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PULSE_ENABLED: false

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pdo_pgsql, simplexml, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Restore Composer package cache
        uses: ./.github/actions/composer-package-cache

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Verify empty PostgreSQL installation
        run: php artisan migrate --force --no-interaction

      - name: Validate KingdomMaps releases
        run: php artisan kingdom-maps:validate

      - name: Verify KingdomMaps source rights and lineage
        run: php artisan kingdom-maps:verify-sources

      - name: List released KingdomMaps datasets
        run: php artisan kingdom-maps:list

      - name: Run KingdomMaps PHP tests
        run: php artisan test --fail-on-empty-test-suite tests/Contexts/GameWorld/KingdomMaps

      - name: Run Territory owner and authorized ReadModel tests
        run: php artisan test --fail-on-empty-test-suite tests/Contexts/Operations/TerritoryPlanning tests/ReadModels/TerritoryPlanning

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify PHP/browser geometry parity
        run: npm run check:territory-geometry
