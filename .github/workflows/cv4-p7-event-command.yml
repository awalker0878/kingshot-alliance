name: CV4 P7 Event Command

on:
  push:
    branches:
      - agent/context-v4-convergence
    paths:
      - .github/workflows/cv4-p7-event-command.yml

permissions:
  contents: write

jobs:
  decompose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/context-v4-convergence
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Cut Event Command page over to extracted contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('resources/js/pages/Operations/Events/Manage.vue')
          text = p.read_text()
          text = text.replace("import StatSeal from '@/components/game/StatSeal.vue';\n", '')
          marker = "import RoomBanner from '@/components/game/RoomBanner.vue';\n"
          additions = (
              "import EventCommandNavigation from '@/components/events/EventCommandNavigation.vue';\n"
              "import EventCommandSummary from '@/components/events/EventCommandSummary.vue';\n"
          )
          text = text.replace(marker, additions + marker)
          type_import = """import type {
            BattlePlanOccurrence,
            EventObjective,
            EventRoster,
            EventSettingValue,
            EventTemplateForm,
            ObjectiveAssignment,
            OccurrenceOperations,
            Phase,
            PlayerIntelligence,
            RallyGroup,
            RallyGuidance,
            RallyOccurrence,
            RallyRecommendation,
            ResultOccurrence,
            RosterCandidate,
            RosterOccurrence,
          } from '@/types/event-command';

          """
          text, count = re.subn(
              r"type EventSettingScalar[\s\S]*?(?=const props = defineProps<)",
              type_import,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Event type block not found exactly once')
          text = text.replace('  user: { name: string; email: string };\n', '')
          text = text.replace('<AppLayout :user="props.user">', '<AppLayout>')

          summary = """<EventCommandSummary
        :occurrence-count="event.occurrences.length"
        :participant-count="participants.length"
        :reminder-count="reminderRules.length"
        :capability-count="event.capabilities.length"
      />"""
          text, count = re.subn(
              r'<section\s+class="mt-4 grid gap-3 sm:grid-cols-2 2xl:grid-cols-4"\s+aria-label="Event command summary"\s*>[\s\S]*?</section>',
              summary,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Event summary block not found exactly once')

          text, count = re.subn(
              r'<nav class="ks-tab-strip mt-4" aria-label="Event organizer command sections">[\s\S]*?</nav>',
              '<EventCommandNavigation :capabilities="event.capabilities" />',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Event command nav not found exactly once')
          p.write_text(text)
          PY
      - name: Format and capture frontend certification
        shell: bash
        run: |
          npx prettier --write "resources/js/**/*.{ts,vue}"
          set +e
          npm run check > docs/architecture/rewrite-status/P7-FRONTEND-DIAGNOSTIC.txt 2>&1
          code=$?
          echo "exit_code=$code" >> docs/architecture/rewrite-status/P7-FRONTEND-DIAGNOSTIC.txt
          exit 0
      - name: Remove workflow
        run: rm .github/workflows/cv4-p7-event-command.yml
      - name: Commit P7 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Decompose Event Command surface"
          git push origin HEAD:agent/context-v4-convergence
