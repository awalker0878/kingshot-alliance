name: Architecture V2 P2 Cutover

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/architecture-v2-p2-cutover.yml'

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out architecture-v2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none

      - name: Apply P2 hard cut
        shell: bash
        run: |
          python - <<'PY'
          import base64, zlib
          payload = ''
          exec(zlib.decompress(base64.b64decode(payload)).decode(), {'__name__': '__main__'})
          PY

      - name: Syntax-check PHP
        shell: bash
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Remove one-off migration tooling
        shell: bash
        run: |
          rm -f .github/workflows/architecture-v2-p2-cutover.yml
          rm -f .github/workflows/architecture-v2-source-snapshot.yml

      - name: Commit P2 hard cut
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'refactor(arch-v2): cut over Accounts and GameWorld foundation'
          git push origin HEAD:architecture-v2
