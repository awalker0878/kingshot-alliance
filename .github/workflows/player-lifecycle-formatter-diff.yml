name: Player Lifecycle Formatter Diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply Prettier
        run: npx prettier --write resources/js/pages/Accounts/Governor/Governors.vue

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Apply Pint
        run: vendor/bin/pint app/Contexts/GameWorld/Players/Actions/ReconcilePlayers.php

      - name: Show formatter diff
        run: git diff -- resources/js/pages/Accounts/Governor/Governors.vue app/Contexts/GameWorld/Players/Actions/ReconcilePlayers.php

      - name: Require clean formatter output
        run: test -z "$(git status --short -- resources/js/pages/Accounts/Governor/Governors.vue app/Contexts/GameWorld/Players/Actions/ReconcilePlayers.php)"
