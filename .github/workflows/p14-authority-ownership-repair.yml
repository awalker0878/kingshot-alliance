name: P1-P4 Authority Ownership Repair

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/p14-authority-ownership-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pdo_pgsql, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Move downstream Alliance authority to context owners
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('app/Contexts/Operations'): (
                  ('use App\\Contexts\\Alliance\\Access\\Services\\AllianceAuthorization;', 'use App\\Contexts\\Operations\\Access\\Services\\AllianceOperationsAuthorization;'),
                  ('AllianceAuthorization $', 'AllianceOperationsAuthorization $'),
                  ('use App\\Contexts\\Alliance\\Access\\Services\\AllianceMutationAuthority;', 'use App\\Contexts\\Operations\\Access\\Services\\AllianceOperationsMutationAuthority;'),
                  ('AllianceMutationAuthority $', 'AllianceOperationsMutationAuthority $'),
              ),
              Path('app/Contexts/Intelligence'): (
                  ('use App\\Contexts\\Alliance\\Access\\Services\\AllianceAuthorization;', 'use App\\Contexts\\Intelligence\\Access\\Services\\AllianceIntelligenceAuthorization;'),
                  ('AllianceAuthorization $', 'AllianceIntelligenceAuthorization $'),
                  ('use App\\Contexts\\Alliance\\Access\\Services\\AllianceMutationAuthority;', 'use App\\Contexts\\Intelligence\\Access\\Services\\AllianceIntelligenceMutationAuthority;'),
                  ('AllianceMutationAuthority $', 'AllianceIntelligenceMutationAuthority $'),
              ),
          }

          for root, pairs in replacements.items():
              for path in root.rglob('*.php'):
                  if '/Access/Services/' in path.as_posix():
                      continue
                  text = path.read_text()
                  updated = text
                  for old, new in pairs:
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated)
          PY

      - name: Enforce no downstream use of Alliance permission-bearing authority
        shell: bash
        run: |
          set -euo pipefail
          bad=$(grep -R -n -E --include='*.php' 'Alliance\\Access\\Services\\Alliance(Authorization|MutationAuthority)' app/Contexts/Operations app/Contexts/Intelligence \
            | grep -v '/Access/Services/' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            exit 1
          fi

      - name: Format and analyse repaired contexts
        run: |
          vendor/bin/pint app/Contexts/Alliance app/Contexts/Operations app/Contexts/Intelligence
          vendor/bin/phpstan analyse --memory-limit=1536M app/Contexts/Alliance app/Contexts/Operations app/Contexts/Intelligence

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p14-authority-ownership-repair.yml
          git add app/Contexts/Alliance app/Contexts/Operations app/Contexts/Intelligence
          git commit -m 'refactor: enforce context-owned alliance authority semantics'
          git push origin HEAD:architecture-v2
