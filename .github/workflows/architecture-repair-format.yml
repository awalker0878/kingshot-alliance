name: Repair and Format Domain Refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: architecture-repair-format
  cancel-in-progress: true

jobs:
  repair:
    if: github.head_ref == 'agent/app-architecture-alignment' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/app-architecture-alignment
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Repair prefix-collision namespace moves
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'App\\Domain\\Alliances\\Models\\AllianceMembership': 'App\\Domain\\Memberships\\Models\\AllianceMembership',
              'App\\Domain\\Alliances\\Models\\AllianceBrandingMedia': 'App\\Domain\\Content\\Models\\AllianceBrandingMedia',
              'App\\Domain\\Alliances\\Models\\AllianceProfile': 'App\\Domain\\Content\\Models\\AllianceProfile',
              'App\\Domain\\Events\\Models\\EventRecommendedFormation': 'App\\Domain\\Rallies\\Models\\EventRecommendedFormation',
              'App\\Domain\\Events\\Models\\EventReminderDelivery': 'App\\Domain\\Notifications\\Models\\EventReminderDelivery',
              'App\\Domain\\Events\\Models\\EventReminderRule': 'App\\Domain\\Notifications\\Models\\EventReminderRule',
          }
          suffixes = {'.php', '.md', '.json', '.xml', '.neon'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix not in suffixes or '.git' in path.parts or 'vendor' in path.parts:
                  continue
              text = path.read_text(errors='replace')
              changed = text
              for old, new in replacements.items():
                  changed = changed.replace(old, new)
                  changed = changed.replace(old.replace('\\', '\\\\'), new.replace('\\', '\\\\'))
              if changed != text:
                  path.write_text(changed)
          PY

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Apply repository PHP formatting
        run: vendor/bin/pint --parallel

      - name: Commit repairs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Repair and format domain-first namespace move"
          git push origin HEAD:agent/app-architecture-alignment
