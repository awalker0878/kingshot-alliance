name: UX P5-B PHP diagnostic

on:
  push:
    branches:
      - ux/ux-001-experience-localization
    paths:
      - .ux-p5b-php-diagnostic-trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kingshot_test
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_test
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ux/ux-001-experience-localization

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run migrations
        run: php artisan migrate --force

      - name: Full parallel tests and capture output
        id: tests
        shell: bash
        run: |
          set +e
          php artisan test --parallel 2>&1 | tee /tmp/ux-p5b-test-output.log
          status=${PIPESTATUS[0]}
          tail -n 500 /tmp/ux-p5b-test-output.log > ux-p5b-test-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit failure output
        if: steps.tests.outputs.status != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ux-p5b-test-output.txt
          git commit -m "Capture UX-P5-B PHP test failure"
          git push origin HEAD:ux/ux-001-experience-localization

      - name: Fail when tests fail
        if: steps.tests.outputs.status != '0'
        run: exit 1
