name: UX P5A ESLint Helper

on:
  push:
    branches:
      - ux/ux-001-experience-localization
    paths:
      - .github/workflows/ux-p5a-eslint-helper.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ux/ux-001-experience-localization
      - name: Remove unused props binding
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('resources/js/pages/Alliance/Events/Index.vue')
          source = path.read_text()
          old = 'const props = defineProps<{'
          if old not in source:
              raise SystemExit('expected props binding not found')
          path.write_text(source.replace(old, 'defineProps<{', 1))
          PY
      - name: Commit lint fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add resources/js/pages/Alliance/Events/Index.vue
          git commit -m "Fix UX-P5 event calendar lint"
          git push origin HEAD:ux/ux-001-experience-localization
