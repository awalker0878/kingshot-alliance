name: Finish product language alignment

on:
  push:
    branches:
      - product/kingshot-language-alignment

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: product/kingshot-language-alignment
          fetch-depth: 0

      - name: Apply language alignment
        run: node scripts/finish-product-language-alignment.mjs

      - name: Verify generated diff
        run: git diff --check

      - name: Commit generated language changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            resources/js/localization/messages/core \
            resources/js/localization/messages/contributions \
            resources/js/pages/Intelligence/Contributions/Manage.vue \
            resources/js/pages/Intelligence/Roster/Dossiers.vue \
            resources/js/pages/Intelligence/KingdomWatch/AllianceDossier.vue \
            resources/js/pages/Intelligence/KingdomWatch/History.vue \
            resources/js/pages/Intelligence/KingdomWatch/Diplomacy.vue \
            resources/js/pages/Intelligence/KingdomWatch/Reports.vue \
            resources/js/pages/Operations/Events/Manage.vue \
            resources/js/pages/Platform/Administration/Index.vue \
            resources/js/pages/Platform/EventTypes/Index.vue \
            resources/js/pages/Public/Alliance/Show.vue \
            scripts/check-page-localization-coverage.mjs
          git commit -m "Complete localized product language audit"
          git push origin HEAD:product/kingshot-language-alignment
