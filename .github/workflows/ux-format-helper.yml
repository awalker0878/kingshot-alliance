name: UX Format Helper

on:
  push:
    branches:
      - ux/ux-001-experience-localization

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Format resources
        run: npm run format

      - name: Commit formatter output
        shell: bash
        run: |
          git add resources
          if git diff --cached --quiet; then
            echo "Resources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format UX resources"
          git push origin "HEAD:${GITHUB_REF_NAME}"
