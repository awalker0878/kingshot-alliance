name: V3 CA-P1 Mechanical Refactor

on:
  push:
    branches:
      - architecture-v3-capability-alignment

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, 'apply CA-P1 mechanical capability moves') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture-v3-capability-alignment
          fetch-depth: 0

      - name: Apply clean-room physical moves
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import shutil
          import sys

          root = Path('.')

          def move(src: str, dst: str) -> None:
              source = root / src
              target = root / dst
              if not source.exists():
                  return
              target.parent.mkdir(parents=True, exist_ok=True)
              if target.exists():
                  raise RuntimeError(f'target already exists: {dst}')
              shutil.move(str(source), str(target))

          def remove(path: str) -> None:
              target = root / path
              if target.is_dir():
                  shutil.rmtree(target)
              elif target.exists():
                  target.unlink()

          def replace_in_file(path: Path, replacements: list[tuple[str, str]]) -> None:
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  return
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)

          # Capability/package moves that still require their existing implementation.
          move('app/Contexts/Operations/EventCore', 'app/Contexts/Operations/Events')

          move('app/Contexts/Platform/Http/Controllers/PlatformAdministrationController.php', 'app/Contexts/Platform/Administration/Http/Controllers/PlatformAdministrationController.php')
          move('app/Contexts/Platform/Queries/PlatformAdministrationQuery.php', 'app/Contexts/Platform/Administration/Queries/PlatformAdministrationQuery.php')
          move('app/Contexts/Platform/Services/ProductionLaunchReadiness.php', 'app/Contexts/Platform/Administration/Services/ProductionLaunchReadiness.php')
          move('app/Contexts/Platform/Services/RuntimeConfigurationValidator.php', 'app/Shared/Infrastructure/Runtime/Services/RuntimeConfigurationValidator.php')
          move('app/Contexts/Platform/Http/Controllers/ReadinessController.php', 'app/Shared/Infrastructure/Runtime/Http/Controllers/ReadinessController.php')
          move('app/Contexts/Platform/Http/Middleware/AssignRequestContext.php', 'app/Shared/Infrastructure/Observability/Http/Middleware/AssignRequestContext.php')
          move('app/Contexts/Platform/Http/Middleware/RecordRequestMetrics.php', 'app/Shared/Infrastructure/Observability/Http/Middleware/RecordRequestMetrics.php')
          move('app/Contexts/Platform/Http/Middleware/SecurityHeaders.php', 'app/Shared/Infrastructure/Security/Http/Middleware/SecurityHeaders.php')
          move('app/Contexts/Platform/Http/Middleware/HandleInertiaRequests.php', 'app/Contexts/GameWorld/Players/Http/Middleware/HandleInertiaRequests.php')

          move('app/Shared/Access', 'app/Shared/Infrastructure/Access')
          move('app/Shared/Http/Controller.php', 'app/Shared/Infrastructure/Http/Controller.php')

          # Remove implementations already rebuilt at their V3 owners. No aliases/shims remain.
          for legacy in [
              'app/Contexts/Accounts/Actions',
              'app/Contexts/Accounts/Http',
              'app/Contexts/Accounts/Models',
              'app/Contexts/Accounts/Services',
              'app/Contexts/GameWorld/Actions',
              'app/Contexts/GameWorld/Enums',
              'app/Contexts/GameWorld/Http',
              'app/Contexts/GameWorld/Models',
              'app/Contexts/GameWorld/Queries',
              'app/Contexts/GameWorld/Services',
              'app/Contexts/Alliance/Core',
              'app/Contexts/Alliance/Policies',
              'app/Contexts/Intelligence/Http',
              'app/Contexts/Communications/Reminders',
              'app/Contexts/Platform/Access',
              'app/Contexts/Platform/Actions',
              'app/Contexts/Platform/Models',
              'app/Contexts/Platform/Providers',
              'app/Shared/Providers',
              'app/Shared/Http',
          ]:
              remove(legacy)

          # Remaining Platform root buckets contain only files already moved/rebuilt above.
          for legacy in [
              'app/Contexts/Platform/Http',
              'app/Contexts/Platform/Queries',
              'app/Contexts/Platform/Services',
          ]:
              remove(legacy)

          replacements = [
              # Accounts
              (r'App\Contexts\Accounts\Models\User', r'App\Contexts\Accounts\Identity\Models\User'),
              (r'App\Contexts\Accounts\Actions\RegisterUser', r'App\Contexts\Accounts\Registration\Actions\RegisterUser'),
              (r'App\Contexts\Accounts\Services\TotpService', r'App\Contexts\Accounts\MultiFactorAuthentication\Services\TotpService'),
              (r'App\Contexts\Accounts\Services\TwoFactorManager', r'App\Contexts\Accounts\MultiFactorAuthentication\Services\TwoFactorManager'),
              (r'App\Contexts\Accounts\Http\Controllers\AuthenticatedSessionController', r'App\Contexts\Accounts\Authentication\Http\Controllers\AuthenticatedSessionController'),
              (r'App\Contexts\Accounts\Http\Controllers\ConfirmPasswordController', r'App\Contexts\Accounts\Authentication\Http\Controllers\ConfirmPasswordController'),
              (r'App\Contexts\Accounts\Http\Controllers\ForgotPasswordController', r'App\Contexts\Accounts\Credentials\Http\Controllers\ForgotPasswordController'),
              (r'App\Contexts\Accounts\Http\Controllers\ResetPasswordController', r'App\Contexts\Accounts\Credentials\Http\Controllers\ResetPasswordController'),
              (r'App\Contexts\Accounts\Http\Controllers\EmailVerificationNotificationController', r'App\Contexts\Accounts\EmailVerification\Http\Controllers\EmailVerificationNotificationController'),
              (r'App\Contexts\Accounts\Http\Controllers\EmailVerificationPromptController', r'App\Contexts\Accounts\EmailVerification\Http\Controllers\EmailVerificationPromptController'),
              (r'App\Contexts\Accounts\Http\Controllers\VerifyEmailController', r'App\Contexts\Accounts\EmailVerification\Http\Controllers\VerifyEmailController'),
              (r'App\Contexts\Accounts\Http\Controllers\ProfileController', r'App\Contexts\Accounts\Profile\Http\Controllers\ProfileController'),
              (r'App\Contexts\Accounts\Http\Controllers\TwoFactorChallengeController', r'App\Contexts\Accounts\MultiFactorAuthentication\Http\Controllers\TwoFactorChallengeController'),
              (r'App\Contexts\Accounts\Http\Controllers\TwoFactorController', r'App\Contexts\Accounts\MultiFactorAuthentication\Http\Controllers\TwoFactorController'),

              # GameWorld
              (r'App\Contexts\GameWorld\Models\KingdomAlliance', r'App\Contexts\GameWorld\Kingdoms\Models\KingdomAlliance'),
              (r'App\Contexts\GameWorld\Models\Kingdom', r'App\Contexts\GameWorld\Kingdoms\Models\Kingdom'),
              (r'App\Contexts\GameWorld\Models\Player', r'App\Contexts\GameWorld\Players\Models\Player'),
              (r'App\Contexts\GameWorld\Actions\ClaimPlayerAccount', r'App\Contexts\GameWorld\Players\Actions\ClaimPlayerAccount'),
              (r'App\Contexts\GameWorld\Actions\PersistPlayerIdentity', r'App\Contexts\GameWorld\Players\Actions\PersistPlayerIdentity'),
              (r'App\Contexts\GameWorld\Actions\ResolveKingdomAlliance', r'App\Contexts\GameWorld\Kingdoms\Actions\ResolveKingdomAlliance'),
              (r'App\Contexts\GameWorld\Actions\ResolveKingdom', r'App\Contexts\GameWorld\Kingdoms\Actions\ResolveKingdom'),
              (r'App\Contexts\GameWorld\Enums\KingdomAllianceStatus', r'App\Contexts\GameWorld\Kingdoms\Enums\KingdomAllianceStatus'),
              (r'App\Contexts\GameWorld\Enums\KingdomStatus', r'App\Contexts\GameWorld\Kingdoms\Enums\KingdomStatus'),
              (r'App\Contexts\GameWorld\Queries\PlayerOwnershipQuery', r'App\Contexts\GameWorld\Players\Queries\PlayerOwnershipQuery'),
              (r'App\Contexts\GameWorld\Services\PlayerContext', r'App\Contexts\GameWorld\Players\Services\PlayerContext'),
              (r'App\Contexts\GameWorld\Http\Middleware\ResolvePlayerContext', r'App\Contexts\GameWorld\Players\Http\Middleware\ResolvePlayerContext'),

              # Alliance / Operations / Intelligence / Communications
              (r'App\Contexts\Alliance\Core\', r'App\Contexts\Alliance\Lifecycle\'),
              (r'App\Contexts\Operations\EventCore\', r'App\Contexts\Operations\Events\'),
              (r'App\Contexts\Intelligence\Http\Controllers\KingdomAllianceIntelligenceController', r'App\Contexts\Intelligence\Diplomacy\Http\Controllers\KingdomAllianceIntelligenceController'),
              (r'App\Contexts\Communications\Reminders\Actions\MarkEventReminderSent', r'App\Contexts\Operations\Participation\Reminders\Actions\MarkEventReminderSent'),
              (r'App\Contexts\Communications\Reminders\Actions\MarkKingPerkReminderSent', r'App\Contexts\Operations\KingPerks\Reminders\Actions\MarkKingPerkReminderSent'),

              # Platform
              (r'App\Contexts\Platform\Access\', r'App\Contexts\Platform\Administration\'),
              (r'App\Contexts\Platform\Actions\ManagePlatformAdministrator', r'App\Contexts\Platform\Administration\Actions\ManagePlatformAdministrator'),
              (r'App\Contexts\Platform\Actions\ConfigureAlliancePlatform', r'App\Contexts\Platform\AllianceAdministration\Actions\ConfigureAlliancePlatform'),
              (r'App\Contexts\Platform\Actions\ManageAllianceLifecycle', r'App\Contexts\Platform\AllianceAdministration\Actions\ManageAllianceLifecycle'),
              (r'App\Contexts\Platform\Actions\EnforcePlatformRetention', r'App\Contexts\Platform\DataGovernance\Actions\EnforcePlatformRetention'),
              (r'App\Contexts\Platform\Actions\ProcessAccountDeletionRequests', r'App\Contexts\Platform\DataGovernance\Actions\ProcessAccountDeletionRequests'),
              (r'App\Contexts\Platform\Models\AlliancePlatformSetting', r'App\Contexts\Platform\AllianceAdministration\Models\AlliancePlatformSetting'),
              (r'App\Contexts\Platform\Models\AllianceFeatureFlag', r'App\Contexts\Platform\AllianceAdministration\Models\AllianceFeatureFlag'),
              (r'App\Contexts\Platform\Models\AllianceUsageSnapshot', r'App\Contexts\Platform\AllianceAdministration\Models\AllianceUsageSnapshot'),
              (r'App\Contexts\Platform\Models\AccountDeletionRequest', r'App\Contexts\Platform\DataGovernance\Models\AccountDeletionRequest'),
              (r'App\Contexts\Platform\Models\LegalHold', r'App\Contexts\Platform\DataGovernance\Models\LegalHold'),
              (r'App\Contexts\Platform\Services\AllianceFeatureService', r'App\Contexts\Platform\AllianceAdministration\Services\AllianceFeatureService'),
              (r'App\Contexts\Platform\Services\PlanEntitlementService', r'App\Contexts\Platform\AllianceAdministration\Services\PlanEntitlementService'),
              (r'App\Contexts\Platform\Services\PlatformUsageService', r'App\Contexts\Platform\AllianceAdministration\Services\PlatformUsageService'),
              (r'App\Contexts\Platform\Services\AllianceDataExportService', r'App\Contexts\Platform\DataGovernance\Services\AllianceDataExportService'),
              (r'App\Contexts\Platform\Services\LegalHoldService', r'App\Contexts\Platform\DataGovernance\Services\LegalHoldService'),
              (r'App\Contexts\Platform\Services\PlatformAdministratorAuthorization', r'App\Contexts\Platform\Administration\Services\PlatformAdministratorAuthorization'),
              (r'App\Contexts\Platform\Services\PlatformAdministratorBootstrapCoordinator', r'App\Contexts\Platform\Administration\Services\PlatformAdministratorBootstrapCoordinator'),
              (r'App\Contexts\Platform\Services\ProductionLaunchReadiness', r'App\Contexts\Platform\Administration\Services\ProductionLaunchReadiness'),
              (r'App\Contexts\Platform\Services\RuntimeConfigurationValidator', r'App\Shared\Infrastructure\Runtime\Services\RuntimeConfigurationValidator'),
              (r'App\Contexts\Platform\Http\Controllers\PlatformAdministrationController', r'App\Contexts\Platform\Administration\Http\Controllers\PlatformAdministrationController'),
              (r'App\Contexts\Platform\Http\Controllers\ReadinessController', r'App\Shared\Infrastructure\Runtime\Http\Controllers\ReadinessController'),
              (r'App\Contexts\Platform\Http\Middleware\AssignRequestContext', r'App\Shared\Infrastructure\Observability\Http\Middleware\AssignRequestContext'),
              (r'App\Contexts\Platform\Http\Middleware\RecordRequestMetrics', r'App\Shared\Infrastructure\Observability\Http\Middleware\RecordRequestMetrics'),
              (r'App\Contexts\Platform\Http\Middleware\SecurityHeaders', r'App\Shared\Infrastructure\Security\Http\Middleware\SecurityHeaders'),
              (r'App\Contexts\Platform\Http\Middleware\HandleInertiaRequests', r'App\Contexts\GameWorld\Players\Http\Middleware\HandleInertiaRequests'),
              (r'App\Contexts\Platform\Http\Middleware\RequirePlatformAdministrator', r'App\Contexts\Platform\Administration\Http\Middleware\RequirePlatformAdministrator'),
              (r'App\Contexts\Platform\Queries\PlatformAdministrationQuery', r'App\Contexts\Platform\Administration\Queries\PlatformAdministrationQuery'),

              # Shared
              (r'App\Shared\Access\', r'App\Shared\Infrastructure\Access\'),
              (r'App\Shared\Http\Controller', r'App\Shared\Infrastructure\Http\Controller'),
              (r'App\Shared\Providers\SharedServiceProvider', r'App\Shared\Infrastructure\Providers\InfrastructureServiceProvider'),
          ]

          roots = [Path(p) for p in ['app','routes','config','database','bootstrap','bin'] if Path(p).exists()]
          for scan_root in roots:
              for path in scan_root.rglob('*'):
                  if path.is_file() and path.suffix in {'.php','.md','.json','.yml','.yaml','.xml'}:
                      replace_in_file(path, replacements)

          # Correct namespaces of files physically split from Platform root packages.
          file_replacements = {
              'app/Contexts/Platform/Administration/Http/Controllers/PlatformAdministrationController.php': [(r'namespace App\Contexts\Platform\Http\Controllers;', r'namespace App\Contexts\Platform\Administration\Http\Controllers;')],
              'app/Contexts/Platform/Administration/Queries/PlatformAdministrationQuery.php': [(r'namespace App\Contexts\Platform\Queries;', r'namespace App\Contexts\Platform\Administration\Queries;')],
              'app/Contexts/Platform/Administration/Services/ProductionLaunchReadiness.php': [(r'namespace App\Contexts\Platform\Services;', r'namespace App\Contexts\Platform\Administration\Services;')],
              'app/Shared/Infrastructure/Runtime/Services/RuntimeConfigurationValidator.php': [(r'namespace App\Contexts\Platform\Services;', r'namespace App\Shared\Infrastructure\Runtime\Services;')],
              'app/Shared/Infrastructure/Runtime/Http/Controllers/ReadinessController.php': [(r'namespace App\Contexts\Platform\Http\Controllers;', r'namespace App\Shared\Infrastructure\Runtime\Http\Controllers;')],
              'app/Shared/Infrastructure/Observability/Http/Middleware/AssignRequestContext.php': [(r'namespace App\Contexts\Platform\Http\Middleware;', r'namespace App\Shared\Infrastructure\Observability\Http\Middleware;')],
              'app/Shared/Infrastructure/Observability/Http/Middleware/RecordRequestMetrics.php': [(r'namespace App\Contexts\Platform\Http\Middleware;', r'namespace App\Shared\Infrastructure\Observability\Http\Middleware;')],
              'app/Shared/Infrastructure/Security/Http/Middleware/SecurityHeaders.php': [(r'namespace App\Contexts\Platform\Http\Middleware;', r'namespace App\Shared\Infrastructure\Security\Http\Middleware;')],
              'app/Contexts/GameWorld/Players/Http/Middleware/HandleInertiaRequests.php': [(r'namespace App\Contexts\Platform\Http\Middleware;', r'namespace App\Contexts\GameWorld\Players\Http\Middleware;')],
          }
          for filename, reps in file_replacements.items():
              path = Path(filename)
              if not path.exists():
                  raise RuntimeError(f'moved file missing: {filename}')
              replace_in_file(path, reps)

          # V3 structural tests. These are additive; existing test suites are untouched.
          test_dir = Path('tests/v3/Architecture')
          test_dir.mkdir(parents=True, exist_ok=True)
          (test_dir / 'CapabilityFirstSourceLayoutV3Test.php').write_text(r'''<?php

declare(strict_types=1);

namespace Tests\V3\Architecture;

use PHPUnit\Framework\Attributes\Test;
use PHPUnit\Framework\TestCase;

final class CapabilityFirstSourceLayoutV3Test extends TestCase
{
    #[Test]
    public function only_the_seven_business_context_roots_exist(): void
    {
        $root = dirname(__DIR__, 3).'/app/Contexts';
        $actual = array_values(array_map('basename', array_filter(glob($root.'/*') ?: [], 'is_dir')));
        sort($actual);
        $expected = ['Accounts', 'Alliance', 'Communications', 'GameWorld', 'Intelligence', 'Operations', 'Platform'];
        sort($expected);
        self::assertSame($expected, $actual);
    }

    #[Test]
    public function context_roots_do_not_expose_technical_layer_buckets(): void
    {
        $forbidden = ['Actions','Catalog','Contracts','Enums','Events','Http','Jobs','Listeners','Models','Policies','Providers','Queries','Services','ValueObjects'];
        foreach (glob(dirname(__DIR__, 3).'/app/Contexts/*', GLOB_ONLYDIR) ?: [] as $context) {
            foreach ($forbidden as $name) {
                self::assertDirectoryDoesNotExist($context.'/'.$name, basename($context).' exposes root technical bucket '.$name);
            }
        }
    }

    #[Test]
    public function removed_pre_v3_packages_do_not_exist(): void
    {
        $app = dirname(__DIR__, 3).'/app';
        foreach ([
            'Contexts/Alliance/Core',
            'Contexts/Alliance/Policies',
            'Contexts/Operations/EventCore',
            'Contexts/Intelligence/Http',
            'Contexts/Communications/Reminders',
        ] as $relative) {
            self::assertDirectoryDoesNotExist($app.'/'.$relative);
        }
    }

    #[Test]
    public function shared_has_only_the_infrastructure_package(): void
    {
        $root = dirname(__DIR__, 3).'/app/Shared';
        $directories = array_values(array_map('basename', array_filter(glob($root.'/*') ?: [], 'is_dir')));
        sort($directories);
        self::assertSame(['Infrastructure'], $directories);
    }
}
''')

          (test_dir / 'NamespaceLocationV3Test.php').write_text(r'''<?php

declare(strict_types=1);

namespace Tests\V3\Architecture;

use PHPUnit\Framework\Attributes\Test;
use PHPUnit\Framework\TestCase;
use RecursiveDirectoryIterator;
use RecursiveIteratorIterator;

final class NamespaceLocationV3Test extends TestCase
{
    #[Test]
    public function app_php_files_do_not_reference_removed_architecture_namespaces(): void
    {
        $forbidden = [
            'App\\Contexts\\Accounts\\Models\\',
            'App\\Contexts\\Accounts\\Actions\\',
            'App\\Contexts\\Accounts\\Http\\',
            'App\\Contexts\\Accounts\\Services\\',
            'App\\Contexts\\GameWorld\\Models\\',
            'App\\Contexts\\GameWorld\\Actions\\',
            'App\\Contexts\\GameWorld\\Enums\\',
            'App\\Contexts\\GameWorld\\Queries\\',
            'App\\Contexts\\GameWorld\\Services\\',
            'App\\Contexts\\GameWorld\\Http\\',
            'App\\Contexts\\Alliance\\Core\\',
            'App\\Contexts\\Alliance\\Policies\\',
            'App\\Contexts\\Operations\\EventCore\\',
            'App\\Contexts\\Intelligence\\Http\\',
            'App\\Contexts\\Communications\\Reminders\\',
            'App\\Contexts\\Platform\\Access\\',
            'App\\Contexts\\Platform\\Actions\\',
            'App\\Contexts\\Platform\\Models\\',
            'App\\Contexts\\Platform\\Services\\',
            'App\\Contexts\\Platform\\Queries\\',
            'App\\Contexts\\Platform\\Http\\',
            'App\\Contexts\\Platform\\Providers\\',
            'App\\Shared\\Access\\',
            'App\\Shared\\Http\\',
            'App\\Shared\\Providers\\',
        ];

        $root = dirname(__DIR__, 3).'/app';
        $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root));
        foreach ($iterator as $file) {
            if (! $file->isFile() || $file->getExtension() !== 'php') {
                continue;
            }
            $contents = file_get_contents($file->getPathname());
            self::assertIsString($contents);
            foreach ($forbidden as $namespace) {
                self::assertStringNotContainsString($namespace, $contents, $file->getPathname().' references '.$namespace);
            }
        }
    }
}
''')

          # The one-use workflow removes itself from the resulting clean branch.
          remove('.github/workflows/v3-p1-mechanical-refactor.yml')

          forbidden_namespaces = [
              r'App\Contexts\Accounts\Models\', r'App\Contexts\Accounts\Actions\', r'App\Contexts\Accounts\Http\', r'App\Contexts\Accounts\Services\',
              r'App\Contexts\GameWorld\Models\', r'App\Contexts\GameWorld\Actions\', r'App\Contexts\GameWorld\Enums\', r'App\Contexts\GameWorld\Queries\', r'App\Contexts\GameWorld\Services\', r'App\Contexts\GameWorld\Http\',
              r'App\Contexts\Alliance\Core\', r'App\Contexts\Alliance\Policies\', r'App\Contexts\Operations\EventCore\', r'App\Contexts\Intelligence\Http\', r'App\Contexts\Communications\Reminders\',
              r'App\Contexts\Platform\Access\', r'App\Contexts\Platform\Actions\', r'App\Contexts\Platform\Models\', r'App\Contexts\Platform\Services\', r'App\Contexts\Platform\Queries\', r'App\Contexts\Platform\Http\', r'App\Contexts\Platform\Providers\',
              r'App\Shared\Access\', r'App\Shared\Http\', r'App\Shared\Providers\',
          ]

          offenders: list[str] = []
          for scan_root in roots:
              for path in scan_root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.php','.md','.json','.yml','.yaml','.xml'}:
                      continue
                  try:
                      text = path.read_text()
                  except UnicodeDecodeError:
                      continue
                  for needle in forbidden_namespaces:
                      if needle in text:
                          offenders.append(f'{path}: {needle}')

          forbidden_paths = [
              'app/Contexts/Accounts/Actions','app/Contexts/Accounts/Http','app/Contexts/Accounts/Models','app/Contexts/Accounts/Services',
              'app/Contexts/GameWorld/Actions','app/Contexts/GameWorld/Enums','app/Contexts/GameWorld/Http','app/Contexts/GameWorld/Models','app/Contexts/GameWorld/Queries','app/Contexts/GameWorld/Services',
              'app/Contexts/Alliance/Core','app/Contexts/Alliance/Policies','app/Contexts/Operations/EventCore','app/Contexts/Intelligence/Http','app/Contexts/Communications/Reminders',
              'app/Contexts/Platform/Access','app/Contexts/Platform/Actions','app/Contexts/Platform/Http','app/Contexts/Platform/Models','app/Contexts/Platform/Providers','app/Contexts/Platform/Queries','app/Contexts/Platform/Services',
              'app/Shared/Access','app/Shared/Http','app/Shared/Providers',
          ]
          for path in forbidden_paths:
              if Path(path).exists():
                  offenders.append(f'forbidden path remains: {path}')

          if offenders:
              print('\n'.join(offenders))
              sys.exit(1)
          PY

      - name: Commit clean-room mechanical refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "refactor(v3): apply CA-P1 mechanical capability moves [skip ci]"
          git push origin HEAD:architecture-v3-capability-alignment
