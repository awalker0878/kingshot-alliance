name: Event Command Format Diagnostics

on:
  pull_request:
    paths:
      - 'app/Contexts/Operations/TerritoryPlanning/Queries/EventTerritoryCommandQuery.php'
      - 'resources/js/components/events/EventCommandCard.vue'
      - 'resources/js/localization/event-command-labels.ts'
      - 'resources/js/types/event-command.ts'
      - '.github/workflows/event-command-format-diagnostics.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format PHP target
        run: vendor/bin/pint app/Contexts/Operations/TerritoryPlanning/Queries/EventTerritoryCommandQuery.php

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Format frontend targets
        run: >-
          npx prettier --write
          resources/js/components/events/EventCommandCard.vue
          resources/js/localization/event-command-labels.ts
          resources/js/types/event-command.ts

      - name: Upload formatted targets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: event-command-formatted-targets
          path: |
            app/Contexts/Operations/TerritoryPlanning/Queries/EventTerritoryCommandQuery.php
            resources/js/components/events/EventCommandCard.vue
            resources/js/localization/event-command-labels.ts
            resources/js/types/event-command.ts
          retention-days: 1
