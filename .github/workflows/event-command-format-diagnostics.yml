name: Event Command Format Diagnostics

on:
  pull_request:
    paths:
      - 'app/Contexts/Operations/TerritoryPlanning/Queries/EventTerritoryCommandQuery.php'
      - 'resources/js/components/events/EventCommandCard.vue'
      - 'resources/js/localization/event-command-labels.ts'
      - 'resources/js/types/event-command.ts'
      - '.github/workflows/event-command-format-diagnostics.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref }}

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format PHP target
        run: vendor/bin/pint app/Contexts/Operations/TerritoryPlanning/Queries/EventTerritoryCommandQuery.php

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Format frontend targets
        run: >-
          npx prettier --write
          resources/js/components/events/EventCommandCard.vue
          resources/js/localization/event-command-labels.ts
          resources/js/types/event-command.ts

      - name: Commit exact formatter output
        shell: bash
        run: |
          if git diff --quiet -- \
            app/Contexts/Operations/TerritoryPlanning/Queries/EventTerritoryCommandQuery.php \
            resources/js/components/events/EventCommandCard.vue \
            resources/js/localization/event-command-labels.ts \
            resources/js/types/event-command.ts; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/Contexts/Operations/TerritoryPlanning/Queries/EventTerritoryCommandQuery.php \
            resources/js/components/events/EventCommandCard.vue \
            resources/js/localization/event-command-labels.ts \
            resources/js/types/event-command.ts
          git commit -m "Apply locked Event Command formatters"
          git push origin HEAD:${{ github.head_ref }}
