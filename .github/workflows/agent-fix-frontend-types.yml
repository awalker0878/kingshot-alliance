name: Agent Frontend Type Gate Fix

on:
  push:
    branches:
      - agent/full-ui-rewrite

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out rewrite branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/full-ui-rewrite
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply strict TypeScript fixes
        run: python3 scripts/agent-fix-frontend-types.py

      - name: Format affected frontend files
        run: npx prettier --write resources/js/components/ui/AppButton.vue resources/js/layouts/AppLayout.vue resources/js/localization/locales.ts resources/js/pages/Alliance/Members/Manage.vue resources/js/pages/Alliance/Noticeboard/Manage.vue resources/js/pages/Intelligence/Roster/Dossiers.vue resources/js/pages/Kingdom/Transfer/Manage.vue resources/js/pages/Kingdom/Transfer/Readiness.vue resources/js/pages/Operations/Events/Manage.vue resources/js/pages/Operations/Events/Show.vue

      - name: Run frontend lint
        run: npm run lint:check

      - name: Run strict frontend type check
        run: npm run types:check

      - name: Commit strict TypeScript fixes
        shell: bash
        run: |
          if git diff --quiet -- resources/; then
            echo "No frontend type changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/
          git commit -m "fix frontend strict type gates"
          git push origin HEAD:agent/full-ui-rewrite
