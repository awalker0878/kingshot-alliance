name: V3 CA-P3 Persistence Audit

on:
  push:
    branches:
      - architecture-v3-capability-alignment

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Run cross-context persistence invariant
        id: audit
        shell: bash
        run: |
          set +e
          vendor/bin/phpunit tests/v3/Architecture/CrossContextPersistenceV3Test.php 2>&1 | tee /tmp/v3-p3-audit.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: v3-p3-persistence-audit
          path: /tmp/v3-p3-audit.txt
          if-no-files-found: error
      - name: Fail when leakage remains
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
