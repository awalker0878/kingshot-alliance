name: V3 CA-P6 Close

on:
  push:
    branches:
      - architecture-v3-capability-alignment

permissions:
  contents: write

jobs:
  close:
    if: ${{ !contains(github.event.head_commit.message, 'complete CA-P6') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v3-capability-alignment
          fetch-depth: 0
      - name: Require P6 gate pass
        run: test -f ARCH_V3_P6_GATE_PASS && grep -qx PASS ARCH_V3_P6_GATE_PASS
      - name: Remove temporary P6 tooling
        run: rm -f .github/workflows/v3-p6-gate.yml .github/workflows/v3-p6-close.yml ARCH_V3_P6_GATE_PASS ARCH_V3_P6_GATE_FAIL.txt
      - name: Advance status
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('ARCH_V3_REWRITE_STATUS.md')
          t=p.read_text()
          start=t.index('## Phase CA-P6 — Architecture enforcement')
          end=t.index('## Phase CA-P7 — Full leakage scan and certification')
          replacement='''## Phase CA-P6 — Architecture enforcement\n\nStatus: COMPLETE\n\n### Done\n- Added consolidated V3 architecture enforcement for removed `*MutationAuthority` patterns.\n- Enforced GameWorld Player has no Accounts User Eloquent relationship.\n- Enforced cross-context Eloquent relationships are prohibited in context Models.\n- Enforced ReadModels are read-only.\n- Enforced authorization/access services do not own database transactions or locks.\n- Enforced write Actions/services do not interpret foreign permission vocabularies.\n- Retained and ran the earlier V3 capability-layout, namespace, HTTP, foreign-write, workflow, and Communications invariants as one architecture suite.\n- Removed authorization-service lock acquisition discovered by the new enforcement gate.\n- Strict PSR-4, PHP syntax, route boot, and the complete V3 architecture suite pass with enforcement enabled.\n- Temporary P6 gate workflow and sentinels removed.\n\n### Failed / blocked\n- None.\n\n'''
          t=t[:start]+replacement+t[end:]
          t=t.replace('## Phase CA-P7 — Full leakage scan and certification\n\nStatus: NOT STARTED','## Phase CA-P7 — Full leakage scan and certification\n\nStatus: IN PROGRESS')
          p.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(v3): complete CA-P6 architecture enforcement [skip ci]"
          git push origin HEAD:architecture-v3-capability-alignment
