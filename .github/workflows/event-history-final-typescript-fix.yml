name: Event History Final TypeScript Fix

on:
  push:
    branches:
      - feature/event-contribution-history-p0
    paths:
      - '.github/workflows/event-history-final-typescript-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/event-contribution-history-p0
      - name: Apply final Event form typing fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manage = Path('resources/js/pages/Events/Manage.vue')
          text = manage.read_text()
          marker = "import { useLocale } from '../../localization';\n\n"
          types = """import { useLocale } from '../../localization';

          type EventSettingValue =
            | string
            | number
            | boolean
            | null
            | EventSettingValue[]
            | { [key: string]: EventSettingValue };

          type EventTemplateForm = {
            scope: string;
            target_id: string;
            event_type_id: string;
            name: string;
            instructions: string;
            duration_minutes: number;
            capacity: number | null;
            registration_opens_minutes_before: number | null;
            registration_closes_minutes_before: number | null;
            recurrence_frequency: 'none' | 'daily' | 'weekly';
            recurrence_interval: number;
            settings: Record<string, EventSettingValue>;
          };

          """
          if 'type EventSettingValue =' not in text:
              if marker not in text:
                  raise SystemExit('Manage.vue localization import marker not found')
              text = text.replace(marker, types, 1)
          old = "recurrenceUntilLocal: string | null; settings: Record<string, unknown>; capabilities: string[];"
          new = "recurrenceUntilLocal: string | null; settings: Record<string, EventSettingValue>; capabilities: string[];"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Manage.vue event settings type marker not found')
          if 'const templateForm = useForm({' in text:
              text = text.replace('const templateForm = useForm({', 'const templateForm = useForm<EventTemplateForm>({', 1)
          elif 'const templateForm = useForm<EventTemplateForm>({' not in text:
              raise SystemExit('Manage.vue template form marker not found')
          manage.write_text(text)

          show = Path('resources/js/pages/Events/Show.vue')
          text = show.read_text()
          registration_marker = 'const registrationForm = useForm({});\n'
          registration_helper = """const registrationForm = useForm({});
          function registrationError(): string | undefined {
            return (registrationForm.errors as Record<string, string | undefined>).registration;
          }
          """
          if 'function registrationError()' not in text:
              if registration_marker not in text:
                  raise SystemExit('Show.vue registration form marker not found')
              text = text.replace(registration_marker, registration_helper, 1)
          text = text.replace('registrationForm.errors.registration', 'registrationError()')
          show.write_text(text)
          PY
      - name: Format repaired Vue files
        run: |
          npm ci --no-audit --no-fund
          npx prettier --write resources/js/pages/Events/Manage.vue resources/js/pages/Events/Show.vue
      - name: Commit repaired files
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add resources/js/pages/Events/Manage.vue resources/js/pages/Events/Show.vue
          git commit -m 'Fix Event form TypeScript contracts'
          git push origin HEAD:feature/event-contribution-history-p0
