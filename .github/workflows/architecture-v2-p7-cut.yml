name: Architecture V2 P7 hard cut

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/scripts/arch_v2_p7_cut.py'
      - '.github/scripts/arch_v2_p7_static_fixes.py'
      - '.github/scripts/arch_v2_p7_contract_recovery.py'
      - '.github/scripts/arch_v2_p7_communications_contracts.py'
      - '.github/scripts/arch_v2_p7_communications_fixture_fixes.py'
      - '.github/workflows/architecture-v2-p7-cut.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: architecture-v2-p7-cut
  cancel-in-progress: true

jobs:
  hard-cut:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kingshot_test
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_test
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Check out architecture-v2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Apply P7 ownership cut
        run: python3 .github/scripts/arch_v2_p7_cut.py

      - name: Apply P7 V2 dependency corrections
        run: python3 .github/scripts/arch_v2_p7_static_fixes.py

      - name: Recover stale P5 P6 contracts exposed by P7
        run: python3 .github/scripts/arch_v2_p7_contract_recovery.py

      - name: Promote Communications delivery contracts
        run: python3 .github/scripts/arch_v2_p7_communications_contracts.py

      - name: Correct promoted Communications authority fixture
        run: python3 .github/scripts/arch_v2_p7_communications_fixture_fixes.py

      - name: Format changed PHP
        run: vendor/bin/pint

      - name: Verify PostgreSQL schema
        run: php artisan migrate:fresh --force

      - name: Verify P7 hard-cut boundaries
        shell: bash
        run: |
          set -euo pipefail
          test ! -d app/Domain/Notifications
          test ! -d app/Domain/Integrations
          test ! -d app/Domain/Platform
          test ! -d app/Shared/Audit
          test ! -d app/Shared/Messaging
          test ! -d tests/RewriteInput/Communications
          test -d app/Contexts/Communications/Reminders
          test -d app/Contexts/Platform/Integrations
          test -d app/Shared/Infrastructure/AuditTrail
          test -d app/Shared/Infrastructure/Messaging/Outbox
          test -d tests/Feature/Communications

          matches=$(grep -R -n -E --include='*.php' 'App\\(Domain\\(Notifications|Integrations|Platform)|Shared\\(Audit|Messaging))\\' app routes bootstrap config database tests 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            exit 1
          fi

      - name: Larastan P7 owners and affected orchestration
        run: >-
          vendor/bin/phpstan analyse --memory-limit=1536M
          app/Contexts/Communications
          app/Contexts/Platform
          app/Contexts/Intelligence/Contributions
          app/Shared
          app/Workflows
          app/ReadModels
          app/Domain/Kingdoms/Models/TransferPlan.php
          bootstrap/app.php
          bootstrap/providers.php
          routes/console.php
          routes/platform.php

      - name: Run P7 architecture contract
        run: php artisan test tests/Architecture/ArchitectureV2PlatformTest.php

      - name: Run Platform and integration behavior contracts
        run: php artisan test tests/Feature/Platform

      - name: Run Communications delivery contracts
        run: php artisan test tests/Feature/Communications

      - name: Run recovered contribution reporting contract
        run: php artisan test tests/Feature/Contributions/AllianceContributionReportQueryTest.php

      - name: Run Shared outbox publisher contract
        run: php artisan test tests/Integration/Platform/OutboxPublisherTest.php

      - name: Run complete architecture regression suite
        run: php artisan test tests/Architecture

      - name: Remove one-shot migration machinery
        run: |
          rm .github/scripts/arch_v2_p7_cut.py
          rm .github/scripts/arch_v2_p7_static_fixes.py
          rm .github/scripts/arch_v2_p7_contract_recovery.py
          rm .github/scripts/arch_v2_p7_communications_contracts.py
          rm .github/scripts/arch_v2_p7_communications_fixture_fixes.py
          rm .github/workflows/architecture-v2-p7-cut.yml

      - name: Commit verified P7 cut
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No P7 changes to commit.'
            exit 0
          fi
          git commit -m 'ARCH-V2-P7: hard cut communications platform and shared infrastructure'
          git push origin HEAD:architecture-v2
