name: Kingdom Transfer Validation UX Once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.event.pull_request.head.ref == 'feature/kingdom-transfer-planning' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/kingdom-transfer-planning
      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Add accessible validation feedback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changes = {
              'resources/js/pages/Kingdom/Transfer/Manage.vue': (
                  "import { Head, Link, router, useForm } from '@inertiajs/vue3';",
                  "import { Head, Link, router, useForm, usePage } from '@inertiajs/vue3';",
              ),
              'resources/js/pages/Kingdom/Transfer/Readiness.vue': (
                  "import { Head, Link, router } from '@inertiajs/vue3';",
                  "import { Head, Link, router, usePage } from '@inertiajs/vue3';",
              ),
          }
          for path, (old, new) in changes.items():
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: import pattern missing')
              text = text.replace(old, new, 1)
              anchor = 'const { t, formatDate, formatNumber } = useLocale();\n'
              if anchor not in text:
                  raise SystemExit(f'{path}: locale anchor missing')
              page_state = (
                  anchor
                  + "const page = usePage();\n"
                  + "const validationErrors = computed(() =>\n"
                  + "  Object.values(\n"
                  + "    (((page.props as Record<string, unknown>).errors as Record<string, string> | undefined) ?? {}),\n"
                  + "  ),\n"
                  + ");\n"
              )
              text = text.replace(anchor, page_state, 1)
              header_end = '    </header>\n'
              alert = (
                  header_end
                  + '    <div\n'
                  + '      v-if="validationErrors.length"\n'
                  + '      role="alert"\n'
                  + '      aria-live="assertive"\n'
                  + '      class="mt-5 rounded-lg border border-red-500/30 bg-red-500/10 p-3 text-sm text-red-200"\n'
                  + '    >\n'
                  + '      {{ validationErrors[0] }}\n'
                  + '    </div>\n'
              )
              if header_end not in text:
                  raise SystemExit(f'{path}: header anchor missing')
              text = text.replace(header_end, alert, 1)
              p.write_text(text)
          PY
          npx prettier --write resources/js/pages/Kingdom/Transfer/Manage.vue resources/js/pages/Kingdom/Transfer/Readiness.vue
          npx prettier --check resources/js/pages/Kingdom/Transfer/Manage.vue resources/js/pages/Kingdom/Transfer/Readiness.vue
      - name: Commit validation UX and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/kingdom-transfer-validation-ux-once.yml
          git add resources/js/pages/Kingdom/Transfer/Manage.vue resources/js/pages/Kingdom/Transfer/Readiness.vue
          git commit -m "fix: surface transfer validation failures"
          git push origin HEAD:feature/kingdom-transfer-planning
