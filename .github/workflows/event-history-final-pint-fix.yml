name: Event History Final Pint Fix

on:
  push:
    branches:
      - feature/event-contribution-history-p0

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/event-contribution-history-p0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Format Event participation evidence query
        run: vendor/bin/pint app/Domain/Events/Queries/EventPlayerOccurrenceEvidenceQuery.php
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- app/Domain/Events/Queries/EventPlayerOccurrenceEvidenceQuery.php; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Domain/Events/Queries/EventPlayerOccurrenceEvidenceQuery.php
          git commit -m 'Format Event participation evidence query'
          git fetch origin feature/event-contribution-history-p0
          git rebase origin/feature/event-contribution-history-p0
          git push origin HEAD:feature/event-contribution-history-p0
