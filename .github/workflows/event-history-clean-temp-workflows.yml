name: Event History One-Shot Workflow Cleanup

on:
  push:
    branches:
      - feature/event-contribution-history-p0

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: feature/event-contribution-history-p0
      - name: Remove temporary Event history workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/workflows/event-history-larastan-fix.yml \
            .github/workflows/event-history-remove-dead-method.yml \
            .github/workflows/event-history-remove-unused-helper.yml \
            .github/workflows/event-history-clean-temp-workflows.yml
          git commit -m 'Remove temporary Event history verification helpers'
          git pull --rebase origin feature/event-contribution-history-p0
          git push origin HEAD:feature/event-contribution-history-p0
