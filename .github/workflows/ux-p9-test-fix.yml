name: UX P9 Test Fix

on:
  push:
    paths:
      - '.ux-p9-test-fix-run'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out UX branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ux/ux-001-experience-localization

      - name: Correct authenticated locale setup and retrigger P9
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/Visual/ux-p9.spec.ts')
          source = path.read_text()
          source = source.replace("test('authenticated application shell English baseline', async ({ page }) => {\n  await useLocale(page, 'en');\n", "test('authenticated application shell English baseline', async ({ page }) => {\n", 1)
          source = source.replace("test('authenticated application shell Arabic RTL baseline', async ({ page }) => {\n  await useLocale(page, 'en');\n", "test('authenticated application shell Arabic RTL baseline', async ({ page }) => {\n", 1)
          source = source.replace("  await useLocale(page, 'en');\n  await signIn(page);\n  await page.keyboard.press('Tab');", "  await signIn(page);\n  await page.keyboard.press('Tab');", 1)
          path.write_text(source)
          PY

          printf 'run-2\n' > .ux-p9-run
          rm -f .ux-p9-test-fix-run .github/workflows/ux-p9-test-fix.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix UX-P9 authenticated locale visual setup'
          git push origin HEAD:ux/ux-001-experience-localization
