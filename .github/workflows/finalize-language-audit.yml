name: Finalize language audit

on:
  push:
    branches:
      - product/kingshot-language-alignment

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: product/kingshot-language-alignment
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply final language audit fixes
        run: node scripts/finalize-language-audit.mjs

      - name: Format touched frontend files
        run: |
          npx prettier --write \
            resources/js/localization/messages/kingdom \
            resources/js/pages/Intelligence/KingdomWatch/AllianceDossier.vue \
            resources/js/pages/Intelligence/KingdomWatch/Envoys.vue \
            resources/js/pages/Intelligence/KingdomWatch/History.vue \
            resources/js/pages/Public/Alliance/Show.vue \
            scripts/check-page-localization-coverage.mjs
          git diff --check

      - name: Verify final frontend language checks
        run: |
          npm run lint:check
          npm run types:check
          npm run check:page-localization-coverage
          npm run check:product-language

      - name: Commit final audit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No final audit changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            resources/js/localization/messages/kingdom \
            resources/js/pages/Intelligence/KingdomWatch/AllianceDossier.vue \
            resources/js/pages/Intelligence/KingdomWatch/Envoys.vue \
            resources/js/pages/Intelligence/KingdomWatch/History.vue \
            resources/js/pages/Public/Alliance/Show.vue \
            scripts/check-page-localization-coverage.mjs
          git commit -m "Close final product language audit findings"
          git push origin HEAD:product/kingshot-language-alignment
