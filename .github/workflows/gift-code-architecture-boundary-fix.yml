name: Gift Code Architecture Boundary Fix

on:
  push:
    branches:
      - gift-code-research-backed-acquisition

permissions:
  contents: write

jobs:
  fix-boundaries:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: gift-code-research-backed-acquisition
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, gd, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Refactor Gift Code architecture boundaries
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')

          def read(path: str) -> str:
              return (root / path).read_text()

          def write(path: str, content: str) -> None:
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              content = read(path)
              count = content.count(old)
              if count != expected:
                  raise RuntimeError(f'{path}: expected {expected} occurrence(s), found {count}: {old[:100]!r}')
              write(path, content.replace(old, new))

          # Acquisition is provider/read orchestration, not an application write Action.
          old_acquirer = root / 'app/Contexts/GameWorld/GiftCodes/Actions/AcquireGiftCodeSourceHead.php'
          acquirer = old_acquirer.read_text()
          acquirer = acquirer.replace(
              'namespace App\\Contexts\\GameWorld\\GiftCodes\\Actions;',
              'namespace App\\Contexts\\GameWorld\\GiftCodes\\Services;',
          ).replace(
              'final readonly class AcquireGiftCodeSourceHead',
              'final readonly class GiftCodeSourceHeadAcquirer',
          )
          write('app/Contexts/GameWorld/GiftCodes/Services/GiftCodeSourceHeadAcquirer.php', acquirer)
          old_acquirer.unlink()

          for path in [
              'app/Contexts/GameWorld/GiftCodes/Actions/RunApprovedGiftCodeSourceIngestion.php',
              'app/Contexts/GameWorld/GiftCodes/Actions/RunGiftCodeSourceReconciliation.php',
          ]:
              content = read(path)
              content = content.replace(
                  'use App\\Contexts\\GameWorld\\GiftCodes\\Actions\\AcquireGiftCodeSourceHead;\n',
                  'use App\\Contexts\\GameWorld\\GiftCodes\\Services\\GiftCodeSourceHeadAcquirer;\n',
              )
              if 'use App\\Contexts\\GameWorld\\GiftCodes\\Services\\GiftCodeSourceHeadAcquirer;' not in content:
                  anchor = 'use App\\Contexts\\GameWorld\\GiftCodes\\Services\\GiftCodeSourceHealthProjector;\n'
                  if anchor not in content:
                      raise RuntimeError(f'{path}: cannot locate service import anchor')
                  content = content.replace(anchor, anchor + 'use App\\Contexts\\GameWorld\\GiftCodes\\Services\\GiftCodeSourceHeadAcquirer;\n', 1)
              content = content.replace('AcquireGiftCodeSourceHead', 'GiftCodeSourceHeadAcquirer')
              write(path, content)

          # Public write contract uses scalar source identity.
          path = 'app/Contexts/GameWorld/GiftCodes/Actions/IngestGiftCodeProviderPublication.php'
          content = read(path)
          content = content.replace('use App\\Contexts\\GameWorld\\GiftCodes\\Models\\GiftCodeSourceRegistry;\n', '')
          content = content.replace('        GiftCodeSourceRegistry $source,\n', '        string $sourceId,\n')
          content = content.replace('$this->ingest->handle((string) $source->id, $observation)', '$this->ingest->handle($sourceId, $observation)')
          write(path, content)

          # Cross-context operator lookup stays owned by Platform Administration.
          write('app/Contexts/Platform/Administration/Services/PlatformAdministratorDirectory.php', '''<?php

          declare(strict_types=1);

          namespace App\\Contexts\\Platform\\Administration\\Services;

          use App\\Contexts\\Platform\\Administration\\Models\\PlatformAdministrator;

          final class PlatformAdministratorDirectory
          {
              /** @return list<int> */
              public function activeUserIds(): array
              {
                  return PlatformAdministrator::query()
                      ->whereNull('revoked_at')
                      ->orderBy('user_id')
                      ->pluck('user_id')
                      ->map(static fn (mixed $value): int => (int) $value)
                      ->filter(static fn (int $value): bool => $value > 0)
                      ->values()
                      ->all();
              }
          }
          '''.replace('          ', ''))

          path = 'app/Contexts/GameWorld/GiftCodes/Actions/QueueGiftCodeSourceOperationalAlerts.php'
          content = read(path)
          content = content.replace(
              'use App\\Contexts\\Platform\\Administration\\Models\\PlatformAdministrator;\n',
              'use App\\Contexts\\Platform\\Administration\\Services\\PlatformAdministratorDirectory;\n',
          )
          content = content.replace(
              '    public function __construct(private NotificationDeliveryService $delivery) {}',
              '    public function __construct(\n        private NotificationDeliveryService $delivery,\n        private PlatformAdministratorDirectory $administrators,\n    ) {}',
          )
          old = '''        $administratorIds = PlatformAdministrator::query()
              ->whereNull('revoked_at')
              ->orderBy('user_id')
              ->pluck('user_id')
              ->map(static fn (mixed $value): int => (int) $value)
              ->filter(static fn (int $value): bool => $value > 0)
              ->values()
              ->all();'''
          if old not in content:
              raise RuntimeError('QueueGiftCodeSourceOperationalAlerts: administrator query block not found')
          content = content.replace(old, '        $administratorIds = $this->administrators->activeUserIds();')
          write(path, content)

          # Model-free receipt across public Action boundary.
          write('app/Contexts/GameWorld/GiftCodes/ValueObjects/GiftCodePushDeliveryReceipt.php', '''<?php

          declare(strict_types=1);

          namespace App\\Contexts\\GameWorld\\GiftCodes\\ValueObjects;

          final readonly class GiftCodePushDeliveryReceipt
          {
              public function __construct(
                  public string $deliveryId,
                  public bool $created,
              ) {}
          }
          '''.replace('          ', ''))

          write('app/Contexts/GameWorld/GiftCodes/Actions/RecordGiftCodePushDelivery.php', '''<?php

          declare(strict_types=1);

          namespace App\\Contexts\\GameWorld\\GiftCodes\\Actions;

          use App\\Contexts\\GameWorld\\GiftCodes\\Enums\\GiftCodeSourceDeliveryStatus;
          use App\\Contexts\\GameWorld\\GiftCodes\\Models\\GiftCodeSourceDelivery;
          use App\\Contexts\\GameWorld\\GiftCodes\\Models\\GiftCodeSourceRegistry;
          use App\\Contexts\\GameWorld\\GiftCodes\\ValueObjects\\GiftCodePushDelivery;
          use App\\Contexts\\GameWorld\\GiftCodes\\ValueObjects\\GiftCodePushDeliveryReceipt;

          final class RecordGiftCodePushDelivery
          {
              public function handle(GiftCodePushDelivery $delivery): GiftCodePushDeliveryReceipt
              {
                  $source = GiftCodeSourceRegistry::query()
                      ->where('source_key', $delivery->sourceKey)
                      ->where('is_active', true)
                      ->whereNull('revoked_at')
                      ->firstOrFail();

                  $record = GiftCodeSourceDelivery::query()->firstOrCreate(
                      [
                          'gift_code_source_id' => (string) $source->id,
                          'replay_key' => $delivery->replayKey,
                      ],
                      [
                          'provider' => $delivery->provider,
                          'provider_event_id' => $delivery->providerEventId,
                          'provider_item_id' => $delivery->providerItemId,
                          'payload_sha256' => $delivery->payloadSha256,
                          'received_at' => now(),
                          'authenticated_at' => now(),
                          'signature_valid' => true,
                          'processing_status' => GiftCodeSourceDeliveryStatus::Authenticated->value,
                          'correlation_id' => $delivery->correlationId,
                      ],
                  );

                  return new GiftCodePushDeliveryReceipt(
                      deliveryId: (string) $record->id,
                      created: $record->wasRecentlyCreated,
                  );
              }
          }
          '''.replace('          ', ''))

          write('app/Contexts/GameWorld/GiftCodes/Actions/CompleteGiftCodePushDelivery.php', '''<?php

          declare(strict_types=1);

          namespace App\\Contexts\\GameWorld\\GiftCodes\\Actions;

          use App\\Contexts\\GameWorld\\GiftCodes\\Models\\GiftCodeSourceDelivery;
          use InvalidArgumentException;

          final class CompleteGiftCodePushDelivery
          {
              public function handle(string $deliveryId, string $status, ?string $errorCode = null): void
              {
                  if (! in_array($status, ['processed', 'quarantined', 'failed', 'ignored'], true)) {
                      throw new InvalidArgumentException('Unsupported Gift Code push-delivery completion status.');
                  }

                  $delivery = GiftCodeSourceDelivery::query()->findOrFail($deliveryId);
                  $delivery->forceFill([
                      'processing_status' => $status,
                      'error_code' => $errorCode,
                      'processed_at' => now(),
                  ])->save();
              }
          }
          '''.replace('          ', ''))

          write('app/Contexts/GameWorld/GiftCodes/Actions/RecordGiftCodeSourcePushActivity.php', '''<?php

          declare(strict_types=1);

          namespace App\\Contexts\\GameWorld\\GiftCodes\\Actions;

          use App\\Contexts\\GameWorld\\GiftCodes\\Models\\GiftCodeSourceRegistry;
          use InvalidArgumentException;

          final class RecordGiftCodeSourcePushActivity
          {
              public function handle(string $sourceId, string $event): void
              {
                  $source = GiftCodeSourceRegistry::query()->findOrFail($sourceId);

                  match ($event) {
                      'signature_failure' => $source->increment('signature_failure_count'),
                      'replay_rejection' => $source->increment('replay_rejection_count'),
                      'received' => $source->forceFill([
                          'last_push_received_at' => now(),
                          'last_provider_event_at' => now(),
                          'last_health_checked_at' => now(),
                      ])->save(),
                      default => throw new InvalidArgumentException('Unsupported Gift Code push-activity event.'),
                  };
              }
          }
          '''.replace('          ', ''))

          write('app/Contexts/GameWorld/GiftCodes/Actions/UpdateGiftCodeSourceSubscription.php', '''<?php

          declare(strict_types=1);

          namespace App\\Contexts\\GameWorld\\GiftCodes\\Actions;

          use App\\Contexts\\GameWorld\\GiftCodes\\Models\\GiftCodeSourceSubscription;

          final class UpdateGiftCodeSourceSubscription
          {
              /** @param array<string, mixed> $attributes */
              public function handle(
                  string $sourceId,
                  string $provider,
                  string $transport,
                  array $attributes,
                  bool $createIfMissing = false,
              ): void {
                  $identity = [
                      'gift_code_source_id' => $sourceId,
                      'provider' => $provider,
                      'transport' => $transport,
                  ];

                  if ($createIfMissing) {
                      GiftCodeSourceSubscription::query()->updateOrCreate($identity, $attributes);

                      return;
                  }

                  GiftCodeSourceSubscription::query()
                      ->where($identity)
                      ->update($attributes);
              }
          }
          '''.replace('          ', ''))

          def add_action_imports(content: str) -> str:
              anchor = 'use App\\Contexts\\GameWorld\\GiftCodes\\Actions\\RecordGiftCodePushDelivery;\n'
              addition = (
                  'use App\\Contexts\\GameWorld\\GiftCodes\\Actions\\CompleteGiftCodePushDelivery;\n'
                  'use App\\Contexts\\GameWorld\\GiftCodes\\Actions\\IngestGiftCodeProviderPublication;\n'
                  'use App\\Contexts\\GameWorld\\GiftCodes\\Actions\\RecordGiftCodePushDelivery;\n'
                  'use App\\Contexts\\GameWorld\\GiftCodes\\Actions\\RecordGiftCodeSourcePushActivity;\n'
                  'use App\\Contexts\\GameWorld\\GiftCodes\\Actions\\UpdateGiftCodeSourceSubscription;\n'
              )
              content = content.replace('use App\\Contexts\\GameWorld\\GiftCodes\\Actions\\IngestGiftCodeProviderPublication;\n' + anchor, addition)
              return content.replace('use App\\Contexts\\GameWorld\\GiftCodes\\Models\\GiftCodeSourceSubscription;\n', '')

          # X webhook: HTTP validates/dispatches/renders; owner Actions persist.
          path = 'app/Contexts/GameWorld/GiftCodes/Http/Controllers/XGiftCodeWebhookController.php'
          content = add_action_imports(read(path))
          content = content.replace(
              '    public function verify(Request $request, string $source): JsonResponse\n',
              '    public function verify(Request $request, string $source, UpdateGiftCodeSourceSubscription $subscriptions): JsonResponse\n',
          )
          old = '''        GiftCodeSourceSubscription::query()
              ->where('gift_code_source_id', $registry->id)
              ->where('provider', 'x')
              ->where('transport', 'filtered_stream_webhook')
              ->update(['last_verified_at' => now(), 'last_error_code' => null]);'''
          new = '''        $subscriptions->handle(
              sourceId: (string) $registry->id,
              provider: 'x',
              transport: 'filtered_stream_webhook',
              attributes: ['last_verified_at' => now(), 'last_error_code' => null],
          );'''
          if old not in content: raise RuntimeError('X verify subscription block not found')
          content = content.replace(old, new)
          content = content.replace(
              '        RecordGiftCodePushDelivery $record,\n        XPostGiftCodeFetcher $fetcher,',
              '        RecordGiftCodePushDelivery $record,\n        CompleteGiftCodePushDelivery $complete,\n        RecordGiftCodeSourcePushActivity $activity,\n        UpdateGiftCodeSourceSubscription $subscriptions,\n        XPostGiftCodeFetcher $fetcher,',
          )
          content = content.replace('$this->authorizeSignature($request, $registry, $body);', '$this->authorizeSignature($request, $registry, $body, $activity);')
          content = content.replace('if (! $delivery->wasRecentlyCreated) {', 'if (! $delivery->created) {')
          content = content.replace("            $registry->increment('replay_rejection_count');", "            $activity->handle((string) $registry->id, 'replay_rejection');")
          content = content.replace("$outcome = $ingest->handle($registry, $publication, 'x-filtered-stream-webhook-v1', true);", "$outcome = $ingest->handle((string) $registry->id, $publication, 'x-filtered-stream-webhook-v1', true);")
          old = '''            $delivery->forceFill([
                  'processing_status' => $outcome->status,
                  'processed_at' => now(),
              ])->save();
              $registry->forceFill([
                  'last_push_received_at' => now(),
                  'last_provider_event_at' => now(),
                  'last_health_checked_at' => now(),
              ])->save();
              GiftCodeSourceSubscription::query()
                  ->where('gift_code_source_id', $registry->id)
                  ->where('provider', 'x')
                  ->where('transport', 'filtered_stream_webhook')
                  ->update(['last_event_received_at' => now(), 'last_error_code' => null]);'''
          new = '''            $complete->handle($delivery->deliveryId, $outcome->status);
              $activity->handle((string) $registry->id, 'received');
              $subscriptions->handle(
                  sourceId: (string) $registry->id,
                  provider: 'x',
                  transport: 'filtered_stream_webhook',
                  attributes: ['last_event_received_at' => now(), 'last_error_code' => null],
              );'''
          if old not in content: raise RuntimeError('X success persistence block not found')
          content = content.replace(old, new)
          old = '''            $delivery->forceFill([
                  'processing_status' => 'failed',
                  'error_code' => 'canonical_fetch_or_ingestion_failed',
                  'processed_at' => now(),
              ])->save();'''
          content = content.replace(old, "            $complete->handle($delivery->deliveryId, 'failed', 'canonical_fetch_or_ingestion_failed');")
          content = content.replace(
              '    private function authorizeSignature(Request $request, GiftCodeSourceRegistry $source, string $body): void\n',
              '    private function authorizeSignature(\n        Request $request,\n        GiftCodeSourceRegistry $source,\n        string $body,\n        RecordGiftCodeSourcePushActivity $activity,\n    ): void\n',
          )
          content = content.replace("            $source->increment('signature_failure_count');", "            $activity->handle((string) $source->id, 'signature_failure');")
          write(path, content)

          # YouTube WebSub webhook.
          path = 'app/Contexts/GameWorld/GiftCodes/Http/Controllers/YouTubeWebSubGiftCodeController.php'
          content = add_action_imports(read(path))
          content = content.replace(
              '    public function verify(Request $request, string $source): Response\n',
              '    public function verify(Request $request, string $source, UpdateGiftCodeSourceSubscription $subscriptions): Response\n',
          )
          old = '''        GiftCodeSourceSubscription::query()->updateOrCreate(
              [
                  'gift_code_source_id' => (string) $registry->id,
                  'provider' => 'youtube',
                  'transport' => 'websub',
              ],
              [
                  'topic_or_rule' => $expectedTopic,
                  'configured_identity' => ['channel_id' => $channelId],
                  'status' => $mode === 'subscribe' ? 'active' : 'disabled',
                  'activated_at' => $mode === 'subscribe' ? now() : null,
                  'expires_at' => $mode === 'subscribe' && $leaseSeconds > 0 ? now()->addSeconds(min($leaseSeconds, 31_536_000)) : null,
                  'last_verified_at' => now(),
                  'last_error_code' => null,
              ],
          );'''
          new = '''        $subscriptions->handle(
              sourceId: (string) $registry->id,
              provider: 'youtube',
              transport: 'websub',
              attributes: [
                  'topic_or_rule' => $expectedTopic,
                  'configured_identity' => ['channel_id' => $channelId],
                  'status' => $mode === 'subscribe' ? 'active' : 'disabled',
                  'activated_at' => $mode === 'subscribe' ? now() : null,
                  'expires_at' => $mode === 'subscribe' && $leaseSeconds > 0 ? now()->addSeconds(min($leaseSeconds, 31_536_000)) : null,
                  'last_verified_at' => now(),
                  'last_error_code' => null,
              ],
              createIfMissing: true,
          );'''
          if old not in content: raise RuntimeError('YouTube verify subscription block not found')
          content = content.replace(old, new)
          content = content.replace(
              '        RecordGiftCodePushDelivery $record,\n        YouTubeVideoGiftCodeFetcher $fetcher,',
              '        RecordGiftCodePushDelivery $record,\n        CompleteGiftCodePushDelivery $complete,\n        RecordGiftCodeSourcePushActivity $activity,\n        UpdateGiftCodeSourceSubscription $subscriptions,\n        YouTubeVideoGiftCodeFetcher $fetcher,',
          )
          content = content.replace('$this->authorizeSignature($request, $registry, $body);', '$this->authorizeSignature($request, $registry, $body, $activity);')
          content = content.replace('if (! $delivery->wasRecentlyCreated) {', 'if (! $delivery->created) {')
          content = content.replace("                $registry->increment('replay_rejection_count');", "                $activity->handle((string) $registry->id, 'replay_rejection');")
          content = content.replace("$outcome = $ingest->handle($registry, $publication, 'youtube-websub-v1', true);", "$outcome = $ingest->handle((string) $registry->id, $publication, 'youtube-websub-v1', true);")
          old = '''                $delivery->forceFill([
                      'processing_status' => $outcome->status,
                      'processed_at' => now(),
                  ])->save();'''
          content = content.replace(old, '                $complete->handle($delivery->deliveryId, $outcome->status);')
          old = '''                $delivery->forceFill([
                      'processing_status' => 'failed',
                      'error_code' => 'canonical_fetch_or_ingestion_failed',
                      'processed_at' => now(),
                  ])->save();'''
          content = content.replace(old, "                $complete->handle($delivery->deliveryId, 'failed', 'canonical_fetch_or_ingestion_failed');")
          old = '''        $registry->forceFill([
              'last_push_received_at' => now(),
              'last_provider_event_at' => now(),
              'last_health_checked_at' => now(),
          ])->save();
          GiftCodeSourceSubscription::query()
              ->where('gift_code_source_id', $registry->id)
              ->where('provider', 'youtube')
              ->where('transport', 'websub')
              ->update(['last_event_received_at' => now(), 'last_error_code' => null]);'''
          new = '''        $activity->handle((string) $registry->id, 'received');
          $subscriptions->handle(
              sourceId: (string) $registry->id,
              provider: 'youtube',
              transport: 'websub',
              attributes: ['last_event_received_at' => now(), 'last_error_code' => null],
          );'''
          if old not in content: raise RuntimeError('YouTube source/subscription persistence block not found')
          content = content.replace(old, new)
          content = content.replace(
              '    private function authorizeSignature(Request $request, GiftCodeSourceRegistry $source, string $body): void\n',
              '    private function authorizeSignature(\n        Request $request,\n        GiftCodeSourceRegistry $source,\n        string $body,\n        RecordGiftCodeSourcePushActivity $activity,\n    ): void\n',
          )
          content = content.replace("            $source->increment('signature_failure_count');", "            $activity->handle((string) $source->id, 'signature_failure');")
          write(path, content)

          # Facebook Page webhook.
          path = 'app/Contexts/GameWorld/GiftCodes/Http/Controllers/FacebookPageGiftCodeWebhookController.php'
          content = add_action_imports(read(path))
          content = content.replace(
              '    public function verify(Request $request, string $source): Response\n',
              '    public function verify(Request $request, string $source, UpdateGiftCodeSourceSubscription $subscriptions): Response\n',
          )
          old = '''        GiftCodeSourceSubscription::query()->updateOrCreate(
              [
                  'gift_code_source_id' => (string) $registry->id,
                  'provider' => 'facebook',
                  'transport' => 'webhook',
              ],
              [
                  'topic_or_rule' => 'page:feed',
                  'configured_identity' => ['page_id' => $pageId, 'field' => 'feed'],
                  'status' => 'active',
                  'activated_at' => now(),
                  'last_verified_at' => now(),
                  'secret_version' => hash('sha256', $configuredToken),
                  'last_error_code' => null,
              ],
          );'''
          new = '''        $subscriptions->handle(
              sourceId: (string) $registry->id,
              provider: 'facebook',
              transport: 'webhook',
              attributes: [
                  'topic_or_rule' => 'page:feed',
                  'configured_identity' => ['page_id' => $pageId, 'field' => 'feed'],
                  'status' => 'active',
                  'activated_at' => now(),
                  'last_verified_at' => now(),
                  'secret_version' => hash('sha256', $configuredToken),
                  'last_error_code' => null,
              ],
              createIfMissing: true,
          );'''
          if old not in content: raise RuntimeError('Facebook verify subscription block not found')
          content = content.replace(old, new)
          content = content.replace(
              '        RecordGiftCodePushDelivery $record,\n        FacebookPagePostGiftCodeFetcher $fetcher,',
              '        RecordGiftCodePushDelivery $record,\n        CompleteGiftCodePushDelivery $complete,\n        RecordGiftCodeSourcePushActivity $activity,\n        UpdateGiftCodeSourceSubscription $subscriptions,\n        FacebookPagePostGiftCodeFetcher $fetcher,',
          )
          content = content.replace('if (! $delivery->wasRecentlyCreated) {', 'if (! $delivery->created) {')
          content = content.replace("                $registry->increment('replay_rejection_count');", "                $activity->handle((string) $registry->id, 'replay_rejection');")
          content = content.replace("$outcome = $ingest->handle($registry, $publication, 'facebook-page-webhook-v1', true);", "$outcome = $ingest->handle((string) $registry->id, $publication, 'facebook-page-webhook-v1', true);")
          old = '''                    $delivery->forceFill([
                          'processing_status' => 'ignored',
                          'processed_at' => now(),
                      ])->save();'''
          content = content.replace(old, "                    $complete->handle($delivery->deliveryId, 'ignored');")
          old = '''                $delivery->forceFill([
                      'processing_status' => $outcome->status,
                      'processed_at' => now(),
                  ])->save();'''
          content = content.replace(old, '                $complete->handle($delivery->deliveryId, $outcome->status);')
          old = '''                $delivery->forceFill([
                      'processing_status' => 'failed',
                      'error_code' => 'canonical_fetch_or_ingestion_failed',
                      'processed_at' => now(),
                  ])->save();'''
          content = content.replace(old, "                $complete->handle($delivery->deliveryId, 'failed', 'canonical_fetch_or_ingestion_failed');")
          old = '''        $registry->forceFill([
              'last_push_received_at' => now(),
              'last_provider_event_at' => now(),
              'last_health_checked_at' => now(),
          ])->save();
          GiftCodeSourceSubscription::query()
              ->where('gift_code_source_id', $registry->id)
              ->where('provider', 'facebook')
              ->where('transport', 'webhook')
              ->update(['last_event_received_at' => now(), 'last_error_code' => null]);'''
          new = '''        $activity->handle((string) $registry->id, 'received');
          $subscriptions->handle(
              sourceId: (string) $registry->id,
              provider: 'facebook',
              transport: 'webhook',
              attributes: ['last_event_received_at' => now(), 'last_error_code' => null],
          );'''
          if old not in content: raise RuntimeError('Facebook source/subscription persistence block not found')
          content = content.replace(old, new)
          write(path, content)

          # Discord uses the same model-free delivery receipt and owner mutation Actions.
          path = 'app/Contexts/GameWorld/GiftCodes/Actions/ProcessDiscordGiftCodeGatewayEvent.php'
          content = read(path)
          content = content.replace('use App\\Contexts\\GameWorld\\GiftCodes\\Models\\GiftCodeSourceSubscription;\n', '')
          content = content.replace(
              '        private RecordGiftCodePushDelivery $record,\n        private DiscordMessageGiftCodeFetcher $fetcher,',
              '        private RecordGiftCodePushDelivery $record,\n        private CompleteGiftCodePushDelivery $complete,\n        private RecordGiftCodeSourcePushActivity $activity,\n        private UpdateGiftCodeSourceSubscription $subscriptions,\n        private DiscordMessageGiftCodeFetcher $fetcher,',
          )
          content = content.replace('if (! $delivery->wasRecentlyCreated) {', 'if (! $delivery->created) {')
          content = content.replace("                $source->increment('replay_rejection_count');", "                $this->activity->handle((string) $source->id, 'replay_rejection');")
          content = content.replace("$outcome = $this->ingest->handle($source, $publication, 'discord-gateway-v1', true);", "$outcome = $this->ingest->handle((string) $source->id, $publication, 'discord-gateway-v1', true);")
          old = '''                $delivery->forceFill([
                      'processing_status' => $outcome->status,
                      'processed_at' => now(),
                  ])->save();'''
          content = content.replace(old, '                $this->complete->handle($delivery->deliveryId, $outcome->status);')
          old = '''                $source->forceFill([
                      'last_push_received_at' => now(),
                      'last_provider_event_at' => now(),
                      'last_health_checked_at' => now(),
                  ])->save();
                  GiftCodeSourceSubscription::query()
                      ->where('gift_code_source_id', $source->id)
                      ->where('provider', 'discord')
                      ->where('transport', 'gateway')
                      ->update(['last_event_received_at' => now(), 'last_error_code' => null]);'''
          new = '''                $this->activity->handle((string) $source->id, 'received');
                  $this->subscriptions->handle(
                      sourceId: (string) $source->id,
                      provider: 'discord',
                      transport: 'gateway',
                      attributes: ['last_event_received_at' => now(), 'last_error_code' => null],
                  );'''
          if old not in content: raise RuntimeError('Discord source/subscription persistence block not found')
          content = content.replace(old, new)
          old = '''                $delivery->forceFill([
                      'processing_status' => 'failed',
                      'error_code' => 'canonical_fetch_or_ingestion_failed',
                      'processed_at' => now(),
                  ])->save();'''
          content = content.replace(old, "                $this->complete->handle($delivery->deliveryId, 'failed', 'canonical_fetch_or_ingestion_failed');")
          write(path, content)

          # Update any remaining direct references in branch tests/new code.
          for base in [root / 'app', root / 'tests']:
              for php in base.rglob('*.php'):
                  text = php.read_text()
                  changed = text.replace(
                      'App\\Contexts\\GameWorld\\GiftCodes\\Actions\\AcquireGiftCodeSourceHead',
                      'App\\Contexts\\GameWorld\\GiftCodes\\Services\\GiftCodeSourceHeadAcquirer',
                  ).replace('AcquireGiftCodeSourceHead', 'GiftCodeSourceHeadAcquirer')
                  if changed != text:
                      php.write_text(changed)

          diagnostic = root / '.github/workflows/architecture-v3-diagnostics.yml'
          if diagnostic.exists():
              diagnostic.unlink()
          PY

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate PHP syntax
        run: find app -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Run Architecture V3
        run: vendor/bin/phpunit tests/v3/Architecture --colors=never

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Commit architecture boundary refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refactor Gift Code acquisition boundaries for Architecture V3'
          git push origin HEAD:gift-code-research-backed-acquisition
