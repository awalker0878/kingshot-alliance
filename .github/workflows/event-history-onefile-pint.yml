name: Event History One File Pint

on:
  push:
    branches:
      - feature/event-contribution-history-p0

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/event-contribution-history-p0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Apply Pint to one file
        run: vendor/bin/pint app/Domain/Events/Models/EventTypeCapability.php
      - name: Print exact diff
        run: git diff -- app/Domain/Events/Models/EventTypeCapability.php
