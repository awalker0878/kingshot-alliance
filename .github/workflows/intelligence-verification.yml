name: Intelligence Verification

on:
  pull_request:
    paths:
      - 'app/Contexts/Intelligence/**'
      - 'app/ReadModels/ContributionHistory/**'
      - 'app/ReadModels/EventAnalysis/**'
      - 'app/ReadModels/EventHistory/**'
      - 'app/ReadModels/KingdomIntelligence/**'
      - 'app/ReadModels/SharedKingdomIntelligence/**'
      - 'database/migrations/**event**'
      - 'resources/js/pages/Operations/Events/History.vue'
      - 'resources/js/pages/Intelligence/Contributions/History.vue'
      - 'routes/event-history.php'
      - 'routes/contributions.php'
      - 'tests/v3/**'
      - '.github/workflows/intelligence-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Intelligence backend contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kingshot_test
          POSTGRES_USER: kingshot
          POSTGRES_PASSWORD: kingshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingshot -d kingshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:Wb1PHh03m1vXbmyRxlI+Y96TqgK7Vyt8H/lkQ8o1SP0=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kingshot_test
      DB_USERNAME: kingshot
      DB_PASSWORD: kingshot
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PULSE_ENABLED: false

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, gd, intl, mbstring, pcntl, pdo_pgsql, posix, redis, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Fresh PostgreSQL schema
        run: php artisan migrate:fresh --force

      - name: Verify Contributions V1 hard cut
        shell: bash
        run: |
          set -euo pipefail
          test ! -d app/Domain/Contributions
          matches=$(grep -R -n --include='*.php' 'App\\Domain\\Contributions' app routes bootstrap config database 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            exit 1
          fi

      - name: Pint Intelligence V3
        run: >-
          vendor/bin/pint --test
          app/Contexts/Intelligence
          app/ReadModels/ContributionHistory
          app/ReadModels/EventAnalysis
          app/ReadModels/EventHistory
          app/ReadModels/KingdomIntelligence
          app/ReadModels/SharedKingdomIntelligence
          routes/event-history.php
          routes/contributions.php

      - name: Larastan Intelligence V3
        run: >-
          vendor/bin/phpstan analyse --memory-limit=1G
          app/Contexts/Intelligence
          app/ReadModels/ContributionHistory
          app/ReadModels/EventAnalysis
          app/ReadModels/EventHistory
          app/ReadModels/KingdomIntelligence
          app/ReadModels/SharedKingdomIntelligence
          routes/event-history.php
          routes/contributions.php

      - name: Intelligence V3 behavior contracts
        shell: bash
        run: |
          set +e
          vendor/bin/phpunit --configuration phpunit.xml --testsuite "Architecture V3" 2>&1 | tee /tmp/intelligence-v3-tests.txt
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload Intelligence V3 failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intelligence-v3-failure-${{ github.run_id }}
          path: /tmp/intelligence-v3-tests.txt
          if-no-files-found: error

  frontend:
    name: Intelligence history frontend contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Intelligence history frontend lint
        run: npx eslint resources/js/pages/Operations/Events/History.vue resources/js/pages/Intelligence/Contributions/History.vue

      - name: Intelligence history frontend format
        run: npx prettier --check resources/js/pages/Operations/Events/History.vue resources/js/pages/Intelligence/Contributions/History.vue

      - name: Intelligence history frontend types
        shell: bash
        run: |
          cat > tsconfig.intelligence-history.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "include": [
              "resources/js/pages/Operations/Events/History.vue",
              "resources/js/pages/Intelligence/Contributions/History.vue",
              "resources/js/**/*.d.ts"
            ]
          }
          EOF
          npx vue-tsc --noEmit -p tsconfig.intelligence-history.json
          rm tsconfig.intelligence-history.json
