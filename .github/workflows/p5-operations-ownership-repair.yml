name: P5 Operations Ownership Repair

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/p5-operations-ownership-repair.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: architecture-v2
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Repair capability ownership references
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          roots = [
              Path('app/Contexts/Operations'),
              Path('app/Contexts/Platform/EventAdministration'),
              Path('app/ReadModels/EventManagement'),
          ]

          replacements = {
              r'App\Contexts\Operations\EventCore\Models\EventResponse': r'App\Contexts\Operations\Participation\Models\EventResponse',
              r'App\Contexts\Operations\EventCore\Models\EventPlayerContext': r'App\Contexts\Operations\Participation\Models\EventPlayerContext',
              r'App\Contexts\Operations\EventCore\Models\EventPollVote': r'App\Contexts\Operations\Polls\Models\EventPollVote',
              r'App\Contexts\Operations\EventCore\Models\EventPollOption': r'App\Contexts\Operations\Polls\Models\EventPollOption',
              r'App\Contexts\Operations\EventCore\Models\EventPoll': r'App\Contexts\Operations\Polls\Models\EventPoll',
              r'App\Contexts\Operations\EventCore\Models\EventAllianceResultMetric': r'App\Contexts\Operations\Results\Models\EventAllianceResultMetric',
              r'App\Contexts\Operations\EventCore\Models\EventResultMetric': r'App\Contexts\Operations\Results\Models\EventResultMetric',
              r'App\Contexts\Operations\EventCore\Models\EventMetricDefinition': r'App\Contexts\Operations\Results\Models\EventMetricDefinition',
              r'App\Contexts\Operations\EventCore\Models\EventAllianceResult': r'App\Contexts\Operations\Results\Models\EventAllianceResult',
              r'App\Contexts\Operations\EventCore\Models\EventPlayerResult': r'App\Contexts\Operations\Results\Models\EventPlayerResult',
              r'App\Contexts\Operations\EventCore\Models\EventResult': r'App\Contexts\Operations\Results\Models\EventResult',
              r'App\Contexts\Operations\Participation\Actions\RespondToEventRosterAssignment': r'App\Contexts\Operations\Rosters\Actions\RespondToEventRosterAssignment',
          }

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.php'):
                  text = path.read_text()
                  original = text
                  for old, new in replacements.items():
                      text = text.replace(old, new)
                  if text != original:
                      path.write_text(text)

          imports = {
              'app/Contexts/Operations/Participation/Models/EventRegistration.php': [
                  r'use App\Contexts\Operations\EventCore\Models\EventOccurrence;',
              ],
              'app/Contexts/Operations/Participation/Models/EventResponse.php': [
                  r'use App\Contexts\Operations\EventCore\Models\EventOccurrence;',
              ],
              'app/Contexts/Operations/Participation/Services/EventParticipantAuthorization.php': [
                  r'use App\Contexts\Operations\EventCore\Services\EventAuthorization;',
                  r'use App\Contexts\Operations\EventCore\Services\EventTargetResolver;',
              ],
              'app/Contexts/Operations/Polls/Services/EventPollTemplateMaterializer.php': [
                  r'use App\Contexts\Operations\EventCore\Services\EventCapabilityResolver;',
              ],
              'app/Contexts/Operations/Rosters/Services/EventRosterAvailabilityService.php': [
                  r'use App\Contexts\Operations\EventCore\Services\EventCapabilityResolver;',
              ],
              'app/Contexts/Operations/Rosters/Services/EventRosterService.php': [
                  r'use App\Contexts\Operations\EventCore\Services\EventCapabilityResolver;',
              ],
              'app/Contexts/Operations/Rosters/Queries/EventRosterQuery.php': [
                  r'use App\Contexts\Operations\Participation\Queries\EventEligiblePlayerQuery;',
              ],
              'app/Contexts/Operations/Results/Queries/EventResultQuery.php': [
                  r'use App\Contexts\Operations\Participation\Queries\EventEligiblePlayerQuery;',
              ],
              'app/Contexts/Operations/Results/Models/EventAllianceResult.php': [
                  r'use App\Contexts\Operations\EventCore\Models\EventOccurrence;',
              ],
              'app/Contexts/Operations/Results/Models/EventPlayerResult.php': [
                  r'use App\Contexts\Operations\EventCore\Models\EventOccurrence;',
              ],
              'app/Contexts/Operations/Results/Models/EventResult.php': [
                  r'use App\Contexts\Operations\EventCore\Models\EventOccurrence;',
              ],
              'app/Contexts/Operations/Results/Models/EventMetricDefinition.php': [
                  r'use App\Contexts\Operations\EventCore\Models\EventTypeScope;',
              ],
          }

          for filename, needed in imports.items():
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text()
              missing = [line for line in needed if line not in text]
              if not missing:
                  continue
              marker = 'namespace ' + text.split('namespace ', 1)[1].split(';', 1)[0] + ';\n'
              text = text.replace(marker, marker + '\n' + '\n'.join(missing) + '\n', 1)
              path.write_text(text)
          PY

          vendor/bin/pint app/Contexts/Operations app/Contexts/Platform/EventAdministration app/ReadModels/EventManagement

      - name: Commit repair and remove helper workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p5-operations-ownership-repair.yml
          git add app/Contexts/Operations app/Contexts/Platform/EventAdministration app/ReadModels/EventManagement
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ARCH-V2: repair Operations capability ownership references'
          git push origin HEAD:architecture-v2

      - name: Dispatch authoritative verifier
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/architecture-v2-verification.yml/dispatches \
            -d '{"ref":"architecture-v2"}'
