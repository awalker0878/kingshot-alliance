name: ARCH-V2 mechanical ownership move

on:
  push:
    branches:
      - arch-v2-remediation-20260816

permissions:
  contents: write

jobs:
  move-kingdom-transfer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move Kingdom Transfer into GameWorld
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d app/Workflows/KingdomTransfer ]]; then
            echo 'Kingdom Transfer ownership move already applied; nothing to do.'
            exit 0
          fi

          mkdir -p app/Contexts/GameWorld
          git mv app/Workflows/KingdomTransfer app/Contexts/GameWorld/KingdomTransfers

          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('app'), Path('routes'), Path('tests'), Path('database'), Path('bootstrap'), Path('docs')]
          replacements = (
              ('App\\\\Workflows\\\\KingdomTransfer', 'App\\\\Contexts\\\\GameWorld\\\\KingdomTransfers'),
              ('App\\Workflows\\KingdomTransfer', 'App\\Contexts\\GameWorld\\KingdomTransfers'),
              ('app/Workflows/KingdomTransfer', 'app/Contexts/GameWorld/KingdomTransfers'),
              ('Workflows\\\\KingdomTransfer', 'Contexts\\\\GameWorld\\\\KingdomTransfers'),
              ('Workflows\\KingdomTransfer', 'Contexts\\GameWorld\\KingdomTransfers'),
          )

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  updated = text
                  for old, new in replacements:
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')
          PY

          if grep -R --line-number --fixed-strings 'App\Workflows\KingdomTransfer' app routes tests database bootstrap docs 2>/dev/null; then
            echo 'Old KingdomTransfer namespace remains' >&2
            exit 1
          fi

          if grep -R --line-number --fixed-strings 'app/Workflows/KingdomTransfer' app routes tests database bootstrap docs 2>/dev/null; then
            echo 'Old KingdomTransfer path remains' >&2
            exit 1
          fi

          git diff --check
          git status --short

          git config user.name 'ARCH-V2 remediation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(arch-v2): move kingdom transfer ownership to GameWorld [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
