<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
<title id="title">Kingshot alliance hall</title><desc id="desc">An original stylized ceremonial alliance chamber with officers, banners, a crest, and a council table.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07100f"/><stop offset=".48" stop-color="#18211c"/><stop offset="1" stop-color="#090b0a"/></linearGradient>
  <radialGradient id="light" cx="54%" cy="22%" r="54%"><stop stop-color="#f0c77a" stop-opacity=".34"/><stop offset=".46" stop-color="#ac7138" stop-opacity=".10"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="cloth"><stop stop-color="#0a786f"/><stop offset="1" stop-color="#083b38"/></linearGradient>
  <linearGradient id="metal"><stop stop-color="#f1cb78"/><stop offset=".5" stop-color="#9b7135"/><stop offset="1" stop-color="#4d351e"/></linearGradient>
</defs>
<rect width="1600" height="640" fill="url(#bg)"/><rect width="1600" height="640" fill="url(#light)"/>
