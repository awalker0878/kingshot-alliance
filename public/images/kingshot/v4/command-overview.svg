<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
<title id="title">Kingshot command chamber</title><desc id="desc">An original stylized war chamber with banners, braziers, commanders, and a glowing map table.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061011"/><stop offset=".52" stop-color="#13231f"/><stop offset="1" stop-color="#080d0d"/></linearGradient>
  <radialGradient id="sun" cx="50%" cy="12%" r="58%"><stop stop-color="#e0b86f" stop-opacity=".42"/><stop offset=".35" stop-color="#9d6c30" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0cb77"/><stop offset="1" stop-color="#705126"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#127b72"/><stop offset="1" stop-color="#093a37"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1600" height="640" fill="url(#bg)"/><rect width="1600" height="640" fill="url(#sun)"/>
